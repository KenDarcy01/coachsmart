<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Without this the splash renders at desktop scale until Flutter loads. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CoachSmart v3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="CoachSmart" />
  <meta property="og:description" content="Coaching Made Simple" />
  <meta property="og:image" content="/assets/assets/images/CoachSmart_512_x_512_px.png" /> 
  <meta name="twitter:title" content="CoachSmart" />
  <meta name="twitter:description" content="Coaching Made Simple" />
  <meta name="twitter:image" content="/assets/assets/images/CoachSmart_512_x_512_px.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>CoachSmart v3</title>
  <meta name="description" content="Coaching Made Simple" />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#14181b">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#14181b">

  <link rel="manifest" href="manifest.json">

  <!-- The iPhone home-screen status bar takes its colour and fade from the
       page background, so paint it the app's dark colour, not white. -->
  <style>
    html, body { background: #14181b; margin: 0; }
    /* Splash shown while the app downloads; removed on Flutter's first frame. */
    #splash { position: fixed; inset: 0; background: #14181b; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; z-index: 10; transition: opacity .25s ease-out; }
    #splash img { width: 120px; height: 120px; border-radius: 26px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #2e333e;
      overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #87c232;
      border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-512.png" alt=""><div class="bar"><i></i></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
