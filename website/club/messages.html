<!DOCTYPE html>
<html lang="en">

<!--
  Club messages (Ken 2026-11-25; fundraisers 2026-11-26): coachsmart.app/club/messages.html?club=ID.
  Officers with the "Messages" tick (and SuperUsers) send their club an
  important pop-up or a news bar line in the v3 app, to everyone, players and
  parents, or coaches, for all teams or some. Lists what is showing and what
  was sent, with how many saw it. Data: get_app_message_targets,
  get_sent_app_messages, count_app_message_audience, save_app_message,
  end_app_message (all check app_message_can on the server). Fundraisers
  (2026-11-26): own row on v3 Home with a price and a button to the club's
  page; taps counted (app_message_tap).
-->
<style>
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--club:#1a1d23;--band:#1a1d23;--onband:#fff;--tint:#1a1d2314;--bg:#f3f4f7;--card:#fff;--text:#1a1d23;--muted:#667080;--line:#e6e8ec;--good:#2f9e44;--bad:#d9363e;--money:#8a5a00;--moneybg:#fdf6e3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}

button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.top{display:flex;align-items:center;gap:12px;max-width:812px;margin:0 auto}

.band h1{font-size:19px;font-weight:700;line-height:1.15}.band .sub{font-size:13px;opacity:.88;margin-top:2px}
.wrap{padding:6px 24px 48px;max-width:860px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:20px 22px;margin-bottom:12px;box-shadow:0 1px 3px #0000000f}

.h2:first-child{margin-top:4px}

.field{margin-bottom:12px}.field label{display:block;font-size:14.5px;font-weight:600;color:var(--muted);margin-bottom:5px}

/* messages */
.band .tt{min-width:0}

.kind.i{background:#fde8e8;color:#b42318}.kind.n{background:#e7f0fd;color:#1f5fc0}.kind.f{background:#fdf1cf;color:#8a5a00}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}

.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;font:inherit;resize:vertical;line-height:1.4}

.reach{background:var(--tint);color:var(--club);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:4px 0 12px}

.prev{background:#14181b;border-radius:16px;padding:14px;color:#f1f4f8}

.prev .stripe{display:block;height:6px;background:var(--club)}
.prev .pf{display:flex;align-items:center;gap:10px;padding:12px 12px 0 14px}

.prev .pf div{flex:1;min-width:0}.prev .pf b{display:block;font-size:14px}.prev .pf small{color:#a1a1a2;font-size:12px}
.prev .x{width:32px;height:32px;border-radius:50%;background:#2a2f3a;display:flex;align-items:center;justify-content:center;font-size:13px}
.prev .pimg{display:block;width:calc(100% - 28px);height:auto;max-height:260px;object-fit:cover;margin:12px 14px 0;border-radius:12px}
.prev .pin{padding:12px 14px 14px}
.prev .imp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:7px;background:#3a2f12;color:#f5c55a}
.prev .pt{display:block;font-size:20px;font-weight:700;margin-top:8px;line-height:1.2}
.prev .pb{font-size:14px;color:#d5d8de;margin-top:8px;line-height:1.5;white-space:pre-line}
.prev .pg{margin-top:14px;text-align:center;font-weight:700;color:var(--onclub,#fff);background:var(--club);border-radius:12px;padding:12px}
.thumb{display:block;width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.opt{font-weight:500;color:#9aa1ad}
.up{color:var(--club);font-weight:600}
.photo{display:flex;align-items:center;gap:12px}.photo img{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.nbar{display:flex;align-items:center;gap:10px;background:#2a2f3a;border-radius:12px;padding:10px 12px}
.nbar div{flex:1;min-width:0}.nbar b{display:block;font-size:14px}.nbar small{display:block;color:#a1a1a2;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbar span{color:#a1a1a2;font-size:18px}
.ncard{background:#1e222b;border:1px solid #2c313b;border-radius:18px;overflow:hidden;height:136px;display:flex;flex-direction:column}
.ncard .stripe{height:4px;flex:none;background:#fff}
.ncard .nr{flex:1;display:flex;min-height:0}
.ncard .nimg{width:104px;height:100%;object-fit:cover;flex:none;border-radius:0}
.ncard .npan{width:104px;flex:none;background:#14181b;display:flex;align-items:center;justify-content:center}.ncard .npan img{width:64px;height:64px}
.ncard .nin{flex:1;min-width:0;padding:10px 12px}.ncard small{font-size:11px;font-weight:700;letter-spacing:.08em;color:#87c232}
.ncard b{display:block;font-size:17px;line-height:1.2;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard p{font-size:13px;color:#a1a1a2;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0 4px;font-size:16px}
.trow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;font-size:15px}
.trow:first-child{border-top:0;padding-top:2px}
.tick{width:22px;height:22px;border-radius:6px;border:2px solid #c9ced6;flex:none;position:relative}
.tick.on{background:var(--club);border-color:var(--club)}
.tick.on::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.wrap>.btn{margin-top:4px}
</style>

<body>
<div id="app"><div class="state">Loading…</div></div>
<div class="toast" id="toast"></div>

<div class="login" id="login">
  <form class="lbox" id="loginForm">
    <img class="icrest" id="lcrest" alt="" hidden>
    <h2 id="ltitle">Club messages</h2>
    <p>Sign in with your CoachSmart email and password.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="goBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg"></div>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </form>
</div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const clubId = Number(new URLSearchParams(location.search).get('club')) || null;
const AUD = { all: 'Everyone', players: 'Players & parents', staff: 'Coaches' };
const KIND = { important: { c: 'i', l: 'Important' }, news: { c: 'n', l: 'News' }, fundraiser: { c: 'f', l: 'Fundraiser' } };
let T = null, M = [], view = 'list', draft = null, armed = null, reachT = null, filt = '';

function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function brand(c) {
  if (!c) return;
  const p = c.primary_colour, s = c.secondary_colour;
  const okText = h => { const l = lum(h); return l != null && l < .45; };
  const accent = okText(p) ? p : okText(s) ? s : '#1a1d23';
  const band = lum(p) != null && lum(p) < .85 ? p : (lum(s) != null && lum(s) < .85 ? s : accent);
  const r = document.documentElement.style;
  r.setProperty('--club', accent); r.setProperty('--band', band);
  r.setProperty('--onband', lum(band) > .5 ? '#14181b' : '#fff');
  r.setProperty('--tint', accent + '17');
  document.title = c.club_name + ' · Messages';
  if (c.crest) ['icon', 'apple-touch-icon'].forEach(rel => {
    let l = document.querySelector(`link[rel="${rel}"]`);
    if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
    l.href = c.crest;
  });
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }

// ── Sign in ───────────────────────────────────────────────────────
function showLogin(msg, ok) {
  $('app').innerHTML = '';
  $('login').classList.add('on');
  $('loginMsg').textContent = msg || ''; $('loginMsg').classList.toggle('ok', !!ok);
  $('goBtn').disabled = false; $('goBtn').textContent = 'Sign in';
  sb.rpc('club_brand', { p_club: clubId }).then(({ data }) => {
    if (!data) return; brand(data);
    $('ltitle').textContent = data.club_name + ' messages';
    if (data.crest) { $('lcrest').src = data.crest; $('lcrest').hidden = false; }
  }, () => {});
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('goBtn').disabled = true; $('goBtn').textContent = 'Signing in…'; $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
  $('password').value = ''; $('login').classList.remove('on'); load();
});
$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return showLogin('Type your email first, then tap Forgot password.');
  const { error } = await sb.auth.resetPasswordForEmail(email);
  showLogin(error ? error.message : 'Check your email for a link to reset your password.', !error);
});
function state(msg) {
  $('app').innerHTML = `<div class="state">${esc(msg)}<br><a class="link" href="/club/?club=${clubId}">Back to club home</a></div>`;
}

// ── Data ──────────────────────────────────────────────────────────
async function load() {
  if (!clubId) return state('Open this page from your club home.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  // Instant open from the last copy, then refresh (Ken 2026-11-27).
  const ck = 'cs_msgs_' + clubId + '_' + session.user.id;
  let shown = null;
  try { const c = JSON.parse(localStorage.getItem(ck) || 'null'); if (c && c.T) { T = c.T; M = c.M || []; brand(T); render(); shown = $('app').innerHTML; } } catch (e) {}
  const [t, s, b] = await Promise.all([sb.rpc('get_app_message_targets'), sb.rpc('get_sent_app_messages'), sb.rpc('club_brand', { p_club: clubId })]);
  if (b.data) brand(b.data);
  T = (t.data || []).find(c => Number(c.club_id) === clubId);
  if (t.error || !T) return state('Only club officers with the “Messages” tick can send club messages. Ask your chairperson or CoachSmart.');
  T = { ...(b.data || {}), ...T };
  M = (s.data || []).filter(m => Number(m.club_id) === clubId);
  try { localStorage.setItem(ck, JSON.stringify({ T, M })); } catch (e) {}
  if (shown === null || $('app').innerHTML === shown) render();
}

// ── Helpers ───────────────────────────────────────────────────────
const now = () => Date.now();
const status = m => m.ended_at || new Date(m.ends_at) <= now() ? 'ended' : new Date(m.starts_at) > now() ? 'soon' : 'live';
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dShort = iso => { const d = new Date(iso); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const hm = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const teamsLabel = m => (m.team_names && m.team_names.length) ? (m.team_names.length <= 2 ? m.team_names.join(', ') : m.team_names.length + ' teams') : 'All teams';
const pad = n => String(n).padStart(2, '0');
const localInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function band(title, sub) {
  return `<div class="band"><div class="top">${clubHomePill(clubId, T && T.crest)}
    <div class="tt"><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div></div></div>`;
}
function card(m, i) {
  const st = status(m);
  const when = st === 'live' ? `<span class="live">● Live until ${dShort(m.ends_at)}</span>`
    : st === 'soon' ? `<span class="soon">Starts ${dShort(m.starts_at)} ${hm(m.starts_at)}</span>`
    : `<span>Ended ${dShort(m.ended_at && new Date(m.ended_at) < new Date(m.ends_at) ? m.ended_at : m.ends_at)}</span>`;
  const acts = st === 'ended' ? `<button class="sm" onclick="again(${i})">Send again</button>`
    : `<button class="sm" onclick="edit(${i})">Edit</button><button class="sm red" id="stop${i}" onclick="stop(${i})">Stop showing</button>`;
  const tap = m.kind === 'fundraiser' ? `<span><b>${m.tap_count || 0}</b> tapped ${esc(m.link_label || 'the button')}</span>` : '';
  const push = m.kind !== 'important' ? '' : m.push_sent_at ? `<span>Push to <b>${m.push_count ?? '…'}</b> ${m.push_count === 1 ? 'phone' : 'phones'}</span>`
    : m.push && st === 'soon' ? '<span>Push when it starts</span>' : '';
  const sub = m.kind === 'fundraiser' && m.price_label ? esc(m.price_label) + (m.body ? ' · ' : '') : '';
  return `<div class="card"><div class="mrow"><span class="kind ${KIND[m.kind].c}">${KIND[m.kind].l}</span>
    <div class="mx">${m.image_url ? `<img class="thumb" src="${esc(m.image_url)}" alt="">` : ''}<div class="mt">${esc(m.title)}</div>${m.body || sub ? `<div class="ms">${sub}${esc(m.body || '')}</div>` : ''}
    <div class="stat">${when}<span>${esc(AUD[m.audience] || 'Everyone')}</span><span>${esc(teamsLabel(m))}</span><span><b>${m.seen_count || 0}</b> of ${m.reach || 0} seen</span>${tap}${push}</div>
    <div class="acts">${acts}</div></div></div></div>`;
}
function render() {
  if (view === 'form') return renderForm();
  const all = M.map((m, i) => [m, i]).filter(([m]) => !filt || m.kind === filt);
  const live = all.filter(([m]) => status(m) !== 'ended');
  const done = all.filter(([m]) => status(m) === 'ended').slice(0, 20);
  const chip = (v, l) => `<span class="${filt === v ? 'on' : ''}" onclick="filt='${v}';render()">${l}</span>`;
  $('app').innerHTML = band('Messages', '') + `<div class="wrap">
    <p class="intro">News, important pop-ups and fundraisers for ${esc(T.club_name)} on the app’s home screen.</p>
    <button class="btn" onclick="newMsg()">+ New message</button>
    <div class="filt">${chip('', 'All')}${chip('news', 'News')}${chip('important', 'Important')}${chip('fundraiser', 'Fundraisers')}</div>
    <div class="h2">Showing now</div>${live.length ? live.map(([m, i]) => card(m, i)).join('') : '<div class="card empty">Nothing is showing right now.</div>'}
    <div class="h2">Sent</div>${done.length ? done.map(([m, i]) => card(m, i)).join('') : '<div class="card empty">Messages you send will be listed here, with how many people saw them.</div>'}
    <div class="h2">Club partners</div>
    <a class="card ptile" href="/club/sponsors.html?club=${clubId}"><div><b>Club partners</b><small>Sponsor logos in the app and their reach reports</small></div><span class="pchev">›</span></a>
  </div>`;
}

// ── New / edit ────────────────────────────────────────────────────
function blank() {
  const end = new Date(); end.setDate(end.getDate() + 3);
  return { id: null, kind: 'important', title: '', body: '', link_url: '', link_label: '', image_url: '', price_label: '', audience: 'all', team_ids: [],
    push: false, pushN: null, pushSent: null, pushCount: null, later: false, starts: localInput(new Date(Date.now() + 3600e3)), ends: localDate(end), reach: null, picking: false, q: '' };
}
function fromMsg(m, copy) {
  const d = blank();
  Object.assign(d, { id: copy ? null : m.id, kind: m.kind, title: m.title, body: m.body || '', link_url: m.link_url || '', link_label: m.link_label || '', image_url: m.image_url || '', price_label: m.price_label || '',
    audience: m.audience || 'all', team_ids: (m.team_ids || []).map(Number) });
  if (!copy) {
    d.push = !!m.push; d.pushSent = m.push_sent_at || null; d.pushCount = m.push_count;
    d.later = d.wasLater = new Date(m.starts_at) > now(); if (d.later) d.starts = localInput(new Date(m.starts_at));
    d.ends = localDate(new Date(m.ends_at));
  }
  return d;
}
function newMsg() { draft = blank(); view = 'form'; render(); recount(); scrollTo(0, 0); }
function edit(i) { draft = fromMsg(M[i]); view = 'form'; render(); recount(); scrollTo(0, 0); }
function again(i) { draft = fromMsg(M[i], true); view = 'form'; render(); recount(); scrollTo(0, 0); }
function back() { view = 'list'; draft = null; render(); }
function seg(name, opts, cur) {
  return `<div class="seg">${opts.map(([v, l]) => `<span class="${v === cur ? 'on' : ''}" onclick="setD('${name}','${v}')">${l}</span>`).join('')}</div>`;
}
function grab() {
  if (!draft || !$('fTitle')) return;
  draft.title = $('fTitle').value; draft.body = $('fBody').value; draft.ends = $('fEnds').value;
  if ($('fStarts')) draft.starts = $('fStarts').value;
  if ($('fPrice')) draft.price_label = $('fPrice').value;
  if ($('fLink')) draft.link_url = $('fLink').value;
  if ($('fLabel')) draft.link_label = $('fLabel').value;
}
function setD(k, v) { grab(); draft[k] = v === 'true' ? true : v === 'false' ? false : v; renderForm(); if (k === 'audience') recount(); }
function teamsText() {
  if (!draft.team_ids.length) return 'All ' + T.club_name + ' teams';
  const names = T.teams.filter(t => draft.team_ids.includes(Number(t.team_id))).map(t => t.team_name);
  return names.length <= 2 ? names.join(', ') : names.length + ' teams';
}
function renderForm() {
  const d = draft;
  if (d.picking) return renderPicker();
  const n = d.reach;
  $('app').innerHTML = band(d.id ? 'Edit message' : 'New message', 'Shown on the app home screen') + `<div class="wrap">
  <button class="backlink" onclick="back()">‹ All messages</button>
  <div class="card">
    <div class="field"><label>Type</label>${seg('kind', [['important', 'Important'], ['news', 'News'], ['fundraiser', 'Fundraiser']], d.kind)}
      <div class="hint">${d.kind === 'news' ? 'A card in Club news on the home screen.' : d.kind === 'fundraiser' ? 'Its own row under Club news, with a button to buy, order or sign up.' : 'Pops up when people open the app, until they tap Got it.'}</div></div>
    <div class="field"><label>Title</label><input id="fTitle" maxlength="80" value="${esc(d.title)}" placeholder="${d.kind === 'news' ? 'Christmas social, 12 Dec' : d.kind === 'fundraiser' ? 'Christmas Draw' : 'Pitches closed Saturday'}" oninput="draft.title=this.value;pv()"></div>
    <div class="field"><label>Message</label><textarea id="fBody" maxlength="500" rows="4" placeholder="A line or two people need to know." oninput="draft.body=this.value;pv()">${esc(d.body)}</textarea></div>
    ${d.kind === 'fundraiser' ? `<div class="field"><label>Price <span class="opt">optional</span></label><input id="fPrice" maxlength="40" value="${esc(d.price_label)}" placeholder="€10 a line" oninput="draft.price_label=this.value;pv()"></div>
    <div class="field"><label>Button</label><div class="btnrow">${['Buy tickets', 'Order now', 'Donate', 'Sign up'].map(l => `<span class="pre ${d.link_label === l ? 'on' : ''}" onclick="setD('link_label','${l}')">${l}</span>`).join('')}</div>
      <input id="fLabel" maxlength="24" value="${esc(d.link_label)}" placeholder="Or type your own" style="margin-top:8px" oninput="draft.link_label=this.value;pv()"></div>
    <div class="field"><label>Button opens</label><input id="fLink" type="url" value="${esc(d.link_url)}" placeholder="https://your-club-shop.ie/christmas-draw" oninput="draft.link_url=this.value"><div class="hint">Your club’s own page: shop, raffle or lotto. CoachSmart takes no payment.</div></div>` : ''}
    <div class="field"><label>Photo <span class="opt">optional</span></label>
      ${d.image_url ? `<div class="photo"><img src="${esc(d.image_url)}" alt=""><button class="sm red" onclick="setD('image_url','')">Remove</button></div>`
        : `<div class="pick up" onclick="$('fImg').click()"><span id="upTxt">Add a photo (wide, 2:1, e.g. 1200 × 600)</span><span class="mut">Choose ›</span></div>`}
      <input id="fImg" type="file" accept="image/*" hidden onchange="upload(this.files[0])"></div>
    <div class="field"><label>Who gets it</label>${seg('audience', [['all', 'Everyone'], ['players', 'Players &amp; parents'], ['staff', 'Coaches']], d.audience)}</div>
    <div class="field"><label>Teams</label><div class="pick" onclick="openPicker()"><span>${esc(teamsText())}</span><span class="mut">Change ›</span></div></div>
    <div class="two">
      <div class="field"><label>Show from</label>${seg('later', [['false', 'Now'], ['true', 'Later']], String(d.later))}
        ${d.later ? `<input id="fStarts" type="datetime-local" value="${esc(d.starts)}" style="margin-top:6px">` : ''}</div>
      <div class="field"><label>Stop showing</label><input id="fEnds" type="date" value="${esc(d.ends)}" min="${localDate(new Date())}"><div class="hint">At the end of that day</div></div>
    </div>
    ${d.kind === 'important' ? `<div class="field"><label>Push notification</label>${d.pushSent
        ? `<div class="hint">Push sent ${dShort(d.pushSent)} ${hm(d.pushSent)}${d.pushCount != null ? ' to ' + d.pushCount + (d.pushCount === 1 ? ' phone' : ' phones') : ''}. It isn’t sent again.</div>`
        : seg('push', [['false', 'Off'], ['true', 'Send a push too']], String(d.push)) + `<div class="hint" id="pushHint">${pushHint()}</div>`}</div>` : ''}
    <div class="reach" id="reach">${n == null ? 'Counting who it reaches…' : `Reaches about ${n} ${n === 1 ? 'person' : 'people'} at ${esc(T.club_name)}`}</div>
    <div class="warn">Only people on the new app see messages for now. Everyone gets them after the January switch.</div>
    <button class="btn" id="sendBtn" onclick="send()">${d.id ? 'Save changes' : 'Send'}</button>
    <div class="msg" id="fMsg"></div>
  </div>
  <div class="h2">How it looks in the app</div><div id="pv"></div>
  </div>`;
  pv();
}
function pv() {
  const d = draft, el = $('pv'); if (!el) return;
  const crest = T.crest ? `<img src="${esc(T.crest)}" alt="">` : '';
  if (d.kind === 'fundraiser') {
    const th = d.image_url ? `<img class="th" src="${esc(d.image_url)}" alt="">` : (T.crest ? `<img class="th" style="object-fit:contain;padding:3px" src="${esc(T.crest)}" alt="">` : '<span class="th"></span>');
    el.innerHTML = `<div class="prev"><div class="frow">${th}<div><b>${esc(d.title || 'Your title')}</b><small>Fundraiser${d.price_label ? ' · ' + esc(d.price_label) : ''}</small></div><span class="buy">${esc(d.link_label || 'Buy tickets')}</span></div></div>`;
    return;
  }
  el.innerHTML = d.kind === 'news'
    ? `<div class="prev"><div class="ncard"><i class="stripe"></i><div class="nr">${d.image_url ? `<img class="nimg" src="${esc(d.image_url)}" alt="">` : `<span class="npan">${crest}</span>`}
       <div class="nin"><small>NEW · TODAY</small><b>${esc(d.title || 'Your title')}</b>${d.body ? `<p>${esc(d.body)}</p>` : ''}</div></div></div></div>`
    : `<div class="prev"><div class="pc"><i class="stripe"></i><div class="pf">${crest}<div><b>${esc(T.club_name)}</b><small>From the club</small></div><span class="x">✕</span></div>
       ${d.image_url ? `<img class="pimg" src="${esc(d.image_url)}" alt="">` : ''}
       <div class="pin"><span class="imp">IMPORTANT</span><b class="pt">${esc(d.title || 'Your title')}</b>
       ${d.body ? `<div class="pb">${esc(d.body)}</div>` : ''}<div class="pg">Got it</div></div></div></div>`;
}
function pushHint() {
  const d = draft; if (!d.push) return 'Off. It still pops up when people open the app.';
  const n = d.pushN == null ? 'about …' : 'about ' + d.pushN;
  return `Goes to ${n} ${d.pushN === 1 ? 'phone' : 'phones'} with notifications on, ${d.later ? 'when it starts showing' : 'as soon as you send'}. Push only, no email.`;
}
function openPicker() { grab(); draft.picking = true; draft.q = ''; renderForm(); }
function renderPicker() {
  const q = draft.q.toLowerCase();
  const list = T.teams.filter(t => !q || t.team_name.toLowerCase().includes(q));
  $('app').innerHTML = band('Pick teams', 'Who sees this message') + `<div class="wrap">
  <button class="backlink" onclick="pickDone()">‹ Back to the message</button>
  <div class="card">
    <div class="trow" onclick="draft.team_ids=[];renderPicker()"><span class="tick ${draft.team_ids.length ? '' : 'on'}"></span><b>All ${esc(T.club_name)} teams</b></div>
    <input class="search" id="tq" placeholder="Search teams" value="${esc(draft.q)}" oninput="draft.q=this.value;renderPicker();const e=$('tq');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
    ${list.map(t => `<div class="trow" onclick="tog(${Number(t.team_id)})"><span class="tick ${draft.team_ids.includes(Number(t.team_id)) ? 'on' : ''}"></span>${esc(t.team_name)}</div>`).join('') || '<div class="empty">No team matches.</div>'}
  </div>
  <button class="btn" onclick="pickDone()">Done${draft.team_ids.length ? ' · ' + draft.team_ids.length + ' picked' : ''}</button></div>`;
}
function tog(id) { const a = draft.team_ids; const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); renderPicker(); }
function pickDone() { draft.picking = false; renderForm(); recount(); }
function recount() {
  clearTimeout(reachT); draft.reach = null;
  const el = $('reach'); if (el) el.textContent = 'Counting who it reaches…';
  const want = JSON.stringify([draft.team_ids, draft.audience]);
  reachT = setTimeout(async () => {
    const args = { p_club_id: clubId, p_team_ids: draft.team_ids, p_audience: draft.audience };
    const [{ data, error }, pc] = await Promise.all([sb.rpc('count_app_message_audience', args), sb.rpc('count_app_message_push', args)]);
    if (!draft || JSON.stringify([draft.team_ids, draft.audience]) !== want) return;
    draft.reach = error ? null : data;
    draft.pushN = pc.error ? null : pc.data;
    const ph = $('pushHint'); if (ph) ph.textContent = pushHint();
    const e2 = $('reach'); if (e2) e2.textContent = error ? 'Couldn’t count who it reaches.' : `Reaches about ${data} ${data === 1 ? 'person' : 'people'} at ${T.club_name}`;
  }, 250);
}
async function send() {
  grab(); const d = draft;
  const err = t => ($('fMsg').textContent = t);
  if (!d.title.trim()) return err('Give the message a title.');
  if (!d.ends) return err('Pick a day to stop showing it.');
  if (d.kind === 'fundraiser') {
    if (!d.link_label.trim()) d.link_label = 'Buy tickets';
    let u = d.link_url.trim(); if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    if (!/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(u)) return err('Add the web address the button opens.');
    d.link_url = u;
  }
  const ends = new Date(d.ends + 'T23:59:00');
  const starts = d.later && d.starts ? new Date(d.starts) : null;
  if (ends <= (starts || new Date())) return err('Stop showing has to be after it starts.');
  const b = $('sendBtn'); b.disabled = true; b.textContent = d.id ? 'Saving…' : 'Sending…'; err('');
  const { data: savedId, error } = await sb.rpc('save_app_message', {
    p_id: d.id, p_kind: d.kind, p_title: d.title.trim(), p_body: d.body.trim(), p_link_url: d.link_url, p_link_label: d.link_label,
    p_club_id: clubId, p_team_ids: d.team_ids, p_audience: d.audience,
    p_image_url: d.image_url || '', p_price_label: d.kind === 'fundraiser' ? d.price_label.trim() : '', p_starts_at: starts ? starts.toISOString() : (d.id && d.wasLater ? new Date().toISOString() : null), p_ends_at: ends.toISOString() });
  if (error) { b.disabled = false; b.textContent = d.id ? 'Save changes' : 'Send'; return err(/after/.test(error.message) ? 'Stop showing has to be after it starts.' : 'Couldn’t send. Please try again.'); }
  let pushed = false, pushErr = false;
  if (savedId && !d.pushSent && (d.push || d.id)) {
    const pr = await sb.rpc('set_app_message_push', { p_id: savedId, p_push: d.kind === 'important' && d.push });
    pushErr = !!pr.error; pushed = !pr.error && d.kind === 'important' && d.push;
  }
  toast(pushErr ? 'Saved, but the push couldn’t be set. Edit it to try again.'
    : d.id ? 'Saved' : starts ? (pushed ? 'Scheduled, push goes when it starts' : 'Scheduled') : (pushed ? 'Sent with a push' : 'Sent')); view = 'list'; draft = null; load();
}
// Photo: shrunk in the browser to at most 1200px wide JPEG, then stored in
// message-images/<club>/ (only Messages officers of this club may upload).
async function upload(f) {
  if (!f) return; grab();
  const tx = $('upTxt'); if (tx) tx.textContent = 'Uploading…';
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); });
    const w = Math.min(1200, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.85));
    const path = clubId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
    const { error } = await sb.storage.from('message-images').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    draft.image_url = sb.storage.from('message-images').getPublicUrl(path).data.publicUrl;
    renderForm();
  } catch (e) { if (tx) tx.textContent = 'Couldn’t add that photo. Try another.'; }
}
async function stop(i) {
  const b = $('stop' + i);
  if (armed !== i) { armed = i; b.textContent = 'Tap again to stop'; return; }
  armed = null; b.disabled = true;
  const { error } = await sb.rpc('end_app_message', { p_id: M[i].id, p_delete: false });
  toast(error ? 'Couldn’t stop it. Please try again.' : 'Stopped'); load();
}
load();
</script>
