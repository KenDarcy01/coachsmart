<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Club newsletter</title>
<!-- Public view of an approved club newsletter issue (2026-11-25, thread
     "Build The Tarbh Times club newsletter"). coachsmart.app/club/news.html?i=<share token>.
     No sign-in: the `newsletter` edge function returns only approved issues. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/club/newsletter/paper.js"></script>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#d9d3c5;color:#5d574d}.state{padding:80px 30px;text-align:center}</style>
</head>
<body><div class="state" id="st">Loading…</div>
<script>
{
  const sb = window.supabase.createClient('https://gyfporsbdftvtakdvukt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4');
  const token = new URLSearchParams(location.search).get('i') || '';
  sb.functions.invoke('newsletter', { body: { action: 'public', token } }).then(({ data }) => {
    if (!data || !data.success) { document.getElementById('st').textContent = 'This newsletter isn’t available.'; return; }
    const d = data.data;
    const html = window.renderPaper(d, { width: 640, pdfUrl: d.issue.pdf_url, live: true });
    document.open(); document.write(html); document.close();
    if (d.club.crest) { const l = document.createElement('link'); l.rel = 'icon'; l.href = d.club.crest; document.head.appendChild(l); }
  }, () => { document.getElementById('st').textContent = 'This newsletter isn’t available.'; });
}
</script>
</body>
</html>
