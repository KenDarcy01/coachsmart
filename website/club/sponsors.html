<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Club partners</title>
<!-- Club partners (2026-11-25, thread "Explore advertising in CoachSmart").
     Club officers add the club's sponsor (shown on v3 Home, event screens and
     live scores) and read the reach report: times seen, people reached and
     taps, by screen and team, per month. Totals only, nobody's activity.
     coachsmart.app/club/sponsors.html?club=ID. Data via the `sponsors` edge
     function. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/club/home-pill.js"></script>
<script src="/club/shell.js"></script>
<style>
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--club:#1e3f94;--band:#1e3f94;--onband:#fff;--tint:#1e3f9414;--bg:#f3f4f7;--card:#fff;--card2:#f6f7f9;--text:#1a1d23;--muted:#667080;--line:#e6e8ec;
--good:#2f9e44;--warn:#e08a00;--bad:#d9363e;--c1:#3a6fd8;--c2:#87c232;--c3:#f5a524;--c4:#b07cf0;--c5:#9aa1ad}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:DM,system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.band{background:var(--band);color:var(--onband);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #0002}
.band .crest{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;flex:none}
.band h1{font-size:23px;font-weight:700;line-height:1.1}
.band .sub{font-size:13.5px;opacity:.85;margin-top:2px}
body.cs-shell .band{padding:26px max(48px, calc((100% - 1084px) / 2)) 14px}
.band .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--onband) 16%,transparent);font-size:13.5px;font-weight:500;border:0;cursor:pointer;white-space:nowrap;color:var(--onband)}
.chip.on{background:var(--onband);color:var(--band)}
.links{display:flex;gap:14px;font-size:12.5px;align-items:center}
.links button,.links a{background:none;border:0;cursor:pointer;color:var(--onband);text-decoration:underline;opacity:.9;font-size:12.5px}
.links span{opacity:.75}
.wrap{max-width:1180px;margin:0 auto;padding:6px 48px 60px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:0 1px 3px #0000000f;border:0}
.tile span{font-size:15px;color:var(--muted);font-weight:500}.tile b{display:block;font-size:28px;font-weight:700;margin:6px 0 2px}.tile i{font-size:14px;color:var(--muted);font-style:normal}
.nb{background:#fff7e6;border:1px solid #f5d9a0;border-radius:12px;padding:12px 16px;margin-top:16px;font-size:14px;color:#7a5200}.nb b{margin-right:6px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-top:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px}
h2 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:14.5px}
h2 .act{margin-left:auto;font-size:15px;font-weight:600;color:var(--club);background:none;border:0;cursor:pointer}
h2 small+.act{margin-left:10px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border-top:0}
.row .tx{flex:1;min-width:0}.row .tx b{font-weight:600;display:block}.row .tx small{display:block;color:var(--muted);font-size:14.5px;margin-top:1px}
.row .tx q{display:block;color:#3b4250;font-size:13px;margin-top:3px;quotes:'“' '”'}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.b{border:1px solid #d6d9de;background:#fff;border-radius:10px;padding:8px 13px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.b.go{background:var(--club);border-color:var(--club);color:#fff}
.b.sm{padding:4px 9px;font-weight:500}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.thumb{width:38px;height:46px;border-radius:7px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;cursor:pointer}
.thumb.no{cursor:default;opacity:.6}
.lg{display:flex;gap:14px;margin:4px 0 8px;font-size:12px;color:var(--muted);flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tr{display:grid;grid-template-columns:170px 1fr 150px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:16px;cursor:pointer}
.tr:hover{background:var(--tint)}
.tr .nm b{font-weight:600;display:block}.tr .nm small{color:var(--muted);font-size:14px}
.bar{height:10px;background:#eef0f3;border-radius:5px;overflow:hidden;display:flex;position:relative}.bar i{height:100%}
.tr .am{text-align:right;font-weight:600}.tr .am small{color:var(--muted);font-weight:400}.tr .am .over{color:var(--bad)}
.tr .am button{background:none;border:0;color:var(--club);cursor:pointer;font-size:12px;text-decoration:underline;display:block;margin-left:auto}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:6px;vertical-align:1px}
.p-w{background:#fdf1cf;color:#8a5a00}.p-ok{background:#e6f4dc;color:#3f7a12}.p-q{background:#fde8e8;color:#b02a30}.p-d{background:#e8eefb;color:#2b56b0}.p-x{background:#eef0f4;color:#667080}
.empty{color:var(--muted);font-size:16px;padding:8px 0}
.state{padding:80px 40px;text-align:center;color:var(--muted);font-size:16px}
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:9}
.login.on{display:flex}
.lbox{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:380px;box-shadow:0 4px 24px #0001}
.lbox h2{font-size:22px;margin-bottom:6px}.lbox p{color:var(--muted);font-size:14px;margin-bottom:18px}
.lbox input{width:100%;background:#fff;border:1px solid #d6d9df;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.btn{background:var(--club);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.link{background:none;border:0;color:var(--muted);cursor:pointer;margin-top:12px;font-size:14px}
.msg{font-size:14px;color:var(--bad);min-height:20px;margin-top:6px}.msg.ok{color:var(--good)}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.sheet.on{display:flex}
.sbox{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
.sbox h2 button{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.sbox textarea,.sbox input,.sbox select{width:100%;border:1px solid #d6d9df;border-radius:10px;padding:10px 12px;font-size:15px;margin:6px 0 10px;background:#fff}
.sbox img{max-width:100%;border-radius:10px;display:block;margin:8px auto}
.irow{display:grid;grid-template-columns:1fr 120px 90px auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.irow input,.irow select{margin:0;padding:7px 9px;font-size:14px}
.ldpill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:#1a1d23;color:#fff;font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;display:none}
body.busy .ldpill{display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none}
@media (max-width:900px){
  .band,body.cs-shell .band{padding:18px 14px 10px;flex-wrap:wrap}.band .right{margin-left:0;align-items:flex-start;width:100%}
  .wrap{padding:4px 14px 40px}.tiles{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}
  .tr{grid-template-columns:110px 1fr 100px}.row{flex-wrap:wrap}.btns{width:100%;justify-content:flex-start}
  .irow{grid-template-columns:1fr 1fr}
}

.tiles{grid-template-columns:repeat(3,1fr)}
.sp{display:flex;align-items:center;gap:14px}
.prev{background:#14181b;border-radius:16px;padding:14px;max-width:420px}
.pcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid #2a303a;background:#1e222b;color:#f1f4f8}
.pcard .lg2{width:108px;height:48px;padding:8px 12px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.pcard .lg2 img{max-width:100%;max-height:100%}
.pcard .lb{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#87c232}
.pcard b{display:block;font-size:15px}.pcard small{color:#a1a1a2;font-size:12.5px}
.pl{display:grid;grid-template-columns:130px 1fr 70px 60px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pl:first-of-type{border-top:0}.pl .n{text-align:right;font-weight:600}.pl .t{text-align:right;color:var(--muted);font-size:13px}
.hist{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:10px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.hist i{display:block;width:100%;max-width:46px;background:var(--club);border-radius:6px 6px 0 0;min-height:2px}
.hist b{color:var(--text);font-size:12px;margin-bottom:3px}
.privacy{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.fl{display:block;font-size:13px;font-weight:600;margin-top:4px}
.ck{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 12px;font-size:14px}.ck input{width:auto;margin:0 6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media print{.band .right,.noprint{display:none!important}.band{position:static;box-shadow:none}body{background:#fff}.card{box-shadow:none}}
@media (max-width:900px){.tiles{grid-template-columns:1fr 1fr 1fr}.pl{grid-template-columns:100px 1fr 60px 44px}}
</style>
</head>
<body>
<div class="ldpill" id="ld">Saving…</div>
<div class="toast" id="toast"></div>
<div id="app"><div class="state">Loading…</div></div>
<div class="login" id="login">
  <form class="lbox" id="loginForm">
    <h2>Club partners</h2>
    <p>Sign in with your CoachSmart email and password.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="goBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sbox" id="sbox"></div></div>
<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const P = new URLSearchParams(location.search);
const clubId = Number(P.get('club')) || null;
const thisYear = new Date().getFullYear();
let month = P.get('month') || '';
let sponsorId = Number(P.get('sponsor')) || null;
let D = null;

function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function brand(c) {
  const p = c.primary_colour, s = c.secondary_colour;
  const okText = h => { const l = lum(h); return l != null && l < .45; };
  const accent = okText(p) ? p : okText(s) ? s : '#1a1d23';
  const band = lum(p) != null && lum(p) < .85 ? p : (lum(s) != null && lum(s) < .85 ? s : accent);
  const r = document.documentElement.style;
  r.setProperty('--club', accent); r.setProperty('--band', band);
  r.setProperty('--onband', lum(band) > .5 ? '#14181b' : '#fff');
  r.setProperty('--tint', accent + '12');
  if (c.crest) { let l = document.querySelector('link[rel="icon"]'); if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.href = c.crest; }
}

// ── Sign in ───────────────────────────────────────────────────────
function showLogin(msg) { $('login').classList.add('on'); $('loginMsg').textContent = msg || ''; $('goBtn').disabled = false; $('goBtn').textContent = 'Sign in'; }
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('goBtn').disabled = true; $('goBtn').textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
  $('password').value = ''; $('login').classList.remove('on'); boot();
});
async function signOut() { await sb.auth.signOut(); location.reload(); }
function state(msg) { $('app').innerHTML = `<div class="state">${esc(msg)}<br><br><button class="link" onclick="signOut()">Sign out</button></div>`; }

async function api(body) {
  const { data, error } = await sb.functions.invoke('sponsors', { body });
  if (!error && data && data.success) return data.data;
  let m = data && data.error;
  if (error) { try { m = (await error.context.json()).error; } catch (_) { /* keep */ } }
  throw new Error(m || 'Something went wrong. Please try again.');
}
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); }

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  if (!clubId) return state('Open this page from your club’s link, for example coachsmart.app/club/sponsors.html?club=1.');
  await load();
}
async function load() {
  try { D = await api({ action: 'club', club_id: clubId, sponsor_id: sponsorId, month }); }
  catch (e) { return state(e.message); }
  brand(D.club); document.title = D.club.club_name + ' · Club partners';
  render();
}
async function act(body, label, done) {
  document.body.classList.add('busy');
  try { await api(body); if (done) toast(done); closeSheet(); await load(); }
  catch (e) { toast(e.message); }
  finally { document.body.classList.remove('busy'); }
}


// ── Render ────────────────────────────────────────────────────────
const n0 = v => Number(v || 0).toLocaleString('en-IE');
const mLabel = m => { const [y, mo] = m.split('-').map(Number); return MON[mo - 1] + ' ' + y; };
const mLong = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IE', { month: 'long', year: 'numeric' }); };
const PLACES = [['home', 'Home screen'], ['event', 'Event screens'], ['live', 'Live scores']];
function clean(n) { const c = (D.club.club_name || '').split(' ')[0]; return String(n || '').replace(new RegExp('^' + c + '\\s+', 'i'), ''); }
function closeSheet() { $('sheet').classList.remove('on'); }
function openSheet(h) { $('sbox').innerHTML = h; $('sheet').classList.add('on'); }
function setParam(k, v) { const u = new URL(location); if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); history.replaceState(null, '', u); }
function setMonth(m) { month = m; setParam('month', m); load(); }
function setSponsor(id) { sponsorId = id; setParam('sponsor', id); load(); }

function statusPill(s) {
  const m = { draft: ['Draft · only officers see it', 'p-w'], live: ['Live in the app', 'p-ok'], ended: ['Ended', 'p-x'] }[s] || [s, 'p-x'];
  return `<span class="pill ${m[1]}">${m[0]}</span>`;
}
function preview(s, label) {
  const bg = s.card_colour || '#1e222b';
  return `<div class="prev"><div class="pcard" style="background:${esc(bg)}">
   <div class="lg2">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="">` : '<span style="color:#999;font-size:12px">Logo</span>'}</div>
   <div style="flex:1;min-width:0"><div class="lb">${esc(label || 'Club partner')}</div><b>${esc(s.name)}</b><small>${esc(s.tagline || '')}</small></div>
   <span style="color:#87c232;font-size:20px">›</span></div></div>`;
}

function render() {
  const c = D.club, S = D.sponsors, R = D.report;
  const cur = S.find(s => R && s.sponsor_id === R.sponsor_id) || S[0];
  const months = []; for (let i = 5; i >= 0; i--) { const [y, mo] = D.current.split('-').map(Number); const d = new Date(Date.UTC(y, mo - 1 - i, 1)); months.push(d.toISOString().slice(0, 10)); }
  $('app').innerHTML = `
  <div class="band">${clubHomePill(clubId, c.crest)}<div><h1>Club partners</h1><div class="sub">${esc(c.club_name)}${cur ? ' · ' + esc(cur.name) + ' · ' + mLong(D.month) : ''}</div></div>
   <div class="right"><div class="chips">${months.map(m => `<button class="chip ${m === D.month ? 'on' : ''}" onclick="setMonth('${m}')">${mLabel(m)}</button>`).join('')}</div>
   <div class="links"><button onclick="editSheet()">Add a sponsor</button><button onclick="window.print()">Print report</button><button onclick="signOut()">Sign out</button><span>Powered by CoachSmart</span></div></div></div>
  <div class="wrap">
   ${!S.length ? `<div class="card" style="text-align:center;padding:40px">
      <h2 style="justify-content:center">No club partner yet</h2>
      <p style="color:var(--muted);margin:8px 0 18px">Add your club's sponsor. Their card shows in the CoachSmart app for your parents and coaches, on Home, event screens and live scores, and this page shows how often it was seen. You can also give a team its own sponsor.</p>
      <button class="b go" onclick="editSheet()">Add a sponsor</button></div>` : `
   ${S.length > 1 ? `<div class="chips noprint" style="margin-bottom:14px">${S.map(s => `<button class="b ${cur && s.sponsor_id === cur.sponsor_id ? 'go' : ''}" onclick="setSponsor(${s.sponsor_id})">${esc(s.name)} · ${s.team_id ? esc(clean(s.team_name)) : 'whole club'}${s.status === 'ended' ? ' (ended)' : ''}</button>`).join(' ')}</div>` : ''}
   <div class="cols" style="margin-top:0">
    <div class="stack">
     <div class="tiles">
      <div class="card tile"><span>Times seen</span><b>${n0(R.views)}</b><i>${mLong(D.month)}</i></div>
      <div class="card tile"><span>People reached</span><b>${n0(R.people)}</b><i>each person once</i></div>
      <div class="card tile"><span>Taps to ${esc(cur.name)}</span><b>${n0(R.taps)}</b><i>opened their link</i></div>
     </div>
     <div class="card"><h2>Where it was seen</h2>${placeRows(R)}</div>
     <div class="card"><h2>By team <small>times seen · taps</small></h2>${teamRows(R)}</div>
    </div>
    <div class="stack">
     <div class="card"><h2>${esc(cur.name)} ${statusPill(cur.status)}<button class="act noprint" onclick="editSheet(${cur.sponsor_id})">Edit</button></h2>
      <p style="color:var(--muted);font-size:13px;margin:4px 0 12px">How it looks in the app${cur.status === 'draft' ? '. Set it live when the deal is agreed' : ''}.</p>
      ${preview(cur, cur.team_id ? 'Team partner' : 'Club partner')}
      <p style="color:var(--muted);font-size:13px;margin-top:12px">${cur.team_id ? 'For ' + esc(clean(cur.team_name)) + ' only. ' : 'For the whole club. '}Shows on: ${PLACES.filter(([k]) => cur['on_' + (k === 'event' ? 'events' : k)]).map(p => p[1].toLowerCase()).join(', ') || 'nowhere'}${cur.starts_on || cur.ends_on ? ` · ${cur.starts_on ? 'from ' + cur.starts_on : ''} ${cur.ends_on ? 'until ' + cur.ends_on : ''}` : ''}</p></div>
     <div class="card"><h2>Last six months <small>times seen</small></h2>${hist(R)}</div>
    </div>
   </div>
   <p class="privacy">Counted when the card has been on screen for a second in the new CoachSmart app (parents, coaches and club members). Never shown to or counted for children's own logins. Totals only: CoachSmart keeps no record of who saw it. People reached counts each person once in the month.</p>`}
  </div>`;
}
function placeRows(R) {
  const max = Math.max(1, ...PLACES.map(([k]) => R.by_placement[k].views));
  return PLACES.map(([k, l]) => { const p = R.by_placement[k];
    return `<div class="pl"><span>${l}</span><div class="bar"><i style="width:${100 * p.views / max}%;background:var(--club)"></i></div><span class="n">${n0(p.views)}</span><span class="t">${n0(p.taps)} taps</span></div>`; }).join('');
}
function teamRows(R) {
  if (!R.teams.length) return '<div class="empty">Nothing counted this month yet.</div>';
  const max = Math.max(1, ...R.teams.map(t => t.views));
  return R.teams.map(t => `<div class="pl"><span>${esc(t.team_id ? clean(t.team_name) : t.team_name)}</span><div class="bar"><i style="width:${100 * t.views / max}%;background:var(--club)"></i></div><span class="n">${n0(t.views)}</span><span class="t">${n0(t.taps)} taps</span></div>`).join('');
}
function hist(R) {
  const max = Math.max(1, ...R.history.map(h => h.views));
  return `<div class="hist">${R.history.map(h => `<div><b>${n0(h.views)}</b><i style="height:${Math.max(2, 110 * h.views / max)}px"></i>${mLabel(h.month).split(' ')[0]}<br><span style="font-size:11px">${n0(h.people)} people</span></div>`).join('')}</div>`;
}

// ── Edit ──────────────────────────────────────────────────────────
function editSheet(id) {
  const s = (D.sponsors || []).find(x => x.sponsor_id === id) || { name: '', tagline: 'Proud partner of ' + D.club.club_name, link_url: '', card_colour: '', status: 'draft', on_home: true, on_events: true, on_live: true };
  openSheet(`<h2>${id ? 'Edit sponsor' : 'Add a sponsor'}<button onclick="closeSheet()">×</button></h2>
   <label class="fl">Name</label><input id="f_name" maxlength="80" value="${esc(s.name)}" placeholder="Nolans Supermarket">
   <label class="fl">Line under the name</label><input id="f_tag" maxlength="60" value="${esc(s.tagline || '')}" placeholder="Proud partner of ${esc(D.club.club_name)}">
   <label class="fl">Link when tapped (their website)</label><input id="f_link" maxlength="300" value="${esc(s.link_url || '')}" placeholder="https://">
   <label class="fl">Logo</label><input id="f_logo" type="file" accept="image/png,image/jpeg,image/webp" onchange="checkLogo(this)">
   <small style="color:var(--muted);display:block"><b style="color:var(--text)">Use a landscape (wide) logo</b>, on a white or clear background, PNG, JPG or WebP under 2 MB. Square or tall logos show very small in the app.${s.logo_url ? ' Leave empty to keep the current logo.' : ''}</small>
   <small id="f_logo_warn" style="display:none;color:#a15c00;margin-top:4px">This logo is square or tall, so it will look small. A wide version of the logo is better.</small>
   <label class="fl" style="margin-top:10px">Card colour</label>
   <div class="ck"><label><input type="radio" name="f_col" value="" ${!s.card_colour ? 'checked' : ''}>CoachSmart dark</label><label><input type="radio" name="f_col" value="pick" ${s.card_colour ? 'checked' : ''}>Sponsor colour <input id="f_colour" type="color" value="${esc(s.card_colour || '#15302a')}" style="width:44px;height:28px;padding:0;margin:0 0 0 6px;vertical-align:middle"></label></div>
   <label class="fl">Sponsor for</label>
   <select id="f_team" onchange="teamPicked()"><option value="">The whole club</option>${(D.teams || []).map(t => `<option value="${t.team_id}" ${s.team_id === t.team_id ? 'selected' : ''}>${esc(clean(t.team_name))} only</option>`).join('')}</select>
   <small id="f_team_note" style="color:var(--muted);display:block;margin:-4px 0 8px">A team sponsor shows on that team's events and live scores, in place of the club sponsor, never on Home.</small>
   <label class="fl">Show on</label>
   <div class="ck"><label id="f_home_l"><input type="checkbox" id="f_home" ${s.on_home ? 'checked' : ''}>Home</label><label><input type="checkbox" id="f_events" ${s.on_events ? 'checked' : ''}>Event screens</label><label><input type="checkbox" id="f_live" ${s.on_live ? 'checked' : ''}>Live scores</label></div>
   <div class="two"><div><label class="fl">From (optional)</label><input id="f_from" type="date" value="${esc(s.starts_on || '')}"></div><div><label class="fl">Until (optional)</label><input id="f_to" type="date" value="${esc(s.ends_on || '')}"></div></div>
   <label class="fl">Status</label><select id="f_status">
    <option value="draft" ${s.status === 'draft' ? 'selected' : ''}>Draft: only club officers see it in the app, not counted</option>
    <option value="live" ${s.status === 'live' ? 'selected' : ''}>Live: shown to parents and coaches, counted</option>
    <option value="ended" ${s.status === 'ended' ? 'selected' : ''}>Ended: hidden, report kept</option></select>
   <button class="btn" onclick="saveSponsor(${id || 0})">Save</button>`);
  teamPicked();
}
function teamPicked() {
  const team = !!$('f_team').value;
  $('f_home').disabled = team; if (team) $('f_home').checked = false;
  $('f_home_l').style.opacity = team ? .45 : 1;
  $('f_team_note').style.display = team ? 'block' : 'none';
}
// Landscape logos only (Ken, 2026-11-26): the app's logo tile is wide, so a
// square or tall logo shows tiny. Warn, but still allow it.
function checkLogo(inp) {
  const w = $('f_logo_warn'), f = inp.files[0];
  w.style.display = 'none';
  if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { if (im.naturalWidth < im.naturalHeight * 1.3) w.style.display = 'block'; URL.revokeObjectURL(url); };
  im.src = url;
}
function fileB64(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); }); }
async function saveSponsor(id) {
  const colour = document.querySelector('input[name="f_col"]:checked').value === 'pick' ? $('f_colour').value : null;
  const sponsor = { sponsor_id: id || null, team_id: Number($('f_team').value) || null, name: $('f_name').value, tagline: $('f_tag').value, link_url: $('f_link').value, card_colour: colour,
    on_home: $('f_home').checked, on_events: $('f_events').checked, on_live: $('f_live').checked, starts_on: $('f_from').value, ends_on: $('f_to').value, status: $('f_status').value };
  const f = $('f_logo').files[0];
  if (f && f.size > 2e6) return toast('The logo must be under 2 MB.');
  document.body.classList.add('busy');
  try {
    const saved = await api({ action: 'save', club_id: clubId, sponsor });
    if (f) await api({ action: 'logo', club_id: clubId, sponsor_id: saved.sponsor_id, image: await fileB64(f), mime: f.type });
    toast('Saved.'); closeSheet(); sponsorId = saved.sponsor_id; setParam('sponsor', sponsorId); await load();
  } catch (e) { toast(e.message); }
  finally { document.body.classList.remove('busy'); }
}
boot();
</script>
</body>
</html>
