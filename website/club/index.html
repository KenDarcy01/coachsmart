<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Club tools</title>
<script>
// Club home (Ken 2026-11-25): coachsmart.app/club/?club=ID is now a fast
// landing page with a tile for each club tool the officer can open. The
// dashboard moved to /club/dashboard.html. Old dashboard links (invite,
// period, week, tab, #team) go straight there.
(function () {
  const p = new URLSearchParams(location.search);
  if (p.get('invite') || p.get('period') || p.get('week') || p.get('tab') || /^#(t|g)/.test(location.hash))
    location.replace('/club/dashboard.html' + location.search + location.hash);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--club:#1a1d23;--band:#1a1d23;--onband:#fff;--tint:#1a1d2314;--bg:#f3f4f7;--card:#fff;--text:#1a1d23;--muted:#667080;--line:#e6e8ec;--good:#2f9e44;--bad:#d9363e;--moneybg:#fdf6e3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:DM,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.band{background:var(--band);color:var(--onband);padding:18px 16px 20px;padding-top:max(18px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.crest{width:52px;height:52px;background:#fff;border-radius:50%;padding:4px;object-fit:contain;flex:none}
.band h1{font-size:21px;font-weight:700;line-height:1.15}.band .sub{font-size:13.5px;opacity:.88;margin-top:2px}
.out{margin-left:auto;font-size:13px;opacity:.85;text-decoration:underline;background:none;border:0;color:var(--onband);cursor:pointer;align-self:flex-start;margin-top:4px}
.hello{font-size:15px;margin:14px auto 0;opacity:.95;max-width:1080px}
.wrap{padding:16px 14px 28px;max-width:1080px;margin:0 auto}
.h2{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.h2:first-child{margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px;min-height:124px;box-shadow:0 1px 2px #0000000f;display:flex;flex-direction:column;position:relative;cursor:pointer;text-align:left;border:0;transition:transform .08s}
.tile:active{transform:scale(.98)}
.ic{width:38px;height:38px;border-radius:11px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:2px;flex:none}
.tile b{font-size:15.5px;margin-top:12px}.tile small{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.35}
.badge{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.tile.money .ic{background:var(--moneybg)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.tile.wide b{margin:0}.tile.wide .txt{flex:1}
.tile.wide .chev{color:#b4b9c2;font-size:22px}
.tile.wide .badge{position:static}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
.hint{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:13px 14px;color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:12px}
.state{padding:70px 30px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5}
.link{background:none;border:0;color:var(--muted);cursor:pointer;margin-top:12px;font-size:14px;text-decoration:underline}
/* sign in */
.login{display:none;align-items:center;justify-content:center;padding:20px;min-height:100vh}
.login.on{display:flex}
.lbox{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:380px;box-shadow:0 4px 24px #0001}
.lbox .icrest{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 12px}
.lbox h2{font-size:22px;margin-bottom:6px;text-align:center}.lbox p{color:var(--muted);font-size:14px;margin-bottom:18px;text-align:center}
.lbox input{width:100%;background:#fff;border:1px solid #d6d9df;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.btn{background:var(--club);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.msg{font-size:14px;color:var(--bad);min-height:20px;margin-top:6px}.msg.ok{color:var(--good)}
.lbox .link{display:block;margin:12px auto 0}
@media (min-width:760px){
 .band{padding:18px 40px}
 .wrap{padding:22px 40px}
 .tiles{grid-template-columns:repeat(4,1fr);gap:14px}
 .tile{min-height:150px;padding:18px}
 .tile.wide{grid-column:span 2}
}
</style>
</head>
<body>
<div id="app"><div class="state">Loading…</div></div>

<div class="login" id="login">
  <form class="lbox" id="loginForm">
    <img class="icrest" id="lcrest" alt="" hidden>
    <h2 id="ltitle">Club tools</h2>
    <p>Sign in with your CoachSmart email and password.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="goBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg"></div>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </form>
</div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const clubId = Number(new URLSearchParams(location.search).get('club')) || null;
const CACHE = 'cs_club_home_' + clubId;

// ── Club colours (same rules as the dashboard) ────────────────────
function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function brand(c) {
  if (!c) return;
  const p = c.primary_colour, s = c.secondary_colour;
  const okText = h => { const l = lum(h); return l != null && l < .45; };
  const accent = okText(p) ? p : okText(s) ? s : '#1a1d23';
  const band = lum(p) != null && lum(p) < .85 ? p : (lum(s) != null && lum(s) < .85 ? s : accent);
  const r = document.documentElement.style;
  r.setProperty('--club', accent); r.setProperty('--band', band);
  r.setProperty('--onband', lum(band) > .5 ? '#14181b' : '#fff');
  r.setProperty('--tint', accent + '17');
  document.title = c.club_name + ' · Club tools';
  if (c.crest) ['icon', 'apple-touch-icon'].forEach(rel => {
    let l = document.querySelector(`link[rel="${rel}"]`);
    if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
    l.href = c.crest;
  });
}

// ── Sign in ───────────────────────────────────────────────────────
function showLogin(msg, ok) {
  $('app').innerHTML = '';
  $('login').classList.add('on');
  $('loginMsg').textContent = msg || ''; $('loginMsg').classList.toggle('ok', !!ok);
  $('goBtn').disabled = false; $('goBtn').textContent = 'Sign in';
  sb.rpc('club_brand', { p_club: clubId }).then(({ data }) => {
    if (!data) return; brand(data);
    $('ltitle').textContent = data.club_name;
    if (data.crest) { $('lcrest').src = data.crest; $('lcrest').hidden = false; }
  }, () => {});
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('goBtn').disabled = true; $('goBtn').textContent = 'Signing in…'; $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
  $('password').value = ''; $('login').classList.remove('on'); boot();
});
$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return showLogin('Type your email first, then tap Forgot password.');
  const { error } = await sb.auth.resetPasswordForEmail(email);
  showLogin(error ? error.message : 'Check your email for a link to reset your password.', !error);
});
async function signOut() { try { localStorage.removeItem(CACHE); } catch (e) {} await sb.auth.signOut(); location.reload(); }
function state(msg, withOut) {
  $('app').innerHTML = `<div class="state">${esc(msg)}${withOut ? '<br><button class="link" onclick="signOut()">Sign out</button>' : ''}</div>`;
}

// ── Tiles ─────────────────────────────────────────────────────────
function dayLabel(iso) {
  const d = new Date(iso); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
// Each tile: [key, icon, title, subtitle, badge, href, money]
function tilesFor(H) {
  const t = H.tiles || {}, q = '?club=' + clubId, out = [];
  if (t.dashboard) out.push(['dashboard', '📊', 'Club dashboard', 'Results, tables, turnout, health check', 0, '/club/dashboard.html' + q + '&period=season']);
  if (t.week) {
    const w = t.week, bits = [];
    if (w.games) bits.push(plural(w.games, 'fixture', 'fixtures'));
    if (w.events) bits.push(plural(w.events, 'team event', 'team events'));
    out.push(['week', '🗓', 'This week', bits.join(' · ') || 'Results and fixtures', 0, '/club/dashboard.html' + q + '&period=week']);
  }
  if (t.pitches) {
    const n = t.pitches.unread || 0;
    out.push(['pitches', '🏟', 'Pitch planner', n ? plural(n, 'change', 'changes') + ' from the league' : 'Pitch bookings and slots', n, '#pitches']);
  }
  if (t.newsletter) {
    const nl = t.newsletter, no = nl.issue_no ? 'Issue ' + nl.issue_no : '';
    const sub = !nl.status ? 'Set up your first issue'
      : nl.status === 'built' ? no + ' ready to approve'
      : nl.status === 'approved' ? no + ' is out'
      : no + ' being put together';
    out.push(['newsletter', '📰', nl.title || 'Newsletter', sub, nl.status === 'built' ? 1 : 0, '/club/newsletter.html' + q]);
  }
  if (t.sponsors) {
    const s = t.sponsors;
    out.push(['sponsors', '🤝', 'Club partners', s.live ? s.live + ' · live' : s.drafts ? plural(s.drafts, 'draft', 'drafts') : 'Add your club sponsor', 0, '/club/sponsors.html' + q]);
  }
  if (t.officers) {
    const o = t.officers;
    out.push(['officers', '👥', 'Club officers', plural(o.officers, 'officer', 'officers') + (o.invites ? ' · ' + plural(o.invites, 'invite', 'invites') + ' out' : ''), 0, '/club/dashboard.html' + q + '&period=season&open=officers']);
  }
  if (t.spend) {
    const c = t.spend.claims || 0, g = t.spend.gear || 0, bits = [];
    if (c) bits.push(plural(c, 'claim', 'claims')); if (g) bits.push(plural(g, 'gear request', 'gear requests'));
    out.push(['spend', '🧾', 'Spend & gear', bits.length ? bits.join(', ') + ' to look at' : 'Nothing waiting', c + g, '/club/spend.html' + q, true]);
  }
  if (t.lotto) {
    out.push(['lotto', '🎟', 'Club lotto', t.lotto.next_draw ? 'Next draw ' + dayLabel(t.lotto.next_draw) : 'Draws, sales and winners', 0, '/lotto/admin.html?lotto=' + t.lotto.lotto_id, true]);
  }
  return out;
}
function tileHtml([key, ic, title, sub, badge, href, money], wide) {
  return `<a class="tile${money ? ' money' : ''}${wide ? ' wide' : ''}" href="${esc(href)}" data-k="${key}">
    ${!wide && badge ? `<span class="badge">${badge > 99 ? '99+' : badge}</span>` : ''}
    <div class="ic">${ic}</div>
    ${wide ? `<div class="txt"><b>${esc(title)}</b><br><small>${esc(sub)}</small></div>${badge ? `<span class="badge">${badge > 99 ? '99+' : badge}</span>` : '<span class="chev">›</span>'}`
           : `<b>${esc(title)}</b><small>${esc(sub)}</small>`}</a>`;
}
function render(H) {
  brand(H.club);
  const all = tilesFor(H), club = all.filter(t => !t[6]), money = all.filter(t => t[6]);
  const me = H.me || {}, hello = [me.first_name ? 'Hi ' + me.first_name : '', me.title].filter(Boolean).join(' · ');
  const one = all.length === 1;
  $('app').innerHTML = `<div class="band"><div class="top">
      ${H.club.crest ? `<img class="crest" src="${esc(H.club.crest)}" alt="">` : ''}
      <div><h1>${esc(H.club.club_name)}</h1><div class="sub">Club tools</div></div>
      <button class="out" onclick="signOut()">Sign out</button></div>
      ${hello ? `<div class="hello">${esc(hello)}</div>` : ''}</div>
    <div class="wrap">
      ${!all.length ? `<div class="state">You don’t have access to any ${esc(H.club.club_name)} tools yet. Ask your chairperson or CoachSmart to add you.</div>` : ''}
      ${club.length ? `<div class="h2">${one ? 'Your tools' : 'Club'}</div><div class="tiles">${club.map(t => tileHtml(t, one)).join('')}</div>` : ''}
      ${money.length ? `<div class="h2">${one ? 'Your tools' : 'Money'}</div><div class="tiles">${money.map(t => tileHtml(t, one)).join('')}</div>` : ''}
      ${one ? '<div class="hint">Need something else? Ask your chairperson to give you access.</div>' : ''}
      <div class="foot">Powered by CoachSmart</div>
    </div>`;
  const pt = document.querySelector('[data-k="pitches"]');
  if (pt) pt.addEventListener('click', openPlanner);
}
// The planner is another website with its own login store: hand this login
// over in the link's #fragment (never sent to a server; the planner wipes it).
async function openPlanner(e) {
  e.preventDefault();
  const url = `https://coachsmart-v3.web.app/pitches?club=${clubId}&look=club`;
  try {
    const { data: { session } } = await sb.auth.getSession();
    location.href = session ? url + '#cs_rt=' + encodeURIComponent(session.refresh_token) : url;
  } catch (err) { location.href = url; }
}

async function boot() {
  if (!clubId) return state('Open this page from your club’s link, for example coachsmart.app/club/?club=1.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  // Paint the last known tiles straight away, then refresh them.
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (e) {}
  if (cached && cached.uid === session.user.id) render(cached.h);
  const { data, error } = await sb.rpc('club_home', { p_club: clubId });
  if (error) return cached ? null : state('Something went wrong loading your club tools. Please try again.', true);
  if (data.error === 'not_signed_in') return showLogin();
  if (data.error) return state('Club not found. Check the link you were given.', true);
  try { localStorage.setItem(CACHE, JSON.stringify({ uid: session.user.id, h: data })); } catch (e) {}
  render(data);
}
boot();
</script>
</body>
</html>
