<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Club tools</title>
<script>
// Club home (Ken 2026-11-25): coachsmart.app/club/?club=ID is now a fast
// landing page with a tile for each club tool the officer can open. The
// dashboard moved to /club/dashboard.html. Old dashboard links (invite,
// period, week, tab, #team) go straight there.
(function () {
  const p = new URLSearchParams(location.search);
  if (p.get('invite') || p.get('period') || p.get('week') || p.get('tab') || /^#(t|g)/.test(location.hash))
    location.replace('/club/dashboard.html' + location.search + location.hash);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.csShellOwner = true; // this page paints the shared header itself</script>
<script src="/club/shell.js"></script>
<style>
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--club:#1a1d23;--band:#1a1d23;--onband:#fff;--tint:#1a1d2314;--bg:#f3f4f7;--card:#fff;--text:#1a1d23;--muted:#667080;--line:#e6e8ec;--good:#2f9e44;--bad:#d9363e;--gold:#b7791f;--goldbg:#fdf3df}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:DM,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.band{background:var(--card);border-bottom:5px solid var(--club);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:18px;max-width:1180px;margin:0 auto;padding:26px 48px}
.crest{width:64px;height:64px;object-fit:contain;flex:none}
.band h1{font-size:28px;font-weight:700;line-height:1.15}.band .sub{font-size:17px;color:var(--muted);margin-top:2px}
.out{margin-left:auto;font-size:16px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer}
.out:hover{color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:34px 48px 40px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.cols.one{grid-template-columns:1fr;max-width:620px;margin:0 auto}
.h2{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 6px 12px}
.list{background:var(--card);border-radius:18px;box-shadow:0 1px 3px #0000000f;overflow:hidden;margin-bottom:28px}
.r{display:flex;align-items:center;gap:20px;padding:22px 24px;border-top:1px solid var(--line);cursor:pointer;transition:background .1s}
.r:first-child{border-top:0}
.r:hover{background:#f8f9fb}
.r.hot{background:#fffaf0}.r.hot:hover{background:#fff5e3}
.ic{width:54px;height:54px;border-radius:50%;background:var(--club);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.r.money .ic{background:var(--gold)}
.txt{flex:1;min-width:0}
.r h3{font-size:20px;font-weight:700}.r p{font-size:16.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.st{flex:none;text-align:right}
.pill{display:inline-block;font-size:15px;font-weight:600;white-space:nowrap;background:var(--tint);color:var(--club);border-radius:999px;padding:6px 14px}
.pill.ok{background:#e8f5ec;color:#2b7a3d}.pill.gold{background:var(--goldbg);color:var(--gold)}.pill.plain{background:#eef0f3;color:var(--muted)}
.chev{color:#b3b8c1;font-size:28px;line-height:1;flex:none}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.hint{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:16px;line-height:1.45;margin-bottom:24px}
.state{padding:70px 30px;text-align:center;color:var(--muted);font-size:17px;line-height:1.5}
.link{background:none;border:0;color:var(--muted);cursor:pointer;margin-top:12px;font-size:14px;text-decoration:underline}
/* sign in */
.login{display:none;align-items:center;justify-content:center;padding:20px;min-height:100vh}
.login.on{display:flex}
.lbox{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:380px;box-shadow:0 4px 24px #0001}
.lbox .icrest{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 12px}
.lbox h2{font-size:22px;margin-bottom:6px;text-align:center}.lbox p{color:var(--muted);font-size:14px;margin-bottom:18px;text-align:center}
.lbox input{width:100%;background:#fff;border:1px solid #d6d9df;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.btn{background:var(--club);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.msg{font-size:14px;color:var(--bad);min-height:20px;margin-top:6px}.msg.ok{color:var(--good)}
.lbox .link{display:block;margin:12px auto 0}
@media (max-width:760px){
 .top{padding:18px 16px;gap:14px}.crest{width:50px;height:50px}
 .band h1{font-size:23px}.band .sub{font-size:15px}.out{font-size:15px}
 .wrap{padding:20px 14px 28px}.cols{grid-template-columns:1fr;gap:0}
 .r{padding:16px;gap:14px;flex-wrap:wrap}.ic{width:46px;height:46px}.ic svg{width:23px;height:23px}
 .r h3{font-size:18px}.r p{font-size:15px}
 .st{order:4;flex-basis:100%;text-align:left;padding-left:60px;margin-top:-4px}
 .st:empty{display:none}.pill{font-size:14px;padding:5px 12px}
}
</style>
</head>
<body>
<div id="app"><div class="state">Loading…</div></div>

<div class="login" id="login">
  <form class="lbox" id="loginForm">
    <img class="icrest" id="lcrest" alt="" hidden>
    <h2 id="ltitle">Club tools</h2>
    <p>Sign in with your CoachSmart email and password.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="goBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg"></div>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </form>
</div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const clubId = Number(new URLSearchParams(location.search).get('club')) || null;
const CACHE = 'cs_club_home_' + clubId;

// ── Club colours (same rules as the dashboard) ────────────────────
function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function brand(c) {
  if (!c) return;
  const p = c.primary_colour, s = c.secondary_colour;
  const okText = h => { const l = lum(h); return l != null && l < .45; };
  const accent = okText(p) ? p : okText(s) ? s : '#1a1d23';
  const band = lum(p) != null && lum(p) < .85 ? p : (lum(s) != null && lum(s) < .85 ? s : accent);
  const r = document.documentElement.style;
  r.setProperty('--club', accent); r.setProperty('--band', band);
  r.setProperty('--onband', lum(band) > .5 ? '#14181b' : '#fff');
  r.setProperty('--tint', accent + '17');
  document.title = c.club_name + ' · Club tools';
  if (c.crest) ['icon', 'apple-touch-icon'].forEach(rel => {
    let l = document.querySelector(`link[rel="${rel}"]`);
    if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
    l.href = c.crest;
  });
}

// ── Sign in ───────────────────────────────────────────────────────
function showLogin(msg, ok) {
  $('app').innerHTML = '';
  $('login').classList.add('on');
  $('loginMsg').textContent = msg || ''; $('loginMsg').classList.toggle('ok', !!ok);
  $('goBtn').disabled = false; $('goBtn').textContent = 'Sign in';
  sb.rpc('club_brand', { p_club: clubId }).then(({ data }) => {
    if (!data) return; brand(data);
    $('ltitle').textContent = data.club_name;
    if (data.crest) { $('lcrest').src = data.crest; $('lcrest').hidden = false; }
  }, () => {});
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('goBtn').disabled = true; $('goBtn').textContent = 'Signing in…'; $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
  $('password').value = ''; $('login').classList.remove('on'); boot();
});
$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return showLogin('Type your email first, then tap Forgot password.');
  const { error } = await sb.auth.resetPasswordForEmail(email);
  showLogin(error ? error.message : 'Check your email for a link to reset your password.', !error);
});
async function signOut() { try { localStorage.removeItem(CACHE); } catch (e) {} await sb.auth.signOut(); location.reload(); }
function state(msg, withOut) {
  $('app').innerHTML = `<div class="state">${esc(msg)}${withOut ? '<br><button class="link" onclick="signOut()">Sign out</button>' : ''}</div>`;
}

// ── Tiles ─────────────────────────────────────────────────────────
function dayLabel(iso) {
  const d = new Date(iso); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
// Club home rows (design C, Ken 2026-11-27): big list rows in three groups
// with a status pill on the right. Each row:
// {k, g: 'run'|'talk'|'money', ic, title, desc, pill: [text, kind], href}
// pill kind: '' club tint (wants action), ok green, gold, plain grey.
const ICONS = {
  dashboard: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',
  week: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  pitches: '<rect x="2" y="5" width="20" height="14" rx="1.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/><path d="M2 9h3v6H2M22 9h-3v6h3"/>',
  newsletter: '<path d="M4 4h13v16H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v10a2 2 0 0 1-2 2"/><path d="M8 8h5M8 12h5M8 16h3"/>',
  sponsors: '<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/>',
  messages: '<path d="M3 11l15-6v14L3 13z"/><path d="M7 13v5a2 2 0 0 0 4 0v-3.5"/><path d="M21 9v6"/>',
  officers: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 5 5"/>',
  spend: '<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h3"/>',
  lotto: '<path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/>'
};
function rowsFor(H) {
  const t = H.tiles || {}, q = '?club=' + clubId, out = [];
  const add = (k, g, title, desc, pill, href) => out.push({ k, g, title, desc, pill, href });
  if (t.dashboard) add('dashboard', 'run', 'Club dashboard', 'Results, tables, turnout, health check', null, '/club/dashboard.html' + q + '&period=season');
  if (t.week) {
    const w = t.week, bits = [];
    if (w.games) bits.push(plural(w.games, 'fixture', 'fixtures'));
    if (w.events) bits.push(plural(w.events, 'team event', 'team events'));
    add('week', 'run', 'This week', bits.join(' · ') || 'Results and fixtures', null, '/club/dashboard.html' + q + '&period=week');
  }
  if (t.pitches) {
    const n = t.pitches.unread || 0;
    add('pitches', 'run', 'Pitch planner', 'Pitch bookings and slots', n ? [plural(n, 'fixture change', 'fixture changes'), ''] : null, '/club/pitches.html' + q);
  }
  if (t.officers) {
    const o = t.officers;
    add('officers', 'run', 'Club officers', plural(o.officers, 'officer', 'officers'), o.invites ? [plural(o.invites, 'invite', 'invites') + ' out', 'plain'] : null, '/club/officers.html' + q);
  }
  if (t.newsletter) {
    const nl = t.newsletter, no = nl.issue_no ? 'Issue ' + nl.issue_no : 'Issue';
    const pill = !nl.status ? ['Set up first issue', '']
      : nl.status === 'built' ? [no + ' to approve', '']
      : nl.status === 'approved' ? [no + ' is out', 'ok']
      : [no + ' in progress', 'plain'];
    add('newsletter', 'talk', nl.title || 'Newsletter', 'Weekly club newsletter', pill, '/club/newsletter.html' + q);
  }
  if (t.messages) {
    const m = t.messages;
    add('messages', 'talk', 'Messages', m.sent ? m.sent + ' sent this month' : 'Pop-ups and news in the app', m.live ? [m.live + ' live', 'ok'] : null, '/club/messages.html' + q);
  }
  if (t.sponsors) {
    const s = t.sponsors;
    add('sponsors', 'talk', 'Club partners', 'Sponsor slots in the app', s.live ? [s.live + ' live', 'ok'] : s.drafts ? [plural(s.drafts, 'draft', 'drafts'), 'plain'] : ['Add a sponsor', ''], '/club/sponsors.html' + q);
  }
  if (t.spend) {
    const n = (t.spend.claims || 0) + (t.spend.gear || 0);
    add('spend', 'money', 'Spend & gear', 'Coach expenses and gear requests', n ? [n + ' to look at', ''] : ['Nothing waiting', 'ok'], '/club/spend.html' + q);
  }
  if (t.lotto) {
    add('lotto', 'money', 'Club lotto', 'Draws, sales and winners', t.lotto.next_draw ? ['Draw ' + dayLabel(t.lotto.next_draw), 'gold'] : null, '/lotto/admin.html?lotto=' + t.lotto.lotto_id);
  }
  return out;
}
function rowHtml(r) {
  const hot = r.pill && r.pill[1] === '' && r.k !== 'sponsors';
  return `<a class="r${r.g === 'money' ? ' money' : ''}${hot ? ' hot' : ''}" href="${esc(r.href)}" data-k="${r.k}">
    <div class="ic"><svg viewBox="0 0 24 24">${ICONS[r.k]}</svg></div>
    <div class="txt"><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p></div>
    <div class="st">${r.pill ? `<span class="pill ${r.pill[1]}">${esc(r.pill[0])}</span>` : ''}</div>
    <span class="chev">›</span></a>`;
}
function render(H) {
  brand(H.club);
  const all = rowsFor(H), me = H.me || {};
  const by = g => all.filter(r => r.g === g);
  const group = (label, rows) => rows.length ? `<div class="h2">${label}</div><div class="list">${rows.map(rowHtml).join('')}</div>` : '';
  const left = group('Run the club', by('run')) + group('Money', by('money')), right = group('Talk to members', by('talk'));
  window.csShellSet(H); // shared header + tool menu (club/shell.js)
  $('app').innerHTML = `<div class="wrap">
      ${!all.length ? `<div class="state">You don’t have access to any ${esc(H.club.club_name)} tools yet. Ask your chairperson or CoachSmart to add you.</div>` : ''}
      ${all.length ? `<div class="cols${left && right ? '' : ' one'}"><div>${left}</div>${right ? `<div>${right}</div>` : ''}</div>` : ''}
      ${all.length === 1 ? '<div class="cols one"><div class="hint">Need something else? Ask your chairperson to give you access.</div></div>' : ''}
      <div class="foot">Powered by CoachSmart</div>
    </div>`;
}
async function boot() {
  if (!clubId) return state('Open this page from your club’s link, for example coachsmart.app/club/?club=1.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  // Paint the last known tiles straight away, then refresh them.
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (e) {}
  if (cached && cached.uid === session.user.id) render(cached.h);
  const { data, error } = await sb.rpc('club_home', { p_club: clubId });
  if (error) return cached ? null : state('Something went wrong loading your club tools. Please try again.', true);
  if (data.error === 'not_signed_in') return showLogin();
  if (data.error) return state('Club not found. Check the link you were given.', true);
  try { localStorage.setItem(CACHE, JSON.stringify({ uid: session.user.id, h: data })); } catch (e) {}
  render(data);
}
boot();
</script>
</body>
</html>
