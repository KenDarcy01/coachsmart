<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Club dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--club:#1e3f94;--band:#1e3f94;--onband:#fff;--tint:#1e3f9414;--bg:#f3f4f7;--card:#fff;--card2:#f6f7f9;--text:#1a1d23;--muted:#667080;--line:#e6e8ec;
--good:#2f9e44;--warn:#e08a00;--bad:#d9363e;--FB:#3f9a1f;--HU:#1f74d6;--LG:#e0468a;--CA:#8b4fd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:DM,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
/* top band */
.band{background:var(--band);color:var(--onband);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #0002}
.band .crest{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;flex:none}
.band h1{font-size:23px;font-weight:700;line-height:1.1}
.band .sub{font-size:13.5px;opacity:.85;margin-top:2px}
.band .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--onband) 16%,transparent);font-size:13.5px;font-weight:500;border:0;cursor:pointer;white-space:nowrap;color:var(--onband)}
.chip.on{background:var(--onband);color:var(--band)}
.posb{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.posl{display:grid;grid-template-columns:10px minmax(70px,auto) auto auto 1fr;align-items:center;gap:6px;font-size:13px;margin-top:5px}.posl b{font-size:14px}.posl .of{color:var(--muted)}.posl .cp{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.ltr{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font:inherit;font-size:14px;cursor:pointer;text-align:left;color:inherit}
.ltr .chev,.comps .clk span::after{color:var(--muted)}.ltr .chev{margin-left:4px}
.comps .clk{cursor:pointer;border-radius:6px}.comps .clk:hover{background:var(--tint)}.comps .clk span{text-decoration:underline;text-decoration-color:#0002;text-underline-offset:3px}
.comps em{font-style:normal;color:var(--club);font-weight:700;font-size:12px;text-decoration:none}
.csub{color:var(--muted);font-size:14px;margin:-6px 0 10px}.csub .dot{margin-right:6px}.csub b{color:var(--club)}.csub small{font-size:12px}
.lnote{color:var(--muted);font-size:12px;margin-top:6px}
.ch{font-size:15px;margin:16px 0 4px;display:flex;justify-content:space-between}.ch small{color:var(--muted);font-weight:500}
.cg{display:grid;grid-template-columns:62px 1fr auto 72px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.cg .d{color:var(--muted);font-size:12.5px}.cg .o small{color:var(--muted)}.cg .s{font-weight:700;text-align:right}.cg .s.g{color:var(--good)}.cg .s.r{color:var(--bad)}.cg .s.m{color:var(--muted);font-weight:500}.cg .mg{font-size:12px;color:var(--muted);text-align:right}
.lt{border-top:1px solid var(--line);padding:10px 0}.lt summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}.lt summary::-webkit-details-marker{display:none}
.lt .lp{margin-left:auto;font-weight:700;color:var(--club)}
.lt table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}.lt th{color:var(--muted);font-weight:500;text-align:right;padding:4px 6px}.lt th:nth-child(2){text-align:left}
.lt td{padding:5px 6px;text-align:right;border-top:1px solid var(--line)}.lt td:nth-child(2){text-align:left}.lt td:first-child{color:var(--muted);width:22px}
.lt tr.me td{background:var(--tint);font-weight:700}.lt tr.us td{font-weight:600}
.rnd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef0f4;color:#3b4250;margin-left:6px;vertical-align:2px;white-space:nowrap}.rnd.f{background:#fdf1cf;color:#8a5a00}.rt .rnd{margin-left:0}
/* loading (Ken 2026-11-16): bar at the top, page dimmed, label pill */
.ldbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;overflow:hidden;display:none}
.ldbar::before{content:'';position:absolute;top:0;bottom:0;width:40%;background:var(--club);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{left:-40%}100%{left:100%}}
.ldpill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:#1a1d23;color:#fff;font-size:14px;font-weight:600;padding:9px 16px 9px 14px;border-radius:999px;display:none;align-items:center;gap:9px;box-shadow:0 4px 18px #0003}
.ldpill i{width:14px;height:14px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.busy .ldbar{display:block}body.busy .ldpill{display:flex}
body.busy #app .layout{opacity:.45;pointer-events:none;transition:opacity .15s}body.busy #app .band{pointer-events:none}
.links{display:flex;gap:14px;font-size:12.5px;align-items:center}
.links button{background:none;border:0;cursor:pointer;color:var(--onband);text-decoration:underline;opacity:.9;font-size:12.5px}
.links span{opacity:.75}
.menu-btn{display:none}
/* layout */
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 80px)}
.side{background:var(--card);border-right:1px solid var(--line);padding:16px 12px 40px;position:sticky;top:80px;height:calc(100vh - 80px);overflow:auto}
.nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14.5px;color:#2b2f36;line-height:1.25}
.nav:hover{background:var(--card2)}
.nav.on{background:var(--tint);color:var(--club);font-weight:700}
.nav .cnt{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:500}
.nav.club{font-weight:700;font-size:15.5px;margin-bottom:6px}
.nav.grp{font-weight:700;font-size:15px;margin-top:10px}
.nav.grp small{color:var(--muted);font-weight:500;font-size:12px}
.nav.code{padding-left:22px;font-weight:600}
.nav.team{padding-left:40px;font-size:14px}
.nav.team.off{color:#8a919c}
.nav .dot{width:9px;height:9px}
.caret{width:14px;color:var(--muted);font-size:11px;flex:none;text-align:center}
.main{padding:22px 28px 60px;min-width:0;max-width:1400px}
.crumbs{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.crumbs a{color:var(--club);font-weight:600;cursor:pointer}
.ttl{font-size:28px;font-weight:700;letter-spacing:-.3px}
.ttl-sub{color:var(--muted);margin-top:3px;font-size:14.5px}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px #0000000d,0 2px 10px #0000000a;border:1px solid #eceef2}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.kpis.k6{grid-template-columns:repeat(3,1fr)}
.kpi{display:flex;align-items:center;gap:14px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .s{color:var(--muted);font-size:12.5px}
.ring{flex:none}
.g{color:var(--good)}.a{color:var(--warn)}.r{color:var(--bad)}.m{color:#9aa1ab}
.att{margin-top:16px;background:#fff7e6;border:1px solid #f4dca6;border-radius:14px;padding:12px 16px;color:#7a4b00;font-size:14px;display:flex;gap:8px 20px;flex-wrap:wrap}
.att b{color:#4a2e00}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec h2{font-size:19px}
.sec span{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.tc{cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:10px}
.tc:hover{transform:translateY(-2px);box-shadow:0 4px 18px #0000001a}
.tc .top{display:flex;align-items:flex-start;gap:10px}
.tc .nm{font-weight:700;font-size:16.5px}
.tc .nm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.tc .age{margin-left:auto;background:var(--tint);color:var(--club);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tc.off{background:#fbfbfc}
.flag{color:var(--warn)!important;font-weight:600!important}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card2);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:10px}
.mini b{font-size:19px;display:block;line-height:1.1}
.mini span{color:var(--muted);font-size:12px}
.codeline{display:flex;align-items:center;gap:8px;font-size:13.5px}
.codeline .cn{width:118px;display:flex;align-items:center;gap:7px;color:#2b2f36;flex:none}
.codeline .rec{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.codeline .nos{margin-left:auto;color:var(--muted)}
.wbar{flex:1;height:9px;border-radius:5px;overflow:hidden;display:flex;background:#eceef2;min-width:40px}
.wbar i{display:block;height:100%}
.form{display:flex;gap:4px}
.form i{width:18px;height:18px;border-radius:50%;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.hc{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 11px;background:var(--card2)}
.hc .hn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex:none}
.hc.g .hn{background:var(--good)}.hc.a .hn{background:var(--warn)}.hc.r .hn{background:var(--bad)}
.hc.g{background:#2f9e4412}.hc.a{background:#e08a0014}.hc.r{background:#d9363e12}
.hc .hl b{display:block;font-size:13.5px}.hc .hl span{color:var(--muted);font-size:12.5px}
.hbig{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.hparts{display:flex;flex-direction:column;gap:9px}
.hp{display:grid;grid-template-columns:140px 1fr 48px;gap:4px 10px;align-items:center;font-size:13.5px}
.hp b{text-align:right;font-variant-numeric:tabular-nums}
.hp .hb{height:8px;border-radius:4px;background:#eceef2;overflow:hidden}.hp .hb i{display:block;height:100%}
.hp .nt{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-3px}
@media(max-width:700px){.hbig{grid-template-columns:1fr}.hp{grid-template-columns:110px 1fr 44px}}
.wk{display:flex;align-items:center;gap:10px;margin-top:6px}.wk button{background:#ffffff2e;color:var(--onband);border:0;border-radius:8px;width:30px;height:30px;font-size:17px;cursor:pointer}.wk span{color:var(--onband);font-weight:700;font-size:14px}
.tabs{display:inline-flex;background:#e9ebef;border-radius:12px;padding:4px;margin-top:14px;gap:4px}.tabs button{border:0;background:none;padding:8px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:#4a505b}.tabs button.on{background:#fff;color:var(--club);box-shadow:0 1px 3px #0002}
.hero{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:14px;margin-top:16px}
.rec{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}.rec i{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:800;font-size:11.5px}
.day{font-weight:800;font-size:15px;margin:22px 0 10px;color:#2b2f36}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.rr{display:flex;gap:14px;align-items:stretch;padding:14px 16px;color:inherit;text-decoration:none}
.rb{width:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;flex:none}
.ri{flex:1;min-width:0}.rt{display:flex;align-items:center;gap:8px}.rt b{font-size:16px}.age{background:var(--tint);color:var(--club);font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px}
.rc{color:var(--muted);font-size:13px;margin-top:5px;display:flex;align-items:center;gap:6px}.rcs{margin-top:7px;font-size:12.5px;color:#2b6a12;background:#2f9e4414;display:inline-block;padding:3px 8px;border-radius:8px;font-weight:600}
.rs{text-align:right;flex:none;max-width:48%}.sc{font-variant-numeric:tabular-nums;white-space:nowrap}.sc b{font-size:20px}.sc span{color:var(--muted);font-size:15px;margin-left:6px}.op{font-size:13px;color:#2b2f36;margin-top:3px}.rs .mg{font-size:12.5px;font-weight:700;margin-top:3px}
.side2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}.rcol{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.hl{display:flex;flex-direction:column;gap:10px}.hli{background:var(--card2);border-radius:12px;padding:11px 13px}.hli .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}.hli b{display:block;font-size:15px;margin-top:3px}.hli span{font-size:13px;color:var(--muted)}
.gg{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}.gg:last-child{border:0}.gd{margin-left:auto;color:var(--muted);font-size:12px}
.cm{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.cm:last-of-type{border:0}.cmv{margin-left:auto;font-weight:700}.live{background:var(--tint);color:var(--club);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.twg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tw{background:var(--card);border:1px solid #eceef2;border-radius:12px;padding:11px 13px;color:inherit;text-decoration:none}.twn{display:flex;justify-content:space-between}.twn span{color:var(--muted);font-size:12px}.twv{display:flex;align-items:baseline;gap:6px;margin-top:4px}.twv b{font-size:22px}.twv span{color:var(--muted);font-size:12px}.twd{font-size:12.5px;font-weight:700;margin-top:2px}
.fx{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}.fx .d{width:96px;color:var(--muted);font-size:12.5px;flex:none}
.fxl{padding:4px 18px}.fxr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}.fxr:last-child{border:0}.fxr .t{width:48px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}.fxr .w{flex:1;min-width:0}.fxr .c{color:var(--muted);font-size:12.5px}.fxr .r{text-align:right;font-size:13px;color:#2b2f36;flex:none;max-width:40%}.fxr .r b{font-size:15px}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hero>.card:first-child{grid-column:1/-1}.side2{grid-template-columns:1fr}.rgrid{grid-template-columns:1fr}.rr{min-width:0}.wk span{font-size:13px}.rcol{margin-top:6px}}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.gc{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.gc:hover{box-shadow:0 4px 18px #0000001a}
.gc .hd{display:flex;align-items:center;gap:10px}
.gc .hd b{font-size:19px}.gc .hd span{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%;min-width:0}
.bar .b{width:100%;border-radius:6px 6px 2px 2px;background:var(--club)}
.bar .t{font-size:12px;color:var(--muted)}
.bar .p{font-size:12px;font-weight:700}
.side-row{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start}
.side-row:first-of-type{border-top:0}
.sn{font-weight:700;display:flex;gap:8px;align-items:center}
.sn small{color:var(--muted);font-weight:500}
.comps{display:flex;flex-direction:column;gap:5px;font-size:14px}
.comps div{display:flex;justify-content:space-between;gap:10px}
.comps b{font-variant-numeric:tabular-nums;white-space:nowrap}
.gm{display:grid;grid-template-columns:56px 12px 1fr 104px 84px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.gm:first-of-type{border-top:0}
.gm .d{color:var(--muted)}.gm .c{color:var(--muted);font-size:12.5px}
.gm .s{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.gm .mg{color:var(--muted);font-size:12.5px;text-align:right}
.check{display:flex;gap:12px}
.check>div{flex:1;background:var(--card2);border-radius:12px;padding:12px 14px}
.check b{font-size:26px;display:block}
.check span{color:var(--muted);font-size:13px}
.names{margin-top:10px;font-size:14px;line-height:1.6}
.more{background:none;border:0;color:var(--club);cursor:pointer;font-size:14px;margin-top:8px;font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin-top:22px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.state{padding:80px 40px;text-align:center;color:var(--muted);font-size:16px}
.spark{display:block}
/* login + sheet */
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:9}
.login.on{display:flex}
.lbox{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:380px;box-shadow:0 4px 24px #0001}
.lbox h2{font-size:22px;margin-bottom:6px}.lbox p{color:var(--muted);font-size:14px;margin-bottom:18px}
.lbox input{width:100%;background:#fff;border:1px solid #d6d9df;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.btn{background:var(--club);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.link{background:none;border:0;color:var(--muted);cursor:pointer;margin-top:12px;font-size:14px}
.msg{font-size:14px;color:var(--bad);min-height:20px;margin-top:6px}.msg.ok{color:var(--good)}
.lbox .icrest{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 12px}
.lbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbox input[readonly]{background:var(--card2);color:var(--muted)}
.orow .pend{color:var(--muted);font-size:12px;font-weight:600}
.orow .acts{display:flex;gap:6px}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.sheet.on{display:flex}
.sbox{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.sbox h2{font-size:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sbox h2 button{background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer}
.orow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0;gap:10px}
.orow small{color:var(--muted);display:block}
.orow button{background:var(--card2);border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.oadd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.oadd .msg{grid-column:1/-1}
.oadd input{border:1px solid #d6d9df;border-radius:10px;padding:10px 12px}
.oadd .btn{grid-column:1/-1}
.picker{display:grid;gap:10px;max-width:520px;margin:40px auto;padding:0 16px}
.pick{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:14px 16px;cursor:pointer;font-size:17px;font-weight:700;box-shadow:0 1px 6px #0001}
.pick img{width:44px;height:44px;object-fit:contain}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
@media (max-width:900px){
 .band{padding:12px 14px;flex-wrap:wrap;position:static}
 .band .crest{width:44px;height:44px}.band h1{font-size:20px}
 .band .right{margin-left:0;align-items:flex-start;width:100%}
 .menu-btn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:14px}
 .menu-btn span{margin-left:auto;color:var(--muted)}
 .layout{display:block}
 .side{display:none;position:static;height:auto;border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:10px}
 .side.open{display:block}
 .main{padding:14px 14px 40px}
 .ttl{font-size:23px}
 .kpis,.kpis.k6{grid-template-columns:1fr 1fr;gap:10px}
 .kpi{flex-direction:column;align-items:flex-start;gap:6px}.kpi .v{font-size:24px}

 .side-row{grid-template-columns:1fr}
 .gm{grid-template-columns:50px 10px 1fr 82px}.gm .mg{display:none}
 .check{flex-direction:column}
 .bars{gap:4px}.bar .p{font-size:10.5px}
}

function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}

// ── Period ────────────────────────────────────────────────────────
function range() {
  const now = new Date();
  if (period === 'last') return [new Date(seasonYear - 1, 0, 1), new Date(seasonYear, 0, 1)];
  if (period === '3m') { const f = new Date(now); f.setMonth(f.getMonth() - 3); return [f, now]; }
  if (period === '4w') return [new Date(now - 28 * 864e5), now];

  return [new Date(seasonYear, 0, 1), now];
}
// Loading indicator while data loads after a tap (only once the page has content).

const PLABEL = { week: 'this week', season: () => seasonYear + ' season', '3m': 'the last 3 months', '4w': 'the last 4 weeks', last: () => (seasonYear - 1) + ' season' };

    .then(({ data, error }) => { STD = !error && data && data.comps ? data.comps : {}; FIX = (!error && data && data.fixtures) || {}; }, () => { STD = {}; });

// ── Model ─────────────────────────────────────────────────────────
function cleanName(n, club) {
  const w = (club || '').split(/\s+/)[0];
  let x = n.replace(/^.*?\b(Boys|Girls)\b/i, '$1');
  if (w) x = x.replace(new RegExp('^' + w.replace(/[^\w]/g, '') + '\\s+', 'i'), '');
  return x.trim() || n;
}
function groupOfAge(a) { return a <= 12 ? 'ccc1' : a <= 16 ? 'ccc2' : 'adult'; }
function teamMeta(t, year) {
  const n = t.team_name || '';
  let age = null; const y = /(20\d\d)/.exec(n), u = /\bU-?\s?(\d{1,2})\b/i.exec(n);
  if (y) age = year - Number(y[1]); else if (u) age = Number(u[1]);
  if (/minor/i.test(n)) age = 17;
  const female = !!t.female || /girl|ladies|camog|lgfa/i.test(n);
  let codes = female ? ['LG', 'CA'] : ['FB', 'HU'];
  if (age == null || age > 16) {
    if (/hurl/i.test(n)) codes = ['HU']; else if (/camog/i.test(n)) codes = ['CA'];
    else if (/ladies|lgfa/i.test(n)) codes = ['LG']; else if (age == null) codes = [female ? 'LG' : 'FB'];
  }
  const bucket = age == null ? 'adult' : age <= 16 ? (female ? 'G' : 'B') + age : age <= 18 ? (female ? 'G' : 'B') + 'minor' : 'adult';
  return { age, female, codes, bucket, group: age == null ? 'adult' : groupOfAge(age) };
}
function gameBucket(g) {
  const code = CODE[g[1]]; if (!code) return null;
  const female = FEMALE[code], ag = String(g[3] || ''), m = /^U(\d{1,2})$/i.exec(ag);
  if (m && Number(m[1]) <= 16) return { key: (female ? 'G' : 'B') + Number(m[1]), code, age: Number(m[1]), female };
  if (/minor|^u1[78]$/i.test(ag)) return { key: (female ? 'G' : 'B') + 'minor', code, age: 17, female };
  if (/^u2[01]$/i.test(ag)) return { key: (female ? 'G' : 'B') + 'u21', code, age: 21, female };
  return { key: 'adult-' + code, code, age: 99, female };
}
function build(D, year) {
  const games = D.games.map(g => ({ d: new Date(g[0]), code: CODE[g[1]], level: g[2], age: g[3], comp: g[4], opp: g[5], us: g[6], them: g[7], up: g[8], tp: g[9], home: g[10], note: g[11], b: gameBucket(g) })).filter(g => g.b);
  // The RPC returns the current season too (for the health check); show only the picked period.
  const [pf, pt] = range(), inP = g => g.d >= pf && g.d < pt, hy = new Date(new Date().getFullYear(), 0, 1);
  const byBucket = {}; games.forEach(g => (byBucket[g.b.key] = byBucket[g.b.key] || []).push(g));
  const rows = [], claimed = new Set();
  // Ken 2026-11-16: adult, minor and U21 results split into their individual teams (sides).
  const yearGames = g => period === 'last' ? inP(g) : g.d >= hy;
  const split = {};
  for (const [key, gs] of Object.entries(byBucket)) if (key.startsWith('adult-') || /minor|u21$/.test(key)) split[key] = buildSides(gs.filter(yearGames)).filter(sd => sd.div != null || Object.keys(sd.comps).length).map(sd => ({ ...sd, games: Object.values(sd.comps).flat().sort((a, b) => b.d - a.d) }));
  const takeSide = (key, code) => { const sd = (split[key] || []).find(x => x.code === code && !x.taken && x.div != null); if (sd) sd.taken = true; return sd; };
  for (const t of D.teams) {
    const events = t.trn_events + t.m_events;
    if (/test/i.test(t.team_name) || (t.players === 0 && events === 0)) continue;
    // Ken 2026-11-16: leave out teams with only a handful of players, or no event in 3 months
    // (their league results, if any, show as a results-only side instead).
    if (t.players < 10) continue;
    if (period !== 'last' && 'last_event' in t && (!t.last_event || new Date(t.last_event) < Date.now() - 91 * 864e5)) continue;
    const meta = teamMeta(t, year);
    let gs;
    if (meta.bucket === 'adult' || /minor$/.test(meta.bucket)) {
      // A CoachSmart adult or minor team is the top side of each of its codes.
      gs = meta.codes.map(c => takeSide(meta.bucket === 'adult' ? 'adult-' + c : meta.bucket, c)).filter(Boolean).flatMap(sd => sd.games);
    }
    else { gs = (byBucket[meta.bucket] || []).filter(g => meta.codes.includes(g.code)); claimed.add(meta.bucket); }
    rows.push({ key: 't' + t.team_id, team: t, name: cleanName(t.team_name, D.club.club_name), age: meta.age, ageLabel: meta.age == null || meta.age > 18 ? 'Adult' : meta.age >= 17 ? 'Minor' : 'U' + meta.age, group: meta.group, codes: meta.codes, bucket: meta.bucket, games: gs.filter(inP), hgames: gs.filter(g => g.d >= hy), onCS: true, events });
  }
  // Sides with league games but no CoachSmart team: results only.
  for (const [key, sds] of Object.entries(split)) {
    for (const sd of sds) {
      if (sd.taken || !sd.games.some(inP)) continue;
      const b = byBucket[key][0].b, cn = CN[sd.code], many = sds.filter(x => x.code === sd.code && x.div != null).length > 1, L = sd.div != null && many ? String.fromCharCode(65 + sd.idx) : '';
      let name, ageLabel, age;
      if (key.startsWith('adult-')) { name = sd.grade ? cn + ' ' + sd.grade : 'Adult ' + cn.toLowerCase() + (L ? ' ' + L : ''); ageLabel = 'Adult'; age = 99; }
      else if (key.endsWith('u21')) { name = 'U21 ' + cn.toLowerCase() + (L ? ' ' + L : ''); ageLabel = 'U21'; age = 19; }
      else { name = 'Minor ' + cn.toLowerCase() + (L ? ' ' + L : ''); ageLabel = 'Minor'; age = 17; }
      if (sd.div == null && sds.some(x => x.code === sd.code && x.div != null)) name += ' (other games)';
      rows.push({ key: 'g' + key + '-' + sd.code + (sd.idx ?? 'x'), bucket: key, team: null, name, sideLabel: sd.div != null ? sd.label : null, sideIdx: sd.idx ?? 9, age, ageLabel, group: 'adult', codes: [sd.code], games: sd.games.filter(inP), hgames: sd.games.filter(g => g.d >= hy), onCS: false });
    }
  }
  for (const [key, gs] of Object.entries(byBucket)) {
    if (split[key] || claimed.has(key) || !gs.some(inP)) continue;
    const b = gs[0].b;
    let name, ageLabel, group;
    if (key.startsWith('adult-')) { name = 'Adult ' + CN[b.code].toLowerCase(); ageLabel = 'Adult'; group = 'adult'; }
    else if (key.endsWith('minor')) { name = (b.female ? 'Minor girls' : 'Minor boys'); ageLabel = 'Minor'; group = 'adult'; }
    else { name = (b.female ? 'Girls ' : 'Boys ') + (year - b.age); ageLabel = 'U' + b.age; group = groupOfAge(b.age); }
    rows.push({ key: 'g' + key, bucket: key, team: null, name, age: b.age, ageLabel, group, codes: [...new Set(gs.filter(inP).map(g => g.code))].sort((x, y) => 'FBHULGCA'.indexOf(x) - 'FBHULGCA'.indexOf(y)), games: gs.filter(inP), hgames: gs.filter(g => g.d >= hy), onCS: false });
  }
  const order = r => [r.age ?? 98, r.age == null || r.age > 16 ? 'FBHULGCA'.indexOf(r.codes[0]) : 0, r.onCS ? 0 : 1, r.sideIdx ?? 0, /girl/i.test(r.name) ? 1 : 0];
  rows.sort((a, b) => { const x = order(a), y = order(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] - y[i]; return a.name.localeCompare(b.name); });
  // Biggest average match turnout in each group, for the Numbers part of the health check.
  // Ken 2026-11-17: overall numbers (regular match players, h[7]) against the group's best, CCC1 and CCC2 only.
  GTOP = {}; rows.forEach(r => { const h = r.team && r.team.h; if (h && h[2] >= 3 && h[7] && (r.group === 'ccc1' || r.group === 'ccc2')) { const a = h[7]; if (!GTOP[r.group] || a > GTOP[r.group].a) GTOP[r.group] = { a, name: r.name }; } });
  rows.forEach(r => r.health = health(r));
  return { rows, games: games.filter(inP), year };
}
// ── This week (Ken, 2026-11-16) ───────────────────────────────────
// Default view. Results tab: the week's results, go games, CoachSmart matches
// and training; Fixtures tab: every game that week. Mon-Sun; Results open on the latest weekend, Fixtures on the current week.
const DAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  const t = codeTeam(r.team, c), gs = c ? r.games.filter(x => x.code === c) : r.games, res = wdl(gs);
  const sides = buildSides(gs);
  const letters = {}; sides.forEach(s => { if (s.div == null) return; letters[s.code] = (letters[s.code] || 0) + 1; s.letter = String.fromCharCode(64 + letters[s.code]); });
  const multi = q => sides.filter(s => s.code === q && s.div != null).length > 1;
  const codes = (c ? [c] : r.codes).map((q, i) => i ? CN[q].toLowerCase() : CN[q]).join(' and ');
  let h = `<div class="crumbs"><a href="#">Whole club</a> › <a href="${href({ g: r.group })}">${GNAME[r.group]}</a> ›${c ? ` <a href="${href({ g: r.group, c })}">${CN[c]}</a> ›` : ''}</div>
   <div class="ttl">${esc(r.name)}${r.ageLabel !== 'Adult' && !/minor/i.test(r.name) ? ' · ' + r.ageLabel : ''}</div><div class="ttl-sub">${[codes, t ? t.players + ' players' : 'Not on CoachSmart', sides.length ? sides.length + ' side' + (sides.length > 1 ? 's' : '') : ''].filter(Boolean).join(' · ')}${c && r.codes.length > 1 ? ` · <a style="color:var(--club);font-weight:700" href="${href({ g: r.group, t: r.key })}">show all codes</a>` : ''}</div>`;
  h += hCard(r.health);
  if (t) {
    const tp = pc(t.trn_yes, t.trn_inv), mp = pc(t.m_yes, t.m_inv), rr = pc(t.replied, t.trn_inv + t.m_inv);
    h += `<div class="kpis">${attKpi('Training attendance', avg(t.trn_yes, t.trn_events), tp, t.trn_events, 'session')}${attKpi('Match attendance', avg(t.m_yes, t.m_events), mp, t.m_events, 'match')}<div class="card kpi">${ring(t.byCode && t.codePlayers != null ? pc(t.codePlayers, t.players) : rr, 58)}<div><div class="l">${t.byCode && t.codePlayers != null ? `Play ${esc(t.byCode.toLowerCase())}</div><div class="v">${t.codePlayers}</div><div class="s">of ${t.players} · at 1 in 5+ sessions</div>` : `Squad size</div><div class="v">${t.players}</div><div class="s">players${rr != null ? ` · ${rr}% reply` : ''}</div>`}</div></div>${wdlKpi(res)}${kpi('Scored live', t.keeper, 'matches with score keeper')}</div>`;
    const ms = months().slice(-12);
    const mv = ms.map(k => { const v = t.months[k]; return v && v[2] ? { a: v[0] / v[2], p: v[1] ? Math.round(v[0] / v[1] * 100) : null } : null; }), top = Math.max(1, ...mv.filter(Boolean).map(x => x.a));
    const bars = ms.map((k, i) => { const v = mv[i], mi = Number(k.slice(5)) - 1; return `<div class="bar" title="${v ? fmtAvg(v.a) + ' players on average' + (v.p != null ? ', ' + v.p + '%' : '') : ''}">${v ? `<span class="p">${fmtAvg(v.a)}</span><div class="b" style="height:${Math.max(3, v.a / top * 135)}px;opacity:${.55 + (v.p || 0) / 220}"></div><span class="t ${cls(v.p)}" style="font-size:11px">${v.p != null ? v.p + '%' : ''}</span>` : '<span class="p m">–</span>'}<span class="t">${ms.length > 6 ? MON[mi][0] : MON[mi]}</span></div>`; }).join('');
    h += `<div class="two"><div class="card"><h3>Average players per session, by month<small>${t.byCode ? t.byCode + ' sessions only · ' : ''}% of players invited below</small></h3>${t.trn_inv + t.m_inv ? `<div class="bars">${bars}</div>` : '<div class="empty">No sessions in this period.</div>'}</div>
     <div class="card"><h3>Players to check in with<small>last 4 weeks</small></h3><div class="check"><div><b>${t.not_attended.length}</b><span>players not at anything</span></div><div><b>${t.not_replied.length}</b><span>players who haven’t replied</span></div></div>
      ${t.not_attended.length || t.not_replied.length ? `<button class="more" onclick="this.style.display='none';$('names').style.display='block'">Show names</button><div class="names" id="names" style="display:none">${t.not_attended.length ? `<b>Not at anything:</b> ${t.not_attended.map(esc).join(', ')}<br>` : ''}${t.not_replied.length ? `<b>No replies:</b> ${t.not_replied.map(esc).join(', ')}` : ''}</div>` : ''}</div></div>`;
  } else {
    h += `<div class="kpis">${wdlKpi(res)}${kpi('Games played', res.n, res.u ? res.u + ' with no score kept' : 'all scored')}</div>
      <div class="att"><span>This side isn’t on CoachSmart, so there’s no attendance. Results come from the league fixtures.</span></div>`;
  }
  h += `<div class="two"><div class="card"><h3>Sides and competitions</h3>${sides.length ? sides.map(s => { const x = wdl(Object.values(s.comps).flat()); return `<div class="side-row"><div><div class="sn"><span class="dot" style="background:var(--${s.code})"></span>${CN[s.code]}${s.div != null && multi(s.code) ? ' ' + s.letter : ''} <small>${s.div != null ? esc(s.label) : 'Other'}</small></div><div style="margin-top:8px;display:flex">${wbar(x)}</div></div><div class="comps">${Object.entries(s.comps).map(([q, g]) => { const y = wdl(g), p = positions(r).find(x => x.comp === q); return `<div class="clk" onclick="openComp(${cref(r, q)})"><span>${esc(shortComp(q))}${p ? ` <em>${ordinal(p.pos)}/${p.n}</em>` : ''}</span><b>${y.w + y.d + y.l ? y.w + '-' + y.d + '-' + y.l : y.n + ' played'}</b></div>`; }).join('')}</div></div>`; }).join('') : '<div class="empty">No league games in this period.</div>'}</div>
   <div class="card"><h3>Recent results</h3>${recent(gs)}</div></div>${tablesCard(r, c)}`;
  return h;
}
function recent(gs, withTeam) {
  const scored = gs.filter(g => g.up != null && g.tp != null);
  const list = (scored.length ? scored : gs).slice(0, 12);
  if (!list.length) return '<div class="empty">No games in this period.</div>';
  return list.map(g => {
    const has = g.up != null && g.tp != null, diff = has ? g.up - g.tp : 0;
    return `<div class="gm"><span class="d">${g.d.getDate()} ${MON[g.d.getMonth()]}</span><span class="dot" style="background:var(--${g.code})"></span><span>v ${esc(g.opp)}${rChip(g)}<br><span class="c">${withTeam ? esc(g.age) + ' · ' : ''}${esc(shortComp(g.comp))}</span></span><span class="s ${has ? diff > 0 ? 'g' : diff < 0 ? 'r' : '' : 'm'}">${has ? esc(g.us) + ' : ' + esc(g.them) : 'No score'}</span><span class="mg">${has ? diff > 0 ? 'Won by ' + diff : diff < 0 ? 'Lost by ' + -diff : 'Draw' : ''}</span></div>`;
  }).join('');
}

// ── Routing ───────────────────────────────────────────────────────
function selection() { const p = new URLSearchParams(location.hash.slice(1)); return { g: p.get('g'), c: p.get('c'), t: p.get('t') }; }
function render() {
  if (!model) return;
  CREF = [];
  const sel = selection();
  if (sel.t && !model.rows.some(r => r.key === sel.t)) sel.t = null;
  if (sel.g && !GNAME[sel.g]) sel.g = null;
  const body = period === 'week' ? weekView(sel) : sel.t ? teamView(sel) : sel.g && sel.c ? codeView(sel) : sel.g ? groupView(sel) : clubView(sel);
  const y = document.querySelector('.side')?.scrollTop || 0;
  $('app').innerHTML = shell(sel, body);
  const s = document.querySelector('.side'); if (s) s.scrollTop = y;
  const on = document.querySelector('.side .nav.on'); if (on && !y && on.offsetTop > s.clientHeight - 60) s.scrollTop = on.offsetTop - 120;
}
function route() { render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);

boot();
</script>
</body>
