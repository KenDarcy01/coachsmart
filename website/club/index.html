<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Club dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:DM;src:url(/web/fonts/dm-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--club:#1e3f94;--band:#1e3f94;--onband:#fff;--tint:#1e3f9414;--bg:#f3f4f7;--card:#fff;--card2:#f6f7f9;--text:#1a1d23;--muted:#667080;--line:#e6e8ec;
--good:#2f9e44;--warn:#e08a00;--bad:#d9363e;--FB:#3f9a1f;--HU:#1f74d6;--LG:#e0468a;--CA:#8b4fd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:DM,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
/* top band */
.band{background:var(--band);color:var(--onband);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #0002}
.band .crest{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;flex:none}
.band h1{font-size:23px;font-weight:700;line-height:1.1}
.band .sub{font-size:13.5px;opacity:.85;margin-top:2px}
.band .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--onband) 16%,transparent);font-size:13.5px;font-weight:500;border:0;cursor:pointer;white-space:nowrap;color:var(--onband)}
.chip.on{background:var(--onband);color:var(--band)}
.links{display:flex;gap:14px;font-size:12.5px;align-items:center}
.links button{background:none;border:0;cursor:pointer;color:var(--onband);text-decoration:underline;opacity:.9;font-size:12.5px}
.links span{opacity:.75}
.menu-btn{display:none}
/* layout */
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 80px)}
.side{background:var(--card);border-right:1px solid var(--line);padding:16px 12px 40px;position:sticky;top:80px;height:calc(100vh - 80px);overflow:auto}
.nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14.5px;color:#2b2f36;line-height:1.25}
.nav:hover{background:var(--card2)}
.nav.on{background:var(--tint);color:var(--club);font-weight:700}
.nav .cnt{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:500}
.nav.club{font-weight:700;font-size:15.5px;margin-bottom:6px}
.nav.grp{font-weight:700;font-size:15px;margin-top:10px}
.nav.grp small{color:var(--muted);font-weight:500;font-size:12px}
.nav.code{padding-left:22px;font-weight:600}
.nav.team{padding-left:40px;font-size:14px}
.nav.team.off{color:#8a919c}
.nav .dot{width:9px;height:9px}
.caret{width:14px;color:var(--muted);font-size:11px;flex:none;text-align:center}
.main{padding:22px 28px 60px;min-width:0;max-width:1400px}
.crumbs{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.crumbs a{color:var(--club);font-weight:600;cursor:pointer}
.ttl{font-size:28px;font-weight:700;letter-spacing:-.3px}
.ttl-sub{color:var(--muted);margin-top:3px;font-size:14.5px}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px #0000000d,0 2px 10px #0000000a;border:1px solid #eceef2}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.kpis.k6{grid-template-columns:repeat(3,1fr)}
.kpi{display:flex;align-items:center;gap:14px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .s{color:var(--muted);font-size:12.5px}
.ring{flex:none}
.g{color:var(--good)}.a{color:var(--warn)}.r{color:var(--bad)}.m{color:#9aa1ab}
.att{margin-top:16px;background:#fff7e6;border:1px solid #f4dca6;border-radius:14px;padding:12px 16px;color:#7a4b00;font-size:14px;display:flex;gap:8px 20px;flex-wrap:wrap}
.att b{color:#4a2e00}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec h2{font-size:19px}
.sec span{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.tc{cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:10px}
.tc:hover{transform:translateY(-2px);box-shadow:0 4px 18px #0000001a}
.tc .top{display:flex;align-items:flex-start;gap:10px}
.tc .nm{font-weight:700;font-size:16.5px}
.tc .nm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.tc .age{margin-left:auto;background:var(--tint);color:var(--club);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tc.off{background:#fbfbfc}
.flag{color:var(--warn)!important;font-weight:600!important}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card2);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:10px}
.mini b{font-size:19px;display:block;line-height:1.1}
.mini span{color:var(--muted);font-size:12px}
.codeline{display:flex;align-items:center;gap:8px;font-size:13.5px}
.codeline .cn{width:118px;display:flex;align-items:center;gap:7px;color:#2b2f36;flex:none}
.codeline .rec{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.codeline .nos{margin-left:auto;color:var(--muted)}
.wbar{flex:1;height:9px;border-radius:5px;overflow:hidden;display:flex;background:#eceef2;min-width:40px}
.wbar i{display:block;height:100%}
.form{display:flex;gap:4px}
.form i{width:18px;height:18px;border-radius:50%;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.gc{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.gc:hover{box-shadow:0 4px 18px #0000001a}
.gc .hd{display:flex;align-items:center;gap:10px}
.gc .hd b{font-size:19px}.gc .hd span{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%;min-width:0}
.bar .b{width:100%;border-radius:6px 6px 2px 2px;background:var(--club)}
.bar .t{font-size:12px;color:var(--muted)}
.bar .p{font-size:12px;font-weight:700}
.side-row{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start}
.side-row:first-of-type{border-top:0}
.sn{font-weight:700;display:flex;gap:8px;align-items:center}
.sn small{color:var(--muted);font-weight:500}
.comps{display:flex;flex-direction:column;gap:5px;font-size:14px}
.comps div{display:flex;justify-content:space-between;gap:10px}
.comps b{font-variant-numeric:tabular-nums;white-space:nowrap}
.gm{display:grid;grid-template-columns:56px 12px 1fr 104px 84px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.gm:first-of-type{border-top:0}
.gm .d{color:var(--muted)}.gm .c{color:var(--muted);font-size:12.5px}
.gm .s{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.gm .mg{color:var(--muted);font-size:12.5px;text-align:right}
.check{display:flex;gap:12px}
.check>div{flex:1;background:var(--card2);border-radius:12px;padding:12px 14px}
.check b{font-size:26px;display:block}
.check span{color:var(--muted);font-size:13px}
.names{margin-top:10px;font-size:14px;line-height:1.6}
.more{background:none;border:0;color:var(--club);cursor:pointer;font-size:14px;margin-top:8px;font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin-top:22px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.state{padding:80px 40px;text-align:center;color:var(--muted);font-size:16px}
.spark{display:block}
/* login + sheet */
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:9}
.login.on{display:flex}
.lbox{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:380px;box-shadow:0 4px 24px #0001}
.lbox h2{font-size:22px;margin-bottom:6px}.lbox p{color:var(--muted);font-size:14px;margin-bottom:18px}
.lbox input{width:100%;background:#fff;border:1px solid #d6d9df;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.btn{background:var(--club);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.link{background:none;border:0;color:var(--muted);cursor:pointer;margin-top:12px;font-size:14px}
.msg{font-size:14px;color:var(--bad);min-height:20px;margin-top:6px}.msg.ok{color:var(--good)}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.sheet.on{display:flex}
.sbox{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.sbox h2{font-size:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sbox h2 button{background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer}
.orow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0;gap:10px}
.orow small{color:var(--muted);display:block}
.orow button{background:var(--card2);border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.oadd{display:grid;grid-template-columns:1fr 130px;gap:8px;margin-top:14px}
.oadd input{border:1px solid #d6d9df;border-radius:10px;padding:10px 12px}
.oadd .btn{grid-column:1/-1}
.picker{display:grid;gap:10px;max-width:520px;margin:40px auto;padding:0 16px}
.pick{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:14px 16px;cursor:pointer;font-size:17px;font-weight:700;box-shadow:0 1px 6px #0001}
.pick img{width:44px;height:44px;object-fit:contain}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
@media (max-width:900px){
 .band{padding:12px 14px;flex-wrap:wrap;position:static}
 .band .crest{width:44px;height:44px}.band h1{font-size:20px}
 .band .right{margin-left:0;align-items:flex-start;width:100%}
 .menu-btn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:14px}
 .menu-btn span{margin-left:auto;color:var(--muted)}
 .layout{display:block}
 .side{display:none;position:static;height:auto;border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:10px}
 .side.open{display:block}
 .main{padding:14px 14px 40px}
 .ttl{font-size:23px}
 .kpis,.kpis.k6{grid-template-columns:1fr 1fr;gap:10px}
 .kpi{flex-direction:column;align-items:flex-start;gap:6px}.kpi .v{font-size:24px}
 .grid,.grid.big{grid-template-columns:1fr}
 .side-row{grid-template-columns:1fr}
 .gm{grid-template-columns:50px 10px 1fr 82px}.gm .mg{display:none}
 .check{flex-direction:column}
 .bars{gap:4px}.bar .p{font-size:10.5px}
}
</style>
</head>
<body>
<div id="app"><div class="state">Loading…</div></div>

<div class="login" id="login">
  <form class="lbox" id="loginForm">
    <h2>Club dashboard</h2>
    <p>Sign in with your CoachSmart email and password.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="goBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg"></div>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </form>
</div>

<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CN = {FB:'Football',HU:'Hurling',LG:'Ladies football',CA:'Camogie'};
const CODE = {'Football':'FB','Hurling':'HU','Ladies Football':'LG','Camogie':'CA'};
const FEMALE = {LG:true,CA:true,FB:false,HU:false};
const GROUPS = [['ccc1','CCC1','Under 8 to Under 12'],['ccc2','CCC2','Under 13 to Under 16'],['adult','Adult & Minor','Minor and adult teams']];

const P = new URLSearchParams(location.search);
let clubId = Number(P.get('club')) || null;
let period = P.get('period') || 'season';
let seasonYear = new Date().getFullYear();
let myClubs = null, isSuper = false, D = null, model = null;

// ── Colours ───────────────────────────────────────────────────────
function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function brand(c) {
  const p = c.primary_colour, s = c.secondary_colour;
  const okText = h => { const l = lum(h); return l != null && l < .45; };
  const accent = okText(p) ? p : okText(s) ? s : '#1a1d23';
  const band = lum(p) != null && lum(p) < .85 ? p : (lum(s) != null && lum(s) < .85 ? s : accent);
  const r = document.documentElement.style;
  r.setProperty('--club', accent); r.setProperty('--band', band);
  r.setProperty('--onband', lum(band) > .5 ? '#14181b' : '#fff');
  r.setProperty('--tint', accent + '17');
}

// ── Sign in ───────────────────────────────────────────────────────
function showLogin(msg, ok) {
  $('login').classList.add('on');
  $('loginMsg').textContent = msg || ''; $('loginMsg').classList.toggle('ok', !!ok);
  $('goBtn').disabled = false; $('goBtn').textContent = 'Sign in';
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('goBtn').disabled = true; $('goBtn').textContent = 'Signing in…'; $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
  $('password').value = ''; $('login').classList.remove('on'); boot();
});
$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return showLogin('Type your email first, then tap Forgot password.');
  const { error } = await sb.auth.resetPasswordForEmail(email);
  showLogin(error ? error.message : 'Check your email for a link to reset your password.', !error);
});
async function signOut() { await sb.auth.signOut(); location.reload(); }

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data, error } = await sb.rpc('get_my_officer_clubs');
  if (error) return state('Something went wrong loading your clubs. Please try again.');
  myClubs = data.clubs || []; isSuper = !!data.is_super_user;
  if (!myClubs.length) return state('This dashboard is for club officers, and ' + (session.user.email || 'this account') + ' isn’t one yet. Sign in with a SuperUser account, or ask CoachSmart to add you as an officer of your club.', true);
  if (!clubId) {
    if (myClubs.length === 1) clubId = myClubs[0].club_id;
    else return clubPicker();
  }
  load();
}
function state(msg, withOut) {
  $('app').innerHTML = `<div class="state">${esc(msg)}${withOut ? '<br><br><button class="link" onclick="signOut()">Sign out</button>' : ''}</div>`;
}
function clubPicker() {
  $('app').innerHTML = `<div class="band"><div><h1>Club dashboard</h1><div class="sub">Pick a club</div></div></div>
   <div class="picker">${myClubs.map(c => `<a class="pick" href="?club=${c.club_id}">${c.crest ? `<img src="${esc(c.crest)}" alt="">` : ''}${esc(c.club_name)}</a>`).join('')}</div>`;
}

// ── Period ────────────────────────────────────────────────────────
function range() {
  const now = new Date();
  if (period === 'last') return [new Date(seasonYear - 1, 0, 1), new Date(seasonYear, 0, 1)];
  if (period === '3m') { const f = new Date(now); f.setMonth(f.getMonth() - 3); return [f, now]; }
  if (period === '4w') return [new Date(now - 28 * 864e5), now];
  return [new Date(seasonYear, 0, 1), now];
}
function setPeriod(p) {
  period = p; const u = new URL(location); u.searchParams.set('period', p); history.replaceState(null, '', u); load();
}
function chips() {
  const o = [['season', seasonYear + ' season'], ['3m', 'Last 3 months'], ['4w', 'Last 4 weeks'], ['last', (seasonYear - 1) + ' season']];
  return `<div class="chips">${o.map(([k, l]) => `<button class="chip ${period === k ? 'on' : ''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>`;
}

async function load() {
  const [from, to] = range();
  if (!D) state('Loading…');
  const { data, error } = await sb.rpc('get_club_dashboard', { p_club_id: clubId, p_from: from.toISOString(), p_to: to.toISOString() });
  if (error) return state('Something went wrong loading the dashboard. Please try again.');
  if (data.error === 'not_allowed') return state('You’re not an officer of this club.', true);
  if (data.error) return state('Club not found.');
  D = data; brand(D.club); document.title = D.club.club_name + ' · Club dashboard';
  model = build(D, period === 'last' ? seasonYear - 1 : seasonYear);
  route();
}

// ── Model ─────────────────────────────────────────────────────────
function cleanName(n, club) {
  const w = (club || '').split(/\s+/)[0];
  let x = n.replace(/^.*?\b(Boys|Girls)\b/i, '$1');
  if (w) x = x.replace(new RegExp('^' + w.replace(/[^\w]/g, '') + '\\s+', 'i'), '');
  return x.trim() || n;
}
function groupOfAge(a) { return a <= 12 ? 'ccc1' : a <= 16 ? 'ccc2' : 'adult'; }
function teamMeta(t, year) {
  const n = t.team_name || '';
  let age = null; const y = /(20\d\d)/.exec(n), u = /\bU-?\s?(\d{1,2})\b/i.exec(n);
  if (y) age = year - Number(y[1]); else if (u) age = Number(u[1]);
  if (/minor/i.test(n)) age = 17;
  const female = !!t.female || /girl|ladies|camog|lgfa/i.test(n);
  let codes = female ? ['LG', 'CA'] : ['FB', 'HU'];
  if (age == null || age > 16) {
    if (/hurl/i.test(n)) codes = ['HU']; else if (/camog/i.test(n)) codes = ['CA'];
    else if (/ladies|lgfa/i.test(n)) codes = ['LG']; else if (age == null) codes = [female ? 'LG' : 'FB'];
  }
  const bucket = age == null ? 'adult' : age <= 16 ? (female ? 'G' : 'B') + age : age <= 18 ? (female ? 'G' : 'B') + 'minor' : 'adult';
  return { age, female, codes, bucket, group: age == null ? 'adult' : groupOfAge(age) };
}
function gameBucket(g) {

  const sc = gs.filter(q => q.up != null && q.tp != null), f = sc.reduce((a, q) => a + q.up, 0), ag = sc.reduce((a, q) => a + q.tp, 0);
  const a = agg(rs);
  return `<div class="crumbs"><a href="#">Whole club</a> › <a href="${href({ g })}">${GNAME[g]}</a> ›</div><div class="ttl"><span class="dot" style="background:var(--${c});width:14px;height:14px;margin-right:8px"></span>${CN[c]} · ${GNAME[g]}</div><div class="ttl-sub">${rs.length} teams · ${periodLabel()}</div>
   <div class="kpis">${wdlKpi(x)}${kpi('Games played', x.n, x.u ? x.u + ' with no score kept' : 'all scored')}${kpi('Average score', sc.length ? (f / sc.length).toFixed(1) + ' – ' + (ag / sc.length).toFixed(1) : '–', 'points for – against')}${kpi('Training attendance', '', 'these teams', a.trn)}${kpi('Match attendance', '', 'these teams', a.mt)}</div>
   <div class="sec"><h2>Teams</h2></div><div class="grid">${rs.map(r => teamCard(r, g, c)).join('')}</div>
   <div class="card" style="margin-top:14px"><h3>Recent results<small>${CN[c]}</small></h3>${recent(gs, true)}</div>` + legend();
}
function teamView(sel) {
  const r = model.rows.find(x => x.key === sel.t), c = sel.c && r.codes.includes(sel.c) ? sel.c : null;
  const t = r.team, gs = c ? r.games.filter(x => x.code === c) : r.games, res = wdl(gs);
  const sidesBy = {};
  gs.forEach(g => { const d = divOf(g.comp), k = g.code + '|' + (d ?? 'x'); (sidesBy[k] = sidesBy[k] || { code: g.code, div: d, comps: {} }); (sidesBy[k].comps[g.comp] = sidesBy[k].comps[g.comp] || []).push(g); });
  const grp = Object.values(sidesBy), hasLeague = s => Object.keys(s.comps).some(q => compKind(q) === 'League');
  for (const s of grp.filter(s => s.div != null && !hasLeague(s))) {
    const L = grp.filter(x => x !== s && x.code === s.code && x.div != null && hasLeague(x)).sort((a, b) => Math.abs(a.div - s.div) - Math.abs(b.div - s.div) || a.div - b.div)[0];
    if (L) { Object.entries(s.comps).forEach(([q, g]) => L.comps[q] = (L.comps[q] || []).concat(g)); delete sidesBy[s.code + '|' + s.div]; }
  }
  const ORD = ['League', 'Championship', 'Shield', 'Cup'];
  Object.values(sidesBy).forEach(s => { const o = {}; Object.keys(s.comps).sort((a, b) => ORD.indexOf(compKind(a)) - ORD.indexOf(compKind(b))).forEach(k => o[k] = s.comps[k]); s.comps = o; });
  const sides = Object.values(sidesBy).sort((a, b) => CODES.indexOf(a.code) - CODES.indexOf(b.code) || (a.div ?? 99) - (b.div ?? 99));
  const letters = {}; sides.forEach(s => { if (s.div == null) return; letters[s.code] = (letters[s.code] || 0) + 1; s.letter = String.fromCharCode(64 + letters[s.code]); });
  const multi = q => sides.filter(s => s.code === q && s.div != null).length > 1;
  const codes = (c ? [c] : r.codes).map((q, i) => i ? CN[q].toLowerCase() : CN[q]).join(' and ');
  let h = `<div class="crumbs"><a href="#">Whole club</a> › <a href="${href({ g: r.group })}">${GNAME[r.group]}</a> ›${c ? ` <a href="${href({ g: r.group, c })}">${CN[c]}</a> ›` : ''}</div>
   <div class="ttl">${esc(r.name)}${r.ageLabel !== 'Adult' && !/minor/i.test(r.name) ? ' · ' + r.ageLabel : ''}</div><div class="ttl-sub">${[codes, t ? t.players + ' players' : 'Not on CoachSmart', sides.length ? sides.length + ' side' + (sides.length > 1 ? 's' : '') : ''].filter(Boolean).join(' · ')}${c && r.codes.length > 1 ? ` · <a style="color:var(--club);font-weight:700" href="${href({ g: r.group, t: r.key })}">show all codes</a>` : ''}</div>`;
  if (t) {
    const tp = pc(t.trn_yes, t.trn_inv), mp = pc(t.m_yes, t.m_inv), rr = pc(t.replied, t.trn_inv + t.m_inv);
    h += `<div class="kpis">${kpi('Training attendance', '', t.trn_events + ' sessions', tp)}${kpi('Match attendance', '', t.m_events + ' matches', mp)}${kpi('Reply rate', '', 'answered yes or no', rr)}${wdlKpi(res)}${kpi('Scored live', t.keeper, 'matches with score keeper')}</div>`;
    const ms = months().slice(-12);
    const bars = ms.map(k => { const v = t.months[k]; const p = v && v[1] ? Math.round(v[0] / v[1] * 100) : null; const mi = Number(k.slice(5)) - 1; return `<div class="bar">${p != null ? `<span class="p ${cls(p)}">${p}%</span><div class="b" style="height:${Math.max(3, p * 1.35)}px;opacity:${.5 + p / 200}"></div>` : '<span class="p m">–</span>'}<span class="t">${ms.length > 6 ? MON[mi][0] : MON[mi]}</span></div>`; }).join('');
    h += `<div class="two"><div class="card"><h3>Attendance by month</h3>${t.trn_inv + t.m_inv ? `<div class="bars">${bars}</div>` : '<div class="empty">No sessions in this period.</div>'}</div>
     <div class="card"><h3>Players to check in with<small>last 4 weeks</small></h3><div class="check"><div><b>${t.not_attended.length}</b><span>players not at anything</span></div><div><b>${t.not_replied.length}</b><span>players who haven’t replied</span></div></div>
      ${t.not_attended.length || t.not_replied.length ? `<button class="more" onclick="this.style.display='none';$('names').style.display='block'">Show names</button><div class="names" id="names" style="display:none">${t.not_attended.length ? `<b>Not at anything:</b> ${t.not_attended.map(esc).join(', ')}<br>` : ''}${t.not_replied.length ? `<b>No replies:</b> ${t.not_replied.map(esc).join(', ')}` : ''}</div>` : ''}</div></div>`;
  } else {
    h += `<div class="kpis">${wdlKpi(res)}${kpi('Games played', res.n, res.u ? res.u + ' with no score kept' : 'all scored')}</div>
      <div class="att"><span>This side isn’t on CoachSmart, so there’s no attendance. Results come from the league fixtures.</span></div>`;
  }
  h += `<div class="two"><div class="card"><h3>Sides and competitions</h3>${sides.length ? sides.map(s => { const x = wdl(Object.values(s.comps).flat()); return `<div class="side-row"><div><div class="sn"><span class="dot" style="background:var(--${s.code})"></span>${CN[s.code]}${s.div != null && multi(s.code) ? ' ' + s.letter : ''} <small>${s.div != null ? 'Div ' + s.div : 'Other'}</small></div><div style="margin-top:8px;display:flex">${wbar(x)}</div></div><div class="comps">${Object.entries(s.comps).map(([q, g]) => { const y = wdl(g); return `<div><span>${esc(shortComp(q))}</span><b>${y.w + y.d + y.l ? y.w + '-' + y.d + '-' + y.l : y.n + ' played'}</b></div>`; }).join('')}</div></div>`; }).join('') : '<div class="empty">No league games in this period.</div>'}</div>
   <div class="card"><h3>Recent results</h3>${recent(gs)}</div></div>`;
  return h;
}
function recent(gs, withTeam) {
  const scored = gs.filter(g => g.up != null && g.tp != null);
  const list = (scored.length ? scored : gs).slice(0, 12);
  if (!list.length) return '<div class="empty">No games in this period.</div>';
  return list.map(g => {
    const has = g.up != null && g.tp != null, diff = has ? g.up - g.tp : 0;
    return `<div class="gm"><span class="d">${g.d.getDate()} ${MON[g.d.getMonth()]}</span><span class="dot" style="background:var(--${g.code})"></span><span>v ${esc(g.opp)}<br><span class="c">${withTeam ? esc(g.age) + ' · ' : ''}${esc(shortComp(g.comp))}</span></span><span class="s ${has ? diff > 0 ? 'g' : diff < 0 ? 'r' : '' : 'm'}">${has ? esc(g.us) + ' : ' + esc(g.them) : 'No score'}</span><span class="mg">${has ? diff > 0 ? 'Won by ' + diff : diff < 0 ? 'Lost by ' + -diff : 'Draw' : ''}</span></div>`;
  }).join('');
}

// ── Routing ───────────────────────────────────────────────────────
function selection() { const p = new URLSearchParams(location.hash.slice(1)); return { g: p.get('g'), c: p.get('c'), t: p.get('t') }; }
function render() {
  if (!model) return;
  const sel = selection();
  if (sel.t && !model.rows.some(r => r.key === sel.t)) sel.t = null;
  if (sel.g && !GNAME[sel.g]) sel.g = null;
  const body = sel.t ? teamView(sel) : sel.g && sel.c ? codeView(sel) : sel.g ? groupView(sel) : clubView(sel);
  const y = document.querySelector('.side')?.scrollTop || 0;
  $('app').innerHTML = shell(sel, body);
  const s = document.querySelector('.side'); if (s) s.scrollTop = y;
  const on = document.querySelector('.side .nav.on'); if (on && !y && on.offsetTop > s.clientHeight - 60) s.scrollTop = on.offsetTop - 120;
}
function route() { render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);

boot();
</script>
</body>
</html>
