<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CoachSmart Web</title>
<link rel="icon" href="/webviews/icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:DM;src:url(fonts/dm-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:DM;src:url(fonts/dm-sans-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:DM;src:url(fonts/dm-sans-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:DM;src:url(fonts/dm-sans-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Bebas;src:url(fonts/bebas-neue-latin-400-normal.woff2)}
:root{--g:#87c232;--gd:rgba(135,194,50,.15);--bg:#14181b;--side:#101316;--card:#1e222b;--card2:#272c37;--tx:#f1f4f8;--mu:#b3b7bd;--am:#f5a524;--ad:rgba(245,165,36,.15);--red:#ef5350;--bd:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* no visible scroll bars; areas still scroll */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{background:var(--bg);font-family:DM,system-ui,sans-serif;color:var(--tx);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--g)}
#app{display:flex;height:100%;visibility:hidden}
#app.ready{visibility:visible}

/* side menu */
nav{width:220px;flex:none;background:var(--side);border-right:1px solid var(--bd);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{font-family:Bebas;font-size:30px;letter-spacing:1px;padding:0 10px 18px;color:var(--tx)}.logo b{color:var(--g);font-weight:400}
.ni{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-weight:500;color:var(--mu);font-size:16px;text-align:left;width:100%}
.ni:hover{background:var(--card)}
.ni.on{background:var(--gd);color:var(--g);font-weight:700}
.ni svg{width:20px;height:20px;flex:none}
.sp{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid var(--bd)}
.av{width:36px;height:36px;border-radius:50%;background:var(--g);color:#14181b;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.me b{font-size:14px;display:block}
.me button{font-size:13px;color:var(--mu);padding:0}.me button:hover{color:var(--g)}

/* views */
.view{flex:1;display:none;min-width:0}.view.on{display:flex}
.frame{flex:1;border:0;width:100%;height:100%;background:var(--bg)}

/* events list */
.list{width:500px;flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.lh{padding:22px 22px 10px}
.lh h1{font-size:24px;font-weight:700;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;color:var(--mu)}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--g);color:#14181b}
.search{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:10px;padding:10px 14px;color:var(--tx);font:inherit;font-size:15px;outline:none}
.search:focus{border-color:var(--g)}
.items{padding:4px 14px 20px;overflow-y:auto;flex:1}
.day{font-size:13px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.6px;padding:14px 8px 6px}
.ev{display:flex;gap:14px;padding:13px 12px;border-radius:12px;background:var(--card);margin-bottom:8px;border:1.5px solid transparent;align-items:center;width:100%;text-align:left}
.ev:hover{border-color:rgba(135,194,50,.4)}
.ev.on{border-color:var(--g);background:#222a22}
.dt{width:52px;text-align:center;flex:none}.dt b{display:block;font-family:Bebas;font-size:28px;line-height:1;font-weight:400}.dt span{font-size:12px;color:var(--mu);font-weight:600}
.ei{flex:1;min-width:0}.ei h3{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ei p{font-size:14px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gd);color:var(--g);flex:none}
.tag.m{background:var(--ad);color:var(--am)}
.tag.x{background:rgba(239,83,80,.15);color:var(--red)}
.cnt{text-align:right;font-size:13px;color:var(--mu);flex:none;min-width:44px}.cnt b{font-size:17px;color:var(--tx)}
.empty{color:var(--mu);padding:30px 10px;text-align:center;font-size:15px}

/* detail */
.det{flex:1;padding:24px 28px;overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.dh{margin-bottom:18px}
.dh h2{font-size:28px;font-weight:700}.dh p{color:var(--mu);margin-top:4px;font-size:15px}
.dh .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.k{background:var(--card);border-radius:14px;padding:14px 16px}.k span{font-size:13px;color:var(--mu);font-weight:600}.k b{display:block;font-family:Bebas;font-size:38px;line-height:1.1;font-weight:400}
.k small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.k .rl{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);font-weight:600;padding-top:3px}.k .rl i{font-style:normal;color:var(--tx)}.k b em{font-family:DM;font-style:normal;font-size:14px;color:var(--mu);font-weight:600;margin-left:6px}
.sqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.sq{background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;border:1.5px solid transparent;position:relative;overflow:hidden}
.sq .stripe{position:absolute;left:0;right:0;top:0;height:5px}
.sq img{position:absolute;top:10px;right:10px;width:34px;height:34px;object-fit:contain;border-radius:6px}
.sq span{padding-right:40px}
.sq:hover{border-color:rgba(135,194,50,.4)}.sq.on{border-color:var(--g);background:#222a22}
.sq span{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq b{display:block;font-family:Bebas;font-size:32px;line-height:1.1;font-weight:400;color:var(--g)}.sq b em{font-style:normal;font-size:20px;color:var(--mu)}
.sq small{display:block;font-size:13px;color:var(--mu)}
.k.g b{color:var(--g)}.k.r b{color:var(--red)}.k.a b{color:var(--am)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:10px 14px;font-weight:600;color:var(--mu);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.box{background:var(--card);border-radius:14px;padding:14px 16px}
.box h4{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}.box h4 span{color:var(--mu);font-weight:500}
.box h5{font-size:12px;color:var(--g);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;display:flex;align-items:center;gap:8px;padding-left:8px;border-left:4px solid var(--sqc,transparent)}
.box h5 img{width:22px;height:22px;object-fit:contain;border-radius:4px;margin-left:-8px}
.box h5:has(img){border-left:0;padding-left:8px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--bd);font-size:15px}
.pl .s{width:28px;height:28px;border-radius:50%;background:var(--card2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pl em{margin-left:auto;font-style:normal;font-size:13px;color:var(--mu);text-align:right}
.none{color:var(--mu);font-size:14px;padding:6px 0}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex;margin:4px 0 16px}.bar i{display:block;height:100%}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.info .box span{font-size:13px;color:var(--mu);font-weight:600;display:block;margin-bottom:4px}
.notes{white-space:pre-wrap;line-height:1.5}
.tframe{flex:1;min-height:600px;border:0;border-radius:14px;background:var(--bg);width:100%}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:16px}
.spin{width:28px;height:28px;border:3px solid var(--card2);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* sign-in popup */
.ov{position:fixed;inset:0;background:rgba(10,12,14,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov.on{display:flex}
.lg{width:420px;max-width:100%;background:var(--card);border-radius:20px;padding:34px 34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lg .logo{text-align:center;padding:0 0 6px;font-size:38px}
.lg p.sub{text-align:center;color:var(--mu);margin-bottom:24px}
.lg label{font-size:13px;font-weight:600;color:var(--mu);display:block;margin-bottom:6px}
.lg input{width:100%;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:16px;font:inherit;font-size:16px;color:var(--tx);outline:none}
.lg input:focus{border-color:var(--g)}
.lg .go{width:100%;background:var(--g);color:#14181b;font-weight:700;border-radius:12px;padding:14px;font-size:16px;margin-top:6px}
.lg .go:disabled{opacity:.7}
.lg .link{display:block;margin:16px auto 0;color:var(--g);font-size:14px;font-weight:600}
.lg .msg{min-height:20px;font-size:14px;text-align:center;margin-top:12px;color:var(--red)}
.lg .msg.ok{color:var(--g)}

@media (max-width:1100px){.list{width:400px}.cols{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){nav{width:68px;padding:18px 8px}nav .logo,.ni span,.me div,.me button{display:none}.ni{justify-content:center}
  .list{width:100%}.det{display:none}.view.detail-open .list{display:none}.view.detail-open .det{display:flex}.cols{grid-template-columns:1fr}}
.back{display:none;color:var(--g);font-weight:600;margin-bottom:12px;align-self:flex-start}
@media (max-width:860px){.back{display:block}}
</style>
</head>
<body>

<div id="app">
  <nav>
    <div class="logo">COACH<b>SMART</b></div>
    <button class="ni on" data-view="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Events</span></button>
    <button class="ni" data-view="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Insights</span></button>
    <button class="ni" data-view="fixtures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span>Fixtures</span></button>
    <div class="sp"></div>
    <div class="me"><div class="av" id="meInit"></div><div><b id="meName"></b><button id="signOut">Sign out</button></div></div>
  </nav>

  <section class="view on" id="view-events">
    <div class="list">
      <div class="lh">
        <h1>Events</h1>
        <div class="chips" id="teamChips"></div>
        <div class="chips" id="whenChips">
          <button class="chip on" data-when="upcoming">Upcoming</button>
          <button class="chip" data-when="past">Past</button>
          <span style="width:8px"></span>
          <button class="chip on" data-kind="all">All</button>
          <button class="chip" data-kind="match">Matches</button>
          <button class="chip" data-kind="training">Training</button>
        </div>
        <input class="search" id="search" placeholder="Search events…" autocomplete="off">
      </div>
      <div class="items" id="items"><div class="spin"></div></div>
    </div>
    <div class="det" id="det"><div class="placeholder">Pick an event to see its details</div></div>
  </section>

  <section class="view" id="view-insights"><iframe class="frame" data-src="/webviews/dashboard-app.html" title="Insights"></iframe></section>
  <section class="view" id="view-fixtures"><iframe class="frame" data-src="/webviews/gaa-fixtures.html" title="Fixtures"></iframe></section>
</div>

<div class="ov" id="login">
  <form class="lg" id="loginForm" autocomplete="on">
    <div class="logo">COACH<b>SMART</b></div>
    <p class="sub">Sign in with your CoachSmart account</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="go" id="goBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg"></div>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </form>
</div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
// Early access: only these accounts can use the web app for now.
const ALLOWED = ['ken.darcy@gmail.com'];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

let session = null, home = null, teamInfo = {}, lookups = null;
let upcoming = [], past = null;
let fSquad = null, fTeam = 0, fWhen = 'upcoming', fKind = 'all', fText = '', selId = null, detTab = 'attendance';

// ── Sign in ───────────────────────────────────────────────────────
function showLogin(msg, ok) {
  $('app').classList.remove('ready');
  $('login').classList.add('on');
  $('loginMsg').textContent = msg || '';
  $('loginMsg').classList.toggle('ok', !!ok);
  $('goBtn').disabled = false; $('goBtn').textContent = 'Sign in';
  setTimeout(() => $('email').focus(), 50);
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('password').value;
  $('goBtn').disabled = true; $('goBtn').textContent = 'Signing in…'; $('loginMsg').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
  $('password').value = '';
  start(data.session);
});

$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return showLogin('Type your email first, then tap Forgot password.');
  const { error } = await sb.auth.resetPasswordForEmail(email);
  showLogin(error ? error.message : 'Check your email for a link to reset your password.', !error);
});

$('signOut').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function start(s) {
  session = s;
  const email = (s.user.email || '').toLowerCase();
  if (!ALLOWED.includes(email)) {
    await sb.auth.signOut();
    return showLogin('The web version isn’t open to everyone yet. Please use the CoachSmart app for now.');
  }
  $('login').classList.remove('on');
  $('app').classList.add('ready');
  await loadHome();
}

sb.auth.onAuthStateChange((ev, s) => { if (s) session = s; });

(async () => {
  const { data: { session: s } } = await sb.auth.getSession();
  if (s) start(s); else showLogin();
})();

// ── Menu ──────────────────────────────────────────────────────────
document.querySelectorAll('.ni').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.ni').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + b.dataset.view));
  const f = document.querySelector('#view-' + b.dataset.view + ' iframe');
  if (f && !f.src) {
    // The insights dashboard offers a phone "install" prompt; it doesn't apply on desktop.
    try { localStorage.setItem('cs_install_done', '1'); } catch (e) {}
    f.src = f.dataset.src;
  }
}));

// ── Data ──────────────────────────────────────────────────────────
async function loadHome() {
  const { data, error } = await sb.rpc('get_user_home_events', { p_user_id: session.user.id });
  if (error || !data) { $('items').innerHTML = `<div class="empty">Couldn’t load your events. ${esc(error?.message || '')}</div>`; return; }
  home = data;
  const name = [home.first_name, home.last_name].filter(Boolean).join(' ') || session.user.email;
  $('meName').textContent = name;
  $('meInit').textContent = ((home.first_name || '?')[0] + (home.last_name || '')[0] || '').toUpperCase();
  upcoming = (home.events || []).map(fromHome);

  const teams = (home.user_teams || []).filter(t => t.team_id);
  if (teams.length) {
    const { data: tr } = await sb.from('teams').select('team_id,session_plan,teamsheet').in('team_id', teams.map(t => t.team_id));
    (tr || []).forEach(t => teamInfo[t.team_id] = t);
  }
  teams.forEach(t => teamInfo[t.team_id] = { ...(teamInfo[t.team_id] || {}), ...t });

  $('teamChips').innerHTML = [`<button class="chip on" data-team="0">All teams</button>`]
    .concat(teams.map(t => `<button class="chip" data-team="${t.team_id}">${esc(t.team_name)}</button>`)).join('');
  renderList();
  // Open the first event straight away on a wide screen (on a phone the list stays in view)
  const first = shown()[0];
  if (first && !selId && window.innerWidth > 860) {
    selId = first.id;
    document.querySelector(`.ev[data-id="${first.id}"]`)?.classList.add('on');
    renderDetail();
  }
}

// get_user_home_events gives the date only as text like "Saturday, 18 October, 2026 at 11:00"
function parseFormatted(s) {
  const m = /(\d{1,2}) (\w+), (\d{4}) at (\d{1,2}):(\d{2})/.exec(s || '');
  if (!m) return null;
  return new Date(+m[3], MONTHS.indexOf(m[2]), +m[1], +m[4], +m[5]);
}

function isMatch(type, opposition) { return /match|game|challenge|league|championship|blitz|tournament/i.test(type || '') || !!(opposition || '').trim(); }

function fromHome(e) {
  return {
    id: e.event_id, title: e.event_title, date: parseFormatted(e.event_date_time_formatted),
    team_id: e.team_id, team_name: e.team_name, type: e.event_type, code: e.event_code,
    opposition: e.opposition, home_away: e.home_away, location: e.location_name, pin: e.location_pin,
    meet: e.meet_time, details: e.event_details, status: e.event_status, squad: e.squad_name,
    created_by: e.created_by_user_name, role: e.user_highest_role_on_team,
    going: e.accepted_count, notGoing: e.declined_count, noReply: e.no_response_count,
    match: isMatch(e.event_type, e.opposition)
  };
}

async function loadPast() {
  $('items').innerHTML = '<div class="spin"></div>';
  const teamIds = Object.keys(teamInfo).map(Number);
  if (!lookups) {
    const [t, c, s] = await Promise.all([
      sb.from('event_types').select('event_type_id,event_type'),
      sb.from('event_codes').select('code_id,event_code'),
      sb.from('squads').select('squad_id,squad_name').in('team_id', teamIds)
    ]);
    lookups = {
      types: Object.fromEntries((t.data || []).map(r => [r.event_type_id, r.event_type])),
      codes: Object.fromEntries((c.data || []).map(r => [r.code_id, r.event_code])),
      squads: Object.fromEntries((s.data || []).map(r => [r.squad_id, r.squad_name]))
    };
  }
  const since = new Date(); since.setDate(since.getDate() - 120);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const { data, error } = await sb.from('events').select('*')
    .in('team_id', teamIds).neq('status', 'deleted')
    .lt('event_date_time', today.toISOString()).gte('event_date_time', since.toISOString())
    .order('event_date_time', { ascending: false }).limit(300);
  if (error) { $('items').innerHTML = `<div class="empty">Couldn’t load past events. ${esc(error.message)}</div>`; past = null; return; }
  past = (data || []).map(e => {
    const team = teamInfo[e.team_id] || {};
    const type = lookups.types[e.event_type_id] || '', code = lookups.codes[e.event_code_id] || '';
    let title = (e.event_title || '').trim() || [code, type].filter(Boolean).join(' ') + (e.opposition ? ` (${e.opposition})` : '');
    if (team.team_female) title = title.replace(/Hurling/g, 'Camogie');
    return {
      id: e.event_id, title, date: new Date(e.event_date_time), team_id: e.team_id, team_name: team.team_name,
      type, code, opposition: e.opposition, home_away: e.home_away, location: e.location_name, pin: e.location_pin,
      meet: e.meet_time, details: e.event_details, status: e.status, squad: lookups.squads[e.squad_id] || null,
      role: team.user_highest_role_on_team, match: isMatch(type, e.opposition)
    };
  });
}

// ── List ──────────────────────────────────────────────────────────
document.getElementById('teamChips').addEventListener('click', e => {
  const b = e.target.closest('[data-team]'); if (!b) return;
  fTeam = +b.dataset.team;
  document.querySelectorAll('#teamChips .chip').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});
document.getElementById('whenChips').addEventListener('click', async e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.when) {
    fWhen = b.dataset.when;
    document.querySelectorAll('[data-when]').forEach(x => x.classList.toggle('on', x === b));
    if (fWhen === 'past' && !past) await loadPast();
  } else {
    fKind = b.dataset.kind;
    document.querySelectorAll('[data-kind]').forEach(x => x.classList.toggle('on', x === b));
  }
  renderList();
});
$('search').addEventListener('input', e => { fText = e.target.value.trim().toLowerCase(); renderList(); });

function shown() {
  const src = fWhen === 'past' ? (past || []) : upcoming;
  return src.filter(e =>
    (!fTeam || e.team_id === fTeam) &&
    (fKind === 'all' || (fKind === 'match') === e.match) &&
    (!fText || `${e.title} ${e.team_name} ${e.location} ${e.opposition}`.toLowerCase().includes(fText)));
}

function weekLabel(d) {
  if (!d) return 'Date not set';
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const monday = x => { const y = new Date(x); y.setHours(0, 0, 0, 0); y.setDate(y.getDate() - ((y.getDay() + 6) % 7)); return y; };
  const diff = Math.round((monday(d) - monday(now)) / (7 * 864e5));
  if (diff === 0) return 'This week';
  if (diff === 1) return 'Next week';
  if (diff === -1) return 'Last week';
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

function hhmm(d) { return d ? d.toTimeString().slice(0, 5) : ''; }

function renderList() {
  const list = shown();
  if (!list.length) { $('items').innerHTML = `<div class="empty">No ${fWhen === 'past' ? 'past' : 'upcoming'} events match these filters.</div>`; return; }
  let html = '', last = null;
  for (const e of list) {
    const g = weekLabel(e.date);
    if (g !== last) { html += `<div class="day">${esc(g)}</div>`; last = g; }
    const where = [e.match && e.home_away ? e.home_away : null, hhmm(e.date), e.location].filter(Boolean).join(' · ');
    const tag = e.status === 'cancelled' ? '<span class="tag x">Cancelled</span>'
      : e.match ? '<span class="tag m">Match</span>' : `<span class="tag">${esc(e.type || 'Training')}</span>`;
    const cnt = fWhen === 'upcoming' && e.role >= 100 ? `<div class="cnt" data-cnt="${e.id}">${playerCount(e.id)}</div>` : '';
    html += `<button class="ev${e.id === selId ? ' on' : ''}" data-id="${e.id}">
      <div class="dt"><b>${e.date ? e.date.getDate() : '–'}</b><span>${e.date ? DAYS[e.date.getDay()] : ''}</span></div>
      <div class="ei"><h3>${esc(e.title)}</h3><p>${esc([fTeam ? null : e.team_name, where].filter(Boolean).join(' · '))}</p></div>
      ${tag}${cnt}</button>`;
  }
  $('items').innerHTML = html;
  if (fWhen === 'upcoming') prefetchCounts(list);
}

// "x/y going" on the cards counts players only, so each event's attendance is fetched in the background
function playerCount(id) {
  const rows = sumCache[id];
  if (!rows) return '<b>…</b><br>going';
  const t = tally(rows.filter(isPlayer));
  return `<b>${t.going}</b>/${t.going + t.not + t.none}<br>going`;
}

let prefetching = false;
async function prefetchCounts(list) {
  if (prefetching) return;
  prefetching = true;
  const todo = list.filter(e => e.role >= 100 && !sumCache[e.id]);
  const worker = async () => {
    for (let e; (e = todo.shift());) {
      if (await fetchSummary(e.id)) document.querySelectorAll(`[data-cnt="${e.id}"]`).forEach(c => c.innerHTML = playerCount(e.id));
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  prefetching = false;
  if (shown().some(e => e.role >= 100 && !sumCache[e.id] && !sumFailed[e.id])) renderList();
}

$('items').addEventListener('click', e => {
  const b = e.target.closest('.ev'); if (!b) return;
  selId = +b.dataset.id;
  document.querySelectorAll('.ev').forEach(x => x.classList.toggle('on', x === b));
  detTab = 'attendance'; fSquad = null;
  renderDetail();
});

// ── Detail ────────────────────────────────────────────────────────
function current() { return [...upcoming, ...(past || [])].find(e => e.id === selId); }

function tabsFor(e) {
  const t = [['attendance', 'Attendance'], ['info', 'Details']];
  const team = teamInfo[e.team_id] || {};
  if (team.session_plan && !e.match) t.push(['plan', 'Session plan']);
  if (e.match) t.push(['report', 'Match report'], ['live', 'Live score']);
  return t;
}

function renderDetail() {
  const e = current(); if (!e) return;
  $('view-events').classList.add('detail-open');
  const d = e.date;
  const when = d ? `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} · ${hhmm(d)}` : '';
  const sub = [when, e.location, e.team_name].filter(Boolean).join(' · ');
  const tags = [e.status === 'cancelled' ? '<span class="tag x">Cancelled</span>' : '',
    e.match ? '<span class="tag m">Match</span>' : `<span class="tag">${esc(e.type || 'Training')}</span>`,
    e.code ? `<span class="tag">${esc(e.code)}</span>` : '', e.squad ? `<span class="tag">${esc(e.squad)}</span>` : ''].join('');
  const tabs = tabsFor(e);
  if (!tabs.some(t => t[0] === detTab)) detTab = 'attendance';
  $('det').innerHTML = `
    <button class="back" id="back">‹ Events</button>
    <div class="dh"><h2>${esc(e.title)}</h2><p>${esc(sub)}</p><div class="tags">${tags}</div></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="tab${k === detTab ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div id="tabBody" style="flex:1;display:flex;flex-direction:column"></div>`;
  $('back').onclick = () => $('view-events').classList.remove('detail-open');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { detTab = b.dataset.tab; renderDetail(); });
  renderTab(e);
}

// Members are role grade 10 (players, coaches, FLOs…); admins are grade 100 and left out of every count.
// Players are the grade 10 role at level 10; the other member roles are listed under the big number.
const isMember = r => r.role_grade === 10;
const isPlayer = r => r.role_grade === 10 && r.role_level === 10;
const plural = (r, n) => n === 1 ? (r.role_name || '') : (r.role_name_plural || r.role_name || '');

const tally = rows => rows.reduce((t, r) => ({ going: t.going + +r.accepted_attendees_count, not: t.not + +r.declined_attendees_count, none: t.none + +r.no_response_count }), { going: 0, not: 0, none: 0 });

// Big number = players (for the chosen squad when one is picked); every other role underneath, in role list order
function kpis(summary, squadPlayers) {
  const players = squadPlayers || tally(summary.filter(isPlayer));
  const others = summary.filter(r => isMember(r) && !isPlayer(r));
  const card = (cls, label, key, col) => `<div class="k ${cls}"><span>${label}</span><b>${players[key]}<em>${players[key] === 1 ? 'Player' : 'Players'}</em></b>
    ${others.map(r => `<div class="rl">${esc(r.role_name_plural || r.role_name)}<i>${+r[col]}</i></div>`).join('')}</div>`;
  const all = tally(summary.filter(isMember)), tot = all.going + all.not + all.none;
  const pct = tot ? Math.round((all.going + all.not) / tot * 100) : 0;
  $('kpis').innerHTML = card('g', 'Going', 'going', 'accepted_attendees_count') + card('r', 'Not going', 'not', 'declined_attendees_count')
    + card('a', 'No reply', 'none', 'no_response_count') + `<div class="k"><span>Replied</span><b>${pct}%</b><small>${all.going + all.not} of ${tot} members</small></div>`;
}

function iframeUrl(page, e) {
  const q = new URLSearchParams({ token: session.access_token, event_id: e.id, eventId: e.id, user_id: session.user.id });
  return `/webviews/${page}?${q}`;
}

async function renderTab(e) {
  const body = $('tabBody');
  if (detTab === 'info') {
    const pin = (e.pin || '').trim();
    const map = pin ? (/^https?:/.test(pin) ? pin : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(pin)}`) : '';
    body.innerHTML = `<div class="info">
      <div class="box"><span>Team</span>${esc(e.team_name || '')}</div>
      ${e.meet ? `<div class="box"><span>Meet time</span>${esc(e.meet)}</div>` : ''}
      <div class="box"><span>Location</span>${esc(e.location || 'Not set')}${map ? ` · <a href="${esc(map)}" target="_blank" rel="noopener">Map</a>` : ''}</div>
      ${e.opposition ? `<div class="box"><span>Opposition</span>${esc(e.opposition)}${e.home_away ? ` (${esc(e.home_away)})` : ''}</div>` : ''}
      ${e.created_by ? `<div class="box"><span>Created by</span>${esc(e.created_by)}</div>` : ''}
    </div>
    ${e.details ? `<div class="box"><span style="font-size:13px;color:var(--mu);font-weight:600">Notes</span><div class="notes">${esc(e.details)}</div></div>` : ''}`;
    loadAttendance(e, true);
    return;
  }
  if (detTab !== 'attendance') {
    const page = { plan: 'session-plan.html', report: 'match-report.html', live: 'match-live.html' }[detTab];
    body.innerHTML = `<iframe class="tframe" src="${iframeUrl(page, e)}" title="${esc(detTab)}"></iframe>`;
    loadAttendance(e, true);
    return;
  }
  body.innerHTML = '<div class="spin"></div>';
  loadAttendance(e, false);
}

const sumCache = {}, sumFailed = {}, sumPending = {}, squadInfo = {};
function fetchSummary(id) {
  if (sumCache[id]) return Promise.resolve(sumCache[id]);
  return sumPending[id] ||= sb.rpc('get_event_attendance_summary_by_role', { p_event_id: id }).then(({ data, error }) => {
    delete sumPending[id];
    if (error) { sumFailed[id] = error.message; return null; }
    return sumCache[id] = (data || []).slice().sort((a, b) => (a.role_list_seq ?? 99) - (b.role_list_seq ?? 99));
  });
}
// Squad colour and image for a team (the attendance call has no colour)
function fetchSquads(teamId) {
  return squadInfo[teamId] ||= sb.from('squads').select('squad_id,squad_colour,squad_image').eq('team_id', teamId)
    .then(({ data }) => Object.fromEntries((data || []).map(q => [q.squad_id, q])));
}

const attCache = {}, attFailed = {}, attPending = {};
function fetchRoles(id) {
  if (attCache[id]) return Promise.resolve(attCache[id]);
  return attPending[id] ||= sb.rpc('get_event_attendance_by_role_v2', { p_event_id: id }).then(({ data, error }) => {
    delete attPending[id];
    if (error) { attFailed[id] = error.message; return null; }
    return attCache[id] = (data || []).slice().sort((a, b) => (a.role_level ?? 0) - (b.role_level ?? 0));
  });
}

async function loadAttendance(e, kpiOnly) {
  if (e.role < 100) { $('kpis').style.display = 'none'; if (!kpiOnly) $('tabBody').innerHTML = '<div class="none">Attendance lists are only shown to team admins.</div>'; return; }
  const [summary, roles, sqInfo] = await Promise.all([fetchSummary(e.id), fetchRoles(e.id), fetchSquads(e.team_id)]);
  if (selId !== e.id) return;
  if (!roles) { if (!kpiOnly) $('tabBody').innerHTML = `<div class="none">Couldn’t load attendance. ${esc(attFailed[e.id] || '')}</div>`; return; }

  // One row per member, keeping role and squad; squads follow their list order
  const STATUS = { accepted_members: 'going', declined_members: 'not', no_response_members: 'none' };
  const sqName = p => p.squad_name || 'No squad';
  const people = [];
  roles.filter(isMember).forEach(r => Object.keys(STATUS).forEach(k => (r[k] || []).forEach(m => people.push({ ...m, role: r, status: STATUS[k] }))));
  const squads = [];
  people.forEach(p => {
    let q = squads.find(q => q.name === sqName(p));
    if (!q) squads.push(q = { name: sqName(p), seq: p.squad_list_seq ?? 9999, image: p.squad_image || sqInfo[p.squad_id]?.squad_image, colour: sqInfo[p.squad_id]?.squad_colour, going: 0, not: 0, none: 0, total: 0 });
    if (isPlayer(p.role)) { q[p.status]++; q.total++; }
  });
  squads.sort((a, b) => a.seq - b.seq || a.name.localeCompare(b.name));
  const sqOrder = Object.fromEntries(squads.map((q, i) => [q.name, i]));
  if (fSquad && !(fSquad in sqOrder)) fSquad = null;
  const fq = fSquad && squads.find(q => q.name === fSquad);
  if (summary) kpis(summary, fq ? { going: fq.going, not: fq.not, none: fq.none } : null);
  if (kpiOnly || detTab !== 'attendance') return;

  const g = people.filter(p => p.status === 'going').length, n = people.filter(p => p.status === 'not').length;
  const total = people.length || 1;
  const list = people.filter(p => !fSquad || sqName(p) === fSquad);

  const col = (label, status) => {
    const rows = list.filter(p => p.status === status).sort((a, b) =>
      sqOrder[sqName(a)] - sqOrder[sqName(b)] || (isPlayer(b.role) - isPlayer(a.role)) || (a.member_name || '').localeCompare(b.member_name || ''));
    let html = '', last = null;
    rows.forEach(p => {
      if (!fSquad && sqName(p) !== last) {
        const q = squads[sqOrder[sqName(p)]];
        // Squad image if there is one, otherwise its colour, otherwise nothing
        html += q.image ? `<h5><img src="${esc(q.image)}" alt="">${esc(sqName(p))}</h5>`
          : `<h5${q.colour ? ` style="--sqc:${esc(q.colour)}"` : ''}>${esc(sqName(p))}</h5>`;
        last = sqName(p);
      }
      const ini = (p.member_name || '').split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      html += `<div class="pl"><span class="s">${esc(ini)}</span>${esc(p.member_name)}<em>${isPlayer(p.role) ? '' : esc(p.role.role_name || '')}</em></div>`;
    });
    return `<div class="box"><h4>${label} <span>${rows.length}</span></h4>${html || '<div class="none">Nobody</div>'}</div>`;
  };

  $('tabBody').innerHTML = `
    <div class="bar"><i style="width:${g / total * 100}%;background:var(--g)"></i><i style="width:${n / total * 100}%;background:var(--red)"></i><i style="width:${(total - g - n) / total * 100}%;background:var(--am)"></i></div>
    ${squads.length > 1 ? `<div class="sqs">${squads.map(q => `<button class="sq${q.name === fSquad ? ' on' : ''}" data-sq="${esc(q.name)}">
      ${q.image ? `<img src="${esc(q.image)}" alt="">` : q.colour ? `<i class="stripe" style="background:${esc(q.colour)}"></i>` : ''}<span>${esc(q.name)}</span><b>${q.going}<em>/${q.total}</em></b><small>players going</small><small>${q.not} not going · ${q.none} no reply</small></button>`).join('')}</div>` : ''}
    <div class="cols">${col('Going', 'going')}${col('Not going', 'not')}${col('No reply', 'none')}</div>`;
  document.querySelectorAll('.sq').forEach(b => b.onclick = () => {
    fSquad = fSquad === b.dataset.sq ? null : b.dataset.sq;
    loadAttendance(e, false);
  });
}
</script>
