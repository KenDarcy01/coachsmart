<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3354;
      --accent: #4f7cff;
      --accent-dim: #2a3f80;
      --text: #e8ecf4;
      --text-muted: #7a8099;
      --success: #2dd4a0;
      --error: #f4634f;
      --radius: 10px;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --surface2: #eef0f8;
        --border: #d0d4e8;
        --text: #1a1d27;
        --text-muted: #5a6080;
        --accent-dim: #dce5ff;
      }
    }
    :root[data-theme="light"] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface2: #eef0f8;
      --border: #d0d4e8;
      --text: #1a1d27;
      --text-muted: #5a6080;
      --accent-dim: #dce5ff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
    }
    header {
      width: 100%;
      max-width: 680px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
    #dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #dropzone.over { border-color: var(--accent); background: var(--accent-dim); }
    #dropzone.has-image { border-color: var(--success); padding: 12px; }
    #dropzone p { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }
    #dropzone input { display: none; }
    #preview {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 6px;
      display: none;
    }
    #preview.visible { display: block; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    #status {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 12px;
      min-height: 1.4em;
    }
    #status.error { color: var(--error); }
    #status.ok { color: var(--success); }
    #xml-out {
      width: 100%;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      resize: vertical;
      min-height: 120px;
    }
    .copy-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .copy-row span { font-size: 0.78rem; color: var(--text-muted); }
    #spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tag {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #open-drawio-btn { display: none; }
  </style>
</head>
<body>

<header>
  <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
    <rect width="36" height="36" rx="8" fill="#4f7cff"/>
    <path d="M9 27L18 9L27 27" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 22H24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>Diagram Converter</h1>
    <p>Photo → draw.io XML via Claude Vision</p>
  </div>
</header>

<div class="card">
  <h2>Upload Image</h2>
  <div id="dropzone" onclick="document.getElementById('fileinput').click()">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);margin:auto">
      <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <p>Click or drag &amp; drop an image here</p>
    <input type="file" id="fileinput" accept="image/*">
    <img id="preview" alt="Preview">
  </div>

  <div class="btn-row">
    <button class="btn" id="convert-btn" disabled onclick="convert()">
      <div id="spinner"></div>
      Convert to draw.io
    </button>
    <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
  </div>
  <div id="status"></div>
</div>

<div class="card" id="result-card" style="display:none">
  <h2>Result</h2>
  <div class="copy-row">
    <span>mxGraphModel XML — paste into draw.io → Extras → Edit Diagram</span>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.78rem" onclick="copyXml()">Copy</button>
  </div>
  <textarea id="xml-out" readonly></textarea>
  <div class="btn-row">
    <button class="btn" id="open-drawio-btn" onclick="openInDrawio()">Open in draw.io</button>
  </div>
</div>

<script>
  const FUNCTION_URL = 'https://gyfporsbdftvtakdvukt.supabase.co/functions/v1/diagram-to-drawio';

  const dropzone  = document.getElementById('dropzone');
  const fileinput = document.getElementById('fileinput');
  const preview   = document.getElementById('preview');
  const convertBtn = document.getElementById('convert-btn');
  const spinner   = document.getElementById('spinner');
  const statusEl  = document.getElementById('status');
  const resultCard = document.getElementById('result-card');
  const xmlOut    = document.getElementById('xml-out');
  const openBtn   = document.getElementById('open-drawio-btn');

  let currentFile = null;

  fileinput.addEventListener('change', () => {
    if (fileinput.files[0]) setFile(fileinput.files[0]);
  });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) setFile(f);
  });

  function setFile(file) {
    currentFile = file;
    const url = URL.createObjectURL(file);
    preview.src = url;
    preview.classList.add('visible');
    dropzone.classList.add('has-image');
    convertBtn.disabled = false;
    setStatus('');
    resultCard.style.display = 'none';
  }

  function clearAll() {
    currentFile = null;
    fileinput.value = '';
    preview.src = '';
    preview.classList.remove('visible');
    dropzone.classList.remove('has-image');
    convertBtn.disabled = true;
    setStatus('');
    resultCard.style.display = 'none';
  }

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type || '';
  }

  async function convert() {
    if (!currentFile) return;
    convertBtn.disabled = true;
    spinner.style.display = 'block';
    setStatus('Reading image…');
    resultCard.style.display = 'none';

    try {
      const { b64, mime } = await readFileAsBase64(currentFile);
      setStatus('Sending to Claude…');

      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ image_base64: b64, media_type: mime }),
      });

      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      xmlOut.value = data.xml;
      resultCard.style.display = 'block';
      openBtn.style.display = 'inline-flex';
      setStatus('Conversion complete ✓', 'ok');
    } catch (e) {
      setStatus('Error: ' + e.message, 'error');
    } finally {
      convertBtn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const dataUrl = e.target.result;
        const [header, b64] = dataUrl.split(',');
        const mime = header.match(/:(.*?);/)[1];
        resolve({ b64, mime });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function copyXml() {
    navigator.clipboard.writeText(xmlOut.value).then(() => {
      setStatus('Copied to clipboard ✓', 'ok');
    });
  }

  function openInDrawio() {
    const xml = xmlOut.value;
    const encoded = encodeURIComponent(xml);
    window.open('https://app.diagrams.net/?url=data:text/xml,' + encoded, '_blank');
  }
</script>
</body>
</html>
