name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      deploy_all_functions:
        description: 'Redeploy every edge function (not just changed ones)'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gyfporsbdftvtakdvukt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Migrations run first so a function that fails to build can never
      # hold back database changes.
      - name: Show migration status (local vs remote)
        run: supabase migration list --project-ref "$PROJECT_REF"
        continue-on-error: true

      - name: Push DB Migrations
        run: supabase db push --project-ref "$PROJECT_REF"

      # Work out which functions this push touched. A change to _shared/ or
      # supabase/config.toml affects every function, so all are redeployed.
      - name: Find changed edge functions
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          DEPLOY_ALL: ${{ inputs.deploy_all_functions }}
        run: |
          all=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DEPLOY_ALL" = "true" ]; then
            all=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # No usable base commit (first push, force push or manual run
            # without a base): fall back to the last commit only.
            BEFORE="$AFTER~1"
          fi

          if [ "$all" = "false" ]; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions supabase/config.toml)
            if echo "$changed" | grep -qE '^supabase/(functions/_shared/|config\.toml$)'; then
              all=true
            fi
          fi

          if [ "$all" = "true" ]; then
            names=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' | sort)
          else
            names=$(echo "$changed" | sed -nE 's#^supabase/functions/([^/_][^/]*)/.*#\1#p' | sort -u \
              | while read -r n; do [ -d "supabase/functions/$n" ] && echo "$n"; done)
          fi

          echo "Functions to deploy:"; echo "${names:-  (none)}"
          echo "names=$(echo $names)" >> "$GITHUB_OUTPUT"

      - name: Deploy Edge Functions
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: supabase functions deploy $NAMES --project-ref "$PROJECT_REF"
