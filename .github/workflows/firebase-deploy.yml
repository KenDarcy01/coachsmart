name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'webviews/**'
      - 'clontarf-gaa/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy webviews into main website
        run: rm -rf website/webviews && cp -r webviews website/webviews

      - name: Copy clontarf-gaa into main website
        run: rm -rf website/clontarf-gaa && cp -r clontarf-gaa website/clontarf-gaa

      - name: Deploy main website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: coach-smart-new-mpqa5l
          target: main

      - name: Deploy website-alt
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: coach-smart-new-mpqa5l
          target: website-alt
