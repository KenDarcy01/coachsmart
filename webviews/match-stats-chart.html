<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#111418"/>
  <style>html,body{background:#111418 !important;}</style>
  <title>Match Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────────── */
    :root {
      --bg:       #111418;
      --surface:  #1a2332;
      --border:   #1e293b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --us:       #87c232;   /* CoachSmart brand green — direct labels provide secondary encoding */
      --opp:      #d95926;   /* Reference palette slot 2 dark (orange) — passes all CVD checks */
      --amber:    #f59e0b;
      --green:    #87c232;
    }

    /* ── Reset / base ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    /* ── Loading / error screens ────────────────────────────────────────────── */
    #loadingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--us);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 14px; }

    #errorScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    .error-icon { font-size: 32px; }
    .error-title { font-size: 16px; font-weight: 600; }
    .error-msg { font-size: 13px; color: var(--muted); }

    /* ── Picker screen ───────────────────────────────────────────────────────── */
    #pickerScreen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px 16px 32px;
    }
    .picker-event-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .picker-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .picker-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .session-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .session-card:active {
      border-color: var(--us);
      opacity: 0.8;
    }
    .session-colour-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .session-info { flex: 1; min-width: 0; }
    .session-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .session-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .badge-mine {
      background: rgba(135,194,50,0.15);
      color: var(--us);
      border: 1px solid rgba(135,194,50,0.3);
    }
    .badge-final {
      background: rgba(100,116,139,0.15);
      color: var(--muted);
      border: 1px solid rgba(100,116,139,0.3);
    }
    .session-chevron {
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── Main chart screen ──────────────────────────────────────────────────── */
    #chartScreen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 0 24px;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header { padding: 16px 16px 0; }
    .event-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Score board */
    .score-board {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      gap: 8px;
    }
    .score-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
    }
    .score-team-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .score-team-name.us  { color: var(--us); }
    .score-team-name.opp { color: var(--opp); }
    .score-gaa {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      line-height: 1;
    }
    .score-gaa.us  { color: var(--us); }
    .score-gaa.opp { color: var(--opp); }
    .score-pts {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .score-vs {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
    }
    .score-lead {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      height: 16px;
    }
    .score-lead.leading  { color: var(--us); }
    .score-lead.trailing { color: var(--opp); }
    .score-lead.level    { color: var(--muted); }

    /* ── Chart area ─────────────────────────────────────────────────────────── */
    .chart-section { padding: 16px 10px 4px; }
    .chart-wrapper {
      position: relative;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    /* 500:300 aspect ratio */
    .chart-wrapper::before {
      content: '';
      display: block;
      padding-bottom: 60%;
    }
    .chart-wrapper svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }

    /* Tooltip */
    #tooltip {
      display: none;
      position: fixed;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text);
      pointer-events: none;
      z-index: 200;
      min-width: 110px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #tt-min { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .tt-row { display: flex; justify-content: space-between; gap: 12px; }
    .tt-label { font-weight: 600; }
    .tt-label.us  { color: var(--us); }
    .tt-label.opp { color: var(--opp); }
    .tt-score { font-weight: 500; font-variant-numeric: tabular-nums; }

    /* ── Legend ──────────────────────────────────────────────────────────────── */
    .legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 8px 16px 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .legend-line {
      width: 24px;
      height: 3px;
      border-radius: 2px;
    }
    .legend-line.us  { background: var(--us); }
    .legend-line.opp { background: var(--opp); }

    /* ── Events list ─────────────────────────────────────────────────────────── */
    .events-section { padding: 12px 16px 0; }
    .events-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .ev-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--surface);
      border-left: 3px solid transparent;
    }
    .ev-item.us  { border-color: var(--us); }
    .ev-item.opp { border-color: var(--opp); }
    .ev-min {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      min-width: 36px;
      font-variant-numeric: tabular-nums;
    }
    .ev-half {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }
    .ev-type {
      font-size: 13px;
      font-weight: 700;
      flex: 1;
    }
    .ev-type.us  { color: var(--us); }
    .ev-type.opp { color: var(--opp); }
    .ev-team {
      font-size: 11px;
      color: var(--muted);
      flex: 1;
    }
    .ev-tally {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 48px;
      text-align: right;
    }
    .no-events {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 20px 0;
    }

    /* ── Live indicator ─────────────────────────────────────────────────────── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ef4444;
      padding: 2px 8px 2px 6px;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 20px;
      background: rgba(239,68,68,0.08);
    }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- Loading -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Loading match chart…</div>
  </div>

  <!-- Error -->
  <div id="errorScreen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Unable to load chart</div>
    <div class="error-msg" id="errorMsg">No stats found for this event.</div>
  </div>

  <!-- Session picker -->
  <div id="pickerScreen">
    <div class="picker-event-label" id="pickerEventLabel"></div>
    <div class="picker-title">Match Stats</div>
    <div class="picker-subtitle">Multiple sessions recorded — tap to view</div>
    <div id="pickerList"></div>
  </div>

  <!-- Tooltip (floating, outside chart) -->
  <div id="tooltip">
    <div id="tt-min"></div>
    <div class="tt-row">
      <span class="tt-label us">Us</span>
      <span class="tt-score" id="tt-us">—</span>
    </div>
    <div class="tt-row" id="tt-opp-row">
      <span class="tt-label opp" id="tt-opp-label">Opp</span>
      <span class="tt-score" id="tt-opp">—</span>
    </div>
  </div>

  <!-- Main chart screen -->
  <div id="chartScreen">
    <div class="header">
      <div class="header-row">
        <div class="event-label" id="eventLabel">Match</div>
        <div class="live-badge" id="liveBadge" style="display:none">
          <div class="live-dot"></div> Live
        </div>
      </div>
      <div class="score-board">
        <div class="score-team">
          <div class="score-team-name us">Us</div>
          <div class="score-gaa us" id="usGAA">0-00</div>
          <div class="score-pts" id="usPts">(0)</div>
        </div>
        <div class="score-vs">VS</div>
        <div class="score-team">
          <div class="score-team-name opp" id="oppName">Opp</div>
          <div class="score-gaa opp" id="oppGAA">0-00</div>
          <div class="score-pts" id="oppPts">(0)</div>
        </div>
      </div>
      <div class="score-lead" id="scoreLead"></div>
    </div>

    <div class="chart-section">
      <div class="chart-wrapper">
        <svg id="chart" viewBox="0 0 500 300" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-line us"></div>
        <span>Us</span>
      </div>
      <div class="legend-item">
        <div class="legend-line opp"></div>
        <span id="legendOpp">Opp</span>
      </div>
    </div>

    <div class="events-section">
      <div class="events-header">Scoring Timeline</div>
      <div class="events-list" id="eventsList">
        <div class="no-events">No scores yet</div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';

const _p          = new URLSearchParams(window.location.search);
const WV_EVENT    = _p.get('event_id')       || _p.get('eventId');
const WV_TOKEN    = _p.get('token')          || _p.get('currentAuthToken') || _p.get('access_token');
const WV_STATS_ID = _p.get('match_stats_id') || _p.get('matchStatsId');

const sb = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_ANON_KEY,
  WV_TOKEN
    ? { global: { headers: { Authorization: `Bearer ${WV_TOKEN}` } }, auth: { persistSession: false } }
    : {}
);

// ── Chart constants ────────────────────────────────────────────────────────
const VW = 500, VH = 300;
const PAD = { l: 44, r: 24, t: 18, b: 36 };
const CW  = VW - PAD.l - PAD.r;   // 432
const CH  = VH - PAD.t - PAD.b;   // 246
const C_US    = '#87c232';
const C_OPP   = '#d95926';
const C_GRID  = '#1e293b';
const C_AXIS  = '#334155';
const C_MUTE  = '#64748b';
const C_AMBER = '#f59e0b';

// ── State ─────────────────────────────────────────────────────────────────
let timelineData     = null;
let currentSessionId = null;
let realtimeChannel  = null;
let pollTimer        = null;
let oppLabel         = 'Opp';

// Computed chart state (rebuilt on each render)
let chartState = {
  sortedEvents: [],
  usLine: [], oppLine: [],
  usTotal: 0, oppTotal: 0,
  usGoals: 0, usPts: 0,
  oppGoals: 0, oppPts: 0,
  durationMins: 30,
  currentHalf: 1,
  currentAbsMins: 0,
  maxMins: 35,
  maxPts: 5,
};

// ── Screens ───────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('errorScreen').style.display   = 'none';
  document.getElementById('pickerScreen').style.display  = 'none';
  document.getElementById('chartScreen').style.display   = 'none';
}
function showError(msg) {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display   = 'flex';
  document.getElementById('pickerScreen').style.display  = 'none';
  document.getElementById('chartScreen').style.display   = 'none';
  document.getElementById('errorMsg').textContent = msg;
}
function showPickerScreen() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display   = 'none';
  document.getElementById('pickerScreen').style.display  = 'flex';
  document.getElementById('chartScreen').style.display   = 'none';
}
function showChart() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display   = 'none';
  document.getElementById('pickerScreen').style.display  = 'none';
  document.getElementById('chartScreen').style.display   = 'flex';
}

// ── Data loading ──────────────────────────────────────────────────────────

// List all sessions for the event; auto-load if only one, else show picker.
async function loadEventSessions() {
  if (!WV_EVENT) { showError('No event specified.'); return; }
  const { data, error } = await sb.rpc('list_match_stats_for_event', {
    p_event_id: parseInt(WV_EVENT)
  });
  if (error || !data || !data.length) {
    showError('No match stats found for this event. Open the match timer first.');
    return;
  }
  if (data.length === 1) {
    await loadSessionById(data[0].id);
    return;
  }
  renderPicker(data);
  showPickerScreen();
}

// Load a specific session by match_stats_id and show the chart.
async function loadSessionById(id) {
  currentSessionId = id;
  const { data, error } = await sb.rpc('get_match_stats_session', {
    p_match_stats_id: id
  });
  if (error || !data || !data.match_stats_id) {
    showError('Could not load that stats session.');
    return;
  }
  timelineData = data;
  oppLabel = data.opposition || 'Opp';
  document.getElementById('oppName').textContent      = oppLabel;
  document.getElementById('legendOpp').textContent    = oppLabel;
  document.getElementById('tt-opp-label').textContent = oppLabel;
  document.getElementById('eventLabel').textContent   = data.event_title || 'Match';
  render();
  showChart();
  subscribeRealtime(id);
}

// Tap handler on a picker card (global for inline onclick).
async function selectSession(id) {
  showLoading();
  await loadSessionById(id);
}

// Pull fresh data for the current session and re-render.
async function refreshSession() {
  if (!currentSessionId) return;
  const { data, error } = await sb.rpc('get_match_stats_session', {
    p_match_stats_id: currentSessionId
  });
  if (!error && data && data.match_stats_id) {
    timelineData = data;
    render();
  }
}

// ── Picker rendering ──────────────────────────────────────────────────────
function renderPicker(sessions) {
  const listEl = document.getElementById('pickerList');

  // Try to extract event title from first session (if available via a separate call)
  // For now just leave pickerEventLabel empty — we don't have event_title here.

  listEl.innerHTML = sessions.map(s => {
    const dotColour  = s.squad_colour || '#64748b';
    const squadPart  = s.squad_name   ? ` · ${s.squad_name}` : '';
    const oppPart    = s.opposition   || 'Opposition';
    const countPart  = `${s.score_count} score${s.score_count !== 1 ? 's' : ''}`;
    const isFinal    = !!s.finalised_at;
    const isMine     = !!s.is_mine;
    const userName   = (s.user_name && s.user_name.trim()) ? s.user_name.trim() : 'Unknown';

    const mineTag  = isMine  ? `<span class="badge badge-mine">Mine</span>` : '';
    const finalTag = isFinal ? `<span class="badge badge-final">Final</span>` : '';

    return `<div class="session-card" onclick="selectSession(${s.id})">
      <div class="session-colour-dot" style="background:${dotColour}"></div>
      <div class="session-info">
        <div class="session-name">${userName}${squadPart}</div>
        <div class="session-meta">vs ${oppPart} · ${countPart}</div>
      </div>
      <div class="session-badges">${mineTag}${finalTag}</div>
      <div class="session-chevron">›</div>
    </div>`;
  }).join('');
}

// ── Realtime subscription ─────────────────────────────────────────────────
function subscribeRealtime(matchStatsId) {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

  realtimeChannel = sb
    .channel(`chart-${matchStatsId}`)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'match_stats_details',
      filter: `match_stats_id=eq.${matchStatsId}`,
    }, () => refreshSession())
    .subscribe(status => {
      if (status === 'SUBSCRIBED') {
        clearInterval(pollTimer);
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        startPolling();
      }
    });

  // Fallback: if not subscribed after 5s, start polling
  setTimeout(() => {
    if (!realtimeChannel || realtimeChannel.state !== 'joined') startPolling();
  }, 5000);
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(refreshSession, 15000);
}

// ── Render pipeline ───────────────────────────────────────────────────────
function render() {
  if (!timelineData) return;
  processData();
  renderScore();
  renderChartSVG();
  renderEvents();
}

function processData() {
  const timer  = timelineData.timer  || {};
  const events = timelineData.events || [];

  const durationMins = Math.round((timer.duration_seconds || 1800) / 60);
  const currentHalf  = timer.current_half || 1;

  // Current absolute time in minutes
  let elapsed = timer.elapsed_seconds || 0;
  if (timer.status === 'running' && timer.started_at) {
    elapsed += (Date.now() - new Date(timer.started_at).getTime()) / 1000;
  }
  const elapsedMins    = elapsed / 60;
  const currentAbsMins = currentHalf === 2
    ? durationMins + Math.min(elapsedMins, durationMins + 15)
    : Math.min(elapsedMins, durationMins + 15);

  // Sort events chronologically
  const sortedEvents = [...events].sort((a, b) => {
    if (a.half !== b.half) return a.half - b.half;
    if (a.minute !== b.minute) return a.minute - b.minute;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  // Build step-function paths and accumulate scores
  let usRunning = 0, oppRunning = 0;
  let usGoals = 0, usPtsAcc = 0, oppGoals = 0, oppPtsAcc = 0;
  const usLine  = [{ x: 0, y: 0 }];
  const oppLine = [{ x: 0, y: 0 }];

  const enrichedEvents = sortedEvents.map(ev => {
    const absMin = ev.half === 1 ? ev.minute : durationMins + ev.minute;
    const val = ev.score_value || 1;
    const isGoal = val >= 3;
    let usCum, oppCum;
    if (ev.side === 'us') {
      usLine.push({ x: absMin, y: usRunning });
      usRunning += val;
      usLine.push({ x: absMin, y: usRunning });
      if (isGoal) usGoals++; else usPtsAcc += val;
      usCum  = usRunning;
      oppCum = oppRunning;
    } else {
      oppLine.push({ x: absMin, y: oppRunning });
      oppRunning += val;
      oppLine.push({ x: absMin, y: oppRunning });
      if (isGoal) oppGoals++; else oppPtsAcc += val;
      usCum  = usRunning;
      oppCum = oppRunning;
    }
    return { ...ev, absMin, val, isGoal, usCum, oppCum };
  });

  // Extend lines to current time
  usLine.push(  { x: currentAbsMins, y: usRunning });
  oppLine.push( { x: currentAbsMins, y: oppRunning });

  const hasH2  = sortedEvents.some(e => e.half === 2) || currentHalf === 2;
  const maxMins = hasH2
    ? Math.max(currentAbsMins + 2, 2 * durationMins + 2)
    : Math.max(currentAbsMins + 2, durationMins + 2, 12);
  const maxPts  = Math.max(usRunning, oppRunning, 4) + 3;

  chartState = {
    sortedEvents: enrichedEvents,
    usLine, oppLine,
    usTotal: usRunning, oppTotal: oppRunning,
    usGoals, usPts: usPtsAcc,
    oppGoals, oppPts: oppPtsAcc,
    durationMins, currentHalf,
    currentAbsMins, maxMins, maxPts,
    hasH2, timerStatus: timer.status,
  };

  // Live badge
  document.getElementById('liveBadge').style.display =
    timer.status === 'running' ? 'inline-flex' : 'none';
}

// ── Score display ─────────────────────────────────────────────────────────
function fmtGAA(goals, pts) {
  return `${goals}-${String(pts).padStart(2, '0')}`;
}

function renderScore() {
  const { usTotal, oppTotal, usGoals, usPts, oppGoals, oppPts } = chartState;
  document.getElementById('usGAA').textContent  = fmtGAA(usGoals, usPts);
  document.getElementById('usPts').textContent  = `(${usTotal})`;
  document.getElementById('oppGAA').textContent = fmtGAA(oppGoals, oppPts);
  document.getElementById('oppPts').textContent = `(${oppTotal})`;

  const leadEl = document.getElementById('scoreLead');
  const diff = usTotal - oppTotal;
  if (diff > 0) {
    leadEl.textContent = `▲ Us leading by ${diff} pt${diff !== 1 ? 's' : ''}`;
    leadEl.className = 'score-lead leading';
  } else if (diff < 0) {
    leadEl.textContent = `▼ Us trailing by ${Math.abs(diff)} pt${Math.abs(diff) !== 1 ? 's' : ''}`;
    leadEl.className = 'score-lead trailing';
  } else if (usTotal === 0 && oppTotal === 0) {
    leadEl.textContent = '';
    leadEl.className = 'score-lead';
  } else {
    leadEl.textContent = '= Level';
    leadEl.className = 'score-lead level';
  }
}

// ── SVG chart ─────────────────────────────────────────────────────────────
function xS(m, maxMins) { return PAD.l + (m / maxMins) * CW; }
function yS(p, maxPts)  { return PAD.t + CH - (p / maxPts) * CH; }
function f(n)            { return n.toFixed(1); }

function pts2str(pts, maxMins, maxPts) {
  return pts.map(p => `${f(xS(p.x, maxMins))},${f(yS(p.y, maxPts))}`).join(' ');
}

function renderChartSVG() {
  const {
    sortedEvents, usLine, oppLine,
    usTotal, oppTotal, durationMins, currentAbsMins,
    maxMins, maxPts, hasH2, currentHalf,
  } = chartState;

  let svg = '';

  // Y-axis grid lines
  const yTick = maxPts <= 5 ? 1 : maxPts <= 12 ? 2 : maxPts <= 25 ? 5 : 10;
  for (let y = 0; y <= maxPts; y += yTick) {
    const cy = f(yS(y, maxPts));
    svg += `<line x1="${PAD.l}" y1="${cy}" x2="${f(PAD.l + CW)}" y2="${cy}" stroke="${C_GRID}" stroke-width="1"/>`;
    svg += `<text x="${PAD.l - 4}" y="${cy}" dy="4" text-anchor="end" fill="${C_MUTE}" font-size="9" font-family="DM Sans,sans-serif">${y}</text>`;
  }

  // X-axis grid lines
  const xTick = maxMins <= 20 ? 5 : maxMins <= 40 ? 5 : 10;
  for (let x = 0; x <= Math.ceil(maxMins); x += xTick) {
    const cx = f(xS(x, maxMins));
    svg += `<line x1="${cx}" y1="${PAD.t}" x2="${cx}" y2="${f(PAD.t + CH)}" stroke="${C_GRID}" stroke-width="1"/>`;
    svg += `<text x="${cx}" y="${f(PAD.t + CH + 14)}" text-anchor="middle" fill="${C_MUTE}" font-size="9" font-family="DM Sans,sans-serif">${x}'</text>`;
  }

  // Halftime marker
  if (hasH2) {
    const htX = f(xS(durationMins, maxMins));
    svg += `<line x1="${htX}" y1="${PAD.t}" x2="${htX}" y2="${f(PAD.t + CH)}" stroke="${C_AMBER}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"/>`;
    svg += `<text x="${htX}" y="${PAD.t - 4}" text-anchor="middle" fill="${C_AMBER}" font-size="8" font-weight="600" font-family="DM Sans,sans-serif">HT</text>`;
  }

  // Axes
  svg += `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${f(PAD.t + CH)}" stroke="${C_AXIS}" stroke-width="1"/>`;
  svg += `<line x1="${PAD.l}" y1="${f(PAD.t + CH)}" x2="${f(PAD.l + CW)}" y2="${f(PAD.t + CH)}" stroke="${C_AXIS}" stroke-width="1"/>`;

  // Axis labels
  svg += `<text x="${f(PAD.l + CW / 2)}" y="${VH - 2}" text-anchor="middle" fill="${C_MUTE}" font-size="9" font-family="DM Sans,sans-serif">Minutes</text>`;
  svg += `<text x="9" y="${f(PAD.t + CH / 2)}" text-anchor="middle" fill="${C_MUTE}" font-size="9" font-family="DM Sans,sans-serif" transform="rotate(-90 9 ${f(PAD.t + CH / 2)})">Points</text>`;

  // Current time cursor
  if (currentAbsMins > 0) {
    const cX = f(xS(currentAbsMins, maxMins));
    svg += `<line x1="${cX}" y1="${PAD.t}" x2="${cX}" y2="${f(PAD.t + CH)}" stroke="#475569" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>`;
  }

  // Data lines (opp first so Us draws on top)
  if (oppLine.length > 1) {
    svg += `<polyline points="${pts2str(oppLine, maxMins, maxPts)}" fill="none" stroke="${C_OPP}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if (usLine.length > 1) {
    svg += `<polyline points="${pts2str(usLine, maxMins, maxPts)}" fill="none" stroke="${C_US}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  // Event markers (circles at each score)
  for (const ev of sortedEvents) {
    const cx = f(xS(ev.absMin, maxMins));
    const cy = ev.side === 'us' ? f(yS(ev.usCum, maxPts)) : f(yS(ev.oppCum, maxPts));
    const c  = ev.side === 'us' ? C_US : C_OPP;
    const r  = ev.isGoal ? 4.5 : 3;

    // White ring then colour fill for legibility
    svg += `<circle cx="${cx}" cy="${cy}" r="${r + 1}" fill="#111418"/>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`;

    // Goal label (abbreviated name)
    if (ev.isGoal) {
      const labelY = ev.side === 'us' ? parseFloat(cy) - 8 : parseFloat(cy) + 14;
      svg += `<text x="${cx}" y="${f(labelY)}" text-anchor="middle" fill="${c}" font-size="8" font-weight="700" font-family="DM Sans,sans-serif">${ev.abbreviated_name || 'G'}</text>`;
    }
  }

  // Direct labels at end of each line (secondary encoding)
  const usEnd  = usLine[usLine.length - 1];
  const oppEnd = oppLine[oppLine.length - 1];
  if (usTotal > 0) {
    const lx = Math.min(xS(usEnd.x, maxMins) + 4, VW - PAD.r - 2);
    const ly = yS(usEnd.y, maxPts);
    svg += `<text x="${f(lx)}" y="${f(ly - 4)}" fill="${C_US}" font-size="9" font-weight="700" font-family="DM Sans,sans-serif">Us ${usTotal}</text>`;
  }
  if (oppTotal > 0) {
    const lx = Math.min(xS(oppEnd.x, maxMins) + 4, VW - PAD.r - 2);
    const ly = yS(oppEnd.y, maxPts);
    const yOff = Math.abs(yS(usEnd.y, maxPts) - yS(oppEnd.y, maxPts)) < 14 ? 12 : -4;
    svg += `<text x="${f(lx)}" y="${f(ly + yOff)}" fill="${C_OPP}" font-size="9" font-weight="700" font-family="DM Sans,sans-serif">${oppLabel} ${oppTotal}</text>`;
  }

  // Empty-state message
  if (sortedEvents.length === 0) {
    svg += `<text x="${f(VW / 2)}" y="${f(VH / 2)}" text-anchor="middle" fill="${C_MUTE}" font-size="12" font-family="DM Sans,sans-serif">Waiting for first score…</text>`;
  }

  // Invisible interaction overlay
  svg += `<rect id="chartOverlay" x="${PAD.l}" y="${PAD.t}" width="${CW}" height="${CH}" fill="transparent" style="cursor:crosshair"/>`;

  document.getElementById('chart').innerHTML = svg;
  attachChartInteraction();
}

// ── Chart interaction (crosshair + tooltip) ───────────────────────────────
function attachChartInteraction() {
  const overlay = document.getElementById('chartOverlay');
  const tooltip = document.getElementById('tooltip');
  if (!overlay) return;

  function getAbsMin(clientX) {
    const rect  = overlay.closest('svg').getBoundingClientRect();
    const scaleX = VW / rect.width;
    const svgX   = (clientX - rect.left) * scaleX;
    const chartX = svgX - PAD.l;
    return (chartX / CW) * chartState.maxMins;
  }

  function getScoresAtMin(absMin) {
    let us = 0, opp = 0;
    for (const ev of chartState.sortedEvents) {
      if (ev.absMin <= absMin) {
        if (ev.side === 'us')  us  = ev.usCum;
        else                   opp = ev.oppCum;
      }
    }
    return { us, opp };
  }

  function showTip(clientX, clientY, absMin) {
    if (absMin < 0 || absMin > chartState.maxMins) { hideTip(); return; }
    const scores  = getScoresAtMin(absMin);
    const { durationMins } = chartState;
    const half = absMin < durationMins ? 1 : 2;
    const relMin = half === 1 ? absMin : absMin - durationMins;
    const halfStr = chartState.hasH2 ? `H${half} · ` : '';

    document.getElementById('tt-min').textContent = `${halfStr}${Math.round(relMin)}'`;
    document.getElementById('tt-us').textContent  = scores.us;
    document.getElementById('tt-opp').textContent = scores.opp;

    const tipEl = tooltip;
    tipEl.style.display = 'block';
    const tipW = tipEl.offsetWidth, tipH = tipEl.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = clientX + 12, top = clientY - tipH / 2;
    if (left + tipW > vw) left = clientX - tipW - 12;
    if (top < 8) top = 8;
    if (top + tipH > vh - 8) top = vh - tipH - 8;
    tipEl.style.left = `${left}px`;
    tipEl.style.top  = `${top}px`;
  }

  function hideTip() { tooltip.style.display = 'none'; }

  overlay.addEventListener('mousemove',  e => showTip(e.clientX, e.clientY, getAbsMin(e.clientX)));
  overlay.addEventListener('mouseleave', hideTip);
  overlay.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    showTip(t.clientX, t.clientY, getAbsMin(t.clientX));
  }, { passive: false });
  overlay.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    showTip(t.clientX, t.clientY, getAbsMin(t.clientX));
  }, { passive: false });
  overlay.addEventListener('touchend', hideTip);
}

// ── Events list ───────────────────────────────────────────────────────────
function renderEvents() {
  const el = document.getElementById('eventsList');
  const { sortedEvents, hasH2 } = chartState;

  if (!sortedEvents.length) {
    el.innerHTML = '<div class="no-events">No scores yet</div>';
    return;
  }

  el.innerHTML = [...sortedEvents].reverse().map(ev => {
    const teamClass = ev.side === 'us' ? 'us' : 'opp';
    const teamName  = ev.side === 'us' ? 'Us' : oppLabel;
    const halfLabel = hasH2 ? `H${ev.half}` : '';
    const minLabel  = `${ev.absMin}'`;
    const scoreStr  = `${ev.usCum} – ${ev.oppCum}`;

    return `<div class="ev-item ${teamClass}">
      <span class="ev-min">${minLabel}</span>
      ${halfLabel ? `<span class="ev-half">${halfLabel}</span>` : ''}
      <span class="ev-type ${teamClass}">${ev.abbreviated_name || '?'}</span>
      <span class="ev-team">${teamName}</span>
      <span class="ev-tally">${scoreStr}</span>
    </div>`;
  }).join('');
}

// ── Boot ──────────────────────────────────────────────────────────────────
async function boot() {
  showLoading();
  if (!WV_TOKEN) {
    showError('Authentication required. Please open this page from the CoachSmart app.');
    return;
  }
  try {
    const { data: { user }, error } = await sb.auth.getUser();
    if (error || !user) { showError('Session expired. Please re-open from the app.'); return; }

    if (WV_STATS_ID) {
      // Direct session load — skip picker entirely
      await loadSessionById(parseInt(WV_STATS_ID));
    } else {
      // Event-based — list sessions, auto-load or show picker
      await loadEventSessions();
    }
  } catch (e) {
    console.error(e);
    showError('Failed to load chart data. Check your connection.');
  }
}

boot();
</script>
