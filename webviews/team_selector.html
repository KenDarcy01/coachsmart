<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#111418"/>
  <!-- Early background — applied before any scripts or fonts load to prevent white flash -->
  <style>html,body{background:#111418 !important;}</style>
  <title>CoachSmart — Team Selector</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green:     #87C232;
      --green-dim: rgba(135,194,50,0.12);
      --dark:      #111418;
      --card:      #1E222B;
      --card2:     #252A35;
      --border:    rgba(255,255,255,0.07);
      --text:      #E7EBEE;
      --muted:     #6B7280;
      --red:       #EF4444;
      --pitch-dk:  #2d6a2d;
      --pitch-st:  #3a9a3a;
      --pitch-ln:  rgba(255,255,255,0.88);
    }
    /* ── BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: none; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); font-size: 14px; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }

    /* Two full-screen panels — only one shown at a time */
    .screen {
      display: none;
      width: 100%;
      height: 100vh;
      /* iOS safe fallback */
      height: -webkit-fill-available;
      overflow: hidden;
    }
    .screen.active { display: block; }

    /* ── CLOSE BUTTON ── */
    .wv-close-btn {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; flex-shrink: 0;
      background: none; border: none; cursor: pointer;
      color: var(--green); border-radius: 8px; transition: background 0.1s;
    }
    .wv-close-btn:active { background: var(--green-dim); }
    .wv-close-btn svg { width: 34px; height: 34px; }

    /* ── SHARED HEADER ── */
    .top-bar {
      background: var(--card); border-bottom: 3px solid var(--green);
      padding: 0 16px; height: 54px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .wordmark { font-family: 'Bebas Neue', sans-serif; font-size: 21px; letter-spacing: 3px; line-height: 1; }
    .wordmark .g  { color: #9CA3AF; }
    .wordmark .gr { color: var(--green); }
    .bar-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
    .bar-actions { display: flex; gap: 8px; align-items: center; }
    .green-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 0 13px; height: 34px;
      background: var(--green); color: #111418;
      border-radius: 8px; font-size: 13px; font-weight: 700;
      white-space: nowrap; transition: opacity 0.15s;
    }
    .green-btn:hover { opacity: 0.85; }
    .green-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .hdr-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 0 10px; height: 32px;
      background: var(--green); color: #111418;
      border-radius: 8px; font-size: 12px; font-weight: 700;
      white-space: nowrap; transition: opacity 0.15s; flex-shrink: 0;
    }
    .hdr-btn:hover { opacity: 0.85; }
    .hdr-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .hdr-btn-outline {
      background: transparent; color: var(--green);
      border: 1.5px solid var(--green);
    }
    .hdr-btn-outline:hover { background: var(--green-dim); }

    /* ── AUTH ERROR SCREEN ── */
    #authError {
      display: none; height: 100vh; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 32px; text-align: center;
    }
    #authError.active { display: flex; }
    #authError svg { color: var(--red); }
    #authError h2 { font-family: 'Bebas Neue', sans-serif; font-size: 23px; letter-spacing: 2px; }
    #authError p { font-size: 14px; color: var(--muted); max-width: 280px; line-height: 1.6; }

    /* ── PITCH SCREEN ──
       Use JS-measured pixel heights — no flex magic needed */
    #pitchScreen { overflow: hidden; }
    .sub-bar { background: var(--card2); border-bottom: 1px solid var(--border); height: 38px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sub-bar[hidden] { display: none; }
    .event-lbl { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .event-lbl strong { color: var(--text); }
    .toolbar { background: var(--card); border-bottom: 1px solid var(--border); height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .toolbar::-webkit-scrollbar { display: none; }
    .tlbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); white-space: nowrap; }
    .fmts { display: flex; gap: 3px; }
    .fb { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1.5px solid var(--border); color: var(--muted); background: transparent; transition: all 0.12s; white-space: nowrap; }
    .fb.on { background: var(--green); border-color: var(--green); color: #111418; }
    .fb:hover:not(.on) { border-color: var(--green); color: var(--green); }
    .tsep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .cols { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .sw-w { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .sw-l { font-size: 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    input[type=color].sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; appearance: none; -webkit-appearance: none; overflow: hidden; }
    input[type=color].sw::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color].sw::-webkit-color-swatch { border: none; border-radius: 50%; }

    /* Squad strip — taller for easier touch scrolling */
    .squad-strip { background: var(--card); border-top: 1px solid var(--border); height: 80px; display: flex; align-items: center; gap: 8px; padding: 0 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; cursor: grab; }
    .squad-strip:active { cursor: grabbing; }
    .squad-strip::-webkit-scrollbar { display: none; }
    .ss-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; margin-right: 4px; }
    .ss-empty { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .chip { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; display: flex; align-items: center; gap: 6px; flex-shrink: 0; transition: all 0.12s; }
    .chip.placed { opacity: 0.3; cursor: default; pointer-events: none; }
    .chip:not(.placed):hover { border-color: var(--green); color: var(--green); }
    .chip .cn { width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #111418; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Subs zone — fixed height */
    .subs-zone { background: var(--card); border-top: 1px solid var(--border); height: 62px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 10px 6px; }
    .subs-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); white-space: nowrap; }
    .ss { width: 36px; height: 40px; border: 1.5px dashed var(--border); border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card2); position: relative; flex-shrink: 0; transition: border-color 0.12s; }
    .ss.over { border-color: var(--green); background: var(--green-dim); }
    .ss.full { border-style: solid; border-color: var(--border); }
    .ss .sn  { font-size: 10px; color: var(--muted); font-weight: 600; }
    .ss .snm { position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); text-align: center; width: 48px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ss .srm { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; background: var(--red); color: white; border-radius: 50%; font-size: 9px; line-height: 13px; text-align: center; cursor: pointer; display: none; }
    .ss.full .srm { display: block; }

    /* Pitch area — JS sets explicit px height */
    .pitch-area { background: var(--dark); display: flex; align-items: center; justify-content: center; overflow: hidden; }

    /* Pitch wrap — JS sets explicit px width and height */
    .pitch-wrap { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.55); flex-shrink: 0; }
    .pitch-svg { width: 100%; height: 100%; display: block; }
    .pos-ov { position: absolute; inset: 0; pointer-events: none; }
    .ps { position: absolute; transform: translate(-50%, calc(var(--jh,40px) / -2)); pointer-events: all; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .pc { width: var(--jw,36px); height: var(--jh,40px); position: relative; cursor: pointer; transition: transform 0.12s; }
    .pc.over { transform: scale(1.2); }
    .jsv { position: absolute; inset: 0; width: 100%; height: 100%; }
    .jb { fill: rgba(255,255,255,0.15); stroke: rgba(255,255,255,0.55); stroke-width: 1.5; stroke-dasharray: 3,2; }
    .pc.has .jb { fill: var(--jc-p, #cc0000); stroke: rgba(255,255,255,0.85); stroke-dasharray: none; }
    .pc.gk.has .jb { fill: var(--jc-g, #ffffff); }
    .pc.over .jb { fill: rgba(255,255,255,0.28); stroke: white; stroke-dasharray: none; }
    .pn { font-weight: 700; color: white; text-align: center; line-height: 1.2; position: relative; z-index: 2; background: rgba(0,0,0,0.55); padding: 1px 5px 2px; border-radius: 5px; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
    .pn:empty { display: none; }
    .pn span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl { font-size: 8px; font-weight: 600; color: rgba(255,255,255,0.65); text-shadow: 0 1px 2px rgba(0,0,0,0.6); white-space: nowrap; }
    .rx { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--red); color: white; font-size: 9px; display: none; align-items: center; justify-content: center; z-index: 10; cursor: pointer; line-height: 1; }
    .pc.has:hover .rx { display: flex; }
    .ptip { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.8); font-size: 10px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; pointer-events: none; backdrop-filter: blur(4px); }

    #dg { position: fixed; pointer-events: none; z-index: 9999; background: var(--green); color: #111418; padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,0.5); transform: translate(-50%,-50%) scale(1.04); display: none; white-space: nowrap; }
    #dg.show { display: block; }

    .ppop { position: fixed; z-index: 800; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.65); max-height: 220px; overflow-y: auto; min-width: 170px; }
    .pp-hdr { padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .pp-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; font-size: 12px; text-align: left; color: var(--text); transition: background 0.1s; }
    .pp-item:hover { background: var(--card2); }
    .pp-av { width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #111418; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .lov { position: fixed; inset: 0; background: rgba(17,20,24,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 500; backdrop-filter: blur(4px); }
    .lov.off { display: none; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: sp 0.7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .lov-t { font-size: 13px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--dark); padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.22s; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── PDF PREVIEW OVERLAY ── */
    #pdfOverlay {
      display: none; position: fixed; inset: 0; z-index: 2000;
      background: var(--dark); flex-direction: column;
    }
    #pdfOverlay.show { display: flex; }
    #pdfOverlay .pdf-top {
      flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center;
      height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--border);
    }
    #pdfOverlay .pdf-title { font-size: 16px; font-weight: 700; color: var(--text); }
    #pdfOverlay .pdf-back {
      position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 2px;
      height: 40px; padding: 0 12px 0 6px; font-size: 15px; font-weight: 600; color: var(--text);
      background: none; border: none; border-radius: 10px;
    }
    #pdfOverlay .pdf-back:active { background: var(--card2); }
    #pdfOverlay .pdf-content {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px; display: flex; flex-direction: column; align-items: center;
    }
    #pdfOverlay canvas {
      max-width: 100%; flex-shrink: 0; border-radius: 4px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.6); margin-bottom: 12px;
    }
    #pdfOverlay .pdf-bottom {
      flex-shrink: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); background: var(--dark);
    }
    #pdfOverlay .pdf-share {
      width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--green); color: #14181b; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
    }
    #pdfOverlay .pdf-share:active { opacity: 0.85; }
  </style>
</head>
<body>

<!-- AUTH ERROR SCREEN -->
<div id="authError">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <h2>Access Denied</h2>
  <p>Please open Team Selector from within the CoachSmart app.</p>
</div>

<!-- PITCH SCREEN -->
<div class="screen active" id="pitchScreen">
  <div class="top-bar">
    <button class="wv-close-btn" onclick="closeFlow()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="bar-actions">
      <button class="hdr-btn" id="dlBtn" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Save / Share
      </button>
      <button class="hdr-btn hdr-btn-outline" id="tsBtn" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Teamsheet
      </button>
    </div>
  </div>
  <!-- Team / date bar hidden (Ken, 2026-10-17): the pitch gets the space -->
  <div class="sub-bar" hidden>
    <div class="event-lbl" id="evtLbl">—</div>
  </div>
  <div class="toolbar">
    <span class="tlbl">Format</span>
    <div class="fmts">
      <button class="fb" data-f="9">9</button>
      <button class="fb" data-f="11">11</button>
      <button class="fb" data-f="13">13</button>
      <button class="fb on" data-f="15">15</button>
    </div>
    <div class="tsep"></div>
    <div class="cols">
      <div class="sw-w"><input type="color" class="sw" id="cp" value="#cc0000"/><span class="sw-l">Primary</span></div>
      <div class="sw-w"><input type="color" class="sw" id="cs" value="#cc0000"/><span class="sw-l">Stripe</span></div>
      <div class="sw-w"><input type="color" class="sw" id="cg" value="#ffffff"/><span class="sw-l">GK</span></div>
    </div>
  </div>
  <div class="squad-strip" id="strip">
    <span class="ss-lbl">Squad</span>
    <span class="ss-empty">No players loaded</span>
  </div>
  <div class="pitch-area" id="pitchArea">
      <div class="pitch-wrap" id="pitchWrap">
        <svg class="pitch-svg" viewBox="0 0 300 484" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="ca-t"><rect x="-5" y="73" width="310" height="160"/></clipPath>
            <clipPath id="ca-b"><rect x="-5" y="251" width="310" height="160"/></clipPath>
            <clipPath id="cd-t"><rect x="-5" y="73" width="310" height="52"/></clipPath>
            <clipPath id="cd-b"><rect x="-5" y="359" width="310" height="52"/></clipPath>
          </defs>
          <rect width="300" height="484" fill="var(--pitch-dk)"/>
          <rect x="0" y="0"   width="300" height="48" fill="var(--pitch-st)"/>
          <rect x="0" y="96"  width="300" height="48" fill="var(--pitch-st)"/>
          <rect x="0" y="192" width="300" height="48" fill="var(--pitch-st)"/>
          <rect x="0" y="288" width="300" height="48" fill="var(--pitch-st)"/>
          <rect x="0" y="384" width="300" height="48" fill="var(--pitch-st)"/>
          <rect x="4" y="4" width="292" height="476" fill="none" stroke="var(--pitch-ln)" stroke-width="1.8"/>
          <line x1="4" y1="160" x2="296" y2="160" stroke="var(--pitch-ln)" stroke-width="1.5"/>
          <line x1="4" y1="73"  x2="296" y2="73"  stroke="var(--pitch-ln)" stroke-width="1.5"/>
          <rect x="118" y="4" width="64" height="45" fill="rgba(255,255,255,0.05)" stroke="var(--pitch-ln)" stroke-width="1.4"/>
          <rect x="127" y="4" width="46" height="15" fill="rgba(255,255,255,0.07)" stroke="var(--pitch-ln)" stroke-width="1.1"/>
          <line x1="4" y1="49" x2="296" y2="49" stroke="var(--pitch-ln)" stroke-width="1.1"/>
          <path d="M 107 73 A 43 44 0 0 0 193 73" fill="none" stroke="var(--pitch-ln)" stroke-width="1.1" clip-path="url(#cd-t)"/>
          <path d="M 33 73 A 132 137 0 0 0 267 73" fill="rgba(255,165,0,0.07)" stroke="rgba(255,165,0,0.85)" stroke-width="1.6" stroke-dasharray="4,3" clip-path="url(#ca-t)"/>
          <rect x="139" y="4"  width="22" height="9"  fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="1.8"/>
          <line x1="139" y1="4"  x2="139" y2="-6"  stroke="white" stroke-width="2.2"/>
          <line x1="161" y1="4"  x2="161" y2="-6"  stroke="white" stroke-width="2.2"/>
          <line x1="118" y1="4"  x2="118" y2="-4"  stroke="white" stroke-width="1.3" opacity="0.6"/>
          <line x1="182" y1="4"  x2="182" y2="-4"  stroke="white" stroke-width="1.3" opacity="0.6"/>
          <circle cx="150" cy="43" r="2.2" fill="var(--pitch-ln)"/>
          <line x1="4" y1="242" x2="296" y2="242" stroke="var(--pitch-ln)" stroke-width="1.4" stroke-dasharray="6,4" opacity="0.9"/>
          <line x1="4" y1="229" x2="296" y2="229" stroke="var(--pitch-ln)" stroke-width="1.1"/>
          <line x1="4" y1="255" x2="296" y2="255" stroke="var(--pitch-ln)" stroke-width="1.1"/>
          <line x1="4" y1="324" x2="296" y2="324" stroke="var(--pitch-ln)" stroke-width="1.5"/>
          <line x1="4" y1="411" x2="296" y2="411" stroke="var(--pitch-ln)" stroke-width="1.5"/>
          <rect x="118" y="435" width="64" height="45" fill="rgba(255,255,255,0.05)" stroke="var(--pitch-ln)" stroke-width="1.4"/>
          <rect x="127" y="465" width="46" height="15" fill="rgba(255,255,255,0.07)" stroke="var(--pitch-ln)" stroke-width="1.1"/>
          <line x1="4" y1="435" x2="296" y2="435" stroke="var(--pitch-ln)" stroke-width="1.1"/>
          <path d="M 107 411 A 43 44 0 0 1 193 411" fill="none" stroke="var(--pitch-ln)" stroke-width="1.1" clip-path="url(#cd-b)"/>
          <path d="M 33 411 A 132 137 0 0 1 267 411" fill="rgba(255,165,0,0.07)" stroke="rgba(255,165,0,0.85)" stroke-width="1.6" stroke-dasharray="4,3" clip-path="url(#ca-b)"/>

// ── PITCH SIZER ──
// iOS Safari can't reliably size a pitch with CSS alone.
// We measure actual pixel space and set explicit px dimensions.
const PITCH_RATIO = 90 / 145; // width / height (portrait GAA pitch)

function sizePitch() {
  const screen = $('pitchScreen');
  if (!screen.classList.contains('active')) return;

  const totalH  = window.innerHeight;
  const topBarH = $('pitchScreen').querySelector('.top-bar').offsetHeight;
  const subBarH = $('pitchScreen').querySelector('.sub-bar').offsetHeight;
  const toolbarH= $('pitchScreen').querySelector('.toolbar').offsetHeight;
  const stripH  = $('strip').offsetHeight;
  const subsH   = $('pitchScreen').querySelector('.subs-zone').offsetHeight;

  const availH = totalH - topBarH - subBarH - toolbarH - stripH - subsH - 16; // 16px padding
  const availW = window.innerWidth - 16;

  // Fit within both constraints maintaining ratio
  let pitchH = availH;
  let pitchW = availH * PITCH_RATIO;
  if (pitchW > availW) {
    pitchW = availW;
    pitchH = availW / PITCH_RATIO;
  }

  const area = $('pitchArea');
  const wrap = $('pitchWrap');
  area.style.height = availH + 'px';
  wrap.style.width  = Math.floor(pitchW) + 'px';
  wrap.style.height = Math.floor(pitchH) + 'px';
  if(typeof renderPos==='function') renderPos();
}

window.addEventListener('resize', sizePitch);
window.addEventListener('orientationchange', () => setTimeout(sizePitch, 200));
function screen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');

function applyJC(){document.documentElement.style.setProperty('--jc-p',jc.p);document.documentElement.style.setProperty('--jc-s',jc.s);document.documentElement.style.setProperty('--jc-g',jc.g);}
function numCol(hex){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)/255<0.38?'#ffffff':'#000000';}catch{return'#000000';}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Bench labels are narrow: first name plus surname initial ("Adam L.")
function shortName(name){const p=name.trim().split(/\s+/);return p.length>1?`${p[0]} ${p[p.length-1][0]}.`:p[0];}
// Names: fit each line to the space between columns, never wrap mid-word.
// Always the full name (Ken, 2026-10-17: a surname alone isn't clear enough):
// first name / surname on two lines, smaller and tighter when rows are close,
// or the full name on one line when there's no room for two.
const _mctx=document.createElement('canvas').getContext('2d');
function textW(t,fs){_mctx.font=`700 ${fs}px "DM Sans",sans-serif`;return _mctx.measureText(t).width;}
function fitFs(t,maxW,base,min){const w=textW(t,base);return w<=maxW?base:Math.max(min,Math.floor(base*maxW/w*2)/2);}
function pitchLayout(){
  const wr=$('pitchWrap'),W=wr.offsetWidth||300,H=wr.offsetHeight||484;
  const ys=[...new Set(POS[fmt].map(p=>dispY(p.y)))].sort((a,b)=>a-b);
  let gap=Infinity;for(let i=1;i<ys.length;i++)gap=Math.min(gap,(ys[i]-ys[i-1])*H/100);
  const jh=Math.max(26,Math.min(40,gap*0.56)),jw=jh*0.9;
  const room=gap-jh-4,two=room>=25,tight=!two&&room>=17;
  return{W,H,jw,jh,two,tight,nameW:W*0.30-10};
}
// Spread rows a little so the keeper's name stays on the pitch
function dispY(y){return 8+(y-11)*(80/81);}
function nameLines(name,L){
  const p=name.trim().split(/\s+/),first=p[0],rest=p.slice(1).join(' ');
  if(L.two&&rest) return [first,rest].map(t=>({t,fs:fitFs(t,L.nameW,11,8)}));
  if(L.tight&&rest) return [first,rest].map(t=>({t,fs:fitFs(t,L.nameW,9,7),lh:1.05}));
  const t=rest?`${first} ${rest}`:first;return [{t,fs:fitFs(t,L.nameW,10,7)}];
}

function jSVG(num,isGK,filled){

  const stripe=filled&&!isGK?`<rect x="0" y="18" width="40" height="7" fill="${jc.s}" opacity="0.85" clip-path="url(#jcp${num})"/>`:'';
  return`<svg class="jsv" viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="jcp${num}"><path d="M14 3 Q11 3 6 7 L1 14 L6 18 L8 40 L32 40 L34 18 L39 14 L34 7 Q29 3 26 3 Q23 6 20 6 Q17 6 14 3 Z"/></clipPath></defs>
    <path class="jb" d="M14 3 Q11 3 6 7 L1 14 L6 18 L8 40 L32 40 L34 18 L39 14 L34 7 Q29 3 26 3 Q23 6 20 6 Q17 6 14 3 Z" fill="${fc}" stroke="${sc}" stroke-width="1.5" ${dsh}/>

    <text x="20" y="${yn}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="800" font-family="sans-serif" fill="${nc}" paint-order="stroke fill" stroke="black" stroke-width="4" stroke-linejoin="round">${num}</text>
  </svg>`;
}

function renderPos(){
  const ov=$('posOv'),L=pitchLayout();
  ov.style.setProperty('--jw',L.jw+'px');ov.style.setProperty('--jh',L.jh+'px');
  ov.innerHTML=POS[fmt].map(pos=>{

      <div class="pc${pl?' has':''}${gk?' gk':''}" data-p="${pos.n}">

        ${pl?`<div class="rx" data-rp="${pos.n}">×</div>`:''}
      </div>
    <div class="pn" style="max-width:${L.nameW+10}px">${pl?nameLines(pl.name,L).map(l=>`<span style="font-size:${l.fs}px${l.lh?`;line-height:${l.lh}`:''}">${esc(l.t)}</span>`).join(''):''}</div>

function renderSubs(){

    const slot=$(`ss-${i}`),pid=subAssign[i],pl=pid?players.find(p=>p.id===pid):null;

}
function sJSVG(pid,sn){

}

function showPicker(posNum,el){
  const avail=players.filter(p=>!onPitch(p.id));

  document.getElementById('__pp')?.remove();
  const pop=document.createElement('div');pop.id='__pp';pop.className='ppop';

    const item=document.createElement('button');item.className='pp-item';
    const init=p.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
    item.innerHTML=`<div class="pp-av">${init}</div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>`;
    item.onclick=()=>{assign[posNum]=p.id;pop.remove();markDirty();refresh();};
    pop.appendChild(item);

  let l=r.left+r.width/2-85,t=r.bottom+6;
  if(l<6)l=6;if(l+170>window.innerWidth-6)l=window.innerWidth-176;

  pop.style.left=l+'px';pop.style.top=t+'px';
  document.body.appendChild(pop);
  setTimeout(()=>{document.addEventListener('click',function cls(e){if(!pop.contains(e.target)){pop.remove();document.removeEventListener('click',cls);}});},80);
}

// ── DRAG & DROP ──
const ghost=$('dg');
function startDrag(x,y,pid,src,srcKey){
  const p=players.find(pl=>pl.id===pid);if(!p)return;
  drag={pid,src,srcKey};ghost.textContent=p.name;ghost.classList.add('show');mv(x,y);
  document.addEventListener('mousemove',onMM);document.addEventListener('mouseup',onMU);
  document.addEventListener('touchmove',onTM,{passive:false});document.addEventListener('touchend',onTE);
}
function mv(x,y){ghost.style.left=x+'px';ghost.style.top=y+'px';}
function onMM(e){mv(e.clientX,e.clientY);hl(e.clientX,e.clientY);}
function onTM(e){e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY);hl(t.clientX,t.clientY);}
function onMU(e){endDrag(e.clientX,e.clientY);}
function onTE(e){const t=e.changedTouches[0];endDrag(t.clientX,t.clientY);}
function hl(x,y){
  document.querySelectorAll('.pc').forEach(c=>{c.classList.remove('over');const r=c.getBoundingClientRect();if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<36)c.classList.add('over');});
  document.querySelectorAll('.ss').forEach(s=>{const r=s.getBoundingClientRect();s.classList.toggle('over',x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8);});
}
function endDrag(x,y){
  if(!drag)return;
  ghost.classList.remove('show');
  document.querySelectorAll('.over').forEach(c=>c.classList.remove('over'));
  document.removeEventListener('mousemove',onMM);document.removeEventListener('mouseup',onMU);
  document.removeEventListener('touchmove',onTM);document.removeEventListener('touchend',onTE);
  const{pid,src,srcKey}=drag;drag=null;

  // Find pitch target
  let tPos=null;
  document.querySelectorAll('.pc').forEach(c=>{
    const r=c.getBoundingClientRect();
    if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<36) tPos=parseInt(c.dataset.p);
  });
  // Find sub target
  let tSub=null;
  document.querySelectorAll('.ss').forEach(s=>{
    const r=s.getBoundingClientRect();
    if(x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8) tSub=parseInt(s.dataset.sub);
  });

  if(tPos!==null){
    const displaced=assign[tPos];
    if(displaced){
      // Someone already in that pitch slot — send them back to source
      if(src==='pos')  assign[srcKey]=displaced;
      else if(src==='sub') subAssign[srcKey]=displaced;
      // If dragged from strip, displaced goes to first empty sub slot
      else if(src==='strip'){
        const emptySub=[1,2,3,4,5].find(n=>!subAssign[n]);
        if(emptySub) subAssign[emptySub]=displaced;
      }
    } else {
      // Empty pitch slot — just vacate source
      if(src==='pos')  delete assign[srcKey];
      else if(src==='sub') delete subAssign[srcKey];
    }
    // Remove dragged player from any sub slot they were in
    Object.keys(subAssign).forEach(k=>{ if(subAssign[k]===pid) delete subAssign[k]; });
    assign[tPos]=pid;

  } else if(tSub!==null){
    const displaced=subAssign[tSub];
    if(displaced){
      // Sub slot occupied — send displaced player back to source
      if(src==='pos')       assign[srcKey]=displaced;    // swap: pitch player ↔ sub
      else if(src==='sub')  subAssign[srcKey]=displaced; // swap between sub slots
      else if(src==='strip'){
        const emptySub=[1,2,3,4,5].find(n=>n!==tSub&&!subAssign[n]);
        if(emptySub) subAssign[emptySub]=displaced;
      }
    } else {
      // Empty sub slot — vacate source
      if(src==='pos')  delete assign[srcKey];
      else if(src==='sub') delete subAssign[srcKey];
    }
    // Clean up dragged player from any other slot
    Object.keys(subAssign).forEach(k=>{ if(parseInt(k)!==tSub&&subAssign[k]===pid) delete subAssign[k]; });
    Object.keys(assign).forEach(k=>{ if(assign[k]===pid) delete assign[k]; });
    subAssign[tSub]=pid;

  } else {
    // Dropped outside — remove from position if dragged from pitch
    if(src==='pos'){
      const pw=$('pitchWrap').getBoundingClientRect();
      if(!(x>=pw.left&&x<=pw.right&&y>=pw.top&&y<=pw.bottom)) delete assign[srcKey];
    }
  }
  markDirty();
  refresh();
}

// ── SAVE / SHARE LINEUP ──
// Saves the line-up as a new version (the newest one is what loads next time).
// Only runs from the Save / Share button. quiet=true skips the toast.
let _saving=null;
async function persistLineup(quiet=false){
  if(_saving){ await _saving; }
  const hasPlayers = Object.keys(assign).length > 0 || Object.keys(subAssign).length > 0;
  if(!hasPlayers || !dirty) return true; // nothing assigned, or no changes since last save
  _saving=(async()=>{
    // Snapshot now so changes made while this request is in flight trigger another save
    const snapAssign={...assign}, snapSubs={...subAssign}, snapFmt=fmt;
    dirty=false;
    try{
      const lResp = await fetch(`${SB}/rest/v1/lineup`,{
        method:'POST',
        headers:{ ...getH(),'Content-Type':'application/json','Prefer':'return=representation' },
        body: JSON.stringify({ event_id:eventId, team_id:teamId, squad_id:squadId, format:snapFmt, created_by:jwtUserId(userToken) })
      });
      if(!lResp.ok) throw new Error(await lResp.text());
      const [lineup] = await lResp.json();

      const details=[];
      Object.entries(snapAssign).forEach(([pos,mid])=>{
        const posNum=parseInt(pos);
        const label=POS[snapFmt].find(p=>p.n===posNum)?.l||'';
        details.push({lineup_id:lineup.lineup_id,member_id:mid,position_num:posNum,position_label:label,is_sub:false});
      });
      Object.entries(snapSubs).forEach(([slot,mid])=>
        details.push({lineup_id:lineup.lineup_id,member_id:mid,position_num:parseInt(slot),position_label:'SUB',is_sub:true}));

      if(details.length){
        const dResp = await fetch(`${SB}/rest/v1/lineup_details`,{
          method:'POST',
          headers:{ ...getH(),'Content-Type':'application/json','Prefer':'return=minimal' },
          body: JSON.stringify(details)
        });
        if(!dResp.ok) throw new Error(await dResp.text());
      }
      if(!quiet) toast('Lineup saved!');
      return true;
    }catch(e){
      console.error('Save failed:',e);
      dirty=true;
      if(!quiet) toast('Save failed — lineup image still generated');
      return false;
    }
  })();
  const ok=await _saving;
  _saving=null;
  return ok;
}

function wrapText(ctx,text,maxW){
  const words=text.split(' '),lines=[];let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}
    else line=t;
  }
  if(line)lines.push(line);
  return lines;
}
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function drawCanvasJersey(ctx,cx,cy,num,isGK,filled){
  const JW=46,JH=JW*44/40;
  ctx.save();
  ctx.translate(cx-JW/2,cy-JH/2);
  const sc=JW/40;ctx.scale(sc,sc);
  const path=new Path2D('M14 3 Q11 3 6 7 L1 14 L6 18 L8 40 L32 40 L34 18 L39 14 L34 7 Q29 3 26 3 Q23 6 20 6 Q17 6 14 3 Z');
  if(filled){
    ctx.fillStyle=isGK?jc.g:jc.p;ctx.fill(path);
    if(!isGK){ctx.save();ctx.clip(path);ctx.fillStyle=jc.s;ctx.globalAlpha=0.85;ctx.fillRect(0,18,40,7);ctx.restore();}
  }else{ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fill(path);}
  ctx.strokeStyle=filled?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.55)';
  ctx.lineWidth=1.5/sc;
  if(!filled)ctx.setLineDash([3/sc,2/sc]);
  ctx.stroke(path);ctx.setLineDash([]);
  const nc=filled?numCol(isGK?jc.g:jc.p):'rgba(255,255,255,0.9)';
  const fs=filled?14:11,yn=filled&&!isGK?21:26;
  ctx.lineWidth=4/sc;ctx.strokeStyle='rgba(0,0,0,0.8)';ctx.lineJoin='round';
  ctx.font=`800 ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeText(String(num),20,yn);
  ctx.fillStyle=nc;ctx.fillText(String(num),20,yn);
  ctx.restore();
}
function generateLineupCanvas(){
  const SC=3,PW=380,PH=Math.round(PW*145/90),PAD=12,HDR=66;
  const JW=44,JH=JW*44/40,NAMEW=PW*0.30-8;
  const subEntries=Object.entries(subAssign).filter(([,m])=>m).sort((a,b)=>+a[0]-+b[0]);
  const subRows=Math.ceil(subEntries.length/2),SUB_H=subEntries.length?28+subRows*26:0;
  const TW=PW+PAD*2,TH=HDR+PH+PAD*2+SUB_H+26;
  const canvas=document.createElement('canvas');
  canvas.width=TW*SC;canvas.height=TH*SC;
  const ctx=canvas.getContext('2d');ctx.scale(SC,SC);
  ctx.fillStyle='#14181b';ctx.fillRect(0,0,TW,TH);
  // Header: club colour bar, team, event
  ctx.fillStyle=jc.p;ctx.fillRect(0,0,TW,5);
  ctx.fillStyle=jc.s;ctx.fillRect(0,5,TW,2);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#f1f4f8';ctx.font='26px "Bebas Neue",sans-serif';
  ctx.fillText((teamName||'Line-up').toUpperCase(),PAD,40);
  ctx.fillStyle='#a1a1a2';ctx.font='500 12px "DM Sans",sans-serif';
  ctx.fillText(imageSub,PAD,58);
  const PY=HDR;
  // Pitch: soft mowing stripes
  const NS=10,SH=PH/NS;
  ctx.save();rr(ctx,PAD,PY,PW,PH,10);ctx.clip();
  for(let i=0;i<NS;i++){ctx.fillStyle=i%2?'#3d8c3a':'#357e33';ctx.fillRect(PAD,PY+i*SH,PW,SH+1);}
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1.5;
  const SQW=PW*0.149,SQX=PAD+(PW-SQW)/2,SQH=PH*0.033;
  ctx.strokeRect(SQX,PY,SQW,SQH);ctx.strokeRect(SQX,PY+PH-SQH,SQW,SQH);
  const LRW=PW*0.217,LRX=PAD+(PW-LRW)/2,LRH=PH*0.095;
  ctx.strokeRect(LRX,PY,LRW,LRH);ctx.strokeRect(LRX,PY+PH-LRH,LRW,LRH);
  ctx.strokeStyle='rgba(255,255,255,0.45)';
  [0.146,0.328,0.474,0.526,0.672,0.854].forEach(yp=>{ctx.beginPath();ctx.moveTo(PAD,PY+yp*PH);ctx.lineTo(PAD+PW,PY+yp*PH);ctx.stroke();});
  ctx.beginPath();ctx.arc(PAD+PW/2,PY+PH*0.146,PW*0.149,0,Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(PAD+PW/2,PY+PH*0.854,PW*0.149,Math.PI,2*Math.PI);ctx.stroke();
  ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.beginPath();ctx.moveTo(PAD,PY+PH*0.5);ctx.lineTo(PAD+PW,PY+PH*0.5);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;rr(ctx,PAD,PY,PW,PH,10);ctx.stroke();
  // Players: jersey on the spot, first name / surname under it
  POS[fmt].forEach(pos=>{
    const pid=assign[pos.n],pl=pid?players.find(p=>p.id===pid):null;
    const cx=PAD+pos.x/100*PW,cy=PY+dispY(pos.y)/100*PH;
    drawCanvasJersey(ctx,cx,cy,pos.n,pos.n===1,!!pl);
    if(!pl) return;
    const parts=pl.name.trim().split(/\s+/),lines=parts.length>1?[parts[0],parts.slice(1).join(' ')]:[parts[0]];
    const fit=lines.map(t=>{let fs=12;ctx.font=`700 ${fs}px "DM Sans",sans-serif`;const w=ctx.measureText(t).width;if(w>NAMEW)fs=Math.max(8.5,12*NAMEW/w);return{t,fs};});
    const widths=fit.map(l=>{ctx.font=`700 ${l.fs}px "DM Sans",sans-serif`;return Math.min(ctx.measureText(l.t).width,NAMEW);});
    const pillW=Math.max(...widths)+12,pillH=fit.length*14+5;
    const ly=cy+JH/2+2;
    ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,cx-pillW/2,ly,pillW,pillH,5);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='top';
    fit.forEach((l,i)=>{ctx.font=`${i?600:700} ${l.fs}px "DM Sans",sans-serif`;ctx.fillText(l.t,cx,ly+3+i*14,NAMEW);});
  });
  // Subs: numbered, two columns
  if(subEntries.length){
    let y=PY+PH+PAD+6;
    ctx.fillStyle='#87c232';ctx.font='700 11px "DM Sans",sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('SUBSTITUTES',PAD,y);y+=22;
    const colW=PW/2;
    subEntries.forEach(([slot,m],i)=>{
      const pl=players.find(p=>p.id===m);if(!pl)return;
      const x=PAD+(i%2)*colW,yy=y+Math.floor(i/2)*26;
      const num=String(POS[fmt].length+parseInt(slot));
      ctx.fillStyle=jc.p;rr(ctx,x,yy,24,18,4);ctx.fill();
      ctx.fillStyle=numCol(jc.p);ctx.font='800 11px "DM Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(num,x+12,yy+9.5);
      ctx.fillStyle='#f1f4f8';ctx.font='500 13px "DM Sans",sans-serif';ctx.textAlign='left';
      ctx.fillText(pl.name,x+32,yy+9.5,colW-40);
    });
  }
  ctx.font='12px "Bebas Neue",sans-serif';ctx.fillStyle='rgba(135,194,50,0.7)';ctx.letterSpacing='1px';
  ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('COACHSMART',PAD+PW,TH-6);
  return canvas;
}

async function generateTeamsheet(){
  load(true,'Fetching data…');
  try{
    // ── 1. Club + team details ──
    const teamRow = await sb(`teams?select=team_name,clubs(club_name_translated,club_name,crest,chairperson,secretary,sport_id)&team_id=eq.${teamId}`);
    const club        = teamRow[0]?.clubs || {};
    const clubIrish   = club.club_name_translated || club.club_name || teamName;
    const crestUrl    = club.crest || '';
    const chairperson = club.chairperson || '';
    const secretary   = club.secretary  || '';

    // Fetch GAA logo from sports table
    let gaaLogoUrl = '';
    try{
      const sportRows = await sb(`sport?select=sport_crest&sport_name=eq.GAA`);
      gaaLogoUrl = sportRows[0]?.sport_crest || '';
    }catch(e){ console.warn('GAA logo fetch failed',e); }

    // Pre-fetch both images as base64 so they can be cleaned up and embedded
    async function toBase64(url){
      if(!url) return '';
      try{
        const r = await fetch(url);
        if(!r.ok) return '';
        const blob = await r.blob();
        return await new Promise(res=>{
          const fr = new FileReader();
          fr.onload = ()=> res(fr.result.split(',')[1]); // strip data:...;base64,
          fr.readAsDataURL(blob);
        });
      }catch(e){ return ''; }
    }

    load(true,'Loading images…');
    const [crestB64, gaaB64] = await Promise.all([
      toBase64(crestUrl),
      toBase64(gaaLogoUrl)
    ]);

    // ── 2. Player member details — include name_translated ──
    const playerIds = players.map(p=>p.id);
    const memRows   = playerIds.length
      ? await sb(`members?select=member_id,first_name,last_name,date_of_birth,membership_num,name_translated&member_id=in.(${playerIds.join(',')})`)
      : [];
    const memMap = {};
    memRows.forEach(m=>{ memMap[m.member_id]=m; });

    // ── 3. Managers — use latest match_squad_details for this event (same as players) ──
    // Get the latest match_squad_id for this event
    const msRows = await sb(`match_squads?select=match_squad_id&event_id=eq.${eventId}&order=match_squad_id.desc&limit=1`);
    let mgrList = [];

    if(msRows.length){
      const latestMsId = msRows[0].match_squad_id;

      // Get members from match_squad_details for this squad (or all squads)
      let coachDetQ;
      if(squadId){
        coachDetQ = `match_squad_details?select=id,member_id&match_squad_id=eq.${latestMsId}&squad_id=eq.${squadId}&order=id.desc`;
      } else {
        coachDetQ = `match_squad_details?select=id,member_id&match_squad_id=eq.${latestMsId}&order=id.desc`;
      }
      const coachDetRows = await sb(coachDetQ);

      // Deduplicate — latest entry per member (same as player logic)
      const latestByMember = {};
      coachDetRows.forEach(r=>{ if(!latestByMember[r.member_id]) latestByMember[r.member_id]=r; });
      const squadMemberIds = Object.keys(latestByMember).map(Number);

      if(squadMemberIds.length){
        // Filter to role_level 25 or 30
        const roleRows = await sb(
          `member_team_link?select=member_id,member_team_role_link(roles(role_level))&team_id=eq.${teamId}&member_id=in.(${squadMemberIds.join(',')})`
        );
        const coachIds = new Set();
        roleRows.forEach(r=>{
          if((r.member_team_role_link||[]).some(x=>x.roles?.role_level===25||x.roles?.role_level===30))
            coachIds.add(r.member_id);
        });

        if(coachIds.size){
          // Apply attendance filter — latest response=3 for this event
          const coachArr = [...coachIds];
          const attRows = await sb(
            `event_attendance?select=member_id,response_id,created_at&event_id=eq.${eventId}&member_id=in.(${coachArr.join(',')})&order=member_id,created_at.desc`
          );
          const latestAtt = {};
          attRows.forEach(r=>{ if(!latestAtt[r.member_id]) latestAtt[r.member_id]=r; });
          const attendingCoachIds = Object.values(latestAtt)
            .filter(r=>r.response_id===3).map(r=>r.member_id);

          if(attendingCoachIds.length){
            const coachMemRows = await sb(
              `members?select=member_id,first_name,last_name,membership_num,name_translated&member_id=in.(${attendingCoachIds.join(',')})&order=last_name,first_name`
            );
            mgrList = coachMemRows.map(m=>({
              id:              m.member_id,
              name:            `${m.first_name} ${m.last_name}`.trim(),
              mem:             m.membership_num || 'blank',
              name_translated: m.name_translated || ''
            }));
          }
        }
      }
    }

    // ── 4. Translation — use stored name_translated; Gemini for any missing ──
    // Collect all members missing a translation
    const missing = [];
    playerIds.forEach(id=>{
      const m = memMap[id];
      if(m && !m.name_translated){
        missing.push({ id: m.member_id, name: `${m.first_name} ${m.last_name}`.trim() });
      }
    });
    mgrList.forEach(m=>{
      if(!m.name_translated) missing.push({ id: m.id, name: m.name });
    });

    // Deduplicate by id
    const missingUniq = [...new Map(missing.map(x=>[x.id,x])).values()];

    let translationMap = {};
    if(missingUniq.length){
      load(true,'Translating names…');
      translationMap = await translateWithClaude(missingUniq.map(x=>x.name));

      // Write translations back to Supabase in parallel (fire and forget)
      missingUniq.forEach(({id, name})=>{
        const translated = translationMap[name];
        if(translated && translated !== name){
          fetch(`${SB}/rest/v1/members?member_id=eq.${id}`,{
            method:'PATCH',
            headers:{ ...getH(), 'Content-Type':'application/json', 'Prefer':'return=minimal' },
            body: JSON.stringify({ name_translated: translated })
          }).catch(e=>console.warn('Write-back failed for',name,e));
        }
      });
    }

    // Build final irish name map — DB value takes priority, translated as fallback
    function irishName(engName, storedTranslation){
      return storedTranslation || translationMap[engName] || engName;
    }

    // ── 5. Build structured data ──
    const playerData = players.map(p=>{
      const m   = memMap[p.id] || {};
      const dob = m.date_of_birth
        ? new Date(m.date_of_birth).toLocaleDateString('en-IE',{day:'2-digit',month:'2-digit',year:'numeric'})
        : 'blank';
      return {
        irish:   irishName(p.name, m.name_translated),
        english: p.name,
        dob,
        mem:     m.membership_num || 'blank'
      };
    });

    const mgrData = mgrList.map(m=>({
      irish:   irishName(m.name, m.name_translated),
      english: m.name,
      mem:     m.mem
    }));

    // ── 6. Build the PDF and preview ──
    load(true,'Generating PDF…');
    await generatePDF({
      clubIrish, crestB64, gaaB64, chairperson, secretary,
      teamName, players: playerData, managers: mgrData
    });

  }catch(e){
    load(false);
    throw e;
  }
}

// ── TRANSLATION via edge function ──
async function translateWithClaude(names){
  if(!names.length) return {};
  try{
    const resp = await fetch(`${SB}/functions/v1/translate-names`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': KEY,
        'Authorization': `Bearer ${userToken || KEY}`
      },
      body: JSON.stringify({ names })
    });
    if(!resp.ok){
      console.error('Translation API error:', resp.status, await resp.text());
      const fb={};names.forEach(n=>fb[n]=n);return fb;
    }
    return await resp.json();
  }catch(e){
    console.error('Translation failed:',e);
    const fb={};names.forEach(n=>fb[n]=n);return fb;
  }
}

// ── TEAMSHEET PDF (jsPDF) ──
// Same A4 layout the ReportLab version drew, now built in the browser in a
// few milliseconds. The preview is drawn straight onto canvases with the
// same layout code, so there's no PDF viewer to load either.
// ── TEAMSHEET LAYOUT ──
// One layout, drawn by two "pens": jsPDF for the PDF and a canvas for the
// on-screen preview. Points on A4, measured from the bottom left like the
// original ReportLab version, so every position is unchanged.
const TS_W = 595.2756, TS_H = 841.8898, MM = 72 / 25.4;
function drawTeamsheet(pen, d){
  const W=TS_W, H=TS_H, mm=MM;
  const ML=14*mm, MR=14*mm, MT=10*mm, MB=10*mm, GAP=8*mm;
  const COLW=(W-ML-MR-GAP)/2, LX=ML, RX=ML+COLW+GAP;
  const TEAL='#004A67', DETAIL='#7E8291', LGREY='#cccccc', DGREY='#333333', BLACK='#000000';
  const B='bold', N='normal';
  let y = H - MT;

  // Logos, vertically centred in the logo row
  const logo = 28*mm, midY = y - logo/2;
  if (d.crest) pen.image(d.crest, LX, y-logo, logo, logo);
  else { pen.stroke(LGREY, 0.5); pen.rect(LX, y-logo, logo, logo); }
  const gw=26*mm, gh=18*mm;
  if (d.gaa) pen.image(d.gaa, W-MR-gw, midY-gh/2, gw, gh);
  else { pen.stroke(LGREY, 0.5); pen.rect(W-MR-gw, midY-gh/2, gw, gh); }
  pen.font(B, 25); pen.fill(TEAL); pen.text(d.club_name_irish, W/2, midY, 'center');
  y -= logo + 4*mm;

  // Meta fields
  const ROW_H = 11*mm;
  const meta = (x, top, value, label) => {
    if (value) { pen.font(B, 11); pen.fill(TEAL); pen.text(value, x, top-4*mm); }
    pen.stroke(TEAL, 0.5); pen.line(x, top-6*mm, x+COLW, top-6*mm);
    pen.font(N, 7); pen.fill(DETAIL); pen.text(label, x, top-8.5*mm);
  };
  meta(LX, y, d.chairperson, '(Cathaoirleach)');
  meta(RX, y, d.secretary, '(Rúnaí)');
  y -= ROW_H;
  meta(LX, y, d.team_name, '(Foireann)');
  meta(RX, y, '', '(Freasúra)');
  y -= ROW_H;
  meta(LX, y, '', '(Comórtas)');
  meta(RX, y, '', '(Dáta)');
  y -= ROW_H + 2*mm;

  // Imreoirí
  pen.font(B, 16); pen.fill(TEAL); pen.text('Imreoirí', W/2, y-5*mm, 'center');
  y -= 9*mm;
  const CB=3.8*mm, r=0.8*mm;
  pen.stroke(DGREY, 0.9); pen.rrect(LX, y-CB, CB, CB, r);
  // The tick in the key box
  pen.stroke(BLACK, 1.1);
  pen.line(LX+0.8*mm, y-CB+1.9*mm, LX+1.6*mm, y-CB+0.9*mm);
  pen.line(LX+1.6*mm, y-CB+0.9*mm, LX+3.1*mm, y-CB+3.0*mm);
  pen.font(N, 8.5); pen.fill(DGREY); pen.text('= ag tosú (Starting)', LX+CB+2.5*mm, y-2.8*mm);
  y -= 7*mm;

  const ROW_P=8.5*mm, LINE_W=7*mm, G2=2*mm, NAME_Y=4*mm, DTL_Y=7.2*mm;
  const TX = CB + G2 + LINE_W + G2;
  const PAGE_BOT = MB + 20*mm;
  const newPage = () => { pen.newPage(); return H - MT; };
  const player = (cx, cy, p) => {
    pen.stroke(DGREY, 0.9); pen.rrect(cx, cy-CB-1.2*mm, CB, CB, r);
    const jx = cx+CB+G2;
    pen.stroke(TEAL, 0.6); pen.line(jx, cy-CB-0.7*mm, jx+LINE_W, cy-CB-0.7*mm);
    pen.font(N, 10.5); pen.fill(TEAL); pen.text(p.irish, cx+TX, cy-NAME_Y);
    pen.font(N, 8); pen.fill(DETAIL); pen.text(`${p.dob}   ${p.mem}   ${p.english}`, cx+TX, cy-DTL_Y);
  };
  const players = d.players || [];
  const half = Math.ceil(players.length/2), left = players.slice(0, half), right = players.slice(half);
  const rows = Math.max(left.length, right.length);
  for (let i = 0; i < rows; ) {
    if (y - ROW_P < PAGE_BOT) y = newPage();
    while (i < rows && y - ROW_P >= PAGE_BOT) {
      if (left[i]) player(LX, y, left[i]);
      if (right[i]) player(RX, y, right[i]);
      y -= ROW_P; i++;
    }
  }
  y -= 5*mm;

  // Bainisteoirí
  if (y - 16*mm < PAGE_BOT) y = newPage();
  pen.font(B, 16); pen.fill(TEAL); pen.text('Bainisteoirí', W/2, y-4*mm, 'center');
  y -= 8*mm;
  const ROW_M = 8*mm, mgrs = d.managers || [];
  const mh = Math.ceil(mgrs.length/2), ml = mgrs.slice(0, mh), mr = mgrs.slice(mh);
  const mrows = mgrs.length ? Math.max(ml.length, mr.length) : 0;
  for (let i = 0; i < mrows; ) {
    if (y - ROW_M < PAGE_BOT) y = newPage();
    while (i < mrows && y - ROW_M >= PAGE_BOT) {
      for (const [m, cx] of [[ml[i], LX], [mr[i], RX]]) {
        if (!m) continue;
        pen.font(N, 10.5); pen.fill(TEAL); pen.text(m.irish, cx+TX, y-3.5*mm);
        pen.font(N, 8); pen.fill(DETAIL); pen.text(`${m.mem}   ${m.english}`, cx+TX, y-6.8*mm);
      }
      y -= ROW_M; i++;
    }
  }
  y -= 8*mm;

  // Signatures
  pen.stroke(TEAL, 0.6); pen.line(LX, y, LX+COLW, y); pen.line(RX, y, RX+COLW, y);
  pen.font(N, 7.5); pen.fill(DETAIL);
  pen.text('(Sínithe ag an Rúnaí)', LX, y-4.5*mm);
  pen.text('(Sínithe ag an Réiteoir)', RX, y-4.5*mm);

  // Footer
  const t = new Date(), p2 = n => String(n).padStart(2, '0');
  const now = `${p2(t.getDate())}-${p2(t.getMonth()+1)}-${t.getFullYear()} ${p2(t.getHours())}:${p2(t.getMinutes())}`;
  pen.font(N, 6.5); pen.fill(LGREY);
  pen.text('= neamhchláraithe', LX, MB+2*mm);
  pen.text(`Cruthaithe i gCoachSmart ag ${now} (1/1)`, W-MR, MB+2*mm, 'right');
}

// Fit an image inside a box, centred, keeping its shape (as ReportLab did)
function tsFit(img, x, y, w, h){
  const s = Math.min(w / img.width, h / img.height), iw = img.width * s, ih = img.height * s;
  return [x + (w - iw) / 2, y + (h - ih) / 2, iw, ih];
}

// PDF pen (jsPDF, points, top-left origin so y is flipped)
function tsPdfPen(doc){
  const Y = y => TS_H - y;
  return {
    font(w, size){ doc.setFont('helvetica', w); doc.setFontSize(size); },
    fill(c){ doc.setTextColor(c); },
    stroke(c, w){ doc.setDrawColor(c); doc.setLineWidth(w); },
    text(s, x, y, align){ doc.text(String(s ?? ''), x, Y(y), align ? { align } : undefined); },
    line(x1, y1, x2, y2){ doc.line(x1, Y(y1), x2, Y(y2)); },
    rect(x, y, w, h){ doc.rect(x, Y(y+h), w, h, 'S'); },
    rrect(x, y, w, h, r){ doc.roundedRect(x, Y(y+h), w, h, r, r, 'S'); },
    image(img, x, y, w, h){ const [ix, iy, iw, ih] = tsFit(img, x, y, w, h); doc.addImage(img.src, 'PNG', ix, Y(iy+ih), iw, ih); },
    newPage(){ doc.addPage('a4', 'p'); },
  };
}

// Preview pen (canvas). Draws one canvas per page.
function tsCanvasPen(makeCanvas, width){
  const k = width / TS_W;
  let ctx;
  const page = () => { const c = makeCanvas(); ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.lineCap = 'butt'; };
  page();
  const X = x => x * k, Y = y => (TS_H - y) * k;
  return {
    font(w, size){ ctx.font = `${w === 'bold' ? 700 : 400} ${size * k}px Helvetica, Arial, sans-serif`; },
    fill(c){ ctx.fillStyle = c; },
    stroke(c, w){ ctx.strokeStyle = c; ctx.lineWidth = Math.max(0.5, w * k); },
    text(s, x, y, align){ ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(String(s ?? ''), X(x), Y(y)); },
    line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke(); },
    rect(x, y, w, h){ ctx.strokeRect(X(x), Y(y+h), w*k, h*k); },
    rrect(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(X(x), Y(y+h), w*k, h*k, r*k) : ctx.rect(X(x), Y(y+h), w*k, h*k); ctx.stroke(); },
    image(img, x, y, w, h){ const [ix, iy, iw, ih] = tsFit(img, x, y, w, h); ctx.drawImage(img, X(ix), Y(iy+ih), iw*k, ih*k); },
    newPage(){ page(); },
  };
}

let _jspdf = null;
function loadJsPDF(){
  if (window.jspdf) return Promise.resolve();
  if (_jspdf) return _jspdf;
  _jspdf = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
    s.onload = res; s.onerror = () => { _jspdf = null; rej(new Error('Could not load the PDF builder')); };
    document.head.appendChild(s);
  });
  return _jspdf;
}

// Base64 logo → PNG Image with its near-white background made transparent
function tsLogo(b64){
  if (!b64) return Promise.resolve(null);
  return new Promise(res => {
    const src = new Image();
    src.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = src.naturalWidth; c.height = src.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(src, 0, 0);
        const px = ctx.getImageData(0, 0, c.width, c.height), a = px.data;
        for (let i = 0; i < a.length; i += 4) if (a[i] > 230 && a[i+1] > 230 && a[i+2] > 230) a[i+3] = 0;
        ctx.putImageData(px, 0, 0);
        const out = new Image();
        out.onload = () => res(out); out.onerror = () => res(null);
        out.src = c.toDataURL('image/png');
      } catch (e) { res(null); }
    };
    src.onerror = () => res(null);
    src.src = 'data:image;base64,' + b64;
  });
}

let _pdfDoc = null, _pdfFname = null;

async function generatePDF(data){
  load(true, 'Building teamsheet…');
  const [, crest, gaa] = await Promise.all([loadJsPDF(), tsLogo(data.crestB64), tsLogo(data.gaaB64)]);
  const d = {
    club_name_irish: data.clubIrish, chairperson: data.chairperson, secretary: data.secretary,
    team_name: data.teamName, crest, gaa, players: data.players, managers: data.managers,
  };

  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', orientation: 'p', compress: true });
  drawTeamsheet(tsPdfPen(doc), d);
  _pdfDoc = doc;
  _pdfFname = `CoachSmart_${(data.teamName || 'Team').replace(/[^\w-]+/g, '_')}_teamsheet.pdf`;

  // Preview: one canvas per page, sharp on retina screens
  const pagesEl = $('pdfPages');
  pagesEl.innerHTML = '';
  const cssW = Math.min(window.innerWidth - 32, 600), dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pxW = Math.round(cssW * dpr), pxH = Math.round(pxW * TS_H / TS_W);
  drawTeamsheet(tsCanvasPen(() => {
    const c = document.createElement('canvas');
    c.width = pxW; c.height = pxH; c.style.width = cssW + 'px';
    pagesEl.appendChild(c);
    return c;
  }, pxW), d);

  load(false);
  $('pdfPages').scrollTop = 0;
  $('pdfOverlay').classList.add('show');
}

// ── TEAMSHEET OVERLAY ──
$('pdfShareBtn').addEventListener('click', async () => {
  if (!_pdfDoc) return;
  // In the app: native share sheet (same as session plans and game cards)
  if (window.FlutterBridge) {
    const b64 = _pdfDoc.output('datauristring').split(',')[1];
    window.FlutterBridge.postMessage('sharePdf:' + _pdfFname + ':' + b64);
    return;
  }
  const blob = _pdfDoc.output('blob');
  const file = new File([blob], _pdfFname, { type: 'application/pdf' });
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (_) {}
  if (canShare) {
    try { await navigator.share({ files: [file], title: 'Teamsheet' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = _pdfFname;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});

function closePdfOverlay(){
  $('pdfOverlay').classList.remove('show');
  $('pdfPages').innerHTML = '';
  _pdfDoc = null; _pdfFname = null;
}

// ── LOAD MOST RECENT LINEUP ──
async function loadExistingLineup() {
  try {
    const squadFilter = squadId ? `&squad_id=eq.${squadId}` : `&squad_id=is.null`;
    const rows = await sb(`lineup?event_id=eq.${eventId}&team_id=eq.${teamId}${squadFilter}&order=lineup_id.desc&limit=1`);
    if (!rows.length) return;

    const saved = rows[0];
    const details = await sb(`lineup_details?lineup_id=eq.${saved.lineup_id}`);
    if (!details.length) return;

    // Restore format
    const savedFmt = saved.format || 15;
    if (savedFmt !== fmt) {
      fmt = savedFmt;
      document.querySelectorAll('.fb').forEach(b => b.classList.toggle('on', parseInt(b.dataset.f) === fmt));
    }

    // Restore positions
    assign = {}; subAssign = {};
    details.forEach(d => {
      if (d.is_sub) subAssign[d.position_num] = d.member_id;
      else          assign[d.position_num]     = d.member_id;
    });

    // The role-filter in initFromParams queries member_team_link which is RLS-restricted to
    // the authenticated user's own rows — so players[] may be missing most of the team.
    // Fetch saved members that aren't yet in players[], but only those belonging to the
    // current squad (currentSquadMemberIds) to prevent cross-squad contamination from stale
    // lineup records saved before the squad filter was in place.
    const knownIds = new Set(players.map(p => p.id));
    const missingIds = details
      .map(d => d.member_id)
      .filter(id => !knownIds.has(id) && currentSquadMemberIds.has(id));
    if (missingIds.length > 0) {
      const missingRows = await sb(`members?select=member_id,first_name,last_name&member_id=in.(${missingIds.join(',')})`);
      missingRows.forEach(m => {
        players.push({ id: m.member_id, name: `${m.first_name} ${m.last_name}`.trim() });
      });
      players.sort((a, b) => a.name.localeCompare(b.name));
    }

    // Purge any saved positions that reference members outside the current player pool.
    // This handles stale cross-squad data from saves made before the squad filter existed.
    const validIds = new Set(players.map(p => p.id));
    Object.keys(assign).forEach(pos => { if (!validIds.has(assign[pos])) delete assign[pos]; });
    Object.keys(subAssign).forEach(slot => { if (!validIds.has(subAssign[slot])) delete subAssign[slot]; });

    dirty = false;
    refresh();
    updateShareBtn();
    toast('Previous lineup loaded');
  } catch(e) {
    console.error('Failed to load existing lineup:', e);
  }
}

// ── INIT FROM URL PARAMS (always required — embedded from FlutterFlow) ──
async function initFromParams(){
  const params = new URLSearchParams(window.location.search);
  const pToken  = params.get('token');
  const pTeamId  = params.get('teamId');
  const pEventId = params.get('eventId');
  const pSquadId = params.get('squadId'); // optional — omit for all squads

  if(!pToken || !pTeamId || !pEventId){
    $('pitchScreen').classList.remove('active');
    $('authError').classList.add('active');
    return;
  }

  userToken = pToken;
  load(true,'Loading squad…');

  try{
    // Set IDs
    teamId  = parseInt(pTeamId);
    eventId = parseInt(pEventId);
    squadId = (pSquadId && pSquadId !== 'all') ? parseInt(pSquadId) : null;

    // Team name, teamsheet flag and club colours in one call
    let teamRow = [];
    try{
      teamRow = await sb(`teams?select=team_name,teamsheet,clubs(primary_colour,secondary_colour,third_colour)&team_id=eq.${teamId}`);
    }catch(e){
      console.warn('team details with club colours failed, retrying without', e);
      teamRow = await sb(`teams?select=team_name,teamsheet&team_id=eq.${teamId}`);
    }
    teamName = teamRow[0]?.team_name || '';
    // Teamsheet button only for teams with teams.teamsheet switched on
    if(teamRow[0]?.teamsheet === true) $('tsBtn').style.display='';
    applyClubColours(teamRow[0]?.clubs);

    // Fetch eventLabel
    const evtRow = await sb(`events?select=event_date_time,opposition,event_codes(event_code),event_types(event_type)&event_id=eq.${eventId}`);
    if(evtRow.length){
      const e = evtRow[0];
      const ds = new Date(e.event_date_time).toLocaleDateString('en-IE',{day:'2-digit',month:'short',year:'numeric'});
      const opp = e.opposition ? ` vs ${e.opposition.trim()}` : '';
      eventLabel = `${ds} · ${e.event_codes?.event_code||''} ${e.event_types?.event_type||''}${opp}`.trim();
      // Shared image header: no opposition (Ken, 2026-10-16)
      imageSub = [`${e.event_codes?.event_code||''} ${e.event_types?.event_type||''}`.trim(), ds].filter(Boolean).join('  ·  ');
    }

    // Fetch squadName
    if(squadId){
      const sqRow = await sb(`squads?select=squad_name&squad_id=eq.${squadId}`);
      squadName = sqRow[0]?.squad_name || '';
    } else {
      squadName = 'All Squads';
    }

    // Get latest match_squad_id for this event
    const msRows = await sb(`match_squads?select=match_squad_id&event_id=eq.${eventId}&order=match_squad_id.desc&limit=1`);
    if(!msRows.length){ load(false); toast('No match squad set up for this event'); return; }
    const msId = msRows[0].match_squad_id;

    // Get players from match_squad_details
    const detQ = squadId
      ? `match_squad_details?select=id,member_id&match_squad_id=eq.${msId}&squad_id=eq.${squadId}&order=id.desc`
      : `match_squad_details?select=id,member_id&match_squad_id=eq.${msId}&order=id.desc`;
    const detRows = await sb(detQ);
    const latestByMember = {};
    detRows.forEach(r=>{ if(!latestByMember[r.member_id]) latestByMember[r.member_id]=r; });
    const squadMemberIds = Object.keys(latestByMember).map(Number);
    if(!squadMemberIds.length){ load(false); toast('No players found in match squad'); return; }
    currentSquadMemberIds = new Set(squadMemberIds);

    // Attendance filter
    const attRows = await sb(`event_attendance?select=member_id,response_id,created_at&event_id=eq.${eventId}&member_id=in.(${squadMemberIds.join(',')})&order=member_id,created_at.desc`);
    const latestAtt = {};
    attRows.forEach(r=>{ if(!latestAtt[r.member_id]) latestAtt[r.member_id]=r; });
    const attendingIds = Object.values(latestAtt).filter(r=>r.response_id===3).map(r=>r.member_id);
    if(!attendingIds.length){ load(false); toast('No players have accepted for this event'); return; }

    // Role filter — players only (role_level=10)
    const roleRows = await sb(`member_team_link?select=member_id,member_team_role_link(roles(role_level))&team_id=eq.${teamId}&member_id=in.(${attendingIds.join(',')})`);
    const playerIdSet = new Set();
    roleRows.forEach(r=>{ if((r.member_team_role_link||[]).some(x=>x.roles?.role_level===10)) playerIdSet.add(r.member_id); });
    const eligibleIds = attendingIds.filter(id=>playerIdSet.has(id));
    if(!eligibleIds.length){ load(false); toast('No eligible players found'); return; }

    // Fetch names
    const memRows = await sb(`members?select=member_id,first_name,last_name&member_id=in.(${eligibleIds.join(',')})&order=last_name,first_name`);
    players = memRows.map(m=>({id:m.member_id, name:`${m.first_name} ${m.last_name}`.trim()}));
    players.sort((a,b)=>a.name.localeCompare(b.name));

    assign={};subAssign={};dirty=false;
    $('evtLbl').innerHTML=`<strong>${teamName}</strong> · ${eventLabel}`;
    load(false);
    screen('pitchScreen');
    await loadExistingLineup();
    renderStrip();renderPos();renderSubs();
    if(!dirty) toast(`${players.length} player${players.length!==1?'s':''} loaded`);

  }catch(e){
    console.error(e);
    load(false);
    toast('Error loading squad');
  }
}
