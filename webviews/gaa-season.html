<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season Comparison</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gaa-season.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <div>
        <div class="logo">COACH<span>SMART</span></div>
        <div class="logo-sub">Season comparison</div>
      </div>
      <button class="filters-btn" onclick="$('sidebar').classList.toggle('open')">Filters</button>
    </div>
    <div class="sidebar-scroll" id="filters"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="tabs" id="tabs">
        <button data-t="clubs">Clubs</button><button data-t="vs">Club v club</button><button data-t="h2h">Head to head</button><button data-t="trend">Trends</button>
      </div>
      <div class="summary" id="summary"></div>
      <div class="export-btns">
        <button class="export-btn" onclick="exportCsv()">⤓ CSV</button>
        <button class="export-btn" id="xlsxBtn" onclick="exportExcel()">⤓ Excel</button>
        <button class="export-btn" id="pdfBtn" onclick="exportPdf()">⤓ PDF</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
<div id="pdfStage"></div>
<div class="busy" id="busy"><div class="spinner"></div>Making the PDF…</div>

<script src="gaa-season-core.js"></script>
<script>
let tab = stored('gaaSeason.tab', 'clubs');
let myClub = null, clubB = null, sortKey = 'm', sortAsc = false, showAll = false, trendClubs = null;

function filterOpts() { return { clubLabel: 'Your club', clubId: myClub, min: true }; }
function pageInit() {
  myClub = defaultClub();
  clubB = stored('gaaSeason.b', null);
  trendClubs = stored('gaaSeason.trend', null);
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); };
}
function onClubPick(v) { myClub = +v; store('gaaSeason.club', myClub); refresh(); }
function setTab(t) { tab = t; store('gaaSeason.tab', t); render(); $('list').scrollTop = 0; }

// Clubs passing the "clubs shown" minimum, best first by the chosen column
function ranked(agg) {
  const val = {
    m: metric, wp: winPct, ws: wScore, diff: diffPg, p: s => s.p, w: s => s.w, d: s => s.d, l: s => s.l,
    pf: s => s.pf / s.p, pa: s => s.pa / s.p, teams: s => s.teams.size, name: s => s.name,
  }[sortKey] || metric;
  return [...agg.values()].filter(s => s.p >= F.min).sort((a, b) => {
    const x = val(a), y = val(b);
    const c = typeof x === 'string' ? x.localeCompare(y) : (x - y) || (metric(a) - metric(b)) || (diffPg(a) - diffPg(b));
    return sortAsc ? c : -c;
  });
}
const byMetric = list => [...list].sort((a, b) => metric(b) - metric(a) || diffPg(b) - diffPg(a));

function render() {
  if (!DB) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const games = filtered(), [from, to] = range();
  const last = DB.lastDay && DB.lastDay < to ? DB.lastDay : to;
  $('summary').innerHTML = `<b>${fmtN(games.length)}</b> results · ${dayLabel(from)} – ${dayLabel(last)}${F.weighted ? ` · weighted ${F.k}%` : ''}`;
  if (!DB.games.length) {
    $('list').innerHTML = `<div class="empty"><b>No results stored yet</b>The season is loading a fortnight at a time. Check back shortly.</div>`;
    return;
  }
  if (!games.length) { $('list').innerHTML = `<div class="empty"><b>No results for these filters</b>Try more codes, another age group or a longer date range.</div>`; return; }
  const agg = aggregate(games);
  $('list').innerHTML = { clubs: viewClubs, vs: viewVs, h2h: viewH2h, trend: viewTrend }[tab](agg, games);
}

// ── Clubs ──────────────────────────────────────────────────────────────────
function th(key, label, cls = '') {
  const on = sortKey === key || (key === 'm' && sortKey === (F.weighted ? 'ws' : 'wp'));
  return `<th class="${cls} ${on ? 'on' : ''}" onclick="sortBy('${key}')">${label}${on ? (sortAsc ? ' ↑' : ' ↓') : ''}</th>`;
}
function sortBy(k) { if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = k === 'name' || k === 'pa'; } render(); }

function viewClubs(agg) {
  const list = ranked(agg), me = agg.get(myClub), byM = byMetric(list), rank = byM.findIndex(s => s.id === myClub) + 1;
  let h = '';
  if (me) {
    const bands = Object.keys(BANDS).filter(b => me.band[b]?.p >= 5).sort((a, b) => metric(me.band[b]) - metric(me.band[a]));
    const codes = new Set([...me.teams].map(t => t.split('|')[0]));
    h += `<div class="section-title">${esc(me.name)}<span class="n">${rank ? `rank ${rank} of ${byM.length} clubs by ${metricName().toLowerCase()}` : `fewer than ${F.min} games, so not ranked`}</span>
      <span class="right"><a class="back" href="gaa-club.html?club=${me.id}">Club trends →</a></span></div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Overall</div><div class="stat-big">${winPct(me)}%<small>won</small></div><div class="stat-sub">${me.w}W · ${me.d}D · ${me.l}L from ${fmtN(me.p)}</div></div>
      ${F.weighted ? `<div class="stat"><div class="stat-label">Weighted score</div><div class="stat-big">${wScore(me)}<small>/ 100</small></div><div class="stat-sub">${F.k}% division, ${100 - F.k}% results</div></div>` : ''}
      <div class="stat"><div class="stat-label">Teams</div><div class="stat-big">${me.teams.size}</div><div class="stat-sub">across ${codes.size} code${codes.size === 1 ? '' : 's'}</div></div>
      <div class="stat"><div class="stat-label">Avg points</div><div class="stat-big">${one(me.pf / me.p)}<small>v</small> ${one(me.pa / me.p)}</div><div class="stat-sub">For v against · ${sign(diffPg(me))} a game</div></div>
      ${bands.length ? `<div class="stat"><div class="stat-label">Best age band</div><div class="stat-big">${BAND_SHORT[bands[0]]}<small>${metricFmt(metric(me.band[bands[0]]))}</small></div><div class="stat-sub">${bands.slice(1).map(b => `${BAND_SHORT[b]} ${metricFmt(metric(me.band[b]))}`).join(' · ') || '&nbsp;'}</div></div>` : ''}
    </div>`;
  }
  const rows = showAll ? list : list.slice(0, 25);
  h += `<div class="section-title">Club rankings<span class="n">${list.length} clubs with ${F.min}+ games</span>
    <span class="right"><span class="seg small">${[['m', metricName()], ['diff', 'Points diff'], ['p', 'Games']].map(([k, l]) => `<button class="${sortKey === k ? 'on' : ''}" onclick="sortKey='${k}';sortAsc=false;render()">${l}</button>`).join('')}</span></span></div>
  <div class="tbl"><table><thead><tr><th class="l">#</th>${th('name', 'Club', 'l')}${th('teams', 'Teams', 'hide-s')}${th('p', 'P')}${th('w', 'W')}${th('d', 'D', 'hide-s')}${th('l', 'L')}${th('wp', 'Win %')}${F.weighted ? th('ws', 'Weighted') : ''}${th('pf', 'For', 'hide-s')}${th('pa', 'Agst', 'hide-s')}${th('diff', 'Diff / game')}<th class="hide-s">Record</th></tr></thead><tbody>
  ${rows.map((s, i) => `<tr class="${s.id === myClub ? 'me' : ''}" onclick="openVs(${s.id})"><td class="l">${i + 1}</td><td class="l club"><b>${esc(s.name)}</b><span>${s.teams.size} teams</span></td>
    <td class="hide-s">${s.teams.size}</td><td>${s.p}</td><td>${s.w}</td><td class="hide-s">${s.d}</td><td>${s.l}</td>
    <td><span class="pill ${!F.weighted && winPct(s) >= 50 ? 'win' : ''}">${winPct(s)}%</span></td>
    ${F.weighted ? `<td><span class="pill ${wScore(s) >= 50 ? 'win' : ''}">${wScore(s)}</span></td>` : ''}
    <td class="hide-s">${one(s.pf / s.p)}</td><td class="hide-s">${one(s.pa / s.p)}</td>
    <td class="${diffPg(s) > 0 ? 'pos' : diffPg(s) < 0 ? 'neg' : ''}">${sign(diffPg(s))}</td><td class="hide-s">${wdlBar(s)}</td></tr>`).join('')}
  </tbody></table></div>
  ${list.length > 25 ? `<button class="more-btn" onclick="showAll=!showAll;render()">${showAll ? 'Show top 25' : `Show all ${list.length}`}</button>` : ''}
  <div class="note">Every scored result in the dates, codes and ages chosen. Tap a club to compare it with ${esc(clubName(myClub))}. Points count goals as 3.${F.weighted ? ' Weighted score blends each result with how high its division is, so wins in top divisions count for more.' : ''}</div>`;
  return h;
}
function openVs(id) { if (id !== myClub) { clubB = id; store('gaaSeason.b', id); } setTab('vs'); }

// ── Club v club ────────────────────────────────────────────────────────────
function pairB(agg) {
  if (clubB && clubB !== myClub && DB.clubs.has(clubB)) return clubB;
  const list = byMetric([...agg.values()].filter(s => s.p >= F.min && s.id !== myClub));
  return list[0]?.id ?? [...DB.clubs.keys()].find(id => id !== myClub);
}
function pickA(v) { myClub = +v; store('gaaSeason.club', myClub); refresh(); }
function pickB(v) { clubB = +v; store('gaaSeason.b', clubB); render(); }
function bfLine(k, a, b, fmt = v => v, lowGood = false) {
  const mx = Math.max(Math.abs(a), Math.abs(b)) || 1, aBest = lowGood ? a <= b : a >= b, bBest = lowGood ? b <= a : b >= a;
  return `<div class="bf"><div class="v ${aBest ? '' : 'worse'}">${fmt(a)}</div><div class="bar l"><i style="width:${Math.abs(a) / mx * 100}%;background:${SERIES[0]}"></i></div>
    <div class="k">${k}</div><div class="bar"><i style="width:${Math.abs(b) / mx * 100}%;background:${SERIES[1]}"></i></div><div class="v r ${bBest ? '' : 'worse'}">${fmt(b)}</div></div>`;
}
let vsRows = [];
function viewVs(agg) {
  const b = pairB(agg), A = agg.get(myClub) || { name: clubName(myClub), ...blank(), home: blank(), away: blank(), band: {}, code: {}, teams: new Set() },
    B = agg.get(b) || { name: clubName(b), ...blank(), home: blank(), away: blank(), band: {}, code: {}, teams: new Set() };
  const pf = s => s.p ? one(s.pf / s.p) : 0, pa = s => s.p ? one(s.pa / s.p) : 0;
  const head = (s, id, cls, col, onch) => `<div class="vs-club ${cls}">${ring(metric(s), col, metricFmt(metric(s)))}<div style="min-width:0">
      <select class="no-pdf-x" onchange="${onch}(this.value)">${clubOptions(id)}</select>
      <div class="s">${s.teams.size} teams · ${s.w}W ${s.d}D ${s.l}L</div><a href="gaa-club.html?club=${id}">Club trends →</a></div></div>`;
  vsRows = [];
  const line = (k, a, bb, fmt, low) => { vsRows.push({ metric: k, a: fmt ? fmt(a) : a, b: fmt ? fmt(bb) : bb }); return bfLine(k, a, bb, fmt, low); };
  const p100 = v => `${v}%`;
  let main = line('Win %', winPct(A), winPct(B), p100);
  if (F.weighted) main += line('Weighted score', wScore(A), wScore(B));
  main += line('Points for a game', pf(A), pf(B)) + line('Points against a game', pa(A), pa(B), undefined, true)
    + line('Diff a game', diffPg(A), diffPg(B), sign) + line('Games played', A.p, B.p) + line('Teams', A.teams.size, B.teams.size)
    + line('Home win %', winPct(A.home), winPct(B.home), p100) + line('Away win %', winPct(A.away), winPct(B.away), p100);
  const bands = Object.keys(BANDS).filter(k => A.band[k]?.p || B.band[k]?.p).map(k => line(BANDS[k], metric(A.band[k]), metric(B.band[k]), metricFmt)).join('');
  const codes = CODES.filter(k => A.code[k]?.p || B.code[k]?.p).map(k => line(k, metric(A.code[k]), metric(B.code[k]), metricFmt)).join('');
  return `<div class="section-title">Club v club<span class="n">pick either club to change it</span></div>
    <div class="card"><div class="vs-head">${head(A, myClub, '', SERIES[0], 'pickA')}<div class="vs-mid">V</div>${head(B, b, 'b', SERIES[1], 'pickB')}</div></div>
    <div class="card">${main}</div>
    <div class="two"><div class="card"><div class="mini-t">${metricName()} by age band</div>${bands || '<div class="note">No games</div>'}</div>
      <div class="card"><div class="mini-t">${metricName()} by code</div>${codes || '<div class="note">No games</div>'}</div></div>`;
}

// ── Head to head ───────────────────────────────────────────────────────────
let h2hRows = [];
function viewH2h(agg, games) {
  const b = pairB(agg), A = clubName(myClub), B = clubName(b);
  const gs = games.filter(g => (g.h === myClub && g.a === b) || (g.h === b && g.a === myClub));
  const s = blank(), home = blank(), away = blank(), byCode = {}, byBand = {};
  const res = [];
  for (const g of gs) {
    const aHome = g.h === myClub, f = aHome ? g.hp : g.ap, a = aHome ? g.ap : g.hp;
    for (const t of [s, aHome ? home : away, byCode[g.comp.code] ??= blank(), byBand[g.comp.level] ??= blank()]) addSide(t, f, a, g.comp.str, 0);
    res.push(f > a ? 'W' : f < a ? 'L' : 'D');
  }
  const team = (id, suf) => `${clubName(id)}${suf ? ` ${suf}` : ''}`;
  h2hRows = gs.slice().reverse().map(g => ({ date: g.day, age: g.comp.age, code: g.comp.code, comp: g.comp.grade, home: team(g.h, g.hs), hp: g.hp, ap: g.ap, away: team(g.a, g.as) }));
  const head = (id, onch, right) => `<div style="${right ? 'text-align:right' : ''}"><div class="vs-club" style="display:block"><select onchange="${onch}(this.value)">${clubOptions(id)}</select></div></div>`;
  const col = r => r === 'W' ? '#87C232' : r === 'L' ? '#e05252' : '#6B7280';
  const lines = (o, keys, label) => keys.filter(k => o[k]).map(k => `${label(k)} <b class="${o[k].w > o[k].l ? 'pos' : o[k].l > o[k].w ? 'neg' : ''}">${rec(o[k])}</b>`).join('<br>') || 'None';
  return `<div class="section-title">Head to head<span class="n">every game between the two clubs in these filters</span></div>
  <div class="card"><div class="h2h">${head(myClub, 'pickA')}<div class="big">${s.w}<span class="d">–</span>${s.d}<span class="d">–</span>${s.l}</div>${head(b, 'pickB', true)}</div>
    <div class="note" style="text-align:center">${gs.length ? `${esc(A)}'s record from ${gs.length} game${gs.length === 1 ? '' : 's'} · home ${rec(home)} · away ${rec(away)} · avg ${one(s.pf / s.p)} v ${one(s.pa / s.p)}` : `${esc(A)} and ${esc(B)} haven't met in these filters`}</div>
    ${res.length ? `<div class="strip">${res.slice(-60).map(r => `<i style="background:${col(r)}">${r}</i>`).join('')}<span class="note" style="margin:0 0 0 8px">oldest to newest, ${esc(A)}'s result</span></div>` : ''}</div>
  ${gs.length ? `<div class="two" style="margin-bottom:6px">
    <div class="card"><div class="mini-t">By code</div><div class="lines">${lines(byCode, CODES, k => k)}</div></div>
    <div class="card"><div class="mini-t">By age band</div><div class="lines">${lines(byBand, Object.keys(BANDS), k => BANDS[k])}</div></div></div>
  ${gs.slice().reverse().map(g => {
    const hw = g.hp > g.ap, aw = g.ap > g.hp;
    return `<div class="game"><div class="dt">${dayLabel(g.day)}</div><div class="cp"><b>${esc(g.comp.age)}</b>${esc(g.comp.code)}<span>${esc(g.comp.grade)}</span></div>
      <div class="m"><div class="h ${hw ? 'w' : aw ? 'lo' : ''}">${esc(team(g.h, g.hs))}</div><div class="sc"><span class="pill ${hw ? 'win' : ''}">${g.hp}</span><span>v</span><span class="pill ${aw ? 'win' : ''}">${g.ap}</span></div><div class="${aw ? 'w' : hw ? 'lo' : ''}">${esc(team(g.a, g.as))}</div></div></div>`;
  }).join('')}
  <div class="note">Scores are total points, with goals counted as 3.</div>` : ''}`;
}

// ── Trends ─────────────────────────────────────────────────────────────────
let trendRows = [];
function viewTrend(agg, games) {
  const months = monthsInRange();
  const top = byMetric([...agg.values()].filter(s => s.p >= F.min));
  let ids = (trendClubs || [myClub, ...top.filter(s => s.id !== myClub).slice(0, 2).map(s => s.id)]).filter(id => DB.clubs.has(id)).slice(0, 5);
  trendClubs = ids;
  // Running totals month by month
  const run = ids.map(() => blank()), byMonth = new Map(months.map(m => [m, []]));
  for (const g of games) if (byMonth.has(g.m)) byMonth.get(g.m).push(g);
  const vals = ids.map(() => []), k = K();
  for (const m of months) {
    for (const g of byMonth.get(m)) ids.forEach((id, i) => {
      if (g.h === id) addSide(run[i], g.hp, g.ap, g.comp.str, k);
      else if (g.a === id) addSide(run[i], g.ap, g.hp, g.comp.str, k);
    });
    ids.forEach((_, i) => vals[i].push(run[i].p ? metric(run[i]) : null));
  }
  trendRows = months.map((m, mi) => Object.fromEntries([['month', MON[m]], ...ids.map((id, i) => [String(id), vals[i][mi]])]));
  const series = ids.map((id, i) => ({ name: clubName(id), color: SERIES[i], values: vals[i], drop: ids.length > 1 ? `trendDrop(${i})` : '' }));
  const legendExtra = `${ids.length < 5 ? `<select class="no-pdf" onchange="trendAdd(this.value)"><option value="">+ Add club</option>${top.filter(s => !ids.includes(s.id)).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>` : ''}`;
  const chart = chartHtml('trend', { labels: months.map(m => MON[m]), series, fmt: metricFmt, min: 0, max: 100, fit: true, ref: 50, endLabels: true, legendExtra, height: 300 });

  // Form: last 6 weeks against the rest of the range
  const [from, to] = range(), end = DB.lastDay && DB.lastDay < to ? DB.lastDay : to, cut = iso(addDays(fromIso(end), -42));
  const before = aggregate(games.filter(g => g.day < cut)), recent = aggregate(games.filter(g => g.day >= cut));
  const moves = [];
  for (const s of agg.values()) {
    const r = recent.get(s.id), b = before.get(s.id);
    if (s.p >= F.min && r?.p >= 6 && b?.p >= 10) moves.push({ s, now: metric(r), d: metric(r) - metric(b), n: r.p });
  }
  moves.sort((a, b) => b.d - a.d);
  const up = moves.filter(m => m.d > 0).slice(0, 6), down = moves.filter(m => m.d < 0).slice(-6).reverse();
  const formLine = m => `<a href="#" onclick="trendAdd(${m.s.id});return false" style="text-decoration:none">${esc(m.s.name)}</a> <b class="${m.d > 0 ? 'pos' : 'neg'}">${sign(m.d)}</b> <span class="note">now ${metricFmt(m.now)} from ${m.n}</span>`;
  const formOk = from < cut;
  return `<div class="section-title">${metricName()} through the season<span class="n">running total by month · up to 5 clubs</span></div>
    <div class="card">${chart}</div>
    <div class="note">Each line is a club's ${metricName().toLowerCase()} for the season so far, month by month. Above the dashed line is winning more than losing. Hover or tap for the numbers.</div>
    ${formOk ? `<div class="section-title" style="margin-top:22px">Form now<span class="n">last 6 weeks against before, clubs with ${F.min}+ games</span></div>
    <div class="two"><div class="card"><div class="mini-t">On the rise</div><div class="lines">${up.map(formLine).join('<br>') || 'Nobody yet'}</div></div>
      <div class="card"><div class="mini-t">Dipping</div><div class="lines">${down.map(formLine).join('<br>') || 'Nobody yet'}</div></div></div>` : ''}`;
}
function trendAdd(v) { if (!v) return; v = +v; if (!trendClubs.includes(v) && trendClubs.length < 5) trendClubs.push(v); store('gaaSeason.trend', trendClubs); render(); }
function trendDrop(i) { trendClubs.splice(i, 1); store('gaaSeason.trend', trendClubs); render(); }

// ── Exports: whatever the open tab shows ───────────────────────────────────
function exportData() {
  const [from, to] = range(), when = `${dayLabel(from)} to ${dayLabel(DB.lastDay && DB.lastDay < to ? DB.lastDay : to)}`;
  const agg = aggregate(filtered());
  if (tab === 'vs') {
    const b = pairB(agg);
    return { title: `${clubName(myClub)} v ${clubName(b)} ${when}`, sheets: [{ name: 'Club v club', cols: [['Measure', 'metric'], [clubName(myClub), 'a'], [clubName(b), 'b']], rows: vsRows }] };
  }
  if (tab === 'h2h') {
    const b = pairB(agg);
    return { title: `Head to head ${clubName(myClub)} v ${clubName(b)} ${when}`, sheets: [{ name: 'Games', cols: [['Date', 'date'], ['Age', 'age'], ['Code', 'code'], ['Competition', 'comp'], ['Home', 'home'], ['Home pts', 'hp'], ['Away pts', 'ap'], ['Away', 'away']], rows: h2hRows }] };
  }
  if (tab === 'trend') {
    return { title: `${metricName()} by month ${when}`, sheets: [{ name: 'Trends', cols: [['Month', 'month'], ...trendClubs.map(id => [clubName(id), String(id)])], rows: trendRows }] };
  }
  const rows = ranked(agg).map((s, i) => ({ _me: s.id === myClub, rank: i + 1, club: s.name, teams: s.teams.size, p: s.p, w: s.w, d: s.d, l: s.l,
    wp: winPct(s), ws: wScore(s), pf: one(s.pf / s.p), pa: one(s.pa / s.p), diff: diffPg(s) }));
  const cols = [['#', 'rank'], ['Club', 'club'], ['Teams', 'teams'], ['P', 'p'], ['W', 'w'], ['D', 'd'], ['L', 'l'], ['Win %', 'wp'],
    ...(F.weighted ? [[`Weighted (${F.k}% division)`, 'ws']] : []), ['For / game', 'pf'], ['Against / game', 'pa'], ['Diff / game', 'diff']];
  return { title: `Club rankings ${when}`, sheets: [{ name: 'Clubs', cols, rows }] };
}

boot();
</script>
</body>
</html>
