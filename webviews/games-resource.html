<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#111418"/>
  <style>html,body{background:#111418 !important;}</style>
  <title>Coaching Resources</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --green:     #87C232;
      --green-dim: rgba(135,194,50,0.12);
      --green-mid: rgba(135,194,50,0.22);
      --dark:      #111418;
      --card:      #1E222B;
      --card2:     #252A35;
      --border:    rgba(255,255,255,0.07);
      --text:      #E7EBEE;
      --muted:     #6B7280;
      --red:       #EF4444;
      --amber:     #F59E0B;
      --blue:      #60A5FA;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: none; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); font-size: 14px; overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    a { text-decoration: none; }

    /* ── SCREENS ── */
    .screen { display: none; width: 100%; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── TOP BAR ── */
    .top-bar {
      background: var(--card);
      border-bottom: 3px solid var(--green);
      padding: 0 16px;
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      color: var(--green); flex-shrink: 0;
      border-radius: 8px;
      transition: background 0.1s;
    }
    .back-btn:active { background: var(--green-dim); }
    .back-btn svg { width: 20px; height: 20px; }
    .bar-wordmark { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .bar-wordmark span { color: var(--green); }
    .bar-title { font-size: 15px; font-weight: 600; line-height: 1.2; }
    .bar-sub   { font-size: 10px; color: var(--muted); margin-top: 1px; letter-spacing: 0.5px; }

    /* ── SCROLL CONTENT ── */
    .scroll-content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 10px; font-weight: 700;
      color: var(--muted); letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 12px;
    }

    /* ── STAGE GRID ── */
    .stage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stage-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 5px;
      text-align: left;
      transition: border-color 0.15s, background 0.1s;
    }
    .stage-card:active { background: var(--card2); border-color: var(--green); }
    .stage-age {
      font-size: 24px; font-weight: 700;
      color: var(--green); text-transform: uppercase; line-height: 1;
    }
    .stage-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .stage-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .stage-count { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── FILTERS ── */
    .filters-wrap {
      padding: 10px 16px 0;
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .filter-row {
      display: flex; gap: 6px;
      overflow-x: auto; padding-bottom: 2px;
    }
    .filter-chip {
      flex-shrink: 0;
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); transition: all 0.15s;
    }
    .filter-chip.active { background: var(--green); border-color: var(--green); color: #111418; }

    /* ── GAME LIST ── */
    .game-list { display: flex; flex-direction: column; gap: 8px; }
    .game-card {
      background: var(--card); border-radius: 10px;
      border: 1px solid var(--border);
      padding: 14px; width: 100%;
      display: flex; align-items: flex-start; gap: 12px;
      text-align: left; transition: border-color 0.15s;
    }
    .game-card:active { border-color: var(--green); background: var(--card2); }
    .type-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); flex-shrink: 0; margin-top: 6px;
    }
    .type-dot.warmup { background: var(--amber); }
    .type-dot.drill  { background: var(--blue); }
    .game-info { flex: 1; min-width: 0; }
    .game-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 5px; line-height: 1.3; }
    .game-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .gtag {
      font-size: 10px; font-weight: 500;
      padding: 2px 7px; border-radius: 10px;
      background: var(--green-dim); color: var(--green);
      border: 1px solid rgba(135,194,50,0.2);
    }
    .gtag.warmup { background: rgba(245,158,11,0.10); color: var(--amber); border-color: rgba(245,158,11,0.2); }
    .gtag.drill  { background: rgba(96,165,250,0.10); color: var(--blue);  border-color: rgba(96,165,250,0.2); }
    .gtag.skill  { background: rgba(255,255,255,0.05); color: var(--muted); border-color: var(--border); }
    .game-chev { color: var(--muted); flex-shrink: 0; }
    .game-chev svg { width: 16px; height: 16px; }

    /* ── EMPTY / ERROR states ── */
    .empty-state { text-align: center; padding: 48px 20px; }
    .empty-state svg { width: 40px; height: 40px; color: var(--muted); opacity: 0.35; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; color: var(--muted); line-height: 1.6; }

    /* ── DETAIL ── */
    .detail-image {
      width: 100%; height: 190px; object-fit: cover;
      display: block; background: var(--card2);
    }
    .detail-body { padding: 16px; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .d-badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: 10px;
    }
    .d-badge.sport { background: var(--green-dim); color: var(--green); border: 1px solid rgba(135,194,50,0.25); }
    .d-badge.type  { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
    .d-badge.skill { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
    .d-badge.warmup { background: rgba(245,158,11,0.12); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
    .d-badge.drill  { background: rgba(96,165,250,0.12); color: var(--blue);  border: 1px solid rgba(96,165,250,0.2); }
    .d-section { margin-bottom: 22px; }
    .d-section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--green); margin-bottom: 8px;
    }
    .d-section-text {
      font-size: 13px; color: var(--text); line-height: 1.65;
      white-space: pre-line;
    }
    .media-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .media-btn {
      flex: 1; padding: 12px 10px;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--card);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: var(--text);
      transition: all 0.15s;
    }
    .media-btn:active { background: var(--card2); border-color: var(--green); }
    .media-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .media-btn.pdf   { color: var(--red); }
    .media-btn.video { color: var(--green); }

    /* ── LOADING ── */
    #loadingOverlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(17,20,24,0.88);
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(135,194,50,0.2);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 13px; color: var(--muted); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 18px;
      font-size: 13px; font-weight: 500; color: var(--text);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── ERROR SCREEN ── */
    #errorScreen { align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    .error-icon { font-size: 52px; margin-bottom: 16px; }
    .error-msg { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 300px; }
    .error-msg strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 16px; }
  </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">Loading…</div></div>
<div id="toast"></div>

<!-- ── STAGE PICKER ── -->
<div id="stageScreen" class="screen">
  <div class="top-bar">
    <div class="bar-wordmark">Coach<span>Smart</span></div>
  </div>
  <div class="scroll-content">
    <div class="section-label" style="margin-bottom:14px">Select age stage</div>
    <div class="stage-grid" id="stageGrid"></div>
  </div>
</div>

<!-- ── GAMES LIST ── -->
<div id="gamesScreen" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('stageScreen')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <div class="bar-title" id="gamesTitle">Resources</div>
    </div>
  </div>
  <div class="filters-wrap">
    <div class="filter-row" id="sportFilter"></div>
    <div class="filter-row" id="typeFilter"></div>
  </div>
  <div class="scroll-content" style="padding-top:12px">
    <div class="game-list" id="gameList"></div>
  </div>
</div>

<!-- ── GAME DETAIL ── -->
<div id="detailScreen" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('gamesScreen')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div style="min-width:0;flex:1">
      <div class="bar-title" id="detailTitle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px"></div>
    </div>
  </div>
  <div class="scroll-content" style="padding:0">
    <div id="detailContent"></div>
  </div>
</div>

<!-- ── ERROR ── -->
<div id="errorScreen" class="screen">
  <div class="error-icon">🔒</div>
  <div class="error-msg" id="errorMsg">
    <strong>Access required</strong>
    Open this page from the CoachSmart app to access coaching resources.
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';

// Use raw regex + decodeURIComponent so that + in base64 tokens is preserved.
// URLSearchParams converts + to space, silently corrupting the JWT.
function _getParam(name) {
  const m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
const WV_TOKEN   = _getParam('token') || _getParam('currentAuthToken');
const WV_REFRESH = _getParam('refreshToken') || _getParam('refresh_token');
const IS_WEBVIEW = !!WV_TOKEN;

let sb, _sbReady;
if (IS_WEBVIEW && WV_REFRESH) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  _sbReady = sb.auth.setSession({ access_token: WV_TOKEN, refresh_token: WV_REFRESH });
} else if (IS_WEBVIEW) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { headers: { Authorization: `Bearer ${WV_TOKEN}` } },
    auth: { persistSession: false },
  });
  _sbReady = Promise.resolve(null);
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  _sbReady = Promise.resolve(null);
}

// ── State ────────────────────────────────────────────────────────────────────
let allGames      = [];
let gameAges      = [];
let selectedAge   = null;
let selectedSport = 'All';
let selectedType  = 'All';

const AGE_ORDER = ['u6','u7','u8','u9','u10','u11','u12','u13','u14','u15','u16','u17','u18'];
const SPORTS    = ['All','Football','Hurling','Camogie'];
const TYPES     = ['All','Games','Warmups','Drill'];

// ── Helpers ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function showLoading(msg = 'Loading…') { $('loadingText').textContent = msg; $('loadingOverlay').classList.add('show'); }
function hideLoading() { $('loadingOverlay').classList.remove('show'); }

let _toast;
function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(_toast); _toast = setTimeout(() => t.classList.remove('show'), 2600);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Resolve display label and description from a game_ages row
// Handles multiple possible column naming conventions
function resolveAgeRow(row) {
  const code = (row.age_code || row.code || row.age_id || '').toLowerCase();
  const name = row.age_name || row.name || row.label || (code ? code.toUpperCase() : '?');
  const desc = row.age_description || row.description || row.age_desc || '';
  return { code, name, desc };
}

// Get the primary game_type for colour coding (first type wins)
function primaryType(types) {
  if (!types?.length) return 'game';
  const t = types[0].toLowerCase();
  if (t === 'warmups') return 'warmup';
  if (t === 'drill')   return 'drill';
  return 'game';
}

// ── Stage Screen ─────────────────────────────────────────────────────────────
function renderStages() {
  // Build age list from game_ages table, ordered by AGE_ORDER
  const fromTable = gameAges.map(r => resolveAgeRow(r))
    .filter(r => r.code)
    .sort((a, b) => {
      const ai = AGE_ORDER.indexOf(a.code);
      const bi = AGE_ORDER.indexOf(b.code);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

  // Fallback: derive age list from games data if table was empty
  let stages = fromTable;
  if (!stages.length) {
    const ageSet = new Set();
    allGames.forEach(g => (g.game_age || []).forEach(a => ageSet.add(a.toLowerCase())));
    stages = [...ageSet]
      .sort((a, b) => {
        const ai = AGE_ORDER.indexOf(a);
        const bi = AGE_ORDER.indexOf(b);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      })
      .map(code => ({ code, name: code.toUpperCase(), desc: '' }));
  }

  // Count games per age
  const countByAge = {};
  allGames.forEach(g => (g.game_age || []).forEach(a => {
    const k = a.toLowerCase();
    countByAge[k] = (countByAge[k] || 0) + 1;
  }));

  $('stageGrid').innerHTML = stages.map(s => {
    const count = countByAge[s.code] || 0;
    return `<button class="stage-card" onclick="selectStage('${esc(s.code)}','${esc(s.name)}')">
      <div class="stage-age">${esc(s.name)}</div>
      ${s.desc ? `<div class="stage-desc">${esc(s.desc)}</div>` : ''}
      ${count ? `<div class="stage-count">${count} resource${count !== 1 ? 's' : ''}</div>` : ''}
    </button>`;
  }).join('') || '<div class="empty-state"><p>No age stages found.</p></div>';
}

function selectStage(code, label) {
  selectedAge   = code;
  selectedSport = 'All';
  selectedType  = 'All';
  $('gamesTitle').textContent = label + ' Resources';
  renderFilters();
  renderGameList();
  showScreen('gamesScreen');
}

// ── Games List Screen ─────────────────────────────────────────────────────────
function gamesForAge() {
  return allGames.filter(g =>
    (g.game_age || []).some(a => a.toLowerCase() === selectedAge)
  );
}

function filteredGames() {
  return gamesForAge().filter(g => {
    if (selectedSport !== 'All' && !(g.game_code || []).includes(selectedSport)) return false;
    if (selectedType  !== 'All' && !(g.game_type || []).includes(selectedType))  return false;
    return true;
  });
}

function renderFilters() {
  const ageGames = gamesForAge();

  const availSports = new Set(['All']);
  ageGames.forEach(g => (g.game_code || []).forEach(c => availSports.add(c)));
  const sportChips = SPORTS.filter(s => availSports.has(s));
  $('sportFilter').innerHTML = sportChips.map(s =>
    `<button class="filter-chip${s === selectedSport ? ' active' : ''}" onclick="setSport('${esc(s)}')">${esc(s)}</button>`
  ).join('');

  const availTypes = new Set(['All']);
  ageGames.forEach(g => (g.game_type || []).forEach(t => availTypes.add(t)));
  const typeChips = TYPES.filter(t => availTypes.has(t));
  $('typeFilter').innerHTML = typeChips.map(t =>
    `<button class="filter-chip${t === selectedType ? ' active' : ''}" onclick="setType('${esc(t)}')">${esc(t)}</button>`
  ).join('');
}

function setSport(s) { selectedSport = s; renderFilters(); renderGameList(); }
function setType(t)  { selectedType  = t; renderFilters(); renderGameList(); }

function renderGameList() {
  const games = filteredGames();
  if (!games.length) {
    $('gameList').innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
      </svg>
      <p>No resources found for this filter.</p>
    </div>`;
    return;
  }
  $('gameList').innerHTML = games.map(g => {
    const pt    = primaryType(g.game_type);
    const types = g.game_type  || [];
    const skills = (g.game_skill || []).slice(0, 2);
    return `<button class="game-card" onclick="showDetail(${g.game_id})">
      <div class="type-dot${pt !== 'game' ? ' ' + pt : ''}"></div>
      <div class="game-info">
        <div class="game-name">${esc(g.game_name)}</div>
        <div class="game-tags">
          ${types.map(t => `<span class="gtag ${pt !== 'game' ? pt : ''}">${esc(t)}</span>`).join('')}
          ${skills.map(s => `<span class="gtag skill">${esc(s)}</span>`).join('')}
        </div>
      </div>
      <div class="game-chev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </button>`;
  }).join('');
}

// ── Detail Screen ─────────────────────────────────────────────────────────────
function showDetail(gameId) {
  const g = allGames.find(x => x.game_id === gameId);
  if (!g) return;

  $('detailTitle').textContent = g.game_name;

  const parts = [];

  // Hero image
  if (g.game_image?.trim()) {
    parts.push(`<img class="detail-image" src="${esc(g.game_image)}" alt="${esc(g.game_name)}" onerror="this.style.display='none'"/>`);
  }

  // Body wrapper open
  parts.push('<div class="detail-body">');

  // Media buttons
  const hasPdf   = !!g.game_pdf?.trim();
  const hasVideo = !!g.game_video?.trim();
  if (hasPdf || hasVideo) {
    parts.push(`<div class="media-row">
      ${hasPdf   ? `<a href="${esc(g.game_pdf)}"   target="_blank" class="media-btn pdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>PDF Guide</a>` : ''}
      ${hasVideo  ? `<a href="${esc(g.game_video)}" target="_blank" class="media-btn video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>Watch Video</a>` : ''}
    </div>`);
  }

  // Badges
  const sports = g.game_code  || [];
  const types  = g.game_type  || [];
  const skills = g.game_skill || [];
  if (sports.length || types.length || skills.length) {
    const pt = primaryType(types);
    parts.push(`<div class="detail-meta">
      ${sports.map(s => `<span class="d-badge sport">${esc(s)}</span>`).join('')}
      ${types.map(t  => `<span class="d-badge type ${pt !== 'game' ? pt : ''}">${esc(t)}</span>`).join('')}
      ${skills.map(s => `<span class="d-badge skill">${esc(s)}</span>`).join('')}
    </div>`);
  }

  // Content sections
  [
    { key: 'game_setup',           label: 'Setup' },
    { key: 'game_how_to_play',     label: 'How to Play' },
    { key: 'game_variations',      label: 'Variations' },
    { key: 'game_teaching_points', label: 'Teaching Points' },
  ].forEach(f => {
    if (g[f.key]?.trim()) {
      parts.push(`<div class="d-section">
        <div class="d-section-label">${esc(f.label)}</div>
        <div class="d-section-text">${esc(g[f.key])}</div>
      </div>`);
    }
  });

  parts.push('</div>'); // close detail-body

  $('detailContent').innerHTML = parts.join('');
  showScreen('detailScreen');
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  showLoading('Loading resources…');
  try {
    await _sbReady;

    // Load game_ages anon-accessible in parallel with games (auth required)
    const agesPromise = sb.from('game_ages').select('*');
    const gamesPromise = IS_WEBVIEW
      ? sb.from('games').select(
          'game_id,game_name,game_age,game_code,game_type,game_skill,' +
          'game_setup,game_how_to_play,game_variations,game_teaching_points,' +
          'game_pdf,game_video,game_image'
        )
      : Promise.resolve({ data: [], error: { message: 'No token provided' } });

    const [agesResult, gamesResult] = await Promise.all([agesPromise, gamesPromise]);

    gameAges = agesResult.data || [];
    if (agesResult.error) console.warn('game_ages:', agesResult.error.message);

    if (gamesResult.error) {
      console.warn('games:', gamesResult.error.message);
      if (!IS_WEBVIEW) {
        $('errorMsg').innerHTML = '<strong>Access required</strong>Open this page from the CoachSmart app to access coaching resources.';
        showScreen('errorScreen');
        hideLoading();
        return;
      }
      showToast('Could not load resources — please try again');
    }

    allGames = gamesResult.data || [];

    renderStages();
    showScreen('stageScreen');
  } catch (e) {
    console.error('Boot error:', e);
    $('errorMsg').innerHTML = '<strong>Something went wrong</strong>Please close and reopen coaching resources.';
    showScreen('errorScreen');
  } finally {
    hideLoading();
  }
}

boot();
</script>

</html>
