}
function closePlayer() {
  document.getElementById('playerFrame').classList.remove('open');
  document.getElementById('pfIframe').src = 'about:blank';
}

/* ── Controls ────────────────────────────────────────────────────────────── */
let wired = false;
function wireControls() {
  if (wired) return; wired = true;

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const { act, k, v, id } = el.dataset;
    switch (act) {
      case 'tab':      st.tab = el.dataset.tab; st.teamPage = null; st.expanded = {}; render(); scrollTop(); break;
      case 'team':     st.tab = 'teams'; st.teamPage = Number(id); st.expanded = {}; render(); scrollTop(); break;
      case 'back':     st.teamPage = null; st.expanded = {}; render(); scrollTop(); break;
      case 'players':  st.tab = 'players'; st.playerSort = v; st.playerQ = ''; st.expanded = {}; render(); scrollTop(); break;
      case 'sort':     st[k] = v; st.expanded = {}; render(); break;
      case 'more':     st.expanded[k] = !st.expanded[k]; render(); break;
      case 'only-code': st.f.code = new Set([v]); renderFilterSheet(); render(); break;
      case 'event':    openSheet({ kind: 'event', id: Number(id), resp: 'all' }); break;
      case 'squad':    openSheet({ kind: 'squad', id: Number(id) }); break;
      case 'roster':   openSheet({ kind: 'roster', role: v }); break;
      case 'resp':     sheetState.resp = sheetState.resp === v && v !== 'all' ? 'all' : v; renderSheet(); break;
      case 'player':   openPlayer(id, el.dataset.name); break;
      case 'pdf-view': exportView(); break;
      case 'pdf-sheet': exportSheet(); break;
      case 'reset':
        if (k === 'dates') { st.custom = null; st.period = 'season'; renderFilterSheet(); loadData(); }
        else { st.f[k] = new Set(fDefault[k]); renderFilterSheet(); render(); }
        break;
      case 'club':     if (Number(v) !== clubId) { clubId = Number(v); fOptions = { team: [], code: [], type: [], role: [] }; st.teamPage = null; renderFilterSheet(); loadData(); } break;
      case 'f-all':    st.f[k] = new Set(fOptions[k].map(o => o[0])); renderFilterSheet(); render(); break;
      case 'f-none':   st.f[k] = new Set(); renderFilterSheet(); render(); break;
      case 'f-pill':   st.f[k].has(v) ? st.f[k].delete(v) : st.f[k].add(v); renderFilterSheet(); render(); break;
      case 'logout':   doLogout(); break;
    }
  });

  document.querySelectorAll('#periodSeg button').forEach(b => b.addEventListener('click', () => {
    st.period = b.dataset.period; st.custom = null; st.expanded = {};
    renderFilterSheet(); loadData();
  }));

  // Search re-renders only the list so the keyboard stays up
  document.getElementById('view').addEventListener('input', e => {
    if (e.target.id !== 'playerSearch') return;
    st.playerQ = e.target.value;
    const ctx = context(), stats = playerStats(ctx.evs); movers(ctx, stats);
    let list = [...stats.values()];
    const q = st.playerQ.trim().toLowerCase();
    if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
    if (st.playerSort === 'dropping') list = list.filter(p => p.delta != null && p.delta < 0);
    if (st.playerSort === 'rising')   list = list.filter(p => p.delta != null && p.delta > 0);
    if (st.playerSort === 'noreply')  list = list.filter(p => p.nr > 0);
    document.getElementById('playerList').innerHTML = playerListHtml(sortPlayers(list, st.playerSort), false);
  });

  const fs = document.getElementById('filterSheet');
  document.getElementById('filterBtn').addEventListener('click', () => { renderFilterSheet(); fs.classList.add('open'); });
  document.getElementById('doneBtn').addEventListener('click', () => fs.classList.remove('open'));
  fs.addEventListener('click', e => { if (e.target === fs) fs.classList.remove('open'); });
  document.getElementById('resetFilters').addEventListener('click', () => {
    GROUPS.forEach(g => { st.f[g.key] = new Set(fDefault[g.key]); });
    const hadCustom = !!st.custom; st.custom = null;
    renderFilterSheet(); hadCustom ? loadData() : render();
  });
  const onDates = () => {
    const a = document.getElementById('dateFrom').value, b = document.getElementById('dateTo').value;
    if (!a || !b) return;
    const from = new Date(a + 'T00:00:00'), to = new Date(b + 'T23:59:59');
    if (to < from) return toast('The end date is before the start date');
    st.custom = { from, to }; st.expanded = {};
    loadData();
  };
  document.getElementById('dateFrom').addEventListener('change', onDates);
  document.getElementById('dateTo').addEventListener('change', onDates);

  const ds = document.getElementById('detailSheet');
  ds.addEventListener('click', e => { if (e.target === ds) closeSheet(); });
  document.getElementById('pfBack').addEventListener('click', closePlayer);
}
function scrollTop() { document.body.scrollTop = 0; document.documentElement.scrollTop = 0; }

/* ── PDF export ──────────────────────────────────────────────────────────── */
let exporting = false;
const TAB_NAMES = { teams: 'Teams', players: 'Players', squads: 'Match squads' };

function pdfHead(title, sub) {
  return `<div class="pdf-head"><div><b>${esc(title)}</b><span>${esc(sub)}</span></div><div class="pdf-brand">Coach<em>Smart</em></div></div>`;
}
function pdfFoot() {
  const d = new Date();
  return `<div class="pdf-foot">Generated ${fmtDay(d)}</div>`;
}
function subLine() {
  const parts = [periodRange().label, ...changedLabels()];
  if (isDefault('team') && raw.teams.length > 1) parts.push('All teams');
  return parts.join(' · ');
}

async function exportView() {
  if (!raw) return;
  const team = st.tab === 'teams' && st.teamPage != null ? raw.teams.find(t => t.team_id === st.teamPage) : null;
  const title = team ? team.team_name : `${raw.clubName} · ${TAB_NAMES[st.tab]}`;
  const sub = team ? [periodRange().label, ...changedLabels().filter(l => !l.startsWith('Teams:'))].join(' · ') : subLine();
  const html = pdfHead(title, sub) + viewHtml(true) + pdfFoot();
  await exportHtml(html, `${team ? team.team_name : raw.clubName} ${team ? 'team' : TAB_NAMES[st.tab]}`, title);
}

async function exportSheet() {
  if (!sheetState) return;
  let title = '', sub = '';
  if (sheetState.kind === 'event') { const e = scopeEvent(sheetState.id); title = eventTitle(e); sub = eventSub(e); }
  if (sheetState.kind === 'squad') { const sm = squadModel(context()); title = sm.sqName(sheetState.id); sub = `${raw.clubName} · ${periodRange().label}`; }
  if (sheetState.kind === 'roster') { const team = raw.teams.find(t => t.team_id === st.teamPage); title = `${team?.team_name || ''} · ${sheetState.role}`; sub = periodRange().label; }
  const html = pdfHead(title, sub) + sheetHtml(sheetState, true) + pdfFoot();
  let file = title;
  if (sheetState.kind === 'event') { const e = scopeEvent(sheetState.id); file = `${e.team_name} ${title} ${e.date.getDate()} ${MON[e.date.getMonth()]}`; }
  await exportHtml(html, file, title);
}

async function exportHtml(html, fileBase, shareTitle) {
  if (exporting) return;
  if (!window.html2canvas || !window.jspdf) return toast('Still loading, try again in a moment');
  exporting = true;
  const stage = document.getElementById('pdfStage');
  stage.innerHTML = html;
  const prevScroll = document.body.scrollTop;
  document.body.classList.add('exporting');
  document.body.scrollTop = 0;
  try {
    const pdf = await buildPdf(stage);
    const file = `${fileBase.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '')}.pdf`;
    restorePage();
    await sharePdf(pdf, file, shareTitle);
  } catch (e) {
    console.error(e);
    toast('Could not create the PDF');
  } finally {
    restorePage();
    exporting = false;
  }
  function restorePage() {
    if (!document.body.classList.contains('exporting')) return;
    document.body.classList.remove('exporting');
    stage.innerHTML = '';
    document.body.scrollTop = prevScroll;
  }
}

// Renders in page-height slices so long lists don't blow the canvas limit
async function buildPdf(el) {
  const { jsPDF } = window.jspdf;
  const pad = 16, pageH = 1100;
  const w = el.offsetWidth, h = el.scrollHeight;
  const top = el.getBoundingClientRect().top + document.body.scrollTop;
  const left = el.getBoundingClientRect().left;
  let pdf = null;
  for (let y = 0; y < h; y += pageH) {
    const sliceH = Math.min(pageH, h - y);
    const canvas = await Promise.race([
      html2canvas(el, { backgroundColor: '#111418', scale: 2, y: top + y, x: left, width: w, height: sliceH, windowWidth: document.body.clientWidth, logging: false, imageTimeout: 5000 }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000)),
    ]);
    const img = canvas.toDataURL('image/jpeg', 0.9);
    const pw = w + pad * 2, ph = sliceH + pad * 2;
    // Orientation must follow each slice's shape, or jsPDF swaps width and height on short last pages
    const orient = pw > ph ? 'l' : 'p';
    if (!pdf) pdf = new jsPDF({ orientation: orient, unit: 'px', format: [pw, ph] });
    else pdf.addPage([pw, ph], orient);
    pdf.setFillColor(17, 20, 24);
    pdf.rect(0, 0, pw, ph, 'F');
    pdf.addImage(img, 'JPEG', pad, pad, w, sliceH);
  }
  return pdf;
}

async function sharePdf(pdf, filename, title) {
  const blob = pdf.output('blob');
  const file = new File([blob], filename, { type: 'application/pdf' });
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (_) {}
  if (canShare) {
    try {
      // navigator.share can hang in some WKWebView configs, so cap it
      await Promise.race([
        navigator.share({ title, files: [file] }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('ShareTimeout')), 10000)),
      ]);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ── Install prompt (standalone web app only) ────────────────────────────── */
// ── Install / Add to Home Screen ─────────────────────────────────
let _deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _deferredInstallPrompt = e;
    // Upgrade the modal if it's already open — swap in the native Install button
    if (document.getElementById('installOverlay').classList.contains('show')) {
        _renderInstallSteps('native');
    }
});

function _shouldShowInstall() {
    if (WV_TOKEN) return false;
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return false;
    if (localStorage.getItem('cs_install_done')) return false;        // user actually installed
    if (sessionStorage.getItem('cs_install_dismissed')) return false; // dismissed this session
    return true;
}

function maybeShowInstallModal() {
    if (!_shouldShowInstall()) return;
    const ua = navigator.userAgent;
    const isIOS     = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);
    const isChrome  = /Chrome/.test(ua) && !/Chromium|EdgA|OPR/.test(ua);
    if (isIOS) {
        _renderInstallSteps('ios');
        _showInstallModal();
    } else if (_deferredInstallPrompt) {
        _renderInstallSteps('native');
        _showInstallModal();
    } else if (isAndroid && isChrome) {
        _renderInstallSteps('android-manual');
        _showInstallModal();
    }
}

function _renderInstallSteps(mode) {
    const steps = document.getElementById('installSteps');
    const nativeBtn = document.getElementById('installNativeBtn');
    nativeBtn.style.display = 'none';
    if (mode === 'ios') {
        steps.innerHTML =
            `<div class="install-step"><div class="step-num">1</div><div class="step-text">Tap the <span class="step-icon">&#x2191;</span> <strong>Share</strong> button at the bottom of Safari</div></div>
             <div class="install-step"><div class="step-num">2</div><div class="step-text">Scroll down and tap <strong>"Add to Home Screen"</strong></div></div>
             <div class="install-step"><div class="step-num">3</div><div class="step-text">Tap <strong>"Add"</strong> in the top right to confirm</div></div>`;
    } else if (mode === 'native') {
        steps.innerHTML =
            `<div class="install-step"><div class="step-num">1</div><div class="step-text">Tap <strong>Install App</strong> below — CoachSmart will be added directly to your home screen.</div></div>`;
        nativeBtn.style.display = '';
    } else {
        steps.innerHTML =
            `<div class="install-step"><div class="step-num">1</div><div class="step-text">Tap the <strong>&#8942;</strong> menu button in the top-right of Chrome</div></div>
             <div class="install-step"><div class="step-num">2</div><div class="step-text">Tap <strong>"Add to Home Screen"</strong></div></div>
             <div class="install-step"><div class="step-num">3</div><div class="step-text">Tap <strong>"Add"</strong> to confirm</div></div>`;
    }
}

function _showInstallModal() {
    const overlay = document.getElementById('installOverlay');
    overlay.style.display = 'flex';
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));
}

async function doInstall() {
    if (!_deferredInstallPrompt) return;
    _deferredInstallPrompt.prompt();
    const { outcome } = await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    if (outcome === 'accepted') {
        localStorage.setItem('cs_install_done', '1');
        _hideInstallModal();
    } else {
        dismissInstall();
    }
}

function dismissInstall() {
    sessionStorage.setItem('cs_install_dismissed', '1');
    _hideInstallModal();
}

function _hideInstallModal() {
    const overlay = document.getElementById('installOverlay');
    overlay.classList.remove('show');
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
}

/* ── Init ────────────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  if (!WV_TOKEN && 'serviceWorker' in navigator) navigator.serviceWorker.register('/webviews/sw.js').catch(() => {});
  setTimeout(maybeShowInstallModal, 700);
  checkAuth();
});
