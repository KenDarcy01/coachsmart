<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Club Analytics</title>
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoachSmart">
<link rel="manifest" href="/webviews/dashboard-app.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens — same palette as member-analytics.html ─────────────────────── */
:root {
  --accent:      #87C232;
  --accent-dim:  rgba(135,194,50,0.14);
  --yes:         #22C55E;
  --yes-dim:     rgba(34,197,94,0.14);
  --no:          #EF4444;
  --no-text:     #F87171;
  --no-dim:      rgba(239,68,68,0.14);
  --warn:        #F59E0B;
  --warn-dim:    rgba(245,158,11,0.14);
  --none:        #4B5563;
  --none-dim:    rgba(75,85,99,0.35);

  --bg:          #111418;
  --surface:     #1E222B;
  --surface-2:   #252A35;
  --border:      rgba(255,255,255,0.07);
  --text:        #F1F4F8;
  --text-2:      #B0B8C8;
  --muted:       #A1A1A2;

  /* Aliases used by the login, splash and install styles */
  --green: var(--accent); --dark: var(--bg); --card: var(--surface); --card2: var(--surface-2); --red: var(--no);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body {
  height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; }

#loginScreen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--dark);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
}
.login-card {
    width: 100%; max-width: 360px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px 28px;
}
.login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 31px; letter-spacing: 3px; text-align: center; margin-bottom: 4px; }
.login-logo span { color: var(--green); }
.login-sub { font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; margin-bottom: 28px; }
.login-field { margin-bottom: 12px; }
.login-field input {
    width: 100%; padding: 12px 14px; border-radius: 8px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif;
}
.login-field input:focus { outline: none; border-color: var(--green); }
.login-field input::placeholder { color: var(--muted); }
.login-submit {
    width: 100%; padding: 13px; border-radius: 8px; margin-top: 6px;
    background: var(--green); border: none; color: #111;
    font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.login-submit:disabled { opacity: 0.5; cursor: default; }
.login-error { font-size: 13px; color: var(--red); margin-top: 10px; text-align: center; min-height: 16px; }
.denied-box { text-align: center; padding: 12px 0 4px; }
.denied-title { font-size: 17px; font-weight: 600; margin-bottom: 10px; color: var(--red); }
.denied-msg { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.denied-sign-out { padding: 10px 24px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.install-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: flex-end;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.install-sheet {
    width: 100%; background: var(--card);
    border-radius: 22px 22px 0 0; border-top: 1px solid var(--border);
    padding: 6px 22px 48px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 -12px 48px rgba(0,0,0,0.5);
}
.install-overlay.show .install-sheet { transform: translateY(0); }
.install-drag { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 10px auto 18px; }
.install-top-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.install-app-icon { width: 54px; height: 54px; border-radius: 13px; flex-shrink: 0; overflow: hidden; }
.install-app-icon img { width: 100%; height: 100%; display: block; }
.install-heading { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
.install-tagline { font-size: 14px; color: var(--muted); line-height: 1.4; }
.install-divider { height: 1px; background: var(--border); margin: 18px 0; }
.install-steps { display: flex; flex-direction: column; gap: 16px; margin-bottom: 26px; }
.install-step { display: flex; align-items: flex-start; gap: 13px; }
.step-num {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: rgba(135,194,50,0.15); border: 1px solid rgba(135,194,50,0.35);
    color: var(--green); font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.step-text { font-size: 16px; line-height: 1.5; color: var(--muted); }
.step-text strong { color: var(--text); font-weight: 600; }
.step-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 6px; vertical-align: middle; margin: 0 1px; font-size: 15px;
    background: var(--card2); color: var(--text);
}
.install-primary-btn {
    width: 100%; padding: 16px; border-radius: 12px; margin-bottom: 10px;
    background: var(--green); border: none; color: #111;
    font-size: 17px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.install-later-btn {
    width: 100%; padding: 14px; border-radius: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer;
}
/* ── Splash screen ── */
#splashScreen {
    position: fixed; inset: 0; z-index: 300;
    background: var(--dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; transition: opacity 0.25s ease;
}
#splashScreen.hiding { opacity: 0; pointer-events: none; }
.splash-logo { font-family: 'Bebas Neue', sans-serif; font-size: 47px; letter-spacing: 5px; }
.splash-logo span { color: var(--green); }
.splash-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }


.spinner {
  width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 80px 24px; text-align: center; color: var(--muted); font-size: 15px; }

#app { display: none; }
.wrap { max-width: 720px; margin: 0 auto; padding: 4px 16px 32px; }

/* ── Tabs + top bar ─────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; text-align: center; padding: 10px 0 10px; font-size: 14px; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); font-weight: 600; border-color: var(--accent); }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.seg { flex: 1; display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; text-align: center; font-size: 13px; padding: 6px 0; border-radius: 8px; color: var(--text-2); white-space: nowrap; }
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.icon-btn {
  width: 40px; height: 38px; flex: none; border-radius: 10px; background: var(--surface); border: 1px solid var(--border);
  display: grid; place-items: center; position: relative;
}
.icon-btn:disabled { opacity: 0.5; }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: none; }
.icon-btn.has-filters .dot { display: block; }
.chips { display: flex; gap: 6px; margin: -2px 0 12px; flex-wrap: wrap; }
.chips:empty { display: none; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-seg { margin-bottom: 10px; }

/* ── Cards ──────────────────────────────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
button.card { display: block; width: 100%; }
.h {
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.h button { color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; }
.hero { display: flex; gap: 16px; align-items: center; }
.ring { width: 96px; height: 96px; flex: none; }
.ring-s { width: 64px; height: 64px; flex: none; }
.big { font-size: 16px; font-weight: 600; }
.sub { font-size: 13px; color: var(--text-2); }
.trend { font-size: 13px; font-weight: 600; margin-top: 2px; }
.trend.up { color: var(--yes); } .trend.down { color: var(--no-text); } .trend.flat { color: var(--muted); }
.stats3 { display: flex; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.stats3 div { flex: 1; text-align: center; }
.stats3 b { display: block; font-size: 17px; }
.stats3 span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.dots-label { font-size: 12px; color: var(--text-2); margin-top: 12px; }
.dots { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.two .card { margin: 0; }
.two.single { grid-template-columns: 1fr; }
.code-name { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.code-sub { font-size: 12px; color: var(--text-2); margin-top: 8px; }
.code-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 1px; color: var(--accent); background: var(--accent-dim);
}
.code-tag.none { color: var(--text-2); background: var(--none-dim); }
.k { font-size: 26px; font-weight: 700; line-height: 1.1; }
.k small { font-size: 15px; color: var(--muted); font-weight: 500; }
.lbl { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.mini { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 10px; overflow: hidden; display: flex; }
.mini i { display: block; height: 100%; }
.needs { border-color: rgba(245,158,11,0.5); }
.empty { font-size: 13px; color: var(--muted); text-align: center; padding: 6px 0; }

/* ── Rows ───────────────────────────────────────────────────────────────── */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); width: 100%; }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child { padding-bottom: 0; }
.date { width: 40px; text-align: center; flex: none; }
.date b { display: block; font-size: 17px; line-height: 1.1; }
.date span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.grow { flex: 1; min-width: 0; }
.t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; flex: none; }
.p-yes { background: var(--yes-dim); color: var(--yes); }
.p-no { background: var(--no-dim); color: var(--no-text); }
.p-none { background: var(--none-dim); color: var(--text-2); }
.p-acc { background: var(--accent-dim); color: var(--accent); }
.p-warn { background: var(--warn-dim); color: var(--warn); }
.chev { color: var(--muted); font-size: 18px; flex: none; }
.ico { min-width: 34px; height: 34px; padding: 0 4px; border-radius: 10px; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 14px; }
.ico.warn { background: var(--warn-dim); color: var(--warn); }
.ico.bad { background: var(--no-dim); color: var(--no-text); }
.ico.good { background: var(--yes-dim); color: var(--yes); }
.rank { width: 18px; font-size: 13px; color: var(--muted); flex: none; text-align: center; }
.track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.track i { display: block; height: 100%; border-radius: 3px; }
.pct { font-weight: 700; font-size: 15px; flex: none; min-width: 44px; text-align: right; }
.c-hi { color: var(--accent); } .c-mid { color: var(--warn); } .c-low { color: var(--no-text); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text-2); flex: none; }
.fd { display: flex; gap: 3px; margin-top: 5px; }
.fd b { width: 8px; height: 8px; border-radius: 50%; }
.d-yes { background: var(--yes); } .d-no { background: var(--no); } .d-none { background: var(--none); }
.up-t { color: var(--yes); } .down-t { color: var(--no-text); } .warn-t { color: var(--warn); }

.months { display: flex; align-items: flex-end; gap: 6px; height: 112px; }
.months > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.months em { font-style: normal; font-size: 11px; color: var(--text-2); }
.months i { display: block; width: 100%; border-radius: 5px 5px 2px 2px; background: var(--accent); min-height: 2px; }
.months i.low { opacity: 0.55; }
.months i.nil { background: var(--surface-2); }
.months span { font-size: 11px; color: var(--muted); }

/* Squads tab graphics */
.split { display: flex; align-items: center; gap: 16px; }
.donut { width: 128px; height: 128px; flex: none; }
.split-leg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.split-leg div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.split-leg b { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.split-leg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.split-leg em { font-style: normal; font-weight: 700; }
.split-leg span small { display: block; text-align: left; font-size: 11px; color: var(--muted); }
.split-leg em + small { color: var(--muted); font-size: 12px; min-width: 32px; text-align: right; }
.sbars { display: flex; align-items: flex-end; gap: 6px; height: 124px; }
.sbars > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.sbars .col { width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; border-radius: 5px 5px 2px 2px; overflow: hidden; }
.sbars .col i { display: block; width: 100%; min-height: 2px; }
.sbars .col i.nil { background: var(--surface-2); height: 2px; }
.sbars em { font-style: normal; font-size: 11px; color: var(--text-2); }
.sbars span { font-size: 11px; color: var(--muted); }
.sq-badge { width: 36px; height: 36px; border-radius: 10px; border: 1px solid; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.sq-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.sq-strip { height: 4px; border-radius: 2px; margin-top: 10px; }
.sbar { display: flex; gap: 1px; height: 7px; margin-top: 6px; border-radius: 4px; overflow: hidden; }
.sbar i { display: block; height: 100%; }
.hbar { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 5px 0; }
.hbar span { width: 112px; flex: none; color: var(--text-2); }
.hbar div { flex: 1; height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.hbar i { display: block; height: 100%; border-radius: 6px; min-width: 3px; }
.hbar b { width: 28px; text-align: right; flex: none; }
.medal { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); flex: none; background: var(--surface-2); }
.medal.m1 { background: #F5C542; color: #14181B; } .medal.m2 { background: #C9D1DC; color: #14181B; } .medal.m3 { background: #D08B4C; color: #14181B; }
.pct small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.ring-xs { width: 36px; height: 36px; flex: none; }

.team-top { display: flex; align-items: center; gap: 14px; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 12px; }
.spark i { flex: 1; background: var(--accent); border-radius: 2px 2px 1px 1px; min-height: 2px; }
.spark i.low { opacity: 0.45; }
.spark i.nil { background: var(--surface-2); }
.tc-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.back { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 15px; font-weight: 500; }
.pagehead { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
.ptitle { font-size: 20px; font-weight: 700; margin: 2px 2px; }
.psub { font-size: 13px; color: var(--text-2); margin: 0 2px 12px; }
.role-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.search { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none; }
.search:focus { border-color: var(--accent); }
.dist { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 10px 0 8px; }
.dist i { display: block; height: 100%; }
.legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); gap: 6px; flex-wrap: wrap; }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.type-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

/* ── Sheets ─────────────────────────────────────────────────────────────── */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet-bg.open { display: flex; }
.sheet {
  width: 100%; max-width: 720px; max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface); border-radius: 18px 18px 0 0; border-top: 1px solid var(--border);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
}
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--surface-2); margin: 0 auto 12px; }
.sheet-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-title b { font-size: 17px; }
.sheet-title > button:not(.icon-btn) { color: var(--accent); font-size: 14px; }
.sheet .icon-btn { background: var(--surface-2); }
.f-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.f-all { display: flex; gap: 14px; }
.f-all button { color: var(--accent); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.f-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.f-pill { font-size: 13px; padding: 7px 12px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid transparent; }
.f-pill.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.dates { display: flex; gap: 8px; margin-top: 10px; }
.dates input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 8px 10px; font-size: 14px; color-scheme: dark; }
.done-btn, .share-btn { width: 100%; margin-top: 20px; padding: 12px; border-radius: 12px; background: var(--accent); color: #111418; font-weight: 700; text-align: center; display: flex; gap: 8px; align-items: center; justify-content: center; }
.counts { display: flex; gap: 8px; margin: 12px 0; }
.counts button { flex: 1; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid transparent; }
.counts button.on { border-color: currentColor; }

};

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const pct = (n, d) => d ? Math.round((n / d) * 100) : 0;
const band = p => p >= 70 ? 'hi' : p >= 50 ? 'mid' : 'low';
const bandColor = p => p >= 70 ? 'var(--accent)' : p >= 50 ? 'var(--warn)' : 'var(--no)';

const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

/* ── Auth ────────────────────────────────────────────────────────────────── */
async function checkAuth() {
  if (WV_TOKEN) {
    document.getElementById('splashScreen').style.display = 'none';
    const { data: { user }, error } = await sb.auth.getUser();
    if (error || !user) return showLoginScreen();
    await handleSession({ user, access_token: WV_TOKEN });
    document.querySelectorAll('.denied-sign-out').forEach(el => el.style.display = 'none');
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) await handleSession(session); else showLoginScreen();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') { currentUser = null; currentSession = null; showLoginScreen(); }
    else if (event === 'TOKEN_REFRESHED' && session) currentSession = session;
  });
}

async function handleSession(session) {
  currentSession = session;
  currentUser = session.user;
  document.getElementById('loginBtn').textContent = 'Checking access…';
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginError').textContent = '';

  const teams = await fetchAdminTeams();
  if (!teams.length) return showAccessDenied();
  adminTeamIds = new Set(teams.map(t => t.team_id));
  userClubs = [...new Map(teams.map(t => [t.club_id, { club_id: t.club_id, club_name: t.club_name }])).values()]
    .sort((a, b) => a.club_name.localeCompare(b.club_name));
  clubId = await defaultClubId();

  hideSplash();
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  wireControls();
  loadData();
}

// The user's default club (users.default_club) when they admin a team there, else the first club
async function defaultClubId() {
  try {
    const { data } = await sb.from('users').select('default_club').eq('user_id', currentUser.id).maybeSingle();
    const id = Number(data?.default_club);
    if (id && userClubs.some(c => c.club_id === id)) return id;
  } catch (e) { console.error(e); }
  return userClubs[0].club_id;
}

// Teams where the user holds an admin (grade 100) role
async function fetchAdminTeams() {
  try {
    const { data: uml } = await sb.from('user_member_link').select('member_id').eq('user_id', currentUser.id);
    if (!uml?.length) return [];
    const { data: mtl } = await sb.from('member_team_link').select('member_team_id,team_id').in('member_id', uml.map(r => r.member_id));
    if (!mtl?.length) return [];
    const mtlMap = Object.fromEntries(mtl.map(r => [r.member_team_id, r.team_id]));
    const { data: mtrl } = await sb.from('member_team_role_link').select('member_team_id,role_id').in('member_team_id', mtl.map(r => r.member_team_id));
    if (!mtrl?.length) return [];
    const { data: roles } = await sb.from('roles').select('role_id').in('role_id', [...new Set(mtrl.map(r => r.role_id))]).eq('role_grade', 100);
    if (!roles?.length) return [];
    const adminRoleIds = new Set(roles.map(r => r.role_id));
    const teamIds = [...new Set(mtrl.filter(r => adminRoleIds.has(r.role_id)).map(r => mtlMap[r.member_team_id]).filter(Boolean))];
    if (!teamIds.length) return [];
    const { data: teams } = await sb.from('teams').select('team_id,team_name,club_id').in('team_id', teamIds);
    if (!teams?.length) return [];
    const { data: clubs } = await sb.from('clubs').select('club_id,club_name').in('club_id', [...new Set(teams.map(t => t.club_id))]);
    const clubMap = Object.fromEntries((clubs || []).map(c => [c.club_id, c.club_name]));
    return teams.map(t => ({ team_id: t.team_id, team_name: t.team_name, club_id: t.club_id, club_name: clubMap[t.club_id] || 'Club' }));
  } catch (e) { console.error(e); return []; }
}

/* ── Period ──────────────────────────────────────────────────────────────── */
// Same day n months back, clamped to the month's last day (31 Mar -> 28 Feb)
function monthsAgo(d, n) {
  const last = new Date(d.getFullYear(), d.getMonth() - n + 1, 0).getDate();
  return new Date(d.getFullYear(), d.getMonth() - n, Math.min(d.getDate(), last), 23, 59);
}
function periodRange() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  if (st.custom) {
    const from = st.custom.from, to = new Date(Math.min(st.custom.to.getTime(), now.getTime()));
    const len = to - from;
    return { from, to, prevFrom: new Date(from - len), prevTo: from, prevLabel: 'the period before',
      label: `${fmtDay(from)} – ${fmtDay(st.custom.to)}` };
  }
  if (st.period === 'month') {
    return { from: new Date(y, m, 1), to: now, prevFrom: new Date(y, m - 1, 1), prevTo: monthsAgo(now, 1),
      prevLabel: 'this time last month', label: `${MON[m]} ${y}` };
  }
  if (st.period === '3months') {
    const from = new Date(y, m - 2, 1);
    return { from, to: now, prevFrom: new Date(y, m - 5, 1), prevTo: monthsAgo(now, 3),
      prevLabel: 'the 3 months before', label: `${MON[from.getMonth()]} – ${MON[m]} ${y}` };
  }
  if (st.period === 'season') {
    return { from: new Date(y, 0, 1), to: now, prevFrom: new Date(y - 1, 0, 1), prevTo: monthsAgo(now, 12),
      prevLabel: 'this time last year', label: `${y} season` };
  }
  return { from: null, to: now, prevFrom: null, prevTo: null, prevLabel: null, label: 'All time' };
}

/* ── Data ────────────────────────────────────────────────────────────────── */
async function loadData() {
  const r = periodRange();
  const need = r.prevFrom || r.from || ALL_FROM;
  if (raw && raw.clubId === clubId && raw.from <= need) return render();

  const seq = ++loadSeq;
  document.getElementById('view').innerHTML = `<div class="state"><div class="spinner"></div></div>`;
  document.getElementById('pdfBtn').disabled = true;
  const { data, error } = await sb.rpc('get_club_comparison_dashboard', {
    p_club_id: clubId, p_start_date: need.toISOString(), p_end_date: new Date().toISOString(),
  });
  if (seq !== loadSeq) return;
  if (error || !data || data.error) {
    document.getElementById('view').innerHTML = `<div class="state">⚠️<div>Couldn't load club data${error ? ': ' + esc(error.message) : data?.error ? ': ' + esc(data.error) : ''}</div></div>`;
    return;
  }
  raw = normalise(data, need);
  buildFilters();
  render();
}

function codeLabel(code, female) {
  if (!code || /^[\s\-–—]*$/.test(code)) return null;
  return female && code === 'Hurling' ? 'Camogie' : code;
}

// Squad colours: the squad's own colour where it shows up on a dark card,
// otherwise a bright palette colour. Two squads on one team never share a colour.
const SQ_PALETTE = ['#87C232', '#3B82F6', '#F59E0B', '#A855F7', '#EC4899', '#14B8A6', '#F97316', '#06B6D4', '#EF4444', '#EAB308'];
function hexOf(c) {
  let h = String(c || '').trim().replace(/^0x/i, '').replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(h)) h = h.split('').map(x => x + x).join('');
  if (/^[0-9a-f]{8}$/i.test(h)) h = h.slice(2);          // Flutter ARGB
  if (!/^[0-9a-f]{6}$/i.test(h)) return null;
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  if (lum < 0.18) return null;                            // too dark to see
  return lum > 0.85 ? '#E2E6EE' : '#' + h.toUpperCase();  // whites read as light grey
}
function squadColours(squads) {
  const byTeam = new Map();
  [...squads.values()].sort((a, b) => (a.seq ?? 999) - (b.seq ?? 999) || (a.squad_name || '').localeCompare(b.squad_name || ''))
    .forEach(s => {
      const used = byTeam.get(s.team_id) || new Set(); byTeam.set(s.team_id, used);
      let c = hexOf(s.colour);
      if (!c || used.has(c)) c = SQ_PALETTE.find(x => !used.has(x)) || SQ_PALETTE[used.size % SQ_PALETTE.length];
      used.add(c); s.hex = c;
    });
}

function normalise(data, from) {
  const teams = (data.teams || []).filter(t => adminTeamIds.has(t.team_id));
  const squads = new Map((data.squads || []).map(s => [s.squad_id, s]));
  // A squad called "Not selected" isn't a real selection
  const realSquad = id => id && !/not\s*selected/i.test(squads.get(id)?.squad_name || '') ? id : null;
  const events = [];
  for (const t of teams) {
    for (const e of t.events || []) {
      const code = codeLabel(e.code, t.team_female);
      events.push({
        id: e.event_id, team_id: t.team_id, team_name: t.team_name,
        date: new Date(e.date), title: e.title || '', rawCode: e.code || '', code,
        type: e.type || '', opposition: e.opposition || '', home_away: e.home_away || '',
        members: (e.members || []).map(m => ({ ...m, role: m.role || 'Player', squad_id: realSquad(m.squad_id) })),
      });
    }
  }
  events.sort((a, b) => b.date - a.date);
  squadColours(squads);
  return { clubId, from, clubName: data.club_name || '', teams, squads, events };
}

/* ── Filters ─────────────────────────────────────────────────────────────── */
const codeKey = e => e.code || NO_CODE;
const typeKey = e => e.type || 'Other';

function buildFilters() {
  const evs = raw.events;
  const codes = [...new Set(evs.map(e => e.code).filter(Boolean))].sort();
  const types = [...new Set(evs.map(typeKey))].sort();
  const roles = new Set();
  raw.teams.forEach(t => (t.member_roles || []).forEach(r => roles.add(r.role)));
  evs.forEach(e => e.members.forEach(m => roles.add(m.role)));

  const next = {
    team: raw.teams.map(t => [String(t.team_id), t.team_name]),
    code: codes.map(c => [c, c]).concat(evs.some(e => !e.code) ? [[NO_CODE, '- (no code)']] : []),
    type: types.map(t => [t, t]),
    role: [...roles].sort().map(r => [r, r]),
  };
  const nextDefault = {
    team: next.team.map(o => o[0]),
    code: codes,                       // "- (no code)" is selectable but off on load
    type: next.type.map(o => o[0]),
    role: next.role.map(o => o[0]),
  };
  for (const { key } of GROUPS) {
    const wasDefault = !fOptions[key].length || isDefault(key);
    const known = new Set(fOptions[key].map(o => o[0]));
    fOptions[key] = next[key];
    fDefault[key] = nextDefault[key];
    if (wasDefault) st.f[key] = new Set(fDefault[key]);
    else nextDefault[key].forEach(v => { if (!known.has(v)) st.f[key].add(v); });   // new values join switched on
  }
  renderFilterSheet();
}

function isDefault(key) {
  const d = fDefault[key];
  return st.f[key].size === d.length && d.every(v => st.f[key].has(v));
}
function filterLabel(key) {
  const g = GROUPS.find(g => g.key === key);
  if (!st.f[key].size) return 'None';
  if (st.f[key].size === fOptions[key].length) return key === 'code' && fOptions.code.some(o => o[0] === NO_CODE) ? 'All, incl. no code' : 'All';
  const on = fOptions[key].filter(([v]) => st.f[key].has(v)).map(o => o[1]);
  const off = fOptions[key].filter(([v]) => !st.f[key].has(v)).map(o => o[1]);
  return on.length > 2 && off.length < on.length ? `All except ${off.join(', ')}` : on.join(', ');
}
function changedLabels() {
  return GROUPS.filter(g => fOptions[g.key].length > 1 && !isDefault(g.key)).map(g => `${g.label}: ${filterLabel(g.key)}`);
}

function renderFilterSheet() {
  const clubGroup = document.getElementById('clubGroup');
  clubGroup.style.display = userClubs.length > 1 ? '' : 'none';
  document.getElementById('clubPills').innerHTML = userClubs.map(c =>
    `<button class="f-pill ${c.club_id === clubId ? 'on' : ''}" data-act="club" data-v="${c.club_id}">${esc(c.club_name)}</button>`).join('');
  document.getElementById('filterGroups').innerHTML = GROUPS.filter(g => fOptions[g.key].length > 1).map(g => `
    <div class="f-label">${g.label} <span class="f-all"><button data-act="f-all" data-k="${g.key}">All</button><button data-act="f-none" data-k="${g.key}">None</button></span></div>
    <div class="f-pills">${fOptions[g.key].map(([v, l]) =>
      `<button class="f-pill ${st.f[g.key].has(v) ? 'on' : ''}" data-act="f-pill" data-k="${g.key}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`).join('');
  const r = st.custom;
  document.getElementById('dateFrom').value = r ? isoDay(r.from) : '';
  document.getElementById('dateTo').value = r ? isoDay(r.to) : '';
}
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function renderChips() {
  const chips = GROUPS.filter(g => fOptions[g.key].length > 1 && !isDefault(g.key))
    .map(g => `<button class="chip" data-act="reset" data-k="${g.key}">${esc(g.label)}: ${esc(filterLabel(g.key))} ✕</button>`);
  if (st.custom) chips.unshift(`<button class="chip" data-act="reset" data-k="dates">${esc(periodRange().label)} ✕</button>`);
  document.getElementById('activeChips').innerHTML = chips.join('');
  document.getElementById('filterBtn').classList.toggle('has-filters', chips.length > 0);
  document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('on', !st.custom && b.dataset.period === st.period));
}

/* ── Derived data ────────────────────────────────────────────────────────── */
// Events in [from, to] that pass the filters, with members cut to the chosen roles and counted
function scope(from, to, teamId) {
  const out = [];
  for (const e of raw.events) {
    if (from && e.date < from) continue;
    if (to && e.date > to) continue;
    if (teamId ? e.team_id !== teamId : !st.f.team.has(String(e.team_id))) continue;
    if (!st.f.code.has(codeKey(e)) || !st.f.type.has(typeKey(e))) continue;
    const members = e.members.filter(m => st.f.role.has(m.role));
    if (!members.length) continue;
    let acc = 0, dec = 0;
    for (const m of members) { if (m.response === 'accepted') acc++; else if (m.response === 'declined') dec++; }
    out.push({ ...e, members, acc, dec, nr: members.length - acc - dec, total: members.length });
  }
  return out;
}

function totals(evs) {
  let acc = 0, dec = 0, total = 0;
  for (const e of evs) { acc += e.acc; dec += e.dec; total += e.total; }
  return { acc, dec, total, nr: total - acc - dec, pct: pct(acc, total), replied: pct(acc + dec, total), events: evs.length };
}

function context(teamId) {
  const r = periodRange();
  const evs  = scope(r.from, r.to, teamId);
  const prev = r.prevFrom ? scope(r.prevFrom, r.prevTo, teamId) : [];
  return { r, evs, prev, teamId };
}

// Per-player numbers across a set of events (newest first)
function playerStats(evs) {
  const map = new Map();
  for (const e of evs) {
    for (const m of e.members) {
      let p = map.get(m.member_id);
      if (!p) { p = { id: m.member_id, name: m.name || 'Player', teams: new Set(), events: 0, acc: 0, dec: 0, nr: 0, recent: [], dates: [] }; map.set(m.member_id, p); }
      p.teams.add(e.team_name);
      p.events++;
      const c = m.response === 'accepted' ? 'yes' : m.response === 'declined' ? 'no' : 'none';
      if (c === 'yes') p.acc++; else if (c === 'no') p.dec++; else p.nr++;
      p.recent.push(c); p.dates.push(e.date);
    }
  }
  for (const p of map.values()) p.rate = pct(p.acc, p.events);
  return map;
}

// Compares each player's first half of the period with the second half
function movers(ctx, stats) {
  const evs = ctx.evs;
  if (evs.length < 4) return;
  const start = ctx.r.from || evs[evs.length - 1].date;
  const mid = new Date((start.getTime() + ctx.r.to.getTime()) / 2);
  for (const p of stats.values()) {
    let a1 = 0, n1 = 0, a2 = 0, n2 = 0;
    p.dates.forEach((d, i) => {
      const yes = p.recent[i] === 'yes';
      if (d < mid) { n1++; if (yes) a1++; } else { n2++; if (yes) a2++; }
    });
    if (n1 >= 2 && n2 >= 2) p.delta = pct(a2, n2) - pct(a1, n1);
  }
}

function months(ctx) {
  const now = ctx.r.to;
  const first = ctx.r.from || (ctx.evs.length ? ctx.evs[ctx.evs.length - 1].date : now);
  const list = [];
  for (let d = new Date(first.getFullYear(), first.getMonth(), 1); d <= now; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) list.push(d);
  return list.slice(-12).map(d => {
    const evs = ctx.evs.filter(e => e.date.getFullYear() === d.getFullYear() && e.date.getMonth() === d.getMonth());
    const t = totals(evs);
    return { key: `${d.getFullYear()}-${d.getMonth()}`, d, evs, pct: evs.length ? t.pct : null };
  });
}

function trendLine(ctx, cur) {
  if (ctx.prev.length < 3 || !ctx.r.prevLabel) return '';
  const diff = cur - totals(ctx.prev).pct;
  if (diff === 0) return `<div class="trend flat">Same as ${ctx.r.prevLabel}</div>`;
  return `<div class="trend ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)}% on ${ctx.r.prevLabel}</div>`;
}

/* ── Render ──────────────────────────────────────────────────────────────── */
function render() {
  if (!raw) return;
  renderChips();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
  const onTeamPage = st.tab === 'teams' && st.teamPage != null;
  document.getElementById('topNav').style.display = onTeamPage ? 'none' : '';
  document.getElementById('view').innerHTML = viewHtml(false)
    + (WV_TOKEN ? '' : `<div class="note" style="margin-top:20px"><button data-act="logout" style="color:var(--muted)">Sign out</button></div>`);
  document.getElementById('pdfBtn').disabled = false;
}

function viewHtml(full) {
  if (st.tab === 'teams' && st.teamPage != null) return teamPageHtml(full);
  if (st.tab === 'players') return playersHtml(full);
  if (st.tab === 'squads')  return squadsHtml(full);
  return teamsHtml(full);
}

const noEvents = () => `<div class="card"><div class="empty">No events in this period${changedLabels().length ? ' for these filters' : ''}</div></div>`;
const seeAll = (key, n, limit, full) => (!full && n > limit)
  ? `<button class="no-pdf" data-act="more" data-k="${key}">${st.expanded[key] ? 'Show less' : `See all ${n.toLocaleString('en-IE')}`}</button>` : '';
const shown = (key, list, limit, full) => (full || st.expanded[key]) ? list : list.slice(0, limit);

function heroHtml(ctx, t, extra = '') {
  return `<div class="card">
    <div class="hero">${ring(t.pct, 'ring', bandHex(t.pct))}
      <div><div class="big">${t.acc.toLocaleString('en-IE')} of ${t.total.toLocaleString('en-IE')} places filled</div>
      <div class="sub">Replied ${t.replied}% · ${plural(t.nr, 'no reply', 'no replies')}</div>${trendLine(ctx, t.pct)}</div>
    </div>${extra}</div>`;
}

function splitHtml(evs) {
  const tr = evs.filter(isTraining), ma = evs.filter(isMatch);
  const card = (list, label, unit, pl) => {
    const t = totals(list);
    return `<div class="card"><div class="k">${t.pct}<small>%</small></div><div class="lbl">${label}</div>
      <div class="code-sub">${t.acc.toLocaleString('en-IE')} of ${t.total.toLocaleString('en-IE')} · ${plural(list.length, unit, pl)}</div>
      <div class="mini"><i style="width:${t.pct}%;background:${bandColor(t.pct)}"></i></div></div>`;
  };
  const cards = [tr.length ? card(tr, 'Training attendance', 'session') : '', ma.length ? card(ma, 'Match availability', 'match', 'matches') : ''].filter(Boolean);
  if (!cards.length) return '';
  return `<div class="two ${cards.length === 1 ? 'single' : ''}">${cards.join('')}</div>`;
}

function codeCardsHtml(evs) {
  const codes = [...new Set(evs.map(e => e.code).filter(Boolean))].sort();
  if (codes.length < 2) return '';
  return `<div class="two">${codes.map(c => {
    const list = evs.filter(e => e.code === c), t = totals(list);
    return `<button class="card" data-act="only-code" data-v="${esc(c)}"><div class="code-name">${esc(c)}</div><div class="k">${t.pct}<small>%</small></div>
      <div class="code-sub">${plural(list.length, 'event')} · replied ${t.replied}%</div></button>`;
  }).join('')}</div>`;
}

function monthsHtml(ctx) {
  const ms = months(ctx);
  if (ms.length < 2 || !ctx.evs.length) return '';
  const avg = totals(ctx.evs).pct;
  const cells = ms.map(m => {
    const label = ms.length > 6 ? MON[m.d.getMonth()].charAt(0) : MON[m.d.getMonth()];
    return m.pct == null ? `<div><em>–</em><i class="nil"></i><span>${label}</span></div>`
      : `<div><em>${m.pct}%</em><i class="${m.pct < avg - 15 ? 'low' : ''}" style="height:${Math.max(m.pct, 2) * 0.7}%"></i><span>${label}</span></div>`;
  }).join('');
  return `<div class="h">Attendance by month</div><div class="card"><div class="months">${cells}</div></div>`;
}

// Event rows: "vs Raheny" for matches, the type otherwise (or a custom title)
function eventTitle(e) {
  if (isMatch(e) && e.opposition) return `vs ${e.opposition}`;
  const auto = `${e.rawCode} ${e.type}`.trim();
  if (e.title && !e.title.startsWith(auto) && !e.title.startsWith(`Camogie ${e.type}`)) return e.title;
  return e.type || e.title || 'Event';
}

function eventRowHtml(e, multiCode, showTeam) {
  const d = e.date;
  const yr = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : '';
  const title = eventTitle(e);
  const meta = [showTeam ? e.team_name : null, title !== e.type ? (isMatch(e) && e.opposition ? null : e.type) : null, e.home_away]
    .filter(Boolean).map(esc).join(' · ');
  const code = !multiCode ? '' : e.code ? `<span class="code-tag">${esc(e.code)}</span>` : `<span class="code-tag none">No code</span>`;
  const p = pct(e.acc, e.total);
  const cls = p >= 70 ? 'p-acc' : p >= 50 ? 'p-warn' : 'p-no';
  return `<button class="row" data-act="event" data-id="${e.id}">
    <div class="date"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}${yr}</span></div>
    <div class="grow"><div class="t">${esc(title)}</div>${meta || code ? `<div class="m">${code}${meta}</div>` : ''}</div>
    <span class="pill ${cls}">${e.acc} of ${e.total}</span></button>`;
}
const multiCodeIn = evs => new Set(evs.map(e => e.code || NO_CODE)).size > 1;

function teamRanking(ctx) {
  const by = new Map();
  for (const e of ctx.evs) { if (!by.has(e.team_id)) by.set(e.team_id, []); by.get(e.team_id).push(e); }
  const prevBy = new Map();
  for (const e of ctx.prev) { if (!prevBy.has(e.team_id)) prevBy.set(e.team_id, []); prevBy.get(e.team_id).push(e); }
  return [...by.entries()].map(([id, evs]) => {
    const t = totals(evs), prev = prevBy.get(id) || [];
    return { id, name: evs[0].team_name, evs, t, tr: totals(evs.filter(isTraining)), ma: totals(evs.filter(isMatch)),
      players: new Set(evs.flatMap(e => e.members.map(m => m.member_id))).size,
      trend: prev.length >= 3 ? t.pct - totals(prev).pct : null };
  });
}

/* Teams tab */
function teamsHtml(full) {
  const ctx = context();
  if (!ctx.evs.length) return noEvents();
  const teams = teamRanking(ctx);
  const sorters = {
    att: (a, b) => b.t.pct - a.t.pct,
    reply: (a, b) => b.t.replied - a.t.replied,
    trend: (a, b) => (b.trend ?? -999) - (a.trend ?? -999),
    az: (a, b) => a.name.localeCompare(b.name),
  };
  teams.sort(sorters[st.teamSort] || sorters.att);
  const seg = [['att', 'Attendance'], ['reply', 'Replies'], ['trend', 'Trend'], ['az', 'A–Z']];
  return `
    <div class="seg sub-seg no-pdf">${seg.map(([v, l]) => `<button class="${st.teamSort === v ? 'on' : ''}" data-act="sort" data-k="teamSort" data-v="${v}">${l}</button>`).join('')}</div>
    ${teams.map(tm => {
      const ms = months({ ...ctx, evs: tm.evs });
      const split = [tm.tr.events ? `Training ${tm.tr.pct}%` : '', tm.ma.events ? `Matches ${tm.ma.pct}%` : ''].filter(Boolean).join(' · ');
      const trend = tm.trend == null ? '' : tm.trend === 0 ? `<div class="trend flat">Same as ${ctx.r.prevLabel}</div>`
        : `<div class="trend ${tm.trend > 0 ? 'up' : 'down'}">${tm.trend > 0 ? '▲' : '▼'} ${Math.abs(tm.trend)}% on ${ctx.r.prevLabel}</div>`;
      return `<button class="card" data-act="team" data-id="${tm.id}">
        <div class="team-top">${ring(tm.t.pct, 'ring-s', bandHex(tm.t.pct), 9)}
          <div class="grow"><div class="big">${esc(tm.name)}</div><div class="sub">${split}</div>${trend}</div><span class="chev no-pdf">›</span></div>
        ${ms.length > 1 ? `<div class="spark">${ms.map(m => m.pct == null ? `<i class="nil"></i>` : `<i class="${m.pct < tm.t.pct - 15 ? 'low' : ''}" style="height:${Math.max(m.pct, 4)}%"></i>`).join('')}</div>` : ''}
        <div class="tc-foot"><span>${plural(tm.players, 'player')} · ${plural(tm.evs.length, 'event')}</span><span>Replied ${tm.t.replied}%</span></div>
      </button>`;
    }).join('')}`;
}

/* Team page */
function teamPageHtml(full) {
  const team = raw.teams.find(t => t.team_id === st.teamPage);
  if (!team) { st.teamPage = null; return teamsHtml(full); }
  const ctx = context(team.team_id);
  const t = totals(ctx.evs);
  const stats = playerStats(ctx.evs);
  const head = full ? '' : `<div class="pagehead"><button class="back" data-act="back">‹ Teams</button>
    <button class="icon-btn" data-act="pdf-view" aria-label="Share PDF">${ICON_PDF}</button></div>
    <div class="ptitle">${esc(team.team_name)}</div>
    <div class="psub">${esc(ctx.r.label)} · ${plural(stats.size, 'player')} · ${plural(ctx.evs.length, 'event')}</div>`;
  if (!ctx.evs.length) return head + noEvents();

  const last10 = ctx.evs.slice(0, 10).reverse();
  const extra = `<div class="dots-label">Last ${last10.length} events (players there)</div>
    <div class="dots">${last10.map(e => { const p = pct(e.acc, e.total); return `<span class="pill ${p >= 70 ? 'p-acc' : p >= 50 ? 'p-none' : 'p-no'}" style="padding:3px 7px">${e.acc}</span>`; }).join('')}</div>`;

  const roles = (team.member_roles || []).filter(r => st.f.role.has(r.role));
  const sort = st.teamPlayerSort;
  const list = sortPlayers([...stats.values()], sort);
  const seg = [['low', 'Lowest first'], ['high', 'Highest first'], ['noreply', 'No reply']];
  const mc = multiCodeIn(ctx.evs);
  return `${head}
    ${heroHtml(ctx, t, extra)}
    ${splitHtml(ctx.evs)}
    ${codeCardsHtml(ctx.evs)}
    ${roles.length ? `<div class="h">Squad</div><div class="card"><div class="role-pills">${roles.map((r, i) =>
      `<button class="pill ${i === 0 ? 'p-acc' : 'p-none'}" data-act="roster" data-v="${esc(r.role)}">${esc(r.role)} ${r.count}</button>`).join('')}</div></div>` : ''}
    <div class="h">Players ${seeAll('teamPlayers', list.length, LIMIT.teamPlayers, full)}</div>
    <div class="seg sub-seg no-pdf">${seg.map(([v, l]) => `<button class="${sort === v ? 'on' : ''}" data-act="sort" data-k="teamPlayerSort" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="card">${shown('teamPlayers', list, LIMIT.teamPlayers, full).map(p => playerRowHtml(p, sort, false)).join('')}</div>
    ${monthsHtml(ctx)}
    <div class="h">Events ${seeAll('teamEvents', ctx.evs.length, LIMIT.teamEvents, full)}</div>
    <div class="card">${shown('teamEvents', ctx.evs, LIMIT.teamEvents, full).map(e => eventRowHtml(e, mc, false)).join('')}</div>`;
}

/* Players tab */
function sortPlayers(list, sort) {
  const by = {
    low: (a, b) => a.rate - b.rate || b.events - a.events,
    high: (a, b) => b.rate - a.rate || b.events - a.events,
    dropping: (a, b) => (a.delta ?? 999) - (b.delta ?? 999) || a.rate - b.rate,
    rising: (a, b) => (b.delta ?? -999) - (a.delta ?? -999) || b.rate - a.rate,
    noreply: (a, b) => (b.nr / b.events) - (a.nr / a.events) || b.nr - a.nr,
  };
  return list.sort(by[sort] || by.low);
}

function playerRowHtml(p, sort, showTeam) {
  const badges = [];
  if (showTeam) badges.push(esc([...p.teams].join(', ')));
  if (sort === 'noreply' || (p.events >= 3 && p.nr / p.events >= 0.5)) badges.push(`<span class="warn-t">No reply ${p.nr}</span>`);
  if (p.delta != null && (Math.abs(p.delta) >= 15 || sort === 'dropping' || sort === 'rising') && p.delta !== 0) {
    badges.push(`<span class="${p.delta > 0 ? 'up-t' : 'down-t'}">${p.delta > 0 ? '▲' : '▼'} ${Math.abs(p.delta)}%</span>`);
  }
  const dots = p.recent.slice(0, 10).reverse().map(c => `<b class="d-${c}"></b>`).join('');
  return `<button class="row" data-act="player" data-id="${p.id}" data-name="${esc(p.name)}">
    <div class="avatar">${esc(initials(p.name))}</div>
    <div class="grow"><div class="t">${esc(p.name)}</div>${badges.length ? `<div class="m">${badges.join(' · ')}</div>` : ''}<div class="fd">${dots}</div></div>
    <div class="pct c-${band(p.rate)}">${p.rate}%</div><span class="chev no-pdf">›</span></button>`;
}

function playersHtml(full) {
  const ctx = context();
  if (!ctx.evs.length) return noEvents();
  const stats = playerStats(ctx.evs);
  movers(ctx, stats);
  const all = [...stats.values()];
  const lo = all.filter(p => p.rate < 50).length, mid = all.filter(p => p.rate >= 50 && p.rate < 70).length, hi = all.length - lo - mid;
  const avg = totals(ctx.evs).pct;
  const q = st.playerQ.trim().toLowerCase();
  let list = q ? all.filter(p => p.name.toLowerCase().includes(q)) : all;
  if (st.playerSort === 'dropping') list = list.filter(p => p.delta != null && p.delta < 0);
  if (st.playerSort === 'rising')   list = list.filter(p => p.delta != null && p.delta > 0);
  if (st.playerSort === 'noreply')  list = list.filter(p => p.nr > 0);
  sortPlayers(list, st.playerSort);
  const seg = [['low', 'Lowest'], ['high', 'Highest'], ['dropping', 'Dropping'], ['rising', 'Rising'], ['noreply', 'No reply']];
  const label = Object.fromEntries(seg)[st.playerSort];
  return `
    <div class="card"><div class="type-row"><div class="big">${plural(all.length, 'player')}</div><div class="sub">Average ${avg}%</div></div>
      <div class="dist">${lo ? `<i style="flex:${lo};background:var(--no)"></i>` : ''}${mid ? `<i style="flex:${mid};background:var(--warn)"></i>` : ''}${hi ? `<i style="flex:${hi};background:var(--accent)"></i>` : ''}</div>
      <div class="legend"><span><b style="background:var(--no)"></b>Under 50% · ${lo}</span><span><b style="background:var(--warn)"></b>50–69% · ${mid}</span><span><b style="background:var(--accent)"></b>70%+ · ${hi}</span></div></div>
    <input class="search no-pdf" id="playerSearch" placeholder="Search players" value="${esc(st.playerQ)}" autocomplete="off">
    <div class="seg sub-seg no-pdf">${seg.map(([v, l]) => `<button class="${st.playerSort === v ? 'on' : ''}" data-act="sort" data-k="playerSort" data-v="${v}">${l}</button>`).join('')}</div>
    ${full ? `<div class="h">${esc(label)} first</div>` : ''}
    <div class="card" id="playerList">${playerListHtml(list, full)}</div>
    <div class="h" style="justify-content:center">${seeAll('players', list.length, LIMIT.players, full)}</div>
    ${full ? '' : `<div class="note no-pdf">Tap a player to open their full stats page</div>`}`;
}
function playerListHtml(list, full) {
  return shown('players', list, LIMIT.players, full).map(p => playerRowHtml(p, st.playerSort, true)).join('')
    || `<div class="empty">${st.playerQ ? 'No players match' : 'Nobody here for this period'}</div>`;
}

/* Squads tab */
function squadModel(ctx) {
  const withPicks = ctx.evs.filter(e => e.members.some(m => m.squad_id));
  const teamIds = new Set(withPicks.map(e => e.team_id));
  const pool = playerStats(ctx.evs.filter(e => teamIds.has(e.team_id)));
  const picks = new Map();     // member -> Map(squad -> count)
  const squads = new Map();    // squad -> { events:Set, members: Map(member -> count) }
  for (const e of withPicks) {
    for (const m of e.members) {
      if (!m.squad_id) continue;
      if (!picks.has(m.member_id)) picks.set(m.member_id, new Map());
      const pm = picks.get(m.member_id); pm.set(m.squad_id, (pm.get(m.squad_id) || 0) + 1);
      if (!squads.has(m.squad_id)) squads.set(m.squad_id, { id: m.squad_id, events: new Set(), members: new Map() });
      const s = squads.get(m.squad_id); s.events.add(e.id); s.members.set(m.member_id, (s.members.get(m.member_id) || 0) + 1);
    }
  }
  // How many picked matches each player was in the running for
  const chances = new Map();
  for (const e of withPicks) for (const m of e.members) chances.set(m.member_id, (chances.get(m.member_id) || 0) + 1);
  const sqName = id => raw.squads.get(id)?.squad_name || 'Squad';
  const sqSeq = id => raw.squads.get(id)?.seq ?? 999;
  const sqHex = id => raw.squads.get(id)?.hex || '#64748B';
  // Name squads with their team when the view spans more than one team
  const teamOf = new Map(withPicks.map(e => [e.team_id, e.team_name]));
  const sqTeam = id => teamOf.size > 1 ? teamOf.get(raw.squads.get(id)?.team_id) || '' : '';
  const sqLabel = id => `${sqTeam(id)} ${sqName(id)}`.trim();
  return { withPicks, pool, picks, squads, chances, sqName, sqSeq, sqHex, sqTeam, sqLabel };
}

const rgba = (hex, a) => { const h = hex.replace('#', ''); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
const sqBadge = (sm, id) => { const c = sm.sqHex(id); return `<div class="sq-badge" style="background:${rgba(c, 0.18)};color:${c};border-color:${rgba(c, 0.45)}">${esc(initials(sm.sqName(id)))}</div>`; };
// Horizontal bar made of squad-coloured pieces; width is relative to max
const stackBar = (sm, m, max) => `<div class="sbar">${[...m.entries()].sort((a, b) => sm.sqSeq(a[0]) - sm.sqSeq(b[0]))
  .map(([sid, n]) => `<i style="width:${(n / max) * 100}%;background:${sm.sqHex(sid)}"></i>`).join('')}</div>`;

function donut(segs, big, small) {
  const total = segs.reduce((s, x) => s + x.v, 0) || 1, gap = segs.length > 1 ? 1.2 : 0;
  let off = 0;
  const arcs = segs.map(x => {
    const len = (x.v / total) * 100, d = Math.max(len - gap, 0.4);
    const c = `<circle cx="21" cy="21" r="15.5" fill="none" stroke="${x.c}" stroke-width="6" pathLength="100" stroke-dasharray="${d} ${100 - d}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;
    off += len; return c;
  }).join('');
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="${esc(small)}">
    <circle cx="21" cy="21" r="15.5" fill="none" stroke="#252A35" stroke-width="6"/>${arcs}
    <text x="21" y="21.5" text-anchor="middle" font-size="8" font-weight="700" fill="#F1F4F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">${big}</text>
    <text x="21" y="27" text-anchor="middle" font-size="3.4" fill="#A1A1A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">${esc(small)}</text>
  </svg>`;
}

function squadsHtml(full) {
  const ctx = context();
  if (!ctx.evs.length) return noEvents();
  const sm = squadModel(ctx);
  if (!sm.withPicks.length) return `<div class="card"><div class="empty">No match squads saved in this period</div></div>`;
  const poolN = sm.pool.size, picked = sm.picks.size;
  const multi = [...sm.picks.values()].filter(m => m.size >= 2).length;
  const p = pct(picked, poolN);
  const most = [...sm.picks.entries()].map(([id, m]) => ({ id, name: sm.pool.get(id)?.name || nameOf(id), total: [...m.values()].reduce((a, b) => a + b, 0), m, of: sm.chances.get(id) || 0 }))
    .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  const unpicked = [...sm.pool.values()].filter(pl => !sm.picks.has(pl.id)).sort((a, b) => b.rate - a.rate);
  const squads = [...sm.squads.values()].map(s => ({ ...s, places: [...s.members.values()].reduce((a, b) => a + b, 0) }))
    .sort((a, b) => sm.sqTeam(a.id).localeCompare(sm.sqTeam(b.id)) || sm.sqSeq(a.id) - sm.sqSeq(b.id) || sm.sqName(a.id).localeCompare(sm.sqName(b.id)));
  const places = squads.reduce((t, s) => t + s.places, 0);
  const maxPlaces = Math.max(...squads.map(s => s.places), 1);
  const maxPick = most.length ? most[0].total : 1;

  // Squad split donut (biggest 7, the rest as Other)
  const bySize = [...squads].sort((a, b) => b.places - a.places);
  const segs = bySize.slice(0, 7).map(s => ({ v: s.places, c: sm.sqHex(s.id), label: sm.sqName(s.id), team: sm.sqTeam(s.id) }));
  if (bySize.length > 7) segs.push({ v: bySize.slice(7).reduce((t, s) => t + s.places, 0), c: '#64748B', label: `${bySize.length - 7} other squads`, team: '' });
  const split = `<div class="h">Squad split</div><div class="card"><div class="split">${donut(segs, places, 'places')}
    <div class="split-leg">${segs.map(x => `<div><b style="background:${x.c}"></b><span class="grow">${esc(x.label)}${x.team ? `<small>${esc(x.team)}</small>` : ''}</span><em>${x.v}</em><small>${pct(x.v, places)}%</small></div>`).join('')}</div></div></div>`;

  // Picks by month, stacked by squad
  const ms = months({ ...ctx, evs: sm.withPicks });
  let byMonth = '';
  if (ms.length >= 2) {
    const cols = ms.map(m => {
      const c = new Map();
      for (const e of m.evs) for (const x of e.members) if (x.squad_id) c.set(x.squad_id, (c.get(x.squad_id) || 0) + 1);
      return { m, c, total: [...c.values()].reduce((a, b) => a + b, 0) };
    });
    const mx = Math.max(...cols.map(x => x.total), 1);
    byMonth = `<div class="h">Squad places by month</div><div class="card"><div class="sbars">${cols.map(({ m, c, total }) => {
      const label = ms.length > 6 ? MON[m.d.getMonth()].charAt(0) : MON[m.d.getMonth()];
      const segsH = [...c.entries()].sort((a, b) => sm.sqSeq(b[0]) - sm.sqSeq(a[0]))
        .map(([sid, n]) => `<i style="height:${(n / mx) * 100}%;background:${sm.sqHex(sid)}"></i>`).join('');
      return `<div><em>${total || '–'}</em><div class="col">${segsH || '<i class="nil"></i>'}</div><span>${label}</span></div>`;
    }).join('')}</div></div>`;
  }

  // Share of matches each player was picked for
  const B = [['Never picked', '#EF4444'], ['Under a third', '#F97316'], ['A third to half', '#F59E0B'], ['Over half', '#A3D65C'], ['Every match', '#87C232']];
  const buckets = B.map(() => 0);
  for (const pl of sm.pool.values()) {
    const of = sm.chances.get(pl.id) || 0; if (!of) continue;
    const n = sm.picks.has(pl.id) ? [...sm.picks.get(pl.id).values()].reduce((a, b) => a + b, 0) : 0;
    const r = n / of;
    buckets[n === 0 ? 0 : r >= 1 ? 4 : r > 0.5 ? 3 : r >= 1 / 3 ? 2 : 1]++;
  }
  const bMax = Math.max(...buckets, 1);
  const share = `<div class="h">How often players are picked</div><div class="card">${B.map(([l, c], i) =>
    `<div class="hbar"><span>${l}</span><div>${buckets[i] ? `<i style="width:${(buckets[i] / bMax) * 100}%;background:${c}"></i>` : ''}</div><b>${buckets[i]}</b></div>`).join('')}
    <div class="note">Share of their team's picked matches</div></div>`;

  return `
    <div class="card"><div class="hero">${ring(p, 'ring', bandHex(p))}<div>
      <div class="big">${picked} of ${poolN} players picked</div><div class="sub">For at least one match squad</div>
      <div class="trend flat">${unpicked.length ? `${plural(unpicked.length, 'player')} not picked yet` : 'Everyone has been picked'}</div></div></div></div>
    <div class="two"><div class="card"><div class="k">${places}</div><div class="lbl">Squad places</div>
        <div class="mini">${squads.map(s => `<i style="width:${pct(s.places, places)}%;background:${sm.sqHex(s.id)}"></i>`).join('')}</div>
        <div class="code-sub">across ${plural(sm.withPicks.length, 'match', 'matches')}</div></div>
      <div class="card"><div class="k">${multi}</div><div class="lbl">Played 2+ squads</div>
        <div class="mini"><i style="width:${pct(multi, picked)}%;background:#A855F7"></i></div>
        <div class="code-sub">${pct(multi, picked)}% of picked players</div></div></div>
    ${split}
    ${byMonth}
    <div class="h">Squads</div>
    <div class="card">${squads.map(s => {
      const top = [...s.members.entries()].sort((a, b) => b[1] - a[1])[0];
      const topName = top ? (sm.pool.get(top[0])?.name || nameOf(top[0])) : '';
      const c = sm.sqHex(s.id);
      return `<button class="row" data-act="squad" data-id="${s.id}">${sqBadge(sm, s.id)}<div class="grow"><div class="t">${esc(sm.sqLabel(s.id))}</div>
        <div class="m">${plural(s.events.size, 'match', 'matches')}${top ? ` · most picked ${esc(topName)} ×${top[1]}` : ''}</div>
        <div class="track"><i style="width:${(s.places / maxPlaces) * 100}%;background:${c}"></i></div></div>
        <span class="pill" style="background:${rgba(c, 0.16)};color:${c}">${plural(s.members.size, 'player')}</span><span class="chev no-pdf">›</span></button>`;
    }).join('')}</div>
    ${share}
    <div class="h">Most picked ${seeAll('picked', most.length, LIMIT.picked, full)}</div>
    <div class="card">${shown('picked', most, LIMIT.picked, full).map((pl, i) => `<button class="row" data-act="player" data-id="${pl.id}" data-name="${esc(pl.name)}">
      <div class="medal${i < 3 ? ` m${i + 1}` : ''}">${i + 1}</div><div class="grow"><div class="t">${esc(pl.name)}</div>
      <div class="m">${[...pl.m.entries()].sort((a, b) => b[1] - a[1]).map(([sid, n]) => `<b class="sq-dot" style="background:${sm.sqHex(sid)}"></b>${esc(sm.sqName(sid))} ×${n}`).join(' &nbsp;')}</div>
      ${stackBar(sm, pl.m, maxPick)}</div>
      <div class="pct c-hi">${pl.total}${pl.of ? `<small>of ${pl.of}</small>` : ''}</div></button>`).join('')}</div>
    ${unpicked.length ? `<div class="h">Not picked yet ${seeAll('unpicked', unpicked.length, LIMIT.unpicked, full)}</div>
    <div class="card">${shown('unpicked', unpicked, LIMIT.unpicked, full).map(pl => `<button class="row" data-act="player" data-id="${pl.id}" data-name="${esc(pl.name)}">
      ${ring(pl.rate, 'ring-xs', bandHex(pl.rate), 10)}<div class="grow"><div class="t">${esc(pl.name)}</div>
      <div class="m">${esc([...pl.teams].join(', '))} · attendance ${pl.rate}%</div></div><span class="chev no-pdf">›</span></button>`).join('')}</div>` : ''}`;
}
function nameOf(memberId) {
  for (const e of raw.events) { const m = e.members.find(x => x.member_id === memberId); if (m) return m.name; }
  return 'Player';
}

/* ── Detail sheet ────────────────────────────────────────────────────────── */
function openSheet(s) {
  sheetState = s;
  renderSheet();
  document.getElementById('detailSheet').classList.add('open');
  document.querySelector('#detailSheet .sheet').scrollTop = 0;
}
function closeSheet() { document.getElementById('detailSheet').classList.remove('open'); sheetState = null; }
function renderSheet() { document.getElementById('detailBody').innerHTML = sheetHtml(sheetState, false); }

function sheetHtml(s, forPdf) {
  const head = (title, sub) => `${forPdf ? '' : '<div class="grab"></div>'}
    ${forPdf ? '' : `<div class="sheet-title"><b>${esc(title)}</b><button class="icon-btn" data-act="pdf-sheet" aria-label="Share PDF">${ICON_PDF}</button></div>`}
    ${sub && !forPdf ? `<div class="sub">${esc(sub)}</div>` : ''}`;
  const foot = forPdf ? '' : `<button class="share-btn" data-act="pdf-sheet">${ICON_PDF} Share PDF</button>`;

  if (s.kind === 'event') {
    const e = scopeEvent(s.id);
    if (!e) return head('Event', '') + '<div class="empty">Event not found</div>';
    const PILL = { accepted: '<span class="pill p-yes">Going</span>', declined: '<span class="pill p-no">Not going</span>', no_response: '<span class="pill p-none">No reply</span>' };
    const order = { accepted: 0, declined: 1, no_response: 2 };
    const list = e.members.filter(m => s.resp === 'all' || m.response === s.resp)
      .sort((a, b) => order[a.response] - order[b.response] || (a.name || '').localeCompare(b.name || ''));
    const seg = [['all', `All ${e.total}`], ['accepted', 'Going'], ['declined', 'Not going'], ['no_response', 'No reply']];
    return `${head(eventTitle(e), eventSub(e))}
      <div class="counts">
        <button class="${s.resp === 'accepted' ? 'on' : ''}" data-act="resp" data-v="accepted" style="background:var(--yes-dim);color:var(--yes)"><b>${e.acc}</b><span>Going</span></button>
        <button class="${s.resp === 'declined' ? 'on' : ''}" data-act="resp" data-v="declined" style="background:var(--no-dim);color:var(--no-text)"><b>${e.dec}</b><span>Not going</span></button>
        <button class="${s.resp === 'no_response' ? 'on' : ''}" data-act="resp" data-v="no_response" style="background:var(--none-dim);color:var(--text-2)"><b>${e.nr}</b><span>No reply</span></button>
      </div>
      ${forPdf ? '' : `<div class="seg sub-seg">${seg.map(([v, l]) => `<button class="${s.resp === v ? 'on' : ''}" data-act="resp" data-v="${v}">${l}</button>`).join('')}</div>`}
      <div>${list.map(m => {
        const sq = m.squad_id ? raw.squads.get(m.squad_id)?.squad_name : null;
        return `<button class="row" data-act="player" data-id="${m.member_id}" data-name="${esc(m.name)}"><div class="avatar">${esc(initials(m.name))}</div>
          <div class="grow"><div class="t">${esc(m.name)}</div><div class="m">${esc([m.role, sq].filter(Boolean).join(' · '))}</div></div>${PILL[m.response] || PILL.no_response}</button>`;
      }).join('') || '<div class="empty">Nobody here</div>'}</div>${foot}`;
  }

  if (s.kind === 'squad') {
    const ctx = context(), sm = squadModel(ctx), sq = sm.squads.get(s.id), c = sm.sqHex(s.id);
    const n = sq ? sq.events.size : 0;
    const rows = sq ? [...sq.members.entries()].map(([id, k]) => ({ id, n: k, name: sm.pool.get(id)?.name || nameOf(id) })).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name)) : [];
    return `${head(sm.sqLabel(s.id), `${ctx.r.label} · ${plural(n, 'match', 'matches')} · ${plural(rows.length, 'player')}`)}
      <div class="sq-strip" style="background:${c}"></div>
      <div style="margin-top:12px">${rows.map(r => `<button class="row" data-act="player" data-id="${r.id}" data-name="${esc(r.name)}"><div class="avatar" style="background:${rgba(c, 0.18)};color:${c}">${esc(initials(r.name))}</div>
        <div class="grow"><div class="t">${esc(r.name)}</div><div class="track"><i style="width:${pct(r.n, n)}%;background:${c}"></i></div></div>
        <span class="pill" style="background:${rgba(c, 0.16)};color:${c}">${r.n} of ${n}</span></button>`).join('')}</div>${foot}`;
  }

  if (s.kind === 'roster') {
    const team = raw.teams.find(t => t.team_id === st.teamPage);
    const role = (team?.member_roles || []).find(r => r.role === s.role);
    const stats = playerStats(context(st.teamPage).evs);
    const rows = (role?.members || []).map(m => ({ ...m, p: stats.get(m.member_id) })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    return `${head(`${team?.team_name || ''} · ${s.role}`, `${plural(rows.length, 'member')} · attendance for ${periodRange().label}`)}
      <div style="margin-top:12px">${rows.map(r => `<button class="row" data-act="player" data-id="${r.member_id}" data-name="${esc(r.name)}"><div class="avatar">${esc(initials(r.name))}</div>
        <div class="grow"><div class="t">${esc(r.name)}</div>${r.p ? `<div class="m">${plural(r.p.events, 'event')}</div>` : ''}</div>
        ${r.p ? `<div class="pct c-${band(r.p.rate)}">${r.p.rate}%</div>` : '<span class="pill p-none">No events</span>'}</button>`).join('')}</div>${foot}`;
  }
  return '';
}

function scopeEvent(id) {
  const e = raw.events.find(x => x.id === id);
  if (!e) return null;
  const members = e.members.filter(m => st.f.role.has(m.role));
  let acc = 0, dec = 0;
  members.forEach(m => { if (m.response === 'accepted') acc++; else if (m.response === 'declined') dec++; });
  return { ...e, members, acc, dec, nr: members.length - acc - dec, total: members.length };
}
function eventSub(e) {
  const d = e.date;
  const kind = [e.code, e.type].filter(Boolean).join(' ').toLowerCase();
  return [e.team_name, kind ? kind.charAt(0).toUpperCase() + kind.slice(1) : null, `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`, e.home_away]
    .filter(Boolean).join(' · ');
}

/* ── Player page (member-analytics.html, opened in place) ───────────────── */
function openPlayer(id, name) {

  document.getElementById('pfName').textContent = name || '';
  document.getElementById('pfIframe').src = `member-analytics.html?member_id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;
