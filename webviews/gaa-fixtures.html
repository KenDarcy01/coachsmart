<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Fixtures — CoachSmart</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:  #87C232;
  --dark:   #111418;
  --card:   #1E222B;
  --card2:  #252A35;
  --border: rgba(255,255,255,0.07);
  --text:   #E7EBEE;
  --muted:  #9CA3AF;
  --red:    #e05252;
  --amber:  #F5A623;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { font-family: 'DM Sans', sans-serif; font-size: 15px; background: var(--dark); color: var(--text); height: 100%; overflow: hidden; }

/* ── Layout ── */
.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 268px; flex-shrink: 0;
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }

.logo-area {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2.5px; line-height: 1; }
.logo span { color: var(--green); }
.logo-sub { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

.s-section { padding: 14px 12px 6px; }
.s-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding: 0 2px; }

/* filter inputs */
.filter-input {
  width: 100%; padding: 8px 10px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 14px;
  font-family: 'DM Sans', sans-serif;
}
.filter-input:focus { outline: none; border-color: var(--green); }
.filter-input::placeholder { color: var(--muted); }

.fetch-btn {
  margin: 12px; width: calc(100% - 24px);
  padding: 12px; background: var(--green); border: none;
  border-radius: 8px; color: #111; font-size: 15px; font-weight: 700;
  font-family: 'DM Sans', sans-serif; cursor: pointer; flex-shrink: 0;
  transition: opacity .15s;
}
.fetch-btn:hover { opacity: 0.88; }
.fetch-btn:disabled { opacity: 0.4; cursor: default; }

/* club picker + chips */
.club-select {
  width: 100%; padding: 8px 10px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 14px;
  font-family: 'DM Sans', sans-serif;
}
.club-select:focus { outline: none; border-color: var(--green); }
.date-row { display: flex; gap: 6px; margin-top: 6px; }
.date-row input { flex: 1; min-width: 0; padding: 7px 8px; font-size: 13px; color-scheme: dark; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 11px; border-radius: 16px; cursor: pointer; user-select: none;
  font-size: 13px; font-weight: 600; color: var(--muted);
  background: var(--card2); border: 1px solid var(--border); transition: all .15s;
}
.chip:hover { color: var(--text); }
.chip.on { color: var(--green); background: rgba(135,194,50,0.1); border-color: rgba(135,194,50,0.35); }
.chip .n { font-weight: 500; opacity: .7; margin-left: 3px; }
.s-hint { font-size: 12px; color: var(--muted); padding: 4px 2px 0; line-height: 1.4; }
/* ── Main area ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* competition tabs */
.comp-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
  padding: 0 4px;
}
.comp-tabs::-webkit-scrollbar { height: 3px; }
.comp-tabs::-webkit-scrollbar-thumb { background: var(--border); }
.comp-tab {
  padding: 13px 18px 11px; font-size: 14px; font-weight: 500; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .15s; margin-bottom: -1px; flex-shrink: 0;
}
.comp-tab:hover { color: var(--text); }
.comp-tab.active { color: var(--green); border-bottom-color: var(--green); }

/* content panel */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 18px 20px; }

/* sub-tabs */
.sub-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-shrink: 0; }
.sub-tab {
  padding: 6px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all .15s; border: 1px solid transparent;
}
.sub-tab:hover { color: var(--text); background: var(--card2); }
.sub-tab.active { color: var(--green); background: rgba(135,194,50,0.1); border-color: rgba(135,194,50,0.28); }
.sub-tab .badge {
  display: inline-block; margin-left: 5px;
  background: var(--card2); border-radius: 10px;
  padding: 0 6px; font-size: 11px; font-weight: 700; color: var(--muted);
  vertical-align: middle;
}
.sub-tab.active .badge { background: rgba(135,194,50,0.15); color: var(--green); }

/* export row */
.table-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; flex-shrink: 0;
}
.row-count { font-size: 14px; color: var(--muted); }
.export-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 14px;
  background: var(--card2); border: 1px solid rgba(255,255,255,0.13);
  border-radius: 6px; color: var(--text); font-size: 13px; font-weight: 500;
  font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all .15s;
}
.export-btn:hover { background: var(--card); border-color: rgba(255,255,255,0.22); }

/* table */
.table-wrap { flex: 1; overflow-y: auto; border-radius: 10px; border: 1px solid var(--border); }
.table-wrap::-webkit-scrollbar { width: 6px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--card); padding: 10px 14px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 1px solid var(--border); white-space: nowrap;
  text-align: left;
}
thead th.r { text-align: right; }
thead th.c { text-align: center; }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.025); }
td { padding: 10px 14px; font-size: 15px; vertical-align: middle; }
td.r { text-align: right; }
td.c { text-align: center; }
td.muted { color: var(--muted); }
td.nowrap { white-space: nowrap; }

.team-name { font-weight: 500; }
.score-pill {
  display: inline-block; padding: 3px 9px; border-radius: 4px;
  font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
  background: var(--card2);
}
.score-win { background: rgba(135,194,50,0.15); color: var(--green); }
.score-lose { opacity: 0.6; }
.vs { color: var(--muted); font-size: 13px; margin: 0 4px; }
.pos { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.pos.top { color: var(--green); }
td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
td.pts { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; color: var(--text); }

/* empty state */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px; color: var(--muted);
}
.empty-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.35; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 13px; line-height: 1.5; max-width: 300px; }

/* loading */
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border); border-top-color: var(--green);
  border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* error banner */
.error-row td { text-align: center; padding: 28px; color: var(--red); font-size: 13px; }
.no-data-row td { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }

/* ── Mobile ── */
@media (max-width: 680px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar-scroll { max-height: 260px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo">COACH<span>SMART</span></div>
      <div class="logo-sub">GAA Fixtures</div>
    </div>

    <div class="sidebar-scroll">
      <div class="s-section">
        <div class="s-label">Club</div>
        <select class="club-select" id="clubSelect" onchange="onClubChange()"></select>
        <div class="s-hint">Clubs you've played appear here after a fetch.</div>
      </div>

      <div class="s-section">
        <div class="s-label">Dates</div>
        <select class="club-select" id="rangeSelect" onchange="onRangeChange()">
          <option value="default">Last week + next 5 weeks</option>
          <option value="next14">Next 2 weeks</option>
          <option value="past28">Last 4 weeks</option>
          <option value="season">Last 8 weeks + next 8 weeks</option>
          <option value="custom">Custom…</option>
        </select>
        <div class="date-row" id="customDates" style="display:none">
          <input type="date" class="filter-input" id="fromDate">
          <input type="date" class="filter-input" id="toDate">
        </div>
      </div>

      <div id="liveFilters" style="display:none">
        <div class="s-section" id="codeSection">
          <div class="s-label">Code</div>
          <div class="chips" id="codeChips"></div>
        </div>
        <div class="s-section">
          <div class="s-label">Age group</div>
          <div class="chips" id="ageChips"></div>
        </div>
      </div>

    </div>

    <button class="fetch-btn" id="fetchBtn" onclick="fetchClub()">Fetch Fixtures</button>
  </aside>

  <!-- ── Main ── -->
  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🏐</div>
      <div class="empty-title">No data yet</div>
      <div class="empty-sub">Pick your club and dates, then hit Fetch Fixtures. You can narrow by age group and competition afterwards.</div>
    </div>
  </div>

</div>

<script>
const EDGE = 'https://gyfporsbdftvtakdvukt.supabase.co/functions/v1/gaa-fixtures';

// ── State ──────────────────────────────────────────────────────────────────
let fetchedData  = {};   // {[compId]: {name, fixtures, results, standings, error}}
let activeComp   = null; // compId string
let activeSubs   = {};   // {[compId]: 'fixtures'|'results'|'standings'}

// Club mode: one fetch per club, then every filter runs on these games locally
let clubGames    = [];   // games from ?type=club
let selAges      = new Set();
let selCodes     = new Set();
const DEFAULT_CLUB = { id: '3561', name: 'Clontarf' };
// Camogie is a separate Sportlomo organisation with its own club IDs, keyed
// here by club name. Learned from camogie opponents like the football IDs are.
const CAMOGIE_SEED = { Clontarf: '40597' };

// ── Club mode ──────────────────────────────────────────────────────────────
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function recall(key, dflt) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? dflt; } catch { return dflt; }
}

// Clubs we know an ID for: the default, anything picked before, and every
// opponent seen in a fetch (Sportlomo gives each team's club ID).
function knownClubs() { return recall('gaa_known_clubs', { [DEFAULT_CLUB.id]: DEFAULT_CLUB.name }); }

function renderClubSelect() {
  const sel = recall('gaa_club', DEFAULT_CLUB);
  const clubs = { ...knownClubs(), [sel.id]: sel.name };
  const el = document.getElementById('clubSelect');
  el.innerHTML = Object.entries(clubs)
    .sort((a, b) => a[1].localeCompare(b[1]))
    .map(([id, name]) => `<option value="${esc(id)}" ${id === sel.id ? 'selected' : ''}>${esc(name)}</option>`)
    .join('') + '<option value="__other">Other club ID…</option>';
}

function onClubChange() {
  const el = document.getElementById('clubSelect');
  if (el.value === '__other') {
    const id = (prompt('Sportlomo club ID (the number in the club logo link, e.g. 3561 for Clontarf):') || '').replace(/\D/g, '');
    const name = id && (prompt('Club name:') || '').trim();
    if (id && name) {
      store('gaa_known_clubs', { ...knownClubs(), [id]: name });
      store('gaa_club', { id, name });
    }
    renderClubSelect();
    return;
  }
  store('gaa_club', { id: el.value, name: el.options[el.selectedIndex].text });
}

const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = n => new Date(Date.now() + n * 864e5);

function onRangeChange() {
  const v = document.getElementById('rangeSelect').value;
  store('gaa_range', v);
  document.getElementById('customDates').style.display = v === 'custom' ? '' : 'none';
}
function dateRange() {
  const v = document.getElementById('rangeSelect').value;
  if (v === 'custom') {
    const from = document.getElementById('fromDate').value, to = document.getElementById('toDate').value;
    if (from && to) return { from, to };
  }
  const [back, ahead] = { next14: [0, 14], past28: [28, 0], season: [56, 56] }[v] || [7, 35];
  return { from: isoDay(addDays(-back)), to: isoDay(addDays(ahead)) };
}

async function fetchClub() {
  const club = recall('gaa_club', DEFAULT_CLUB);
  const { from, to } = dateRange();
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  showLoading();
  try {
    const camogieId = recall('gaa_camogie_clubs', CAMOGIE_SEED)[club.name] || CAMOGIE_SEED[club.name];
    const url = `${EDGE}?type=club&format=json&results=1&club=${club.id}&clubName=${encodeURIComponent(club.name)}`
      + `&from=${from}&to=${to}` + (camogieId ? `&camogieClub=${camogieId}` : '');
    const res = await fetch(url);
    if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
    clubGames = await res.json();
  } catch (e) {
    btn.disabled = false;
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Could not load fixtures</div>
        <div class="empty-sub">${esc(e.message)}</div>
      </div>`;
    return;
  }
  btn.disabled = false;

  // Learn opponents' club IDs so they can be picked next time
  const known = knownClubs();
  const camogie = recall('gaa_camogie_clubs', CAMOGIE_SEED);
  clubGames.filter(g => g.code === 'Camogie').forEach(g => {
    if (g.homeClubId) camogie[g.home] = camogie[g.home] || g.homeClubId;
    if (g.awayClubId) camogie[g.away] = camogie[g.away] || g.awayClubId;
  });
  store('gaa_camogie_clubs', camogie);
  clubGames.filter(g => g.code !== 'Camogie').forEach(g => {
    if (g.homeClubId) known[g.homeClubId] = known[g.homeClubId] || g.home;
    if (g.awayClubId) known[g.awayClubId] = known[g.awayClubId] || g.away;
  });
  store('gaa_known_clubs', known);
  renderClubSelect();

  // Keep previous age picks where they still exist
  const ages = new Set(clubGames.map(g => g.age));
  const savedAges = recall('gaa_ages', []).filter(a => ages.has(a));
  selAges = new Set(savedAges.length ? savedAges : ages);
  const codes = new Set(clubGames.map(g => g.code));
  const savedCodes = recall('gaa_codes', []).filter(c => codes.has(c));
  selCodes = new Set(savedCodes.length ? savedCodes : codes);
  if (!clubGames.length) {
    document.getElementById('liveFilters').style.display = 'none';
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">No games</div>
        <div class="empty-sub">${esc(club.name)} has no games between ${from} and ${to}.</div>
      </div>`;
    return;
  }
  document.getElementById('liveFilters').style.display = '';
  applyClubFilters();
}

const ageOrder = a => { const m = a.match(/^U(\d+)/); return m ? +m[1] : 100; };

function applyClubFilters() {
  // Code chips (Football / Hurling), then age chips counted within the chosen codes
  const codeCounts = {};
  clubGames.forEach(g => { codeCounts[g.code] = (codeCounts[g.code] || 0) + 1; });
  document.getElementById('codeChips').innerHTML = Object.keys(codeCounts).sort()
    .map(c => `<div class="chip ${selCodes.has(c) ? 'on' : ''}" onclick="toggleCode('${esc(c)}')">${esc(c)}<span class="n">${codeCounts[c]}</span></div>`)
    .join('');
  const inCode = clubGames.filter(g => selCodes.has(g.code));
  const ageCounts = {};
  inCode.forEach(g => { ageCounts[g.age] = (ageCounts[g.age] || 0) + 1; });
  document.getElementById('ageChips').innerHTML = Object.keys(ageCounts)
    .sort((a, b) => ageOrder(a) - ageOrder(b) || a.localeCompare(b))
    .map(a => `<div class="chip ${selAges.has(a) ? 'on' : ''}" onclick="toggleAge('${esc(a)}')">${esc(a)}<span class="n">${ageCounts[a]}</span></div>`)
    .join('');

  // Rebuild the per-competition data the tabs render from
  const prev = fetchedData;
  const now = Date.now();
  fetchedData = {};
  inCode.filter(g => selAges.has(g.age)).forEach(g => {
    const d = fetchedData[g.competitionId] = fetchedData[g.competitionId] ||
      { name: g.competition, fixtures: [], results: [], standings: prev[g.competitionId]?.standings ?? null, error: null };
    // A past game with no score (conceded, postponed…) belongs with results, not upcoming
    (g.kind === 'result' || new Date(g.start).getTime() < now ? d.results : d.fixtures).push(g);
  });
  Object.keys(fetchedData).forEach(id => { if (!activeSubs[id]) activeSubs[id] = 'fixtures'; });

  if (!Object.keys(fetchedData).length) {
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Nothing selected</div>
        <div class="empty-sub">Pick at least one code and age group in the sidebar.</div>
      </div>`;
    return;
  }
  renderAll();
}

function toggleCode(c) {
  selCodes.has(c) ? selCodes.delete(c) : selCodes.add(c);
  store('gaa_codes', [...selCodes]);
  applyClubFilters();
}

function toggleAge(a) {
  selAges.has(a) ? selAges.delete(a) : selAges.add(a);
  store('gaa_ages', [...selAges]);
  applyClubFilters();
}
// League tables load only when a competition's Standings tab is opened
async function loadStandings(compId) {
  const d = fetchedData[compId];
  if (!d || d.standings !== null || d.loadingStandings) return;
  d.loadingStandings = true;
  try {
    const res = await fetch(`${EDGE}?comp=${compId}&type=table`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    d.standings = await res.json();
  } catch { d.standings = []; }
  d.loadingStandings = false;
  if (activeComp === compId) renderContent();
}

// ── Render ─────────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('main').innerHTML = `
    <div class="empty-state">
      <div class="spinner"></div>
      <div class="empty-sub">Fetching fixtures and standings…</div>
    </div>`;
}

function renderAll() {
  const ids = Object.keys(fetchedData);
  if (!ids.length) return;
  // 'all' is the virtual combined tab; default to it when multiple comps
  if (activeComp !== 'all' && !ids.includes(activeComp)) activeComp = ids.length > 1 ? 'all' : ids[0];

  const main = document.getElementById('main');
  main.innerHTML = '';

  // Competition tabs (only if >1)
  if (ids.length > 1) {
    const tabsEl = document.createElement('div');
    tabsEl.className = 'comp-tabs';
    // "All" combined tab first
    tabsEl.innerHTML = `<div class="comp-tab ${activeComp === 'all' ? 'active' : ''}" onclick="switchComp('all')">All</div>`;
    tabsEl.innerHTML += ids.map(id => {
      const d = fetchedData[id];
      return `<div class="comp-tab ${id === activeComp ? 'active' : ''}"
                   onclick="switchComp('${id}')">${esc(d.name)}</div>`;
    }).join('');
    main.appendChild(tabsEl);
  }

  // Content area
  const content = document.createElement('div');
  content.className = 'content';
  content.id = 'contentPanel';
  main.appendChild(content);

  renderContent();
}

function getViewData(compId) {
  // Returns {fixtures, results, standings} — merged across all comps for 'all'
  if (compId === 'all') {
    const all = Object.values(fetchedData);
    return {
      fixtures:  all.flatMap(d => d.fixtures),
      results:   all.flatMap(d => d.results),
      standings: [], // standings don't merge meaningfully
    };
  }
  return fetchedData[compId] || { fixtures: [], results: [], standings: [] };
}

function renderContent() {
  const panel = document.getElementById('contentPanel');
  panel.innerHTML = '';

  if (activeComp !== 'all') {
    const d = fetchedData[activeComp];
    if (d?.error) {
      panel.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div class="empty-title">Could not load</div>
          <div class="empty-sub">${esc(d.error)}</div>
        </div>`;
      return;
    }
  }

  const vd  = getViewData(activeComp);
  const sub = activeSubs[activeComp] || 'fixtures';

  // Sub-tabs — hide Standings on the combined "All" view
  const tabs = [
    { key: 'fixtures',  label: 'Fixtures',  count: vd.fixtures.length  },
    { key: 'results',   label: 'Results',   count: vd.results.length   },
    ...(activeComp !== 'all' ? [{ key: 'standings', label: 'Standings', count: vd.standings?.length ?? '' }] : []),
  ];

  const subEl = document.createElement('div');
  subEl.className = 'sub-tabs';
  subEl.innerHTML = tabs.map(t => `
    <div class="sub-tab ${t.key === sub ? 'active' : ''}" onclick="switchSub('${t.key}')">
      ${t.label}${t.count === '' ? '' : `<span class="badge">${t.count}</span>`}
    </div>
  `).join('');
  panel.appendChild(subEl);

  // Toolbar
  if (sub === 'standings' && vd.standings === null) {
    loadStandings(activeComp);
    panel.insertAdjacentHTML('beforeend', `
      <div class="empty-state"><div class="spinner"></div><div class="empty-sub">Loading league table…</div></div>`);
    return;
  }
  const rowCount = sub === 'standings' ? vd.standings.length : sub === 'results' ? vd.results.length : vd.fixtures.length;
  const toolbar  = document.createElement('div');
  toolbar.className = 'table-toolbar';
  toolbar.innerHTML = `
    <span class="row-count">${rowCount} ${sub === 'standings' ? 'team' : 'game'}${rowCount !== 1 ? 's' : ''}</span>
    <button class="export-btn" onclick="exportCsv('${activeComp}','${sub}')">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Export CSV
    </button>`;
  panel.appendChild(toolbar);

  // Table
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  if (sub === 'fixtures')  wrap.innerHTML = buildFixturesTable(vd.fixtures, activeComp === 'all');
  if (sub === 'results')   wrap.innerHTML = buildResultsTable(vd.results, activeComp === 'all');
  if (sub === 'standings') wrap.innerHTML = buildStandingsTable(vd.standings);
  panel.appendChild(wrap);
}

function switchComp(id) {
  activeComp = id;
  document.querySelectorAll('.comp-tab').forEach((el, i) => {
    // first tab is "All" when multiple comps
    const ids = Object.keys(fetchedData);
    const tabId = ids.length > 1 ? (i === 0 ? 'all' : ids[i - 1]) : ids[i];
    el.classList.toggle('active', tabId === id);
  });
  renderContent();
}

function switchSub(sub) {
  activeSubs[activeComp] = sub;
  renderContent();
}

// ── Table builders ─────────────────────────────────────────────────────────
function fmtDate(iso) {
  const d = new Date(iso);
  return new Intl.DateTimeFormat('en-IE', {
    timeZone: 'Europe/Dublin', weekday: 'short', day: 'numeric',
    month: 'short', hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(d);
}

function buildFixturesTable(rows, showComp) {
  if (!rows.length) return '<table><thead><tr><th colspan="5"><span style="color:var(--muted)">No upcoming fixtures</span></th></tr></thead></table>';
  const sorted = [...rows].sort((a, b) => new Date(a.start) - new Date(b.start));
  return `<table>
    <thead><tr>
      <th>Date / Time</th>${showComp ? '<th>Competition</th>' : ''}<th>Home</th><th>Away</th><th>Venue</th><th>Note</th>
    </tr></thead>
    <tbody>${sorted.map(g => `
      <tr>
        <td class="nowrap muted">${fmtDate(g.start)}</td>${showComp ? `<td class="muted">${esc(g.competition)}</td>` : ''}
        <td class="team-name">${esc(g.home)}</td>
        <td class="team-name">${esc(g.away)}</td>
        <td class="muted">${esc(g.venue || '—')}</td>
        <td class="muted">${esc(g.note || '')}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

function parseScore(s) {
  if (!s) return null;
  const [h, a] = s.split(' v ');
  const total = part => {
    const m = (part || '').match(/(\d+)\s*-\s*(\d+)/);
    return m ? +m[1] * 3 + +m[2] : 0;
  };
  return { home: h?.trim() || '', away: a?.trim() || '', homeTotal: total(h), awayTotal: total(a) };
}

function buildResultsTable(rows, showComp) {
  if (!rows.length) return '<table><thead><tr><th colspan="5"><span style="color:var(--muted)">No results yet</span></th></tr></thead></table>';
  const sorted = [...rows].sort((a, b) => new Date(b.start) - new Date(a.start));
  return `<table>
    <thead><tr>
      <th>Date</th>${showComp ? '<th>Competition</th>' : ''}<th>Home</th><th class="c">Score</th><th>Away</th><th>Venue</th>
    </tr></thead>
    <tbody>${sorted.map(g => {
      const sc = parseScore(g.score);
      const hWin = sc && sc.homeTotal > sc.awayTotal;
      const aWin = sc && sc.awayTotal > sc.homeTotal;
      return `
      <tr>
        <td class="nowrap muted">${fmtDate(g.start)}</td>${showComp ? `<td class="muted">${esc(g.competition)}</td>` : ''}
        <td class="team-name" style="${hWin ? '' : 'opacity:.55'}">${esc(g.home)}</td>
        <td class="c nowrap">
          ${sc
            ? `<span class="score-pill ${hWin ? 'score-win' : ''}">${esc(sc.home)}</span>
               <span class="vs">v</span>
               <span class="score-pill ${aWin ? 'score-win' : ''}">${esc(sc.away)}</span>`
            : '<span class="muted">—</span>'}
        </td>
        <td class="team-name" style="${aWin ? '' : 'opacity:.55'}">${esc(g.away)}</td>
        <td class="muted">${esc(g.venue || '—')}</td>
      </tr>`;
    }).join('')}
    </tbody></table>`;
}

function buildStandingsTable(rows) {
  if (!rows.length) return '<table><thead><tr><th colspan="7"><span style="color:var(--muted)">No standings available for this competition</span></th></tr></thead></table>';
  return `<table>
    <thead><tr>
      <th class="r">Pos</th><th>Team</th>
      <th class="r">P</th><th class="r">W</th><th class="r">D</th><th class="r">L</th><th class="r">Pts</th>
    </tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td class="r"><span class="pos ${r.position <= 2 ? 'top' : ''}">${r.position}</span></td>
        <td class="team-name">${esc(r.team)}</td>
        <td class="num">${r.played}</td>
        <td class="num">${r.won}</td>
        <td class="num">${r.drawn}</td>
        <td class="num">${r.lost}</td>
        <td class="pts">${r.points}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

// ── CSV Export ─────────────────────────────────────────────────────────────
function exportCsv(compId, type) {
  const vd = getViewData(compId);
  const name = compId === 'all' ? 'All' : (fetchedData[compId]?.name || compId);
  let headers, rows;

  if (type === 'fixtures') {
    headers = ['Date/Time', 'Competition', 'Home', 'Away', 'Venue', 'Note'];
    rows = [...vd.fixtures].sort((a, b) => new Date(a.start) - new Date(b.start))
      .map(g => [fmtDate(g.start), g.competition, g.home, g.away, g.venue || '', g.note || '']);
  } else if (type === 'results') {
    headers = ['Date/Time', 'Competition', 'Home', 'Home Score', 'Away Score', 'Away', 'Venue'];
    rows = [...vd.results].sort((a, b) => new Date(b.start) - new Date(a.start))
      .map(g => {
        const sc = parseScore(g.score);
        return [fmtDate(g.start), g.competition, g.home, sc?.home || '', sc?.away || '', g.away, g.venue || ''];
      });
  } else {
    headers = ['Pos', 'Team', 'P', 'W', 'D', 'L', 'Pts'];
    rows = (vd.standings || []).map(r => [r.position, r.team, r.played, r.won, r.drawn, r.lost, r.points]);
  }

  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${name.replace(/[^a-z0-9]+/gi, '-')}-${type}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

renderClubSelect();
document.getElementById('rangeSelect').value = recall('gaa_range', 'default');
document.getElementById('fromDate').value = isoDay(addDays(-7));
document.getElementById('toDate').value = isoDay(addDays(35));
onRangeChange();
</script>
