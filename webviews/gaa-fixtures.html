async function buildPdf() {
  const jsPDF = await loadPdf();
  const { club, shown, byTeam, groups } = exportData();
  const { from, to } = dateRange();
  // Screen colours
  const C = {
    bg: [20, 24, 27], card: [30, 34, 43], border: [44, 49, 60], text: [231, 235, 238], muted: [156, 163, 175],
    green: [135, 194, 50], red: [224, 82, 82], amber: [245, 166, 35], band: [30, 38, 27], pill: [37, 42, 53], winPill: [44, 60, 30],
  };
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 10, CW = W - 2 * M;
  const font = (size, style = 'normal', color = C.text) => { doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color); };
  const fit = (t, maxW) => {   // trim text with an ellipsis to fit a width
    t = String(t || '');
    if (doc.getTextWidth(t) <= maxW) return t;
    while (t.length > 1 && doc.getTextWidth(t + '…') > maxW) t = t.slice(0, -1);
    return t + '…';
  };
  const fill = (c, ...r) => { doc.setFillColor(...c); doc.rect(...r, 'F'); };
  const box = (x, y, w, h, c, border) => {
    doc.setFillColor(...c);
    if (border) { doc.setDrawColor(...border); doc.setLineWidth(0.25); doc.roundedRect(x, y, w, h, 2, 2, 'FD'); }
    else doc.roundedRect(x, y, w, h, 1.4, 1.4, 'F');
  };

  let y = 0, page = 0;
  const newPage = () => {
    if (page++) doc.addPage();
    fill(C.bg, 0, 0, W, H);
    // Header strip
    font(15, 'normal', C.text); doc.text('COACH', M, 13);
    font(15, 'normal', C.green); doc.text('SMART', M + doc.getTextWidth('COACH') + 0.3, 13);
    font(6.5, 'bold', C.muted); doc.text('GAA FIXTURES', M, 17.5);
    font(10, 'bold', C.text);
    const right = `${club || 'All clubs'}`;
    doc.text(right, W - M, 12, { align: 'right' });
    font(7.5, 'normal', C.muted);
    doc.text(`${shortFmt.format(new Date(from))} – ${shortFmt.format(new Date(to))}  ·  ${shown.length} games  ·  by ${byTeam ? 'team' : 'date'}`, W - M, 17, { align: 'right' });
    doc.setDrawColor(...C.border); doc.setLineWidth(0.3); doc.line(0, 22, W, 22);
    y = 29;
  };
  const room = h => { if (y + h > H - 12) newPage(); };

  newPage();

  // Stat cards, as on screen (club chosen, scored results)
  const rec = groupRecord(shown);
  if (rec) {
    const cards = [...rec.recs, { label: 'Avg points', avg: true }];
    const gap = 3, cw = (CW - gap * (cards.length - 1)) / cards.length, ch = 21;
    cards.forEach((c, i) => {
      const x = M + i * (cw + gap);
      box(x, y, cw, ch, C.card, C.border);
      font(6.5, 'bold', C.muted); doc.text(c.label.toUpperCase(), x + 3.5, y + 5.5);
      if (c.avg) {
        font(15, 'bold', C.text); doc.text(rec.avgFor, x + 3.5, y + 13);
        let tx = x + 3.5 + doc.getTextWidth(rec.avgFor) + 1.2;
        font(8, 'normal', C.muted); doc.text('v', tx, y + 13); tx += doc.getTextWidth('v') + 1.2;
        font(15, 'bold', C.text); doc.text(rec.avgAgainst, tx, y + 13);
        const diff = Math.round((rec.avgFor - rec.avgAgainst) * 10) / 10;
        font(6.5, 'normal', C.muted); doc.text(`For v against · ${diff >= 0 ? '+' : ''}${diff} a game`, x + 3.5, y + 18);
      } else {
        font(15, 'bold', C.text); doc.text(`${c.pct}%`, x + 3.5, y + 13);
        const pw = doc.getTextWidth(`${c.pct}%`);
        font(8, 'normal', C.muted); doc.text('won', x + 3.5 + pw + 1.2, y + 13);
        font(6.5, 'normal', C.muted); doc.text(`${c.w}W · ${c.d}D · ${c.l}L from ${c.n}`, x + 3.5, y + 17);
        // W/D/L bar
        const bw = cw - 7, bx = x + 3.5, by = y + 18.6;
        fill(C.green, bx, by, bw * c.w / c.n, 0.9);
        fill(C.muted, bx + bw * c.w / c.n, by, bw * c.d / c.n, 0.9);
        fill(C.red, bx + bw * (c.w + c.d) / c.n, by, bw * c.l / c.n, 0.9);
      }
    });
    y += ch + 6;
  }

  const gameH = g => (g.note || '').replace(/^Time TBC( · )?/, '') ? 15 : 13;
  const dayLabel = d => {
    room(7);
    font(7, 'bold', C.muted); doc.text(d.toUpperCase(), M, y + 4);
    y += 6.5;
  };
  const gameCard = g => {
    const h = gameH(g);
    room(h + 1.6);
    const x = M, mid = y + h / 2;
    box(x, y, CW, h, C.card, C.border);
    const d = new Date(g.start), sc = parseScore(g.score);
    const hWin = sc && sc.ht > sc.at, aWin = sc && sc.at > sc.ht;
    // Time
    font(9, 'bold', C.muted); doc.text(/Time TBC/.test(g.note || '') ? 'TBC' : timeFmt.format(d), x + 4, mid + 1.2);
    // Team label and competition
    const cx = x + 19;
    font(8.5, 'bold', C.green); doc.text(g.age || '', cx, mid - 0.6);
    font(8.5, 'bold', C.text); doc.text(fit(g.code || '', 34), cx + doc.getTextWidth(g.age || '') + (g.age ? 1.3 : 0), mid - 0.6);
    font(7, 'normal', C.muted); doc.text(fit(shortComp(g), 44), cx, mid + 3.4);
    // Match: home  [score] v [score]  away
    const mx = x + 112;
    const isClub = n => club && sameClub(canonClub(n), club);
    const nameColor = (n, lost) => lost ? C.muted : C.text;
    let hl = mx - 3, ar = mx + 3;
    font(7, 'normal', C.muted); doc.text('v', mx, mid + 1, { align: 'center' });
    if (sc) {
      font(8.5, 'bold', C.text);
      const pw = t => doc.getTextWidth(t) + 3.6;
      const hp = pw(sc.home), ap = pw(sc.away);
      box(mx - 2.6 - hp, mid - 3, hp, 6, hWin ? C.winPill : C.pill);
      box(mx + 2.6, mid - 3, ap, 6, aWin ? C.winPill : C.pill);
      font(8.5, 'bold', hWin ? C.green : C.text); doc.text(sc.home, mx - 2.6 - hp / 2, mid + 1.1, { align: 'center' });
      font(8.5, 'bold', aWin ? C.green : C.text); doc.text(sc.away, mx + 2.6 + ap / 2, mid + 1.1, { align: 'center' });
      hl = mx - 2.6 - hp - 2; ar = mx + 2.6 + ap + 2;
    }
    const sideW = 44;
    font(9, isClub(g.home) ? 'bold' : 'normal', nameColor(g.home, aWin)); doc.text(fit(g.home, sideW - (mx - 3 - hl)), hl, mid + 1.2, { align: 'right' });
    font(9, isClub(g.away) ? 'bold' : 'normal', nameColor(g.away, hWin)); doc.text(fit(g.away, sideW - (ar - mx - 3)), ar, mid + 1.2);
    // Venue and note
    const vx = x + 160, vw = CW - 160 - 3;
    const note = (g.note || '').replace(/^Time TBC( · )?/, '');
    font(7.5, 'normal', C.muted); doc.text(fit(g.venue || '', vw), vx, note ? mid - 0.6 : mid + 1);
    if (note) { font(6.8, 'normal', C.amber); doc.text(fit(note, vw), vx, mid + 3.4); }
    y += h + 1.6;
  };

  groups.forEach(grp => {
    const statsRec = groupRecord(grp.games);
    const bandH = statsRec ? 13 : 8.5;
    room(bandH + 3 + gameH(grp.games[0]) + (byTeam ? 7 : 0));
    y += 2;
    // Group band: soft green with a bright edge, title, count and record
    fill(C.band, M, y, CW, bandH);
    fill(C.green, M, y, 0.9, bandH);
    const t = byTeam ? grp.title.replace(club ? ` ${grp.games[0] && (sameClub(homeClub(grp.games[0]), club) ? grp.games[0].home : grp.games[0].away)}` : '', '') : grp.title;
    font(10, 'bold', C.text); doc.text(t, M + 4, y + 5.6);
    if (byTeam && club) {
      const side = grp.title.slice(t.length).trim();
      font(9.5, 'bold', C.green); doc.text(side, M + 4 + doc.getTextWidth(t) + 3, y + 5.6);
      font(10, 'bold', C.text);
    }
    font(7, 'normal', C.muted); doc.text(`${grp.games.length} game${grp.games.length === 1 ? '' : 's'}`, W - M - 3, y + 5.6, { align: 'right' });
    if (statsRec) {
      let sx = M + 4;
      const part = (label, value, color, tail) => {
        font(7.5, 'normal', C.muted); doc.text(label, sx, y + 10.6); sx += doc.getTextWidth(label) + 1.5;
        font(7.5, 'bold', color); doc.text(value, sx, y + 10.6); sx += doc.getTextWidth(value) + 1.2;
        font(7.5, 'normal', C.muted); doc.text(tail, sx, y + 10.6); sx += doc.getTextWidth(tail) + 6;
      };
      statsRec.recs.forEach(r => part(r.label, `${r.pct}%`, r.pct >= 50 ? C.green : C.red, r.wdl));
      part('Avg points', statsRec.avgFor, C.text, `v ${statsRec.avgAgainst}`);
    }
    y += bandH + 2.5;
    let lastDay = '';
    grp.games.forEach(g => {
      if (byTeam) {
        const day = dayFmt.format(new Date(g.start));
        if (day !== lastDay) { dayLabel(day); lastDay = day; }
      }
      gameCard(g);
    });
  });

  // Footer on every page
  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    font(7, 'normal', C.muted);
    doc.text('CoachSmart', M, H - 5);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 5, { align: 'right' });
  }
  doc.save(`${(club || 'all-clubs').replace(/[^a-z0-9]+/gi, '-')}-fixtures${byTeam ? '-by-team' : ''}.pdf`);
}

async function buildXlsx() {
  const ExcelJS = await loadExcel();
  const { club, shown, byTeam, groups } = exportData();
  const GREEN = 'FF87C232', DARK = 'FF14181B', LINE = 'FFE2E5EA', MUTED = 'FF6B7280';
  const cols = [
    { header: 'Date', key: 'date', width: 16 },
    { header: 'Time', key: 'time', width: 8 },
    { header: 'Code', key: 'code', width: 16 },
    { header: 'Age', key: 'age', width: 9 },
    { header: 'Competition', key: 'comp', width: 42 },
    { header: 'Home', key: 'home', width: 24 },
    { header: 'Home score', key: 'hs', width: 11 },
    { header: 'Away score', key: 'as', width: 11 },
    { header: 'Away', key: 'away', width: 24 },
    { header: 'Venue', key: 'venue', width: 24 },
    { header: 'Note', key: 'note', width: 26 },
  ];
  const last = cols.length;
  const { from, to } = dateRange();

  const wb = new ExcelJS.Workbook();
  wb.creator = 'CoachSmart';
  const ws = wb.addWorksheet(byTeam ? 'By team' : 'By date', {
    views: [{ state: 'frozen', ySplit: 4, showGridLines: false }],
    pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '4:4' },
  });
  ws.columns = cols.map(c => ({ key: c.key, width: c.width }));

  // Title and summary
  ws.mergeCells(1, 1, 1, last);
  // Title band: black with green text, like the app
  const blackFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: DARK } };
  Object.assign(ws.getCell(1, 1), { value: `${club || 'All clubs'} fixtures and results`, font: { bold: true, size: 16, color: { argb: GREEN } }, fill: blackFill, alignment: { vertical: 'middle', indent: 1 } });
  ws.mergeCells(2, 1, 2, last);
  Object.assign(ws.getCell(2, 1), {
    value: `${shortFmt.format(new Date(from))} – ${shortFmt.format(new Date(to))} · ${shown.length} games · grouped by ${byTeam ? 'team' : 'date'}`,
    font: { italic: true, size: 10, color: { argb: 'FFA1A1A2' } }, fill: blackFill, alignment: { vertical: 'top', indent: 1 },
  });
  ws.getRow(2).height = 18;
  ws.getRow(1).height = 24;

  // Column headings
  const head = ws.getRow(4);
  cols.forEach((c, i) => {
    Object.assign(head.getCell(i + 1), {
      value: c.header,
      font: { bold: true, color: { argb: GREEN } },
      fill: blackFill,
      alignment: { vertical: 'middle', horizontal: ['hs', 'as', 'time'].includes(c.key) ? 'center' : 'left' },
    });
  });
  head.height = 20;

  let r = 5;
  for (const grp of groups) {
    r++;   // blank line before each group
    ws.mergeCells(r, 1, r, last);
    Object.assign(ws.getCell(r, 1), {
      value: `${grp.title}  (${grp.games.length} game${grp.games.length === 1 ? '' : 's'})`,
      font: { bold: true, size: 12, color: { argb: DARK } },
      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: GREEN } },
      alignment: { vertical: 'middle' },
    });
    ws.getRow(r).height = 20;
    r++;
    for (const g of grp.games) {
      const d = new Date(g.start);
      const sc = parseScore(g.score);
      const hWin = sc && sc.ht > sc.at, aWin = sc && sc.at > sc.ht;
      const row = ws.getRow(r);
      row.values = {
        date: new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())),
        time: /Time TBC/.test(g.note || '') ? 'TBC' : timeFmt.format(d),
        code: g.code || '', age: g.age || '', comp: g.competition || '',
        home: g.home, hs: sc?.home || '', as: sc?.away || '', away: g.away,
        venue: g.venue || '', note: (g.note || '').replace(/^Time TBC( · )?/, ''),
      };
      row.eachCell({ includeEmpty: true }, (cell, i) => {
        if (i > last) return;
        cell.border = { bottom: { style: 'thin', color: { argb: LINE } } };
        cell.alignment = { vertical: 'middle', horizontal: [2, 7, 8].includes(i) ? 'center' : 'left' };
      });
      row.getCell('date').numFmt = 'ddd d mmm yyyy';
      // Both teams in the dark text colour; the winner in bold
      row.getCell('home').font = { bold: !!hWin, color: { argb: DARK } };
      row.getCell('away').font = { bold: !!aWin, color: { argb: DARK } };
      row.getCell('hs').font = { bold: !!hWin };
      row.getCell('as').font = { bold: !!aWin };
      if (row.getCell('note').value) row.getCell('note').font = { color: { argb: 'FFB45309' } };
      row.height = 18;
      r++;
    }
  }

  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = `${(club || 'all-clubs').replace(/[^a-z0-9]+/gi, '-')}-fixtures${byTeam ? '-by-team' : ''}.xlsx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.getElementById('fromDate').value = isoDay(addDays(-7));
document.getElementById('toDate').value = isoDay(addDays(35));

// Camogie club list, refreshed once a day; the first load waits for it (briefly)
(async () => {
  const cached = recall('gaa_camogie_clubs', null);
  if (!cached || Date.now() - cached.at > 864e5) {
    try {
      const res = await fetch(`${EDGE}?type=clubs`, { signal: AbortSignal.timeout(8000) });
      if (res.ok) store('gaa_camogie_clubs', { at: Date.now(), list: (await res.json()).camogie || [] });
    } catch {}
  }
  loadGames();
})();
