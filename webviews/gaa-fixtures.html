<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Fixtures — CoachSmart</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:  #87C232;
  --dark:   #111418;
  --card:   #1E222B;
  --card2:  #252A35;
  --border: rgba(255,255,255,0.07);
  --text:   #E7EBEE;
  --muted:  #6B7280;
  --red:    #e05252;
  --amber:  #F5A623;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); height: 100%; overflow: hidden; }

/* ── Layout ── */
.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 244px; flex-shrink: 0;
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }

.logo-area {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2.5px; line-height: 1; }
.logo span { color: var(--green); }
.logo-sub { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

.s-section { padding: 14px 12px 6px; }
.s-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding: 0 2px; }

/* competition items */
.comp-item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 4px; border-radius: 6px; margin-bottom: 1px; cursor: pointer;
}
.comp-item:hover { background: var(--card2); }
.comp-item label { display: flex; align-items: center; gap: 7px; flex: 1; cursor: pointer; }
.comp-item input[type="checkbox"] { width: 13px; height: 13px; accent-color: var(--green); flex-shrink: 0; }
.comp-name { font-size: 12px; font-weight: 500; line-height: 1.3; }
.comp-del {
  width: 18px; height: 18px; border: none; background: none;
  color: var(--muted); cursor: pointer; border-radius: 3px; font-size: 14px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  opacity: 0; transition: opacity .1s;
}
.comp-item:hover .comp-del { opacity: 1; }
.comp-del:hover { color: var(--red); }

/* sheet sync */
.sync-row { display: flex; gap: 6px; align-items: center; }
.sync-input {
  flex: 1; padding: 7px 9px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 11px;
  font-family: 'DM Sans', sans-serif; min-width: 0;
}
.sync-input:focus { outline: none; border-color: var(--green); }
.sync-input::placeholder { color: var(--muted); }
.sync-btn {
  flex-shrink: 0; padding: 7px 10px;
  background: rgba(135,194,50,0.12); border: 1px solid rgba(135,194,50,0.28);
  border-radius: 6px; color: var(--green); font-size: 11px; font-weight: 600;
  font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.sync-btn:hover { background: rgba(135,194,50,0.2); }
.sync-btn:disabled { opacity: 0.4; cursor: default; }
.sync-status { font-size: 11px; margin-top: 5px; min-height: 14px; padding: 0 2px; }

.add-btn {
  width: 100%; margin-top: 6px; padding: 7px 6px;
  background: none; border: 1px dashed rgba(255,255,255,0.12);
  border-radius: 6px; color: var(--muted); font-size: 12px; font-weight: 500;
  font-family: 'DM Sans', sans-serif; cursor: pointer; text-align: left;
  transition: all .15s; display: flex; align-items: center; gap: 5px;
}
.add-btn:hover { border-color: var(--green); color: var(--green); background: rgba(135,194,50,0.06); }

.empty-comps { padding: 6px 4px 8px; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* filter inputs */
.filter-input {
  width: 100%; padding: 8px 10px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 13px;
  font-family: 'DM Sans', sans-serif;
}
.filter-input:focus { outline: none; border-color: var(--green); }
.filter-input::placeholder { color: var(--muted); }

.fetch-btn {
  margin: 12px; width: calc(100% - 24px);
  padding: 11px; background: var(--green); border: none;
  border-radius: 8px; color: #111; font-size: 14px; font-weight: 700;
  font-family: 'DM Sans', sans-serif; cursor: pointer; flex-shrink: 0;
  transition: opacity .15s;
}
.fetch-btn:hover { opacity: 0.88; }
.fetch-btn:disabled { opacity: 0.4; cursor: default; }

/* ── Main area ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* competition tabs */
.comp-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
  padding: 0 4px;
}
.comp-tabs::-webkit-scrollbar { height: 3px; }
.comp-tabs::-webkit-scrollbar-thumb { background: var(--border); }
.comp-tab {
  padding: 13px 18px 11px; font-size: 13px; font-weight: 500; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .15s; margin-bottom: -1px; flex-shrink: 0;
}
.comp-tab:hover { color: var(--text); }
.comp-tab.active { color: var(--green); border-bottom-color: var(--green); }

/* content panel */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 18px 20px; }

/* sub-tabs */
.sub-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-shrink: 0; }
.sub-tab {
  padding: 5px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all .15s; border: 1px solid transparent;
}
.sub-tab:hover { color: var(--text); background: var(--card2); }
.sub-tab.active { color: var(--green); background: rgba(135,194,50,0.1); border-color: rgba(135,194,50,0.28); }
.sub-tab .badge {
  display: inline-block; margin-left: 5px;
  background: var(--card2); border-radius: 10px;
  padding: 0 6px; font-size: 10px; font-weight: 700; color: var(--muted);
  vertical-align: middle;
}
.sub-tab.active .badge { background: rgba(135,194,50,0.15); color: var(--green); }

/* export row */
.table-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; flex-shrink: 0;
}
.row-count { font-size: 12px; color: var(--muted); }
.export-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 12px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted); font-size: 12px; font-weight: 500;
  font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all .15s;
}
.export-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.14); }

/* table */
.table-wrap { flex: 1; overflow-y: auto; border-radius: 10px; border: 1px solid var(--border); }
.table-wrap::-webkit-scrollbar { width: 6px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--card); padding: 9px 12px;
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 1px solid var(--border); white-space: nowrap;
  text-align: left;
}
thead th.r { text-align: right; }
thead th.c { text-align: center; }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.025); }
td { padding: 9px 12px; font-size: 13px; vertical-align: middle; }
td.r { text-align: right; }
td.c { text-align: center; }
td.muted { color: var(--muted); font-size: 12px; }
td.nowrap { white-space: nowrap; }

.team-name { font-weight: 500; }
.score-pill {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
  background: var(--card2);
}
.score-win { background: rgba(135,194,50,0.15); color: var(--green); }
.score-lose { opacity: 0.6; }
.vs { color: var(--muted); font-size: 11px; margin: 0 4px; }
.pos { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.pos.top { color: var(--green); }
td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
td.pts { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; color: var(--text); }

/* empty state */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px; color: var(--muted);
}
.empty-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.35; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 13px; line-height: 1.5; max-width: 300px; }

/* loading */
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border); border-top-color: var(--green);
  border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* error banner */
.error-row td { text-align: center; padding: 28px; color: var(--red); font-size: 13px; }
.no-data-row td { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px; width: 340px; max-width: calc(100vw - 32px);
}
.modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 10px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px;
}
.field input {
  width: 100%; padding: 9px 10px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-size: 13px;
  font-family: 'DM Sans', sans-serif;
}
.field input:focus { outline: none; border-color: var(--green); }
.field input::placeholder { color: var(--muted); }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
.modal-btns { display: flex; gap: 8px; margin-top: 18px; }
.btn-cancel {
  flex: 1; padding: 9px; background: var(--card2);
  border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-size: 13px; font-weight: 600;
  font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.btn-save {
  flex: 1; padding: 9px; background: var(--green); border: none;
  border-radius: 7px; color: #111; font-size: 13px; font-weight: 700;
  font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.btn-save:hover { opacity: 0.88; }

/* ── Mobile ── */
@media (max-width: 680px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar-scroll { max-height: 260px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo">COACH<span>SMART</span></div>
      <div class="logo-sub">GAA Fixtures</div>
    </div>

    <div class="sidebar-scroll">
      <div class="s-section">
        <div class="s-label">Sync from Sheet</div>
        <div class="sync-row">
          <input type="text" class="sync-input" id="csvUrl" placeholder="Paste Google Sheet CSV URL…">
          <button class="sync-btn" id="syncBtn" onclick="syncFromSheet()">Sync</button>
        </div>
        <div class="sync-status" id="syncStatus"></div>
      </div>

      <div class="s-section">
        <div class="s-label">Competitions</div>
        <div id="compList"></div>
        <button class="add-btn" onclick="openModal()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add manually
        </button>
      </div>

      <div class="s-section">
        <div class="s-label">Club Filter</div>
        <input type="text" class="filter-input" id="clubFilter" placeholder="e.g. Clontarf (or leave blank)">
      </div>
    </div>

    <button class="fetch-btn" id="fetchBtn" onclick="fetchAll()">Fetch Data</button>
  </aside>

  <!-- ── Main ── -->
  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🏐</div>
      <div class="empty-title">No data yet</div>
      <div class="empty-sub">Add competitions in the sidebar, then hit Fetch Data to load fixtures, results and standings.</div>
    </div>
  </div>

</div>

<!-- ── Add Competition Modal ── -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Add Competition</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="mName" placeholder="e.g. U13 Football League Div.6" autocomplete="off">
    </div>
    <div class="field">
      <label>Competition ID</label>
      <input type="text" id="mId" placeholder="e.g. 215251" autocomplete="off" inputmode="numeric">
      <div class="hint">Found in the Sportlomo URL: …sportlomo.com/league-2/<strong>215251</strong>/</div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveComp()">Add</button>
    </div>
  </div>
</div>

<script>
const EDGE = 'https://gyfporsbdftvtakdvukt.supabase.co/functions/v1/gaa-fixtures';

// ── State ──────────────────────────────────────────────────────────────────
let competitions = [];   // [{id, name}]
let fetchedData  = {};   // {[compId]: {name, fixtures, results, standings, error}}
let activeComp   = null; // compId string
let activeSubs   = {};   // {[compId]: 'fixtures'|'results'|'standings'}

// ── Persistence ────────────────────────────────────────────────────────────
function saveComps() {
  try { localStorage.setItem('gaa_comps', JSON.stringify(competitions)); } catch {}
}
function loadComps() {
  try { competitions = JSON.parse(localStorage.getItem('gaa_comps') || '[]'); } catch { competitions = []; }
}

// ── Competition list rendering ─────────────────────────────────────────────
function renderCompList() {
  const el = document.getElementById('compList');
  if (!competitions.length) {
    el.innerHTML = '<div class="empty-comps">No competitions added yet. Click below to add one.</div>';
    return;
  }
  el.innerHTML = competitions.map((c, i) => `
    <div class="comp-item">
      <label>
        <input type="checkbox" id="chk${i}" data-id="${c.id}" checked>
        <span class="comp-name">${esc(c.name)}</span>
      </label>
      <button class="comp-del" onclick="deleteComp(${i})" title="Remove">×</button>
    </div>
  `).join('');
}

function deleteComp(i) {
  competitions.splice(i, 1);
  saveComps();
  renderCompList();
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('mName').value = '';
  document.getElementById('mId').value   = '';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('mName').focus(), 50);
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
function saveComp() {
  const name = document.getElementById('mName').value.trim();
  const id   = document.getElementById('mId').value.trim().replace(/\D/g, '');
  if (!name || !id) return;
  if (competitions.some(c => c.id === id)) { closeModal(); return; }
  competitions.push({ id, name });
  saveComps();
  renderCompList();
  closeModal();
}
document.getElementById('mId').addEventListener('keydown', e => { if (e.key === 'Enter') saveComp(); });

// ── Fetch ──────────────────────────────────────────────────────────────────
async function fetchAll() {
  const selected = competitions.filter((c, i) => {
    const el = document.getElementById('chk' + i);
    return el && el.checked;
  });
  if (!selected.length) return;

  const club = document.getElementById('clubFilter').value.trim();
  document.getElementById('fetchBtn').disabled = true;

  showLoading();

  fetchedData = {};
  activeComp  = selected[0].id;

  await Promise.all(selected.map(async c => {
    let gamesUrl = `${EDGE}?comp=${c.id}&format=json&results=1`;
    if (club) gamesUrl += '&team=' + encodeURIComponent(club);
    const tableUrl = `${EDGE}?comp=${c.id}&type=table`;

    try {
      const [gamesRes, tableRes] = await Promise.all([
        fetch(gamesUrl).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
        fetch(tableUrl).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
      ]);
      fetchedData[c.id] = {
        name:      c.name,
        fixtures:  gamesRes.filter(g => g.kind === 'fixture'),
        results:   gamesRes.filter(g => g.kind === 'result'),
        standings: tableRes,
        error:     null,
      };
    } catch (e) {
      fetchedData[c.id] = { name: c.name, fixtures: [], results: [], standings: [], error: e.message };
    }
    if (!activeSubs[c.id]) activeSubs[c.id] = 'fixtures';
  }));

  document.getElementById('fetchBtn').disabled = false;
  renderAll();
}

// ── Render ─────────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('main').innerHTML = `
    <div class="empty-state">
      <div class="spinner"></div>
      <div class="empty-sub">Fetching fixtures and standings…</div>
    </div>`;
}

function renderAll() {
  const ids = Object.keys(fetchedData);
  if (!ids.length) return;
  if (!ids.includes(activeComp)) activeComp = ids[0];

  const main = document.getElementById('main');
  main.innerHTML = '';

  // Competition tabs (only if >1)
  if (ids.length > 1) {
    const tabsEl = document.createElement('div');
    tabsEl.className = 'comp-tabs';
    tabsEl.innerHTML = ids.map(id => {
      const d = fetchedData[id];
      return `<div class="comp-tab ${id === activeComp ? 'active' : ''}"
                   onclick="switchComp('${id}')">${esc(d.name)}</div>`;
    }).join('');
    main.appendChild(tabsEl);
  }

  // Content area
  const content = document.createElement('div');
  content.className = 'content';
  content.id = 'contentPanel';
  main.appendChild(content);

  renderContent();
}

function renderContent() {
  const d = fetchedData[activeComp];
  if (!d) return;
  const sub = activeSubs[activeComp] || 'fixtures';
  const panel = document.getElementById('contentPanel');
  panel.innerHTML = '';

  if (d.error) {
    panel.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Could not load</div>
        <div class="empty-sub">${esc(d.error)}</div>
      </div>`;
    return;
  }

  // Sub-tabs
  const subEl = document.createElement('div');
  subEl.className = 'sub-tabs';
  subEl.innerHTML = [
    { key: 'fixtures',  label: 'Fixtures',  count: d.fixtures.length  },
    { key: 'results',   label: 'Results',   count: d.results.length   },
    { key: 'standings', label: 'Standings', count: d.standings.length },
  ].map(t => `
    <div class="sub-tab ${t.key === sub ? 'active' : ''}" onclick="switchSub('${t.key}')">
      ${t.label}<span class="badge">${t.count}</span>
    </div>
  `).join('');
  panel.appendChild(subEl);

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'table-toolbar';

  let rowCount = 0;
  if (sub === 'fixtures')  rowCount = d.fixtures.length;
  if (sub === 'results')   rowCount = d.results.length;
  if (sub === 'standings') rowCount = d.standings.length;

  toolbar.innerHTML = `
    <span class="row-count">${rowCount} ${sub === 'standings' ? 'team' : 'game'}${rowCount !== 1 ? 's' : ''}</span>
    <button class="export-btn" onclick="exportCsv('${activeComp}','${sub}')">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Export CSV
    </button>`;
  panel.appendChild(toolbar);

  // Table
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  if (sub === 'fixtures')  wrap.innerHTML = buildFixturesTable(d.fixtures);
  if (sub === 'results')   wrap.innerHTML = buildResultsTable(d.results);
  if (sub === 'standings') wrap.innerHTML = buildStandingsTable(d.standings);
  panel.appendChild(wrap);
}

function switchComp(id) {
  activeComp = id;
  // Re-render tabs
  document.querySelectorAll('.comp-tab').forEach(el => {
    el.classList.toggle('active', el.textContent.trim() === fetchedData[id].name);
  });
  // Re-render content
  renderContent();
}

function switchSub(sub) {
  activeSubs[activeComp] = sub;
  renderContent();
}

// ── Table builders ─────────────────────────────────────────────────────────
function fmtDate(iso) {
  const d = new Date(iso);
  return new Intl.DateTimeFormat('en-IE', {
    timeZone: 'Europe/Dublin', weekday: 'short', day: 'numeric',
    month: 'short', hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(d);
}

function buildFixturesTable(rows) {
  if (!rows.length) return '<table><thead><tr><th colspan="5"><span style="color:var(--muted)">No upcoming fixtures</span></th></tr></thead></table>';
  const sorted = [...rows].sort((a, b) => new Date(a.start) - new Date(b.start));
  return `<table>
    <thead><tr>
      <th>Date / Time</th><th>Home</th><th>Away</th><th>Venue</th><th>Note</th>
    </tr></thead>
    <tbody>${sorted.map(g => `
      <tr>
        <td class="nowrap muted">${fmtDate(g.start)}</td>
        <td class="team-name">${esc(g.home)}</td>
        <td class="team-name">${esc(g.away)}</td>
        <td class="muted">${esc(g.venue || '—')}</td>
        <td class="muted">${esc(g.note || '')}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

function parseScore(s) {
  if (!s) return null;
  const [h, a] = s.split(' v ');
  const total = part => {
    const m = (part || '').match(/(\d+)\s*-\s*(\d+)/);
    return m ? +m[1] * 3 + +m[2] : 0;
  };
  return { home: h?.trim() || '', away: a?.trim() || '', homeTotal: total(h), awayTotal: total(a) };
}

function buildResultsTable(rows) {
  if (!rows.length) return '<table><thead><tr><th colspan="5"><span style="color:var(--muted)">No results yet</span></th></tr></thead></table>';
  const sorted = [...rows].sort((a, b) => new Date(b.start) - new Date(a.start));
  return `<table>
    <thead><tr>
      <th>Date</th><th>Home</th><th class="c">Score</th><th>Away</th><th>Venue</th>
    </tr></thead>
    <tbody>${sorted.map(g => {
      const sc = parseScore(g.score);
      const hWin = sc && sc.homeTotal > sc.awayTotal;
      const aWin = sc && sc.awayTotal > sc.homeTotal;
      return `
      <tr>
        <td class="nowrap muted">${fmtDate(g.start)}</td>
        <td class="team-name ${hWin ? '' : 'muted'}">${esc(g.home)}</td>
        <td class="c nowrap">
          ${sc
            ? `<span class="score-pill ${hWin ? 'score-win' : ''}">${esc(sc.home)}</span>
               <span class="vs">v</span>
               <span class="score-pill ${aWin ? 'score-win' : ''}">${esc(sc.away)}</span>`
            : '<span class="muted">—</span>'}
        </td>
        <td class="team-name ${aWin ? '' : 'muted'}">${esc(g.away)}</td>
        <td class="muted">${esc(g.venue || '—')}</td>
      </tr>`;
    }).join('')}
    </tbody></table>`;
}

function buildStandingsTable(rows) {
  if (!rows.length) return '<table><thead><tr><th colspan="7"><span style="color:var(--muted)">No standings available for this competition</span></th></tr></thead></table>';
  return `<table>
    <thead><tr>
      <th class="r">Pos</th><th>Team</th>
      <th class="r">P</th><th class="r">W</th><th class="r">D</th><th class="r">L</th><th class="r">Pts</th>
    </tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td class="r"><span class="pos ${r.position <= 2 ? 'top' : ''}">${r.position}</span></td>
        <td class="team-name">${esc(r.team)}</td>
        <td class="num">${r.played}</td>
        <td class="num">${r.won}</td>
        <td class="num">${r.drawn}</td>
        <td class="num">${r.lost}</td>
        <td class="pts">${r.points}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

// ── CSV Export ─────────────────────────────────────────────────────────────
function exportCsv(compId, type) {
  const d = fetchedData[compId];
  if (!d) return;
  let headers, rows;

  if (type === 'fixtures') {
    headers = ['Date/Time', 'Home', 'Away', 'Venue', 'Note'];
    rows = [...d.fixtures].sort((a, b) => new Date(a.start) - new Date(b.start))
      .map(g => [fmtDate(g.start), g.home, g.away, g.venue || '', g.note || '']);
  } else if (type === 'results') {
    headers = ['Date/Time', 'Home', 'Home Score', 'Away Score', 'Away', 'Venue'];
    rows = [...d.results].sort((a, b) => new Date(b.start) - new Date(a.start))
      .map(g => {
        const sc = parseScore(g.score);
        return [fmtDate(g.start), g.home, sc?.home || '', sc?.away || '', g.away, g.venue || ''];
      });
  } else {
    headers = ['Pos', 'Team', 'P', 'W', 'D', 'L', 'Pts'];
    rows = d.standings.map(r => [r.position, r.team, r.played, r.won, r.drawn, r.lost, r.points]);
  }

  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${d.name.replace(/[^a-z0-9]+/gi, '-')}-${type}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Sheet CSV sync ─────────────────────────────────────────────────────────
function saveCsvUrl(url) {
  try { localStorage.setItem('gaa_csv_url', url); } catch {}
}
function loadCsvUrl() {
  try { return localStorage.getItem('gaa_csv_url') || ''; } catch { return ''; }
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const result = [];
  for (let i = 1; i < lines.length; i++) {   // skip header row
    const cols = splitCsvRow(lines[i]);
    const name = cols[0]?.trim();
    const raw  = cols[1]?.trim() || '';
    // A cell may contain multiple IDs comma-separated; keep as-is, the fetch handles it
    if (name && raw) result.push({ name, id: raw });
  }
  return result;
}

function splitCsvRow(line) {
  const cols = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
    else cur += ch;
  }
  cols.push(cur);
  return cols;
}

async function syncFromSheet() {
  const url = document.getElementById('csvUrl').value.trim();
  if (!url) return setSyncStatus('Paste a CSV URL first.', 'warn');
  saveCsvUrl(url);

  document.getElementById('syncBtn').disabled = true;
  setSyncStatus('Syncing…', 'muted');

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = parseCsv(text);
    if (!parsed.length) throw new Error('No competitions found in sheet.');
    competitions = parsed;
    saveComps();
    renderCompList();
    setSyncStatus(`Synced ${parsed.length} competition${parsed.length !== 1 ? 's' : ''}.`, 'ok');
  } catch (e) {
    setSyncStatus(e.message, 'error');
  } finally {
    document.getElementById('syncBtn').disabled = false;
  }
}

function setSyncStatus(msg, type) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.style.color = type === 'ok' ? 'var(--green)' : type === 'error' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--muted)';
}

// ── Init ───────────────────────────────────────────────────────────────────
loadComps();
renderCompList();
const savedUrl = loadCsvUrl();
if (savedUrl) document.getElementById('csvUrl').value = savedUrl;
</script>
