<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Fixtures — CoachSmart</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:  #87C232;
  --dark:   #111418;
  --card:   #1E222B;
  --card2:  #252A35;
  --border: rgba(255,255,255,0.07);
  --text:   #E7EBEE;
  --muted:  #9CA3AF;
  --red:    #e05252;
  --amber:  #F5A623;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { font-family: 'DM Sans', sans-serif; font-size: 15px; background: var(--dark); color: var(--text); height: 100%; overflow: hidden; }
button, select, input { font-family: inherit; }

/* ── Layout ── */
.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 290px; flex-shrink: 0;
  background: var(--card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.logo-area { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2.5px; line-height: 1; }
.logo span { color: var(--green); }
.logo-sub { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
.filters-btn { display: none; }
.sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 16px; }

.s-section { padding: 14px 14px 4px; }
.s-label-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.s-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 0 2px; }
.s-hint { font-size: 12px; color: var(--muted); padding: 4px 2px 0; line-height: 1.4; }
.clear-btn {
  background: none; border: none; padding: 0; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--muted);
}
.clear-btn:hover { color: var(--green); }
.toggle-all { display: flex; gap: 10px; }
.toggle-all button { background: none; border: none; padding: 0; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.toggle-all button:hover { color: var(--green); }

.select {
  width: 100%; padding: 9px 10px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 14px;
}
.select:focus { outline: none; border-color: var(--green); }
.date-row { display: flex; gap: 6px; margin-top: 6px; }
.date-row input { flex: 1; min-width: 0; padding: 7px 8px; font-size: 13px; color-scheme: dark; }

/* segmented control */
.seg { display: flex; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.seg button {
  flex: 1; padding: 7px 0; border: none; border-radius: 6px; cursor: pointer;
  background: none; color: var(--muted); font-size: 13px; font-weight: 600;
}
.seg button.on { background: var(--green); color: #111; }

/* chips: none selected = show everything; tap to narrow */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 11px; border-radius: 16px; cursor: pointer; user-select: none;
  font-size: 13px; font-weight: 600; color: var(--text);
  background: var(--card2); border: 1px solid var(--border); transition: all .12s;
}
.chip:hover { border-color: rgba(255,255,255,0.2); }
.chip.on { color: var(--text); background: rgba(135,194,50,0.14); border-color: rgba(135,194,50,0.55); }
.chip .n { font-weight: 500; opacity: .6; margin-left: 4px; }
.chip.on .n { opacity: .75; }
.comp-group { margin-bottom: 10px; }
.adv-toggle { background: none; border: none; padding: 0; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.adv-toggle:hover { color: var(--text); }
#compChips { margin-top: 10px; }
.comp-group-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 2px 5px; }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.summary { font-size: 14px; color: var(--muted); }
.summary b { color: var(--text); font-weight: 600; }
.export-btns { display: flex; gap: 6px; flex-shrink: 0; }
.export-btn {
  display: flex; align-items: center; gap: 5px; padding: 6px 12px; flex-shrink: 0;
  background: var(--card2); border: 1px solid rgba(255,255,255,0.13);
  border-radius: 6px; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
}
.export-btn:hover { border-color: rgba(255,255,255,0.25); }
.list { flex: 1; overflow-y: auto; padding: 6px 22px 40px; }

.section-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px;
  margin: 18px 0 4px; display: flex; align-items: baseline; gap: 8px;
}
.section-title .n { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); letter-spacing: 0; }
/* results stats cards (club chosen only) */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 6px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
.stat-big { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat-big small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.panel-body .stats { margin: 4px 0 12px; }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wdl-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: rgba(255,255,255,0.06); }
.wdl-bar .w { background: var(--green); } .wdl-bar .d { background: var(--muted); } .wdl-bar .l { background: #d9534f; }
.team-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 22px 0 4px; padding: 7px 12px;
  background: rgba(135,194,50,0.08); border-left: 3px solid var(--green, #87c232); border-radius: 6px; }
.team-head .age { font-size: 15px; font-weight: 700; color: var(--text); }
.team-head .side { font-size: 14px; font-weight: 600; color: var(--green, #87c232); }
.team-head .n { font-size: 12px; color: var(--muted); margin-left: auto; }
.team-head { cursor: pointer; user-select: none; }
.team-head .caret { color: var(--muted); width: 12px; font-size: 12px; margin-right: -4px; }
.team-head.closed { margin-bottom: 0; }
.team-head.closed + .team-head { margin-top: 8px; }
.section-title .group-toggle { margin-left: auto; font-size: 12px; }
.team-head + .day { margin-top: 8px; }
.g-stats { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.g-stats .gs-l { margin-right: 6px; }
.g-stats b { color: var(--text); font-weight: 700; }
.g-stats b.good { color: var(--green); }
.g-stats b.bad { color: var(--red); }
.team-head + .game { margin-top: 8px; }
.day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 14px 0 6px; }

/* game row: grid on desktop, card on phone */
.game {
  display: grid; grid-template-columns: 52px minmax(150px, 1.1fr) minmax(0, 2.4fr) minmax(0, 0.9fr);
  align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 14px; margin-bottom: 6px;
}
.g-time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.g-comp {
  font-size: 13px; color: var(--muted); line-height: 1.3; cursor: pointer;
}
.g-comp .cname { text-decoration: underline; text-decoration-color: rgba(255,255,255,0.15); text-underline-offset: 3px; }
.g-comp:hover .cname { color: var(--green); text-decoration-color: var(--green); }
.g-comp .code { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.g-comp .code b { color: var(--green); font-weight: 700; margin-right: 4px; }
.g-match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; min-width: 0; }
.g-team { font-size: 15px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.g-team.home { text-align: right; }
.g-team.mine { font-weight: 700; }
.g-team.lost { opacity: .55; }
.g-mid { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.pill {
  display: inline-block; padding: 3px 8px; border-radius: 4px;
  font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--card2);
}
.pill.win { background: rgba(135,194,50,0.18); color: var(--green); }
.vs { color: var(--muted); font-size: 12px; }
.g-venue { font-size: 13px; color: var(--muted); line-height: 1.3; }
.g-note { display: block; color: var(--amber); font-size: 12px; }

/* empty / loading */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px; color: var(--muted);
}
.empty-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.35; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 13px; line-height: 1.5; max-width: 320px; }
.spinner {
  width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--green);
  border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.seg.small { display: inline-flex; padding: 2px; }
.seg.small button { flex: none; padding: 5px 14px; font-size: 12px; }
.topbar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }

/* standings panel */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
  display: flex; justify-content: flex-end; z-index: 100;
}
.panel {
  width: 480px; max-width: 100%; height: 100%; background: var(--card);
  border-left: 1px solid var(--border); display: flex; flex-direction: column;
}
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
.panel-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
.panel-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.close-btn { background: none; border: none; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; }
.close-btn:hover { color: var(--text); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px 10px 20px; }
.panel-tools { padding: 12px 18px 4px; display: flex; flex-direction: column; gap: 10px; }
.team-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: rgba(255,255,255,0.03); }
tr.sel td { background: rgba(135,194,50,0.1); }
.pg { display: grid; grid-template-columns: 62px 1fr auto 1fr; gap: 8px; align-items: center; padding: 9px 8px; border-top: 1px solid var(--border); font-size: 14px; }
.pg .d { color: var(--muted); font-size: 12px; line-height: 1.3; }
.pg .h { text-align: right; }
.pg .t { cursor: pointer; }
.pg .t:hover { color: var(--green); }
.pg .t.sel { color: var(--green); font-weight: 700; }
.pg .pill { font-size: 12px; padding: 2px 6px; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 8px; text-align: right; }
th.l, td.l { text-align: left; }
td { padding: 9px 8px; font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid var(--border); }
tr.mine td { color: var(--green); font-weight: 700; }
td.pts { font-weight: 700; }
/* Teams ranking */
.teams-wrap { overflow-x: auto; margin-top: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.teams-wrap th { cursor: pointer; white-space: nowrap; user-select: none; }
.teams-wrap th.sorted { color: var(--green); }
.teams-wrap td.rank { color: var(--muted); width: 28px; }
.teams-wrap td.team b { font-weight: 600; }
.teams-wrap td.team span { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
.teams-wrap td.pos { color: var(--green); } .teams-wrap td.neg { color: #e5736f; }
.teams-wrap tr.grp:hover td { background: rgba(255,255,255,0.03); }
.teams-wrap .caret { font-style: normal; color: var(--muted); display: inline-block; width: 14px; }
.teams-wrap tr.sub td { font-size: 14px; font-weight: 400; color: var(--muted); border-top-color: rgba(255,255,255,0.03); padding-top: 6px; padding-bottom: 6px; }
.teams-wrap tr.sub td.team { padding-left: 22px; color: var(--text); }
.teams-wrap tr.sub td.pts { color: var(--text); font-weight: 400; }
.teams-wrap tbody tr { cursor: pointer; }
.teams-wrap tbody tr:hover td.team b, .teams-wrap tr.sub:hover td.team { color: var(--green); }
.teams-wrap .caret { cursor: pointer; padding: 4px 2px; }
.trend-wrap { position: relative; margin-top: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px 4px; }
.trend-wrap svg { display: block; touch-action: pan-y; }
.trend-wrap .tg { stroke: rgba(255,255,255,0.05); }
.trend-wrap .t0 { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.trend-wrap .th { stroke: rgba(255,255,255,0.35); stroke-width: 1; }
.trend-wrap .tl { fill: var(--muted); font-size: 11px; }
.trend-tip { position: absolute; max-width: 320px; background: var(--card2); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 10px; pointer-events: none; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.trend-tip .tt-v { font-size: 18px; font-weight: 700; color: var(--text); }
.trend-tip .tt-d { color: var(--muted); margin: 2px 0 4px; }
.trend-tip .tt-g { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teams-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* ── Phone ── */
@media (max-width: 760px) {
  .teams-wrap .wide { display: none; }
  .teams-wrap td, .teams-wrap th { padding-left: 6px; padding-right: 6px; }
  .topbar .seg.small button { padding-left: 7px; padding-right: 7px; font-size: 11.5px; }
  .trend-tip { max-width: calc(100% - 8px); }
  .section-title { flex-wrap: wrap; row-gap: 6px; }
  .section-title .seg { order: 3; margin-left: 0 !important; }
  .section-title .n { flex-basis: 100%; order: 2; }
  .app { flex-direction: column; height: 100dvh; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); flex-shrink: 0; max-height: 70dvh; }
  .logo-area { padding: 12px 14px; }
  .filters-btn {
    display: flex; align-items: center; gap: 6px; padding: 7px 12px;
    background: var(--card2); border: 1px solid var(--border); border-radius: 18px;
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .filters-btn .badge { background: var(--green); color: #111; border-radius: 9px; padding: 0 6px; font-size: 11px; }
  .sidebar:not(.open) .sidebar-scroll { display: none; }
  .topbar { padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
  .topbar .export-btns { order: -1; margin-left: auto; }
  .list { padding: 4px 12px 40px; }
  .game { grid-template-columns: auto 1fr; grid-template-areas: "time comp" "match match" "venue venue"; gap: 8px 10px; }
  .g-time { grid-area: time; }
  .g-comp { grid-area: comp; text-align: right; }
  .g-comp .code { display: inline-block; margin: 0 6px 0 0; }
  .g-match { grid-area: match; }
  .g-venue { grid-area: venue; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <div>
        <div class="logo">COACH<span>SMART</span></div>
        <div class="logo-sub">GAA Fixtures</div>
      </div>
      <button class="filters-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
        Filters <span class="badge" id="filterCount" style="display:none"></span>
      </button>
    </div>

    <div class="sidebar-scroll">
      <div class="s-section">
        <div class="s-label-row"><div class="s-label">Club</div></div>
        <select class="select" id="clubSelect" onchange="onClubChange()"></select>
      </div>

      <div class="s-section">
        <div class="s-label-row"><div class="s-label">Dates</div></div>
        <select class="select" id="rangeSelect" onchange="onRangeChange()">
          <option value="lastweek">Last week</option>
          <option value="thisweek">This week</option>
          <option value="lastthis">Last week + this week</option>
          <option value="month">This month</option>
          <option value="spring">Spring (Jan – Jul)</option>
          <option value="autumn">Autumn (Aug – Dec)</option>
          <option value="year">This year</option>
          <option value="custom">Custom…</option>
        </select>
        <div class="date-row" id="customDates" style="display:none">
          <input type="date" class="select" id="fromDate" onchange="loadGames()">
          <input type="date" class="select" id="toDate" onchange="loadGames()">
        </div>
      </div>

      <div id="liveFilters" style="display:none">
        <div class="s-section">
          <div class="s-label-row">
            <div class="s-label">Show</div>
            <button class="clear-btn" id="clearBtn" onclick="clearFilters()">Reset filters</button>
          </div>
          <div class="seg" id="genderSeg">
            <button data-g="all" onclick="setGender('all')">All</button>
            <button data-g="boys" onclick="setGender('boys')">Boys</button>
            <button data-g="girls" onclick="setGender('girls')">Girls</button>
          </div>
        </div>
        <div class="s-section">
          <div class="s-label-row"><div class="s-label">Code</div>
            <div class="toggle-all"><button onclick="setAll('code', true)">All</button><button onclick="setAll('code', false)">None</button></div></div>
          <div class="chips" id="codeChips"></div>
        </div>
        <div class="s-section">
          <div class="s-label-row"><div class="s-label">Age group</div>
            <div class="toggle-all"><button onclick="setAll('age', true)">All</button><button onclick="setAll('age', false)">None</button></div></div>
          <div class="seg" id="bandSeg" style="margin-bottom:10px">
            <button data-b="all" onclick="setBand('all')">All</button>
            <button data-b="ccc1" onclick="setBand('ccc1')">CCC1</button>
            <button data-b="ccc2" onclick="setBand('ccc2')">CCC2</button>
            <button data-b="adult" onclick="setBand('adult')">Adult</button>
          </div>
          <div class="chips" id="ageChips"></div>
        </div>
        <div class="s-section">
          <div class="s-label-row">
            <button class="adv-toggle" id="compToggle" onclick="toggleComps()"><span id="compCaret">▸</span> Competitions</button>
            <div class="toggle-all" id="compAllNone" style="display:none"><button onclick="setAll('comp', true)">All</button><button onclick="setAll('comp', false)">None</button></div></div>
          <div id="compChips" style="display:none"></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main" id="main"></div>
</div>

<script>
const EDGE = 'https://gyfporsbdftvtakdvukt.supabase.co/functions/v1/gaa-fixtures';
// Bump when the edge function's output changes, so browsers don't reuse cached data (cached 15 min)
const DATA_VERSION = 2;
// Sportlomo keeps three separate organisations, each with its own club IDs:
// GAA (football + hurling), camogie and ladies football. Clubs are matched
// across them by name. IDs are only needed to fetch one club over a long
// date range; short ranges load every club and filter here.
const ORG_OF = { Football: 'gaa', Hurling: 'gaa', Camogie: 'camogie', 'Ladies Football': 'lgfa' };
const ORG_PARAM = { gaa: 'club', camogie: 'camogieClub', lgfa: 'lgfaClub' };
const CLUB_SEED = { Clontarf: { gaa: '3561', camogie: '40597', lgfa: '5346' } };
// Camogie club list name -> names the same club goes by in GAA fixtures
const CAMOGIE_ALIAS = {
  'Naomh Brid': ['St Brigids'],
  'Naomh Jude': ['St Judes'],
  'Naomh Fionnbarra': ['St Finbarrs'],
  'Naomh Caitriona': ['St Catherines'],
  'Round Towers Lusk': ['Round Towers (L)', 'Round Towers Lusk'],
  'Round Tower': ['Round Towers (C)', 'Round Towers Clondalkin'],
  'St Pats Donabate': ['St Patricks Donabate'],
  'Kevins': ['St Kevins'],
};
const ALL_CLUBS_MAX_DAYS = 15;   // same limit as the edge function
const CHUNK_DAYS = 14;           // one request per two weeks of a long range
const addDaysFrom = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d; };
const GENDER = { boys: ['Football', 'Hurling'], girls: ['Camogie', 'Ladies Football'] };

// ── State ──────────────────────────────────────────────────────────────────
// One fetch per club + date range; every filter after that runs locally.
// An empty selection set means "no filter" (show everything).
let games = [];
let gender = 'all';
let band = 'all';   // all | ccc1 (U12 and under) | ccc2 (U13-U16) | adult (Minor and up)
let view = recall('gaa_view', 'all');
let listGroup = recall('gaa_list_group', 'date');   // date | team   // all | results | fixtures | teams
let teamSort = { key: 'pct', dir: -1 };
let venue = recall('gaa_venue', 'all'); // all | home | away (relative to the chosen club)
// Every chip starts on; these hold what has been switched off, so new
// codes/ages/competitions appear switched on.
let offCodes = new Set(), offAges = new Set(), offComps = new Set();
let compsOpen = recall('gaa_comps_open', false);
const standingsCache = {};

// ── Storage ────────────────────────────────────────────────────────────────
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function recall(key, dflt) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? dflt; } catch { return dflt; }
}
function saveFilters() { store('gaa_gender', gender); store('gaa_band', band); }
function loadFilters() { gender = recall('gaa_gender', 'all'); band = recall('gaa_band', 'all'); }
// name -> {gaa, camogie, lgfa} IDs, learned from every game loaded
function clubDir() {
  const dir = {};
  // Fold any entries saved under a camogie/variant name into the club's GAA name
  for (const [name, ids] of Object.entries(recall('gaa_clubdir', {}))) {
    const k = canonClub(name);
    dir[k] = { ...ids, ...dir[k] };
  }
  // Camogie IDs come from Sportlomo's camogie club list (a club's camogie team may
  // never have shown up in a loaded game, so it can't be learned)
  for (const { id, name } of recall('gaa_camogie_clubs', { list: [] }).list) {
    const names = [name, ...(CAMOGIE_ALIAS[name.trim()] || [])];
    const k = Object.keys(dir).find(n => names.some(c => sameClub(n, c)));
    if (k) dir[k] = { ...dir[k], camogie: id };
  }
  for (const [name, ids] of Object.entries(CLUB_SEED)) dir[name] = { ...dir[name], ...ids };   // seeds win
  return dir;
}
const currentClub = () => canonClub(recall('gaa_club_name2', 'Clontarf'));   // '' = all clubs
const clubKey = n => (n || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const sameClub = (a, b) => clubKey(a) === clubKey(b);
// One name per club: camogie names (and GAA spelling variants) fold into the GAA name
const ALIAS_TO = {};
for (const [camogie, gaa] of Object.entries(CAMOGIE_ALIAS)) for (const n of [camogie, ...gaa]) ALIAS_TO[clubKey(n)] = gaa[0];
const canonClub = n => ALIAS_TO[clubKey(n)] || n;
const homeClub = g => canonClub(g.homeClub || g.home);
const awayClub = g => canonClub(g.awayClub || g.away);

// ── Club + dates ───────────────────────────────────────────────────────────
function renderClubSelect() {
  const sel = currentClub();
  const names = Object.keys(clubDir());
  if (sel && !names.some(n => sameClub(n, sel))) names.push(sel);
  document.getElementById('clubSelect').innerHTML =
    `<option value="" ${sel ? '' : 'selected'}>All clubs</option>` +
    names.sort((a, b) => a.localeCompare(b))
      .map(n => `<option value="${esc(n)}" ${sameClub(n, sel) ? 'selected' : ''}>${esc(n)}</option>`).join('');
}

function onClubChange() {
  store('gaa_club_name2', document.getElementById('clubSelect').value);
  loadGames();   // no new fetch when every club is already loaded for these dates
}

const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = n => new Date(Date.now() + n * 864e5);

function onRangeChange() {
  const v = document.getElementById('rangeSelect').value;
  store('gaa_range5', v);
  document.getElementById('customDates').style.display = v === 'custom' ? '' : 'none';
  loadGames();
}
function dateRange() {
  const v = document.getElementById('rangeSelect').value;
  if (v === 'custom') {
    const from = document.getElementById('fromDate').value, to = document.getElementById('toDate').value;
    if (from && to) return { from, to };
  }
  // Weeks run Monday to Sunday. Last week is also the fallback for an unfinished custom range.
  const sinceMon = (new Date().getDay() + 6) % 7;   // Monday = 0
  if (v === 'thisweek') return { from: isoDay(addDays(-sinceMon)), to: isoDay(addDays(6 - sinceMon)) };
  if (v === 'lastthis') return { from: isoDay(addDays(-sinceMon - 7)), to: isoDay(addDays(6 - sinceMon)) };
  const y = new Date().getFullYear(), m = new Date().getMonth();
  const span = (m1, d1, m2, d2) => ({ from: isoDay(new Date(y, m1, d1)), to: isoDay(new Date(y, m2, d2)) });
  if (v === 'month') return span(m, 1, m + 1, 0);
  if (v === 'spring') return span(0, 1, 6, 31);
  if (v === 'autumn') return span(7, 1, 11, 31);
  if (v === 'year') return span(0, 1, 11, 31);
  return { from: isoDay(addDays(-sinceMon - 7)), to: isoDay(addDays(-sinceMon - 1)) };
}

// ── Fetch ──────────────────────────────────────────────────────────────────
let loadSeq = 0;
let loadedKey = '';   // what `games` currently holds, e.g. "all|2026-10-05|2026-10-18"
async function loadGames() {
  const club = currentClub();
  const { from, to } = dateRange();
  const days = (Date.parse(to) - Date.parse(from)) / 864e5;
  const allClubs = !club;
  // Every club already loaded for these dates also covers any one club
  if (loadedKey === `all|${from}|${to}` || loadedKey === `${club}|${from}|${to}`) { render(); return; }
  const key = `${allClubs ? 'all' : club}|${from}|${to}`;

  const main = document.getElementById('main');
  if (allClubs && days > ALL_CLUBS_MAX_DAYS) {
    games = []; loadedKey = '';
    document.getElementById('liveFilters').style.display = 'none';
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">All clubs is limited to two weeks</div>
        <div class="empty-sub">Choose a club, or "This week" / "Last week + this week".</div>
      </div>`;
    return;
  }

  const seq = ++loadSeq;
  main.innerHTML = `
    <div class="empty-state"><div class="spinner"></div><div class="empty-sub">Loading ${allClubs ? 'every club’s' : esc(club)} games…</div></div>`;
  let data;
  try {
    let url = `${EDGE}?type=club&format=json&results=1&dv=${DATA_VERSION}&from=${from}&to=${to}`;
    if (allClubs) url += '&club=all';
    else {
      const ids = Object.entries(clubDir()).find(([n]) => sameClub(n, club))?.[1] || {};
      url += `&clubName=${encodeURIComponent(club)}` +
        Object.entries(ORG_PARAM).map(([org, p]) => ids[org] ? `&${p}=${ids[org]}` : '').join('');
    }
    // Long ranges are fetched as two-week chunks (a few at a time) so no single
    // request runs into the server's time limit; results are merged and de-duplicated.
    const chunks = [];
    for (let d = from; d <= to; d = isoDay(addDaysFrom(d, CHUNK_DAYS))) {
      const end = isoDay(addDaysFrom(d, CHUNK_DAYS - 1));
      chunks.push([d, end < to ? end : to]);
    }
    const getChunk = async ([f, t], tries = 2) => {
      try {
        const res = await fetch(url.replace(`from=${from}&to=${to}`, `from=${f}&to=${t}`));
        if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
        return await res.json();
      } catch (e) {
        if (tries > 1) return getChunk([f, t], tries - 1);
        throw e;
      }
    };
    const parts = new Array(chunks.length);
    let next = 0, done = 0;
    const worker = async () => {
      while (next < chunks.length && seq === loadSeq) {
        const i = next++;
        parts[i] = await getChunk(chunks[i]);
        if (chunks.length > 1 && seq === loadSeq) {
          const sub = main.querySelector('.empty-sub');
          if (sub) sub.textContent = `Loading ${club || 'every club'}’s games… ${Math.round(++done / chunks.length * 100)}%`;
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(3, chunks.length) }, worker));
    const seen = new Set();
    data = parts.flat().filter(g => {
      const id = [g.competitionId, g.home, g.away, g.start].join('|');
      return !seen.has(id) && seen.add(id);
    });
  } catch (e) {
    if (seq !== loadSeq) return;
    games = []; loadedKey = '';
    document.getElementById('liveFilters').style.display = 'none';
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Could not load fixtures</div>
        <div class="empty-sub">${esc(e.message)}</div>
      </div>`;
    return;
  }
  if (seq !== loadSeq) return;   // a newer request superseded this one
  games = data;
  loadedKey = key;
  offCodes.clear(); offAges.clear(); offComps.clear();
  learnClubs();
  render();
}

function learnClubs() {
  const dir = recall('gaa_clubdir', {});
  games.forEach(g => {
    const org = ORG_OF[g.code];
    for (const [name, id] of [[homeClub(g), g.homeClubId], [awayClub(g), g.awayClubId]]) {
      if (!name || /^bye$/i.test(name)) continue;
      const k = Object.keys(dir).find(n => sameClub(n, name)) || name;
      dir[k] = dir[k] || {};
      if (id && org) dir[k][org] = dir[k][org] || id;
    }
  });
  store('gaa_clubdir', dir);
  renderClubSelect();
}

// Games for the chosen club (all of them when "All clubs")
function clubGames() {
  const club = currentClub();
  return club ? games.filter(g => sameClub(homeClub(g), club) || sameClub(awayClub(g), club)) : games;
}

// ── Filters ────────────────────────────────────────────────────────────────
const ageOrder = a => { const m = a.match(/^U(\d+)/); return m ? +m[1] : 100; };
const genderOk = g => gender === 'all' || GENDER[gender].includes(g.code);
const pass = (off, v) => !off.has(v);
// CCC1 = U12 and under, CCC2 = U13-U16, Adult = Minor, U17+ and every adult grade
function ageBand(age) {
  const n = ageOrder(age);
  if (n <= 12) return 'ccc1';
  if (n <= 16) return 'ccc2';
  return 'adult';   // Minor, Junior, Intermediate, Senior, AFL/AHL and anything without an under-age
}
const bandOk = g => band === 'all' || ageBand(g.age) === band;

// Short competition label: drop the age, code and sponsor words already shown elsewhere
function shortComp(g) {
  let s = (g.grade || g.competition)
    .replace(/\b(PTSB|LGFA|Ladies|Football|Hurling|Camogie|20\d\d)\b/gi, '')
    .replace(/\bDivision\b/gi, 'Div.').replace(/Div\.\s+/g, 'Div.')
    .replace(/\s+/g, ' ').trim();
  return s || g.competition;
}

function setGender(v) { gender = v; saveFilters(); render(); }
function setBand(v) { band = v; saveFilters(); render(); }
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); render(); }
function clearFilters() { gender = 'all'; band = 'all'; offCodes.clear(); offAges.clear(); offComps.clear(); saveFilters(); render(); }
function toggleComps() { compsOpen = !compsOpen; store('gaa_comps_open', compsOpen); render(); }
// All / None for one group, over the chips currently shown in it
let shownChips = { code: [], age: [], comp: [] };
function setAll(group, on) {
  const set = { code: offCodes, age: offAges, comp: offComps }[group];
  shownChips[group].forEach(v => on ? set.delete(v) : set.add(v));
  render();
}

function chip(label, n, on, onclick) {
  return `<div class="chip ${on ? 'on' : ''}" onclick="${onclick}">${esc(label)}<span class="n">${n}</span></div>`;
}
const countBy = (list, key) => list.reduce((m, g) => (m[key(g)] = (m[key(g)] || 0) + 1, m), {});

function renderFilters() {
  document.querySelectorAll('#genderSeg button').forEach(b => b.classList.toggle('on', b.dataset.g === gender));
  document.querySelectorAll('#bandSeg button').forEach(b => b.classList.toggle('on', b.dataset.b === band));

  // Each level only offers what exists under the levels above it, and a
  // selection that no longer exists there is dropped.
  const g1 = clubGames().filter(genderOk);
  const codes = countBy(g1, g => g.code);
  shownChips.code = Object.keys(codes).sort();
  document.getElementById('codeChips').innerHTML = shownChips.code
    .map(c => chip(c, codes[c], !offCodes.has(c), `toggle(offCodes, '${esc(c)}')`)).join('');

  const g2 = g1.filter(g => pass(offCodes, g.code) && bandOk(g));
  const ages = countBy(g2, g => g.age);
  shownChips.age = Object.keys(ages).sort((a, b) => ageOrder(a) - ageOrder(b) || a.localeCompare(b));
  document.getElementById('ageChips').innerHTML = shownChips.age
    .map(a => chip(a, ages[a], !offAges.has(a), `toggle(offAges, '${esc(a)}')`)).join('');

  const g3 = g2.filter(g => pass(offAges, g.age));
  // Competitions: collapsed by default, grouped by age; ids so same-named comps stay apart
  const comps = {};
  g3.forEach(g => { (comps[g.competitionId] = comps[g.competitionId] || { g, n: 0 }).n++; });
  shownChips.comp = Object.keys(comps);
  const offShown = shownChips.comp.filter(c => offComps.has(c)).length;
  document.getElementById('compCaret').textContent = compsOpen ? '▾' : '▸';
  document.getElementById('compToggle').lastChild.textContent = ` Competitions (${shownChips.comp.length - offShown}/${shownChips.comp.length})`;
  document.getElementById('compAllNone').style.display = compsOpen ? '' : 'none';
  const box = document.getElementById('compChips');
  box.style.display = compsOpen ? '' : 'none';
  if (compsOpen) {
    const byAge = {};
    Object.entries(comps).forEach(([id, c]) => (byAge[c.g.age] = byAge[c.g.age] || []).push([id, c]));
    const multiCode = new Set(g3.map(g => g.code)).size > 1;
    box.innerHTML = Object.keys(byAge).sort((a, b) => ageOrder(a) - ageOrder(b) || a.localeCompare(b)).map(age => `
      <div class="comp-group"><div class="comp-group-label">${esc(age)}</div>
        <div class="chips">${byAge[age]
          .sort((a, b) => (a[1].g.code + shortComp(a[1].g)).localeCompare(b[1].g.code + shortComp(b[1].g), undefined, { numeric: true }))
          .map(([id, c]) => chip(shortComp(c.g) + (multiCode ? ` · ${c.g.code}` : ''), c.n, !offComps.has(id), `toggle(offComps, '${id}')`)).join('')}</div>
      </div>`).join('');
  }
  const g4 = g3.filter(g => pass(offComps, g.competitionId));
  const active = (gender !== 'all') + (band !== 'all') + shownChips.code.filter(c => offCodes.has(c)).length +
    shownChips.age.filter(a => offAges.has(a)).length + offShown;
  document.getElementById('clearBtn').style.visibility = active ? '' : 'hidden';
  const fc = document.getElementById('filterCount');
  fc.style.display = active ? '' : 'none';
  fc.textContent = active;

  return g4;
}

// ── Render list ────────────────────────────────────────────────────────────
const dayFmt = new Intl.DateTimeFormat('en-IE', { timeZone: 'Europe/Dublin', weekday: 'long', day: 'numeric', month: 'long' });
const timeFmt = new Intl.DateTimeFormat('en-IE', { timeZone: 'Europe/Dublin', hour: '2-digit', minute: '2-digit', hour12: false });
const shortFmt = new Intl.DateTimeFormat('en-IE', { timeZone: 'Europe/Dublin', day: 'numeric', month: 'short' });

function parseScore(s) {
  if (!s) return null;
  const [h, a] = s.split(' v ');
  const total = p => { const m = (p || '').match(/(\d+)\s*-\s*(\d+)/); return m ? +m[1] * 3 + +m[2] : 0; };
  return { home: (h || '').trim(), away: (a || '').trim(), ht: total(h), at: total(a) };
}

        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        CSV
      </button><button class="export-btn" id="xlsxBtn" onclick="exportXlsx()" title="Download as Excel">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

        : `${view === 'all' || view === 'results' ? section('Results', results, club ? statsCards(results, g => sameClub(homeClub(g), club)) : '') : ''}

// Win/draw/loss record over the results given (scored games only).
// isHome(g) says whether the club/team was at home: true, false, or null when not playing.
function statsCards(results, isHome) {
  const played = results.map(g => {
    const sc = parseScore(g.score);
    if (!sc || !/\d/.test(g.score)) return null;
    const home = isHome(g);
    if (home === null) return null;
    const forPts = home ? sc.ht : sc.at, against = home ? sc.at : sc.ht;
    return { home, forPts, against, r: forPts > against ? 'W' : forPts < against ? 'L' : 'D' };
  }).filter(Boolean);
  if (!played.length) return '';
  const rec = list => {
    const n = list.length, w = list.filter(x => x.r === 'W').length, d = list.filter(x => x.r === 'D').length;
    return { n, w, d, l: n - w - d, pct: n ? Math.round(w / n * 100) : 0 };
  };
  const pct = (x, n) => `${x / n * 100}%`;
  const card = (label, list) => {
    const r = rec(list);
    if (!r.n) return '';
    return `<div class="stat"><div class="stat-label">${label}</div>
      <div class="stat-big">${r.pct}%<small>won</small></div>
      <div class="stat-sub">${r.w}W · ${r.d}D · ${r.l}L from ${r.n}</div>
      <div class="wdl-bar"><div class="w" style="width:${pct(r.w, r.n)}"></div><div class="d" style="width:${pct(r.d, r.n)}"></div><div class="l" style="width:${pct(r.l, r.n)}"></div></div></div>`;
  };
  const n = played.length;
  const avgFor = played.reduce((t, x) => t + x.forPts, 0) / n, avgAgainst = played.reduce((t, x) => t + x.against, 0) / n;
  const diff = avgFor - avgAgainst;
  const one = v => (Math.round(v * 10) / 10).toString();
  return `<div class="stats">
    ${card('Overall', played)}${card('Home', played.filter(x => x.home))}${card('Away', played.filter(x => !x.home))}
    <div class="stat"><div class="stat-label">Avg points</div>
      <div class="stat-big">${one(avgFor)}<small>v</small> ${one(avgAgainst)}</div>
      <div class="stat-sub">For v against · ${diff >= 0 ? '+' : ''}${one(diff)} a game</div></div>
  </div>`;
}

// Teams ranked over the results shown. A team is name + code + age, since the
// same club name fields many teams. With a club chosen, only that club's sides count.
function teamsTable(results, club) {
  const teams = {};
  const blank = () => ({ p: 0, w: 0, d: 0, l: 0, pf: 0, pa: 0 });
  const tally = (t, forPts, against) => {
    t.p++; t.pf += forPts; t.pa += against;
    forPts > against ? t.w++ : forPts < against ? t.l++ : t.d++;
  };
  // Group = team name + code + age; each competition it plays in is a sub-row
  // (a club's U13 Div.3 and Div.11 sides share the name "Clontarf").
  const add = (name, g, forPts, against) => {
    const k = [name, g.code, g.age].join('|');
    const t = teams[k] = teams[k] || { key: k, name, code: g.code, age: g.age, ...blank(), subs: {} };
    const sub = t.subs[g.competitionId] = t.subs[g.competitionId] || { label: shortComp(g), compId: g.competitionId, key: k, name, code: g.code, age: g.age, ...blank() };
    tally(t, forPts, against); tally(sub, forPts, against);
  };
  results.forEach(g => {
    const sc = parseScore(g.score);
    if (!sc || !/\d/.test(g.score)) return;
    if (!club || sameClub(homeClub(g), club)) add(g.home, g, sc.ht, sc.at);
    if (!club || sameClub(awayClub(g), club)) add(g.away, g, sc.at, sc.ht);
  });
  const calc = t => ({ ...t, pct: Math.round(t.w / t.p * 100), diff: t.pf - t.pa, avg: Math.round((t.pf - t.pa) / t.p * 10) / 10 });
  const { key, dir } = teamSort;
  const val = t => key === 'team' ? (t.label ?? `${t.name} ${t.code} ${t.age}`) : t[key];
  const order = (a, b) => (typeof val(a) === 'string' ? val(a).localeCompare(val(b), undefined, { numeric: true }) : val(a) - val(b)) * dir
    || b.pct - a.pct || b.avg - a.avg || b.p - a.p;
  const list = Object.values(teams).map(t => ({ ...calc(t), subs: Object.values(t.subs).map(calc).sort(order) })).sort(order);
  // "By competition": every team-in-a-competition ranked on its own
  const flat = teamsMode === 'flat' ? list.flatMap(t => t.subs).sort(order) : null;
  if (!list.length) return '<div class="empty-state"><div class="empty-sub">No scored results for these filters yet.</div></div>';
  const th = (k, label, cls = '') => `<th class="${cls} ${key === k ? 'sorted' : ''}" onclick="sortTeams('${k}')">${label}${key === k ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`;
  const sign = v => v > 0 ? `+${v}` : `${v}`;
  const tone = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
  const nums = t => `<td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td class="pts">${t.pct}%</td>
    <td class="wide">${t.pf}</td><td class="wide">${t.pa}</td><td class="${tone(t.diff)}">${sign(t.diff)}</td>
    <td class="wide ${tone(t.avg)}">${sign(t.avg)}</td>`;
  const multi = flat ? [] : list.filter(t => t.subs.length > 1);
  const allOpen = multi.every(t => !teamsCollapsed.has(t.key));
  const modeBtn = (m, label) => `<button class="${teamsMode === m ? 'on' : ''}" onclick="setTeamsMode('${m}')">${label}</button>`;
  const head = `
    <div class="section-title">Teams<span class="n">${flat ? flat.length : list.length}</span>
      <div class="seg small" style="margin-left:12px">${modeBtn('group', 'By age group')}${modeBtn('flat', 'By competition')}</div>
      ${multi.length ? `<button class="clear-btn" style="margin-left:auto" onclick="toggleAllTeams(${allOpen})">${allOpen ? 'Collapse all' : 'Expand all'}</button>` : ''}</div>`;
  const thead = `<thead><tr><th class="l">#</th>${th('team', 'Team', 'l')}${th('p', 'P')}${th('w', 'W')}${th('d', 'D')}${th('l', 'L')}
        ${th('pct', 'Win %')}${th('pf', 'For', 'wide')}${th('pa', 'Agst', 'wide')}${th('diff', 'Diff')}${th('avg', 'Per game', 'wide')}</tr></thead>`;
  const note = `<div class="teams-note">Ranked by win %, then points difference per game. Points count goals as 3. Tap a heading to sort, or a team to see its games${flat ? '' : ' (the arrow shows or hides its competitions)'}. Only results in the dates and filters chosen are counted.</div>`;
  if (flat) return `${head}
    <div class="teams-wrap"><table>${thead}
      <tbody>${flat.map((t, i) => `
        <tr data-k="${esc(t.key)}" data-c="${t.compId}" onclick="openTeam(this.dataset.k, this.dataset.c)"><td class="l rank">${i + 1}</td>
          <td class="l team"><b>${esc(t.name)}</b><span>${esc(t.code)} · ${esc(t.age)} · ${esc(t.label)}</span></td>
          ${nums(t)}</tr>`).join('')}</tbody>
    </table></div>${note}`;
  return `${head}
    <div class="teams-wrap"><table>${thead}
      <tbody>${list.map((t, i) => {
        const split = t.subs.length > 1, open = split && !teamsCollapsed.has(t.key);
        return `
        <tr class="${split ? 'grp' : ''}" data-k="${esc(t.key)}" onclick="openTeam(this.dataset.k)">
          <td class="l rank">${i + 1}</td>
          <td class="l team"><b>${split ? `<i class="caret" onclick="event.stopPropagation(); toggleTeam(this.closest('tr').dataset.k)">${open ? '▾' : '▸'}</i>` : ''}${esc(t.name)}</b>
            <span>${esc(t.code)} · ${esc(t.age)}${split ? ` · ${t.subs.length} competitions` : ` · ${esc(t.subs[0].label)}`}</span></td>
          ${nums(t)}</tr>
        ${open ? t.subs.map(sub => `<tr class="sub" data-k="${esc(t.key)}" data-c="${sub.compId}" onclick="openTeam(this.dataset.k, this.dataset.c)"><td></td><td class="l team">${esc(sub.label)}</td>${nums(sub)}</tr>`).join('') : ''}`;
      }).join('')}</tbody>
    </table></div>${note}`;
}
let teamsCollapsed = new Set();
// One team's games (results and upcoming) in the side panel, using the filters on screen.
// key = name|code|age; compId narrows to one competition.
function openTeam(key, compId) {
  const [name, code, age] = key.split('|');
  const club = currentClub();
  const list = renderFilters().filter(g => g.code === code && g.age === age && (!compId || g.competitionId === compId) &&
    (g.home === name || g.away === name) &&
    (!club || venue === 'all' || (venue === 'home') === (g.home === name)));
  const now = Date.now();
  const results = list.filter(g => g.kind === 'result' || new Date(g.start).getTime() < now).sort((a, b) => new Date(b.start) - new Date(a.start));
  const upcoming = list.filter(g => !results.includes(g)).sort((a, b) => new Date(a.start) - new Date(b.start));
  const row = g => {
    const sc = parseScore(g.score);
    const hWin = sc && sc.ht > sc.at, aWin = sc && sc.at > sc.ht;
    const nm = (n, cls) => `<div class="${cls}" style="${n === name ? 'font-weight:700' : ''}">${esc(n)}</div>`;
    return `<div class="pg"><div class="d">${shortFmt.format(new Date(g.start))}<br>${timeFmt.format(new Date(g.start))}</div>
      ${nm(g.home, 'h')}
      <div>${sc ? `<span class="pill ${hWin ? 'win' : ''}">${esc(sc.home)}</span> <span class="pill ${aWin ? 'win' : ''}">${esc(sc.away)}</span>` : '<span class="vs">v</span>'}</div>
      ${nm(g.away, '')}
      ${compId ? '' : `<div style="grid-column: 2 / -1; text-align: center; font-size: 12px; color: var(--muted); margin-top: -4px">${esc(shortComp(g))}</div>`}</div>`;
  };
  const comps = [...new Set(list.map(g => shortComp(g)))];
  closePanel();
  const div = document.createElement('div');
  div.className = 'overlay';
  div.onclick = e => { if (e.target === div) closePanel(); };
  div.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">${esc(name)} · ${esc(age)} ${esc(code)}</div>
          <div class="panel-sub">${compId ? esc(comps[0] || '') : `${comps.length} competition${comps.length === 1 ? '' : 's'}`} · dates and filters as on screen</div></div>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div class="panel-body">
        ${statsCards(results, g => g.home === name ? true : g.away === name ? false : null)}
        ${results.length ? `<div class="day" style="padding:0 8px">Results</div>${results.map(row).join('')}` : ''}
        ${upcoming.length ? `<div class="day" style="padding:0 8px">Upcoming</div>${upcoming.map(row).join('')}` : ''}
        ${list.length ? '' : '<div class="empty-state"><div class="empty-sub">No games for this team in these dates.</div></div>'}
      </div>
    </div>`;
  document.body.appendChild(div);
}
let teamsMode = recall('gaa_teams_mode', 'group');   // group | flat
function setTeamsMode(m) { teamsMode = m; store('gaa_teams_mode', m); render(); }
function toggleTeam(k) { teamsCollapsed.has(k) ? teamsCollapsed.delete(k) : teamsCollapsed.add(k); render(); }

function sortTeams(k) {

// ── Score-difference chart ─────────────────────────────────────────────────
// One point per day: the chosen club's average points difference in that day's
// scored results (so several teams playing the same day don't zigzag the line).
let trendData = null;
let trendMode = recall('gaa_trend_mode', 'pts');   // pts | wl
function setTrendMode(m) { trendMode = m; store('gaa_trend_mode', m); render(); }
function trendSection(results, club) {
  trendData = null;
  if (!club) return '<div class="empty-state"><div class="empty-sub">Pick a club to chart its score difference over time.</div></div>';
  const days = new Map();
  results.forEach(g => {
    const sc = parseScore(g.score);
    if (!sc || !/\d/.test(g.score)) return;
    const home = sameClub(homeClub(g), club), away = sameClub(awayClub(g), club);
    if (!home && !away) return;
    const diff = home ? sc.ht - sc.at : sc.at - sc.ht;
    const day = isoDay(new Date(g.start));
    const d = days.get(day) || { day, t: new Date(day + 'T12:00:00').getTime(), games: [] };
    d.games.push({ g, diff });
    days.set(day, d);
  });
  // pts mode: average points difference that day; wl mode: wins minus losses that day
  const pts = [...days.values()].sort((a, b) => a.t - b.t).map(d => {
    const w = d.games.filter(x => x.diff > 0).length, l = d.games.filter(x => x.diff < 0).length;
    return { ...d, w, l, y: trendMode === 'wl' ? w - l : Math.round(d.games.reduce((s, x) => s + x.diff, 0) / d.games.length * 10) / 10 };
  });
  if (pts.length < 2) return '<div class="empty-state"><div class="empty-sub">Not enough scored results in these dates and filters to draw a chart.</div></div>';
  trendData = pts;
  const all = pts.flatMap(p => p.games);
  const w = all.filter(x => x.diff > 0).length, l = all.filter(x => x.diff < 0).length;
  const avg = Math.round(all.reduce((s, x) => s + x.diff, 0) / all.length * 10) / 10;
  return `
    <div class="section-title">${trendMode === 'wl' ? 'Wins v losses' : 'Score difference'}<span class="n">${all.length} games · ${w}W ${all.length - w - l}D ${l}L · ${avg > 0 ? '+' : ''}${avg} pts a game</span>
      <div class="seg small" style="margin-left:auto">${[['pts', 'Points diff'], ['wl', 'Win / loss']].map(([m, t]) =>
        `<button class="${trendMode === m ? 'on' : ''}" onclick="setTrendMode('${m}')">${t}</button>`).join('')}</div></div>
    <div class="trend-wrap" id="trend"></div>
    <div class="teams-note">${trendMode === 'wl'
      ? `Each point is a day: ${esc(club)}'s wins minus losses in that day's results (+2 = two more wins than losses).`
      : `Each point is a day: ${esc(club)}'s average points difference in that day's results (goals count as 3).`}
      Above the line is winning, below is losing. Follows the dates and filters chosen.</div>`;
}

// Monotone cubic path (Fritsch–Carlson): smooth, but never overshoots a point
function smoothPath(P) {
  const n = P.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((P[i + 1].y - P[i].y) / (P[i + 1].x - P[i].x || 1));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  let path = `M${P[0].x},${P[0].y}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (P[i + 1].x - P[i].x) / 3;
    path += `C${P[i].x + dx},${P[i].y + m[i] * dx} ${P[i + 1].x - dx},${P[i + 1].y - m[i + 1] * dx} ${P[i + 1].x},${P[i + 1].y}`;
  }
  return path;
}

function niceStep(range, count) {
  const raw = range / count, pow = 10 ** Math.floor(Math.log10(raw)), f = raw / pow;
  return (f >= 5 ? 10 : f >= 2 ? 5 : f >= 1 ? 2 : 1) * pow;
}

function drawTrend() {
  const box = document.getElementById('trend');
  if (!box || !trendData) return;
  const pts = trendData;
  const W = box.clientWidth, H = W < 500 ? 240 : 320, ml = 40, mr = 14, mt = 14, mb = 26;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const ys = pts.map(p => p.y);
  let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const step = trendMode === 'wl' ? Math.max(1, niceStep((hi - lo) || 2, 4)) : niceStep((hi - lo) || 10, 5);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (lo === hi) hi = lo + step;
  const X = t => ml + (t - t0) / (t1 - t0 || 1) * (W - ml - mr);
  const Y = v => mt + (hi - v) / (hi - lo) * (H - mt - mb);
  const P = pts.map(p => ({ x: X(p.t), y: Y(p.y) }));
  const line = smoothPath(P), y0 = Y(0);
  const area = `${line}L${P[P.length - 1].x},${y0}L${P[0].x},${y0}Z`;
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    grid += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" class="tg"/>
      <text x="${ml - 6}" y="${Y(v) + 4}" class="tl" text-anchor="end">${v > 0 ? '+' : ''}${Math.round(v * 10) / 10}</text>`;
  }
  // x labels: about one every 90px
  const nx = Math.max(2, Math.floor((W - ml - mr) / 90));
  for (let i = 0; i <= nx; i++) {
    const t = t0 + (t1 - t0) * i / nx;
    grid += `<text x="${X(t)}" y="${H - 8}" class="tl" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${shortFmt.format(new Date(t))}</text>`;
  }
  const tone = v => v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--muted)';
  box.innerHTML = `
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${trendMode === 'wl' ? 'Wins minus losses' : 'Score difference'} over time">
      <defs>
        <clipPath id="above"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath>
        <clipPath id="below"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath>
      </defs>
      ${grid}
      <path d="${area}" fill="var(--green)" opacity=".14" clip-path="url(#above)"/>
      <path d="${area}" fill="var(--red)" opacity=".14" clip-path="url(#below)"/>
      <line x1="${ml}" x2="${W - mr}" y1="${y0}" y2="${y0}" class="t0"/>
      <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round"/>
      ${P.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${P.length > (W - ml - mr) / 10 ? 3 : 4}" fill="${tone(pts[i].y)}" stroke="var(--card)" stroke-width="2"/>`).join('')}
      <line id="trendHair" y1="${mt}" y2="${H - mb}" class="th" style="display:none"/>
      <rect x="${ml}" y="0" width="${W - ml - mr}" height="${H}" fill="transparent" id="trendHit"/>
    </svg>
    <div class="trend-tip" id="trendTip" style="display:none"></div>`;
  const hit = document.getElementById('trendHit'), hair = document.getElementById('trendHair'), tip = document.getElementById('trendTip');
  const show = e => {
    const r = hit.getBoundingClientRect(), x = e.clientX - r.left + ml;
    let i = 0;
    P.forEach((p, k) => { if (Math.abs(p.x - x) < Math.abs(P[i].x - x)) i = k; });
    const d = pts[i];
    hair.setAttribute('x1', P[i].x); hair.setAttribute('x2', P[i].x); hair.style.display = '';
    tip.replaceChildren();
    const head = document.createElement('div');
    head.className = 'tt-v';
    head.textContent = trendMode === 'wl' ? `${d.w}W ${d.games.length - d.w - d.l}D ${d.l}L` : `${d.y > 0 ? '+' : ''}${d.y}`;
    const sub = document.createElement('div');
    sub.className = 'tt-d';
    sub.textContent = `${dayFmt.format(new Date(d.t))}${trendMode === 'wl' ? ` · net ${d.y > 0 ? '+' : ''}${d.y}` : d.games.length > 1 ? ` · average of ${d.games.length} games` : ''}`;
    tip.append(head, sub);
    d.games.slice(0, 6).forEach(({ g, diff }) => {
      const row = document.createElement('div');
      row.className = 'tt-g';
      row.textContent = `${trendMode === 'wl' ? (diff > 0 ? 'W' : diff < 0 ? 'L' : 'D') : (diff > 0 ? '+' : '') + diff}  ${g.home} ${parseScore(g.score).home} v ${parseScore(g.score).away} ${g.away} · ${g.age} ${g.code}`;
      tip.append(row);
    });
    if (d.games.length > 6) { const more = document.createElement('div'); more.className = 'tt-d'; more.textContent = `+${d.games.length - 6} more`; tip.append(more); }
    tip.style.display = '';
    const tw = tip.offsetWidth;
    let left = P[i].x + 12 + tw > W ? P[i].x - tw - 12 : P[i].x + 12;
    left = Math.max(4, Math.min(left, W - tw - 4));
    tip.style.left = `${left}px`;
    tip.style.top = `${mt}px`;
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { hair.style.display = 'none'; tip.style.display = 'none'; });
}
window.addEventListener('resize', () => { if (view === 'trend') drawTrend(); });

function setView(v) { view = v; store('gaa_view', v); render(); }
function setListGroup(v) { listGroup = v; store('gaa_list_group', v); render(); }
function setVenue(v) { venue = v; store('gaa_venue', v); render(); }

// Collapsed list groups ("Section|group"), for this visit only
let listCollapsed = new Set();
function toggleGroup(el) { const k = el.dataset.k; listCollapsed.has(k) ? listCollapsed.delete(k) : listCollapsed.add(k); render(); }
function toggleAllGroups(btn, collapse) {
  const keys = [...document.querySelectorAll(`.team-head[data-s="${btn.dataset.s}"]`)].map(h => h.dataset.k);
  keys.forEach(k => collapse ? listCollapsed.add(k) : listCollapsed.delete(k));
  render();

function section(title, list, extra = '') {
  if (!list.length) return '';
  // Group heading that expands/collapses its games, like the Teams tab
  const keys = [];
  const head = (key, inner, games, body) => {
    const k = esc(`${title}|${key}`);
    keys.push(`${title}|${key}`);
    const open = !listCollapsed.has(`${title}|${key}`);
    return `<div class="team-head ${open ? '' : 'closed'}" data-s="${esc(title)}" data-k="${k}" onclick="toggleGroup(this)">
      <span class="caret">${open ? '▾' : '▸'}</span>${inner}<span class="n">${games.length} game${games.length === 1 ? '' : 's'}</span>${groupStats(games)}</div>${open ? body : ''}`;
  };
  const byDay = games => {
    let out = '', lastDay = '';
    for (const g of games) {
      const day = dayFmt.format(new Date(g.start));
      if (day !== lastDay) { out += `<div class="day">${esc(day)}</div>`; lastDay = day; }
      out += gameRow(g);
    }
    return out;
  };
  let groupsHtml = '';
  if (listGroup !== 'team') {
    // By date: one heading per day, styled like the By team headings
    const days = [];
    for (const g of list) {
      const day = dayFmt.format(new Date(g.start));
      if (days.at(-1)?.day !== day) days.push({ day, games: [] });
      days.at(-1).games.push(g);
    }
    groupsHtml = days.map(d => head(d.day, `<span class="age">${esc(d.day)}</span>`, d.games, d.games.map(gameRow).join(''))).join('');
  } else {
    // By team: youngest first up to adult, then by code and team name; games keep the section's date order
    groupsHtml = teamGroups(list).map(t => head([t.age, t.code, t.side].join(' '),
      `<span class="age">${esc(t.age)} ${esc(t.code || '')}</span>${t.side ? `<span class="side">${esc(t.side)}</span>` : ''}`, t.games, byDay(t.games))).join('');
  }
  const allOpen = keys.every(k => !listCollapsed.has(k));
  const toggleBtn = keys.length > 1
    ? `<button class="clear-btn group-toggle" data-s="${esc(title)}" onclick="toggleAllGroups(this, ${allOpen})">${allOpen ? 'Collapse all' : 'Expand all'}</button>` : '';
  return `<div class="section-title">${title}<span class="n">${list.length}</span>${toggleBtn}</div>${extra}${groupsHtml}`;
}

// Team groups (age + code + the chosen club's side), youngest first; games keep the order given
function teamGroups(list) {
  const club = currentClub();
  const groups = {};
  for (const g of list) {
    const side = !club ? '' : sameClub(homeClub(g), club) ? g.home : g.away;
    const k = [g.age, g.code, side].join('|');
    (groups[k] = groups[k] || { age: g.age, code: g.code, side, games: [] }).games.push(g);
  }
  return Object.values(groups)
    .sort((a, b) => ageRank(a.age) - ageRank(b.age) || a.age.localeCompare(b.age) || (a.code || '').localeCompare(b.code || '')
      || a.side.localeCompare(b.side, undefined, { numeric: true }));
}

// One-line record for a group heading (club chosen, scored results only)
function groupRecord(list) {
  const club = currentClub();
  if (!club) return null;
  const played = list.map(g => {
    const sc = parseScore(g.score);
    if (!sc || !/\d/.test(g.score) || new Date(g.start).getTime() > Date.now()) return null;
    const home = sameClub(homeClub(g), club);
    if (!home && !sameClub(awayClub(g), club)) return null;
    const f = home ? sc.ht : sc.at, a = home ? sc.at : sc.ht;
    return { home, f, a, r: f > a ? 'W' : f < a ? 'L' : 'D' };
  }).filter(Boolean);
  if (!played.length) return null;
  const rec = (label, xs) => {
    if (!xs.length) return null;
    const w = xs.filter(x => x.r === 'W').length, d = xs.filter(x => x.r === 'D').length, l = xs.length - w - d;
    return { label, pct: Math.round(w / xs.length * 100), wdl: `${w}-${d}-${l}`, w, d, l, n: xs.length };
  };
  const one = v => (Math.round(v * 10) / 10).toString();
  return {
    recs: [rec('Overall', played), rec('Home', played.filter(x => x.home)), rec('Away', played.filter(x => !x.home))].filter(Boolean),
    avgFor: one(played.reduce((t, x) => t + x.f, 0) / played.length),
    avgAgainst: one(played.reduce((t, x) => t + x.a, 0) / played.length),
  };
}
function groupStats(list) {
  const r = groupRecord(list);
  if (!r) return '';
  return `<div class="g-stats">${r.recs.map(x => `<span class="gs"><span class="gs-l">${x.label}</span><b class="${x.pct >= 50 ? 'good' : 'bad'}">${x.pct}%</b> ${x.wdl}</span>`).join('')}
    <span class="gs"><span class="gs-l">Avg points</span><b>${r.avgFor}</b> v ${r.avgAgainst}</span></div>`;
}
// Plain-text version for downloads
function groupStatsText(list) {
  const r = groupRecord(list);
  return r ? [...r.recs.map(x => `${x.label} ${x.pct}% ${x.wdl}`), `Avg points ${r.avgFor} v ${r.avgAgainst}`].join('   ·   ') : '';
}

// Youngest to oldest: U8…U18, Minor, then adult grades
function ageRank(age) {
  const m = age.match(/^U(\d+)/);
  if (m) return +m[1];
  const adult = ['Minor', 'Junior', 'Intermediate', 'Senior', 'Adult'].findIndex(w => age.startsWith(w));
  return adult < 0 ? 200 : 100 + adult;
}

function gameRow(g) {
  const club = currentClub();
  const sc = parseScore(g.score);
  const hWin = sc && sc.ht > sc.at, aWin = sc && sc.at > sc.ht;
  const mine = n => club && sameClub(n, club) ? 'mine' : '';
  const time = /Time TBC/.test(g.note || '') ? 'TBC' : timeFmt.format(new Date(g.start));
  const note = (g.note || '').replace(/^Time TBC( · )?/, '');
  return `
    <div class="game">
      <div class="g-time">${time}</div>
      <div class="g-comp" onclick="openStandings('${g.competitionId}')" title="Show league table">
        <span class="code"><b>${esc(g.age)}</b>${esc(g.code || '')}</span><span class="cname">${esc(shortComp(g))}</span>
      </div>
      <div class="g-match">
        <div class="g-team home ${mine(homeClub(g))} ${aWin ? 'lost' : ''}">${esc(g.home)}</div>
        <div class="g-mid">${sc
          ? `<span class="pill ${hWin ? 'win' : ''}">${esc(sc.home)}</span><span class="vs">v</span><span class="pill ${aWin ? 'win' : ''}">${esc(sc.away)}</span>`
          : '<span class="vs">v</span>'}</div>
        <div class="g-team ${mine(awayClub(g))} ${hWin ? 'lost' : ''}">${esc(g.away)}</div>
      </div>
      <div class="g-venue">${esc(g.venue || '')}${note ? `<span class="g-note">${esc(note)}</span>` : ''}</div>
    </div>`;
}

// ── Competition panel: table + every result and fixture, filterable by team ──
const compCache = {};   // compId -> {table, games}
let panel = null;       // {compId, title, tab, team}

async function openStandings(compId) {
  const g = games.find(x => x.competitionId === compId);
  panel = { compId, title: g ? g.competition : 'Competition', tab: 'table', team: '', venue: 'all' };
  document.querySelector('.overlay')?.remove();
  const div = document.createElement('div');
  div.className = 'overlay';
  div.onclick = e => { if (e.target === div) closePanel(); };
  div.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">${esc(panel.title)}</div><div class="panel-sub">Whole competition, all teams</div></div>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div class="panel-tools" id="panelTools"></div>
      <div class="panel-body" id="panelBody"><div class="empty-state"><div class="spinner"></div></div></div>
    </div>`;
  document.body.appendChild(div);
  try {
    if (!compCache[compId]) {
      const get = url => fetch(url).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
      const [table, list] = await Promise.all([
        get(`${EDGE}?comp=${compId}&type=table`),
        get(`${EDGE}?comp=${compId}&format=json&results=1&dv=${DATA_VERSION}`),
      ]);
      compCache[compId] = { table, games: list };
    }
  } catch (e) {
    if (panel?.compId === compId) document.getElementById('panelBody').innerHTML =
      `<div class="empty-state"><div class="empty-sub">Could not load this competition: ${esc(e.message)}</div></div>`;
    return;
  }
  // No league table (cups, blitzes): open on results instead
  if (panel?.compId === compId) {
    if (!compCache[compId].table.length) panel.tab = 'results';
    renderPanel();
  }
}
function closePanel() { panel = null; document.querySelector('.overlay')?.remove(); }
function panelTab(t) { panel.tab = t; renderPanel(); }
function panelVenue(v) { panel.venue = v; renderPanel(); }
function panelTeam(t) { panel.team = panel.team === t ? '' : t; panel.venue = 'all'; renderPanel(); }

function renderPanel() {
  if (!panel || !compCache[panel.compId]) return;
  const { table, games: list } = compCache[panel.compId];
  const team = panel.team;
  const club = currentClub().toLowerCase();
  const now = Date.now();
  const forTeam = list.filter(g => !team ||
    (panel.venue !== 'away' && g.home === team) || (panel.venue !== 'home' && g.away === team));
  const results = forTeam.filter(g => g.kind === 'result' || new Date(g.start).getTime() < now)
    .sort((a, b) => new Date(b.start) - new Date(a.start));
  const fixtures = forTeam.filter(g => !results.includes(g))
    .sort((a, b) => new Date(a.start) - new Date(b.start));

  const tabBtn = (t, label) => `<button class="${panel.tab === t ? 'on' : ''}" onclick="panelTab('${t}')">${label}</button>`;
  document.getElementById('panelTools').innerHTML = `
    <div class="seg">${table.length ? tabBtn('table', 'Table') : ''}${tabBtn('results', `Results ${results.length}`)}${tabBtn('fixtures', `Fixtures ${fixtures.length}`)}</div>
    <div class="team-row">
      <div class="chip ${team ? '' : 'on'}" onclick="panelTeam('')">All teams</div>
      ${team ? `<div class="chip on" onclick="panelTeam('')">${esc(team)} ✕</div>
        <div class="seg small">${['all', 'home', 'away'].map(v => `<button class="${panel.venue === v ? 'on' : ''}" onclick="panelVenue('${v}')">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>`
        : `<span>Tap a team to see only their games</span>`}
    </div>`;

  const body = document.getElementById('panelBody');
  if (panel.tab === 'table') {
    body.innerHTML = `
      <table>
        <thead><tr><th>#</th><th class="l">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead>
        <tbody>${table.map(r => `
          <tr class="${club && r.team.toLowerCase().includes(club) ? 'mine' : ''}">
            <td>${r.position}</td><td class="l">${esc(r.team)}</td><td>${r.played}</td><td>${r.won}</td>
            <td>${r.drawn}</td><td>${r.lost}</td><td class="pts">${r.points}</td>
          </tr>`).join('')}</tbody>
      </table>`;
    return;
  }
  const rows = panel.tab === 'results' ? results : fixtures;
  const stats = team && panel.tab === 'results'
    ? statsCards(results, g => g.home === team ? true : g.away === team ? false : null) : '';
  if (!rows.length) {
    body.innerHTML = `<div class="empty-state"><div class="empty-sub">No ${panel.tab}${team ? ` for ${esc(team)}` : ''} yet.</div></div>`;
    return;
  }
  const teamCell = (name, cls) =>
    `<div class="t ${cls} ${name === team ? 'sel' : ''}" data-team="${esc(name)}" onclick="panelTeam(this.dataset.team)">${esc(name)}</div>`;
  body.innerHTML = stats + rows.map(g => {
    const sc = parseScore(g.score);
    const hWin = sc && sc.ht > sc.at, aWin = sc && sc.at > sc.ht;
    return `
      <div class="pg">
        <div class="d">${shortFmt.format(new Date(g.start))}<br>${timeFmt.format(new Date(g.start))}</div>
        ${teamCell(g.home, 'h')}
        <div>${sc ? `<span class="pill ${hWin ? 'win' : ''}">${esc(sc.home)}</span> <span class="pill ${aWin ? 'win' : ''}">${esc(sc.away)}</span>` : '<span class="vs">v</span>'}</div>
        ${teamCell(g.away, '')}
      </div>`;
  }).join('');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// ── CSV export (what's on screen) ──────────────────────────────────────────
function exportCsv() {
  // Same games and order as the list on screen: Home/Away filter, then by date or by team
  const club = currentClub();
  const shown = renderFilters().filter(g => !club || venue === 'all' || (venue === 'home') === sameClub(homeClub(g), club))
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  const byTeam = listGroup === 'team';
  // Groups as on screen: one per team, or one per day
  const groups = byTeam
    ? teamGroups(shown).map(t => ({ title: [t.age, t.code, t.side].filter(Boolean).join(' '), games: t.games }))
    : shown.reduce((out, g) => {
        const day = dayFmt.format(new Date(g.start));
        if (out.at(-1)?.title !== day) out.push({ title: day, games: [] });
        out.at(-1).games.push(g);
        return out;
      }, []);
  const gameCells = (g, team) => {
    const sc = parseScore(g.score);
    const row = [shortFmt.format(new Date(g.start)), timeFmt.format(new Date(g.start)), g.code, g.age, g.competition,
      g.home, sc?.home || '', sc?.away || '', g.away, g.venue || '', g.note || ''];
    return byTeam ? [team, ...row] : row;
  };
  const headers = [...(byTeam ? ['Team'] : []), 'Date', 'Time', 'Code', 'Age', 'Competition', 'Home', 'Home Score', 'Away Score', 'Away', 'Venue', 'Note'];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  // A blank line and the group heading before each group, for easy reading
  const lines = [headers.map(cell).join(',')];
  groups.forEach(grp => {
    lines.push('', cell(`${grp.title} (${grp.games.length} game${grp.games.length === 1 ? '' : 's'})`));
    grp.games.forEach(g => lines.push(gameCells(g, grp.title).map(cell).join(',')));
  });
  const csv = lines.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${(club || 'all-clubs').replace(/[^a-z0-9]+/gi, '-')}-fixtures${byTeam ? '-by-team' : ''}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
