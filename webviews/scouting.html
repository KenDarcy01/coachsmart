<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#14181b"/>
  <style>html,body{background:#14181b !important;}</style>
  <title>Scouting report</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green: #87c232; --green-dim: rgba(135,194,50,.14);
      --dark: #14181b; --card: #1e222b; --card2: #262b35;
      --text: #f1f4f8; --muted: #a1a1a2; --red: #ef5350; --red-dim: rgba(239,83,80,.14);
      --amber: #f5a524; --border: rgba(255,255,255,.07); --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; -webkit-text-size-adjust: none; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); font-size: 16px; overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    textarea { font: inherit; color: inherit; }

    .top-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--dark); border-bottom: 1px solid var(--border); }
    .top-title { font-size: 18px; font-weight: 700; flex: 1; }
    .back-btn { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--green); }
    .back-btn svg { width: 30px; height: 30px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); color: var(--green); display: flex; align-items: center; justify-content: center; }
    .icon-btn svg { width: 20px; height: 20px; }

    .body { padding: 14px 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }

    .hero { display: flex; gap: 12px; align-items: center; margin: 2px 0 2px; }
    .badge { width: 56px; height: 56px; border-radius: 50%; background: var(--green-dim); border: 2px solid var(--green); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--green); flex: none; }
    .hero h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 34px; line-height: .95; letter-spacing: .5px; }
    .hero .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .next { background: var(--green-dim); color: var(--green); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }

    .card { background: var(--card); border-radius: var(--radius); padding: 14px; }
    .h { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .h em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--green); font-size: 12px; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); background: var(--card2); border-radius: 99px; padding: 3px 8px; }

    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .tile { background: var(--card2); border-radius: 12px; padding: 8px 4px; text-align: center; }
    .tile b { display: block; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 28px; line-height: 1; }
    .tile span { font-size: 11px; color: var(--muted); }
    .form { display: flex; gap: 6px; margin-top: 10px; align-items: center; font-size: 12px; color: var(--muted); }
    .r { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex: none; }
    .W { background: var(--green-dim); color: var(--green); } .L { background: var(--red-dim); color: var(--red); } .D { background: rgba(255,255,255,.08); color: var(--text); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .split div { background: var(--card2); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
    .split b { display: block; color: var(--text); font-size: 15px; }

    .ai { font-size: 15px; line-height: 1.5; padding-left: 18px; }
    .ai li { margin-bottom: 6px; }
    .ai-wait { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

    svg text { font-family: 'DM Sans', sans-serif; fill: var(--muted); font-size: 10px; }

    .row { display: grid; grid-template-columns: 48px 1fr auto 26px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .row:first-of-type { border-top: 0; }
    .row .d { color: var(--muted); font-size: 12px; }
    .row .o { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .o.us { color: var(--green); }
    .row .sc { font-weight: 600; white-space: nowrap; font-size: 13px; }
    .ha { font-size: 10px; color: var(--muted); font-weight: 700; margin-left: 4px; }

    .cmp { display: grid; grid-template-columns: 1fr 78px 78px; gap: 6px; font-size: 14px; padding: 7px 0; border-top: 1px solid var(--border); align-items: center; }
    .cmp.hd { border-top: 0; font-size: 11px; color: var(--muted); font-weight: 700; padding-top: 0; }
    .cmp.hd span { background: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmp span { text-align: center; border-radius: 8px; padding: 3px 0; font-weight: 600; font-size: 13px; }

    .quote { border-left: 3px solid var(--green); padding: 2px 0 2px 10px; font-size: 14px; line-height: 1.5; color: #d6dae0; white-space: pre-wrap; word-break: break-word; }
    .quote.clamp { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
    .by { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }
    .by button { color: var(--green); font-weight: 600; font-size: 12px; }
    .mr + .mr { margin-top: 14px; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl td, .tbl th { padding: 6px 3px; text-align: center; border-top: 1px solid var(--border); }
    .tbl th { font-size: 11px; color: var(--muted); border-top: 0; }
    .tbl td:nth-child(2), .tbl th:nth-child(2) { text-align: left; }
    .tbl tr.opp td { color: var(--amber); font-weight: 700; } .tbl tr.us td { color: var(--green); font-weight: 700; }

    .field { display: block; width: 100%; background: var(--card2); border: 1.5px solid transparent; border-radius: 12px; padding: 12px; font: inherit; color: var(--text); font-size: 16px; outline: none; margin-bottom: 10px; }
    .field:focus { border-color: rgba(135,194,50,.55); }
    .notes { width: 100%; min-height: 96px; background: var(--card2); border: 1.5px solid transparent; border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.5; outline: none; resize: none; }
    .notes:focus { border-color: rgba(135,194,50,.55); }
    .btns { display: flex; gap: 10px; margin-top: 10px; }
    .btn { flex: 1; min-height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px; background: var(--card2); }
    .btn.g { background: var(--green); color: #14181b; }
    .btn:disabled { opacity: .45; }
    .btn svg { width: 18px; height: 18px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    .link { color: var(--green); font-weight: 600; font-size: 14px; text-align: center; padding: 8px; }
    .empty { font-size: 14px; color: var(--muted); line-height: 1.5; }

    /* Link sheet */
    .pick-h { font-weight: 700; font-size: 17px; margin-bottom: 4px; }
    .pick-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
    .opt { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--card2); margin-bottom: 8px; font-size: 15px; border: 2px solid transparent; }
    .opt.on { border-color: var(--green); }
    .rad { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
    .opt.on .rad { border-color: var(--green); background: radial-gradient(var(--green) 45%, transparent 50%); }
    .opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .opt .tx { flex: 1; min-width: 0; }
    .tag { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-dim); padding: 2px 7px; border-radius: 99px; flex: none; }
    .section-label { font-size: 13px; color: var(--muted); margin: 14px 0 8px; }

    .state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 80px 24px; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.5; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
    .spinner.sm { width: 16px; height: 16px; border-width: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--card2); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 15px; font-weight: 500; opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; border: 1px solid var(--border); z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="top-title">Scouting report</div>
    <button class="icon-btn" id="shareTop" onclick="sharePdf('mobile')" aria-label="Share" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></svg>
    </button>
  </div>

  <div id="stateLoading" class="state"><div class="spinner"></div>Loading the opposition's season…</div>
  <div id="stateError" class="state" style="display:none"></div>
  <div id="main" class="body" style="display:none"></div>

  <div class="toast" id="toast"></div>

<script src="cs-mic.js"></script>
<script src="cs-voice-sheet.js"></script>
<script>
  // Opened from FlutterFlow's NativeWebView: scouting.html?token=<jwt>&eventId=<id>
  // In a browser with no token it signs in with the CoachSmart login and lists the coach's matches.
  const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';
  const FN_URL   = SUPABASE_URL + '/functions/v1/scouting';
  const params   = new URLSearchParams(window.location.search);
  const WV_TOKEN = params.get('token') || '';
  let EVENT_ID   = Number(params.get('eventId') || params.get('event_id') || 0);
  const STANDALONE = !WV_TOKEN && !window.FlutterBridge;
  let sb = null;          // supabase client, browser only
  let fromList = false;   // opened from the match list in the browser

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let D = null;           // last load
  let pick = null;        // link sheet choice { our: index, opp: index }
  let showAll = { our: false, opp: false };

  function goBack() {
    if (window.CSVoice && CSVoice.isOpen()) { CSVoice.close(); return; }
    if (STANDALONE) { if (EVENT_ID) showEvents(); return; }
    if (window.FlutterBridge) window.FlutterBridge.postMessage('close');
    else history.back();
  }

  async function token() {
    if (!STANDALONE) return WV_TOKEN || SUPABASE_ANON_KEY;
    const { data: { session } } = await sb.auth.getSession();
    return session ? session.access_token : SUPABASE_ANON_KEY;
  }

  async function callFn(payload) {
    const res = await fetch(FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + await token(), 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ event_id: EVENT_ID, ...payload }),
    });
    let json = {};
    try { json = await res.json(); } catch (_) {}
    if (res.status === 401 && STANDALONE) { showSignIn(); throw new Error('Please sign in'); }
    if (!res.ok || json.error) throw new Error(json.error || 'Something went wrong');
    return json.data ?? json;
  }

  let _toastTimer = null;
  function toast(msg, type = '', ms = 2800) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function showError(msg) {
    $('stateLoading').style.display = 'none';
    $('main').style.display = 'none';
    $('stateError').textContent = msg;
    $('stateError').style.display = '';
  }
  function showMain(html) {
    $('stateLoading').style.display = 'none';
    $('stateError').style.display = 'none';
    $('main').innerHTML = html;
    $('main').style.display = '';
    window.scrollTo(0, 0);
  }

  const fmtDay = d => new Date(d.length === 10 ? d + 'T12:00:00Z' : d).toLocaleDateString('en-IE', { day: 'numeric', month: 'short', timeZone: 'Europe/Dublin' });
  const fmtWhen = d => d ? new Date(d).toLocaleString('en-IE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Dublin' }) : '';
  const signed = m => m > 0 ? '+' + m : String(m);
  const initials = s => (String(s).replace(/\b(GAA|CLG|LGFA)\b/gi, '').match(/\b[A-Za-z]/g) || []).slice(0, 2).join('').toUpperCase();

  // ── Load ─────────────────────────────────────────────────────────────────
  async function load(action = 'load', extra = {}) {
    if (!EVENT_ID) { showError('No match was given.'); return; }
    try {
      D = await callFn({ action, ...extra });
      if (D.link_needed) renderLink(); else renderReport();
    } catch (e) { if (e.message !== 'Please sign in') showError(e.message); }
  }

  // ── Browser: sign in and pick a match ────────────────────────────────────
  function showSignIn(msg = '') {
    $('shareTop').style.display = 'none';
    showMain(`<div class="card"><div class="pick-h">Sign in</div>
      <div class="pick-sub">Use your CoachSmart login to see scouting reports for the teams you manage.</div>
      <input class="field" id="email" type="email" placeholder="Email" autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
      <div class="hint" id="signErr" style="color:var(--red)">${esc(msg)}</div>
      <div class="btns"><button class="btn g" id="signBtn" onclick="signIn()">Sign in</button></div></div>`);
  }
  async function signIn() {
    const b = $('signBtn');
    b.disabled = true; b.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) { b.disabled = false; b.textContent = 'Sign in'; $('signErr').textContent = 'That email and password didn\'t work.'; return; }
    EVENT_ID ? (showLoading(), load()) : showEvents();
  }
  async function signOut() { await sb.auth.signOut(); EVENT_ID = 0; history.replaceState(null, '', location.pathname); showSignIn(); }
  function showLoading() { $('main').style.display = 'none'; $('stateError').style.display = 'none'; $('stateLoading').style.display = ''; }

  async function showEvents() {
    EVENT_ID = 0; D = null; pick = null;
    history.replaceState(null, '', location.pathname);
    $('shareTop').style.display = 'none';
    showLoading();
    try {
      const { events } = await callFn({ action: 'events' });
      showMain(`<div class="card"><div class="pick-h">Your matches</div>
        <div class="pick-sub">Matches with an opposition on the teams you manage, from yesterday to six weeks ahead.</div>
        ${events.length ? events.map(e => `<button class="opt" onclick="openEvent(${Number(e.event_id)})"><span class="tx">v ${esc(e.opposition)}<small>${esc(fmtWhen(e.date))} · ${esc(e.team_name)}${e.squad_name ? ' ' + esc(e.squad_name) : ''}</small></span></button>`).join('')
          : '<div class="empty">No upcoming matches with an opposition on teams you manage, or scouting isn\'t switched on for them.</div>'}
        </div><button class="link" onclick="signOut()">Sign out</button>`);
    } catch (e) { if (e.message !== 'Please sign in') showError(e.message); }
  }
  function openEvent(id) {
    EVENT_ID = id; fromList = true;
    history.replaceState(null, '', location.pathname + '?eventId=' + id);
    showLoading(); load();
  }

  async function start() {
    if (!STANDALONE) { load(); return; }
    await new Promise((ok, bad) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js';
      sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc);
    }).catch(() => {});
    if (!window.supabase) { showError('Could not load the sign-in. Please refresh.'); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) showSignIn();
    else if (EVENT_ID) load();
    else showEvents();
  }

  // ── Link sheet: which sides to compare ───────────────────────────────────
  function renderLink() {
    $('shareTop').style.display = 'none';
    const opts = D.our_options || [];
    if (!opts.length) {
      showMain(`<div class="card"><div class="pick-h">No fixtures found</div><div class="pick-sub">We couldn't find any ${esc(D.code.toLowerCase())} fixtures for ${esc(D.club.name)} this season, so there's nothing to scout from yet.</div></div>`);
      return;
    }
    if (!pick) {
      const best = Math.max(0, opts.findIndex(o => o.best));
      pick = { our: best, opp: opts[best].opps.length && opts[best].opps[0].score > 0 ? 0 : -1 };
    }
    const our = opts[pick.our];
    const ourList = showAll.our ? opts : opts.slice(0, 5);
    const oppList = showAll.opp ? our.opps : our.opps.slice(0, 8);
    const ev = D.event;
    showMain(`
      <div class="card">
        <div class="pick-h">Which fixtures are this team's?</div>
        <div class="pick-sub">Pick once and we'll remember it for ${esc(D.team_name || 'this team')}${D.squad_name ? ' (' + esc(D.squad_name) + ')' : ''}.</div>
        ${ourList.map((o, i) => `
          <button class="opt ${i === pick.our ? 'on' : ''}" onclick="pickOur(${i})">
            <span class="rad"></span><span class="tx">${esc(o.team)}<small>${esc(o.age)} ${esc(D.code)}${o.grades ? ' · ' + esc(o.grades) : ''}</small></span>
            ${o.best ? '<span class="tag">Last used</span>' : ''}
          </button>`).join('')}
        ${opts.length > 5 && !showAll.our ? `<button class="link" onclick="showAll.our=true;renderLink()">Show all ${opts.length}</button>` : ''}
        <div class="section-label">Opposition${ev.date ? ' for ' + esc(fmtWhen(ev.date)) : ''}${ev.opposition ? ' · you entered "' + esc(ev.opposition) + '"' : ''}</div>
        ${our.opps.length ? oppList.map((o, i) => `
          <button class="opt ${i === pick.opp ? 'on' : ''}" onclick="pickOpp(${i})">
            <span class="rad"></span><span class="tx">${esc(o.team)}</span>
            ${o.score > 0 && i === 0 ? '<span class="tag">Best match</span>' : ''}
          </button>`).join('') : `<div class="empty">${esc(our.team)} hasn't played anyone yet this season.</div>`}
        ${our.opps.length > 8 && !showAll.opp ? `<button class="link" onclick="showAll.opp=true;renderLink()">Show all ${our.opps.length}</button>` : ''}
        <div class="btns"><button class="btn g" id="buildBtn" onclick="buildReport()" ${pick.opp < 0 ? 'disabled' : ''}>Build report</button></div>
      </div>`);
  }
  function pickOur(i) { pick = { our: i, opp: -1 }; showAll.opp = false; renderLink(); }
  function pickOpp(i) { pick.opp = i; renderLink(); }
  async function buildReport() {
    const our = D.our_options[pick.our], opp = our.opps[pick.opp];
    if (!opp) return;
    $('buildBtn').disabled = true;
    $('buildBtn').textContent = 'Building…';
    await load('link', { our_team: our.team, age: our.age, opp_team: opp.team, opp_club_id: opp.club_id });
  }
  async function relink() {
    pick = null; showAll = { our: false, opp: false };
    $('main').style.display = 'none'; $('stateLoading').style.display = '';
    await load('relink');
  }

  // ── Report ───────────────────────────────────────────────────────────────
  function renderReport() {
    const r = D.report, rec = r.record, ev = D.event;
    $('shareTop').style.display = '';
    const ha = String(ev.home_away || '').toLowerCase();
    const where = D.fixture ? (D.fixture.venue || (D.fixture.home ? 'Home' : 'Away')) : ha.startsWith('h') ? 'Home' : ha.startsWith('a') ? 'Away' : '';
    const grade = r.table ? r.table.comp : (r.games.length ? r.games[r.games.length - 1].comp : '');
    let h = `
      <div class="hero"><div class="badge">${esc(initials(r.opp.team))}</div>
        <div><h1>${esc(r.opp.team)}</h1><div class="sub">${esc(r.opp.age)} ${esc(r.opp.code)}${grade ? ' · ' + esc(grade) : ''}</div></div></div>
      <div class="next"><span>${ev.date ? 'v ' + esc(r.us.team) + ' · ' + esc(fmtWhen(ev.date)) : 'v ' + esc(r.us.team)}</span><span>${esc(where)}</span></div>`;

    if (!r.games.length) {
      h += `<div class="card"><div class="empty">${esc(r.opp.team)} have no results yet this season, so there's nothing to show.</div></div>`;
    } else {
      h += `
        <div class="card"><div class="h">Season so far</div>
          <div class="tiles">
            <div class="tile"><b>${rec.p}</b><span>Played</span></div>
            <div class="tile"><b>${rec.w}-${rec.d}-${rec.l}</b><span>W-D-L</span></div>
            <div class="tile"><b>${rec.avgFor.toFixed(1)}</b><span>Avg for</span></div>
            <div class="tile"><b>${rec.avgAgainst.toFixed(1)}</b><span>Avg against</span></div>
          </div>
          <div class="form">Last ${r.form.length} ${r.form.map((x, i) => `<span class="r ${x}" ${i === 0 ? 'style="margin-left:4px"' : ''}>${x}</span>`).join('')}<span style="margin-left:auto">newest left</span></div>
          <div class="split"><div>Home<b>${recLine(r.home)}</b></div><div>Away<b>${recLine(r.away)}</b></div></div>
          <div class="hint">Goals: ${rec.goalsFor} scored, ${rec.goalsAgainst} conceded (${(rec.goalsFor / rec.p).toFixed(1)} a game).</div>
        </div>`;
      if (D.ai_enabled) {
        h += `<div class="card"><div class="h">The short version <span class="chip">AI SUMMARY</span></div><div id="aiBox">${
          D.summary ? summaryHtml(D.summary) : '<div class="ai-wait"><div class="spinner sm"></div>Writing a summary…</div>'}</div></div>`;
      }
      h += `<div class="card"><div class="h">Margin game by game</div>${marginChart(r.games)}</div>`;
      h += `<div class="card"><div class="h">Every game <em>${r.games.length} result${r.games.length === 1 ? '' : 's'}</em></div>${
        r.games.map(g => `<div class="row"><span class="d">${esc(fmtDay(g.date))}</span><span class="o ${g.vsUs ? 'us' : ''}">${esc(g.opp)}<span class="ha">${g.home ? 'H' : 'A'}</span></span><span class="sc">${esc(g.us)} v ${esc(g.them)}</span><span class="r ${g.res}">${g.res}</span></div>`).join('')}</div>`;
      if (r.common.length) {
        const cell = xs => { const last = xs[xs.length - 1]; return `<span class="${last.res}">${xs.map(x => x.res + ' ' + (x.m ? signed(x.m) : '0')).join(', ')}</span>`; };
        h += `<div class="card"><div class="h">Same opponents <em>them v us</em></div>
          <div class="cmp hd"><div>Opponent</div><span>${esc(r.opp.team)}</span><span>${esc(r.us.team)}</span></div>
          ${r.common.map(c => `<div class="cmp"><div>${esc(c.opp)}</div>${cell(c.them)}${cell(c.us)}</div>`).join('')}</div>`;
      }
    }

    const mrs = D.match_reports || [];
    if (mrs.length) {
      h += `<div class="card"><div class="h">Our match reports v them <em>${mrs.length} report${mrs.length === 1 ? '' : 's'}</em></div>${
        mrs.map((m, i) => `<div class="mr"><div class="quote clamp" id="mr${i}">${esc(m.report)}</div>
          <div class="by"><span>${esc(fmtDay(m.date))}${m.author ? ' · ' + esc(m.author) : ''}</span>${m.report.length > 300 ? `<button onclick="this.remove();$('mr${i}').classList.remove('clamp')">Read all</button>` : ''}</div></div>`).join('')}</div>`;
    }

    if (r.table) {
      h += `<div class="card"><div class="h">${esc(r.table.comp || 'League table')}</div>
        <table class="tbl"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>+/-</th><th>Pts</th></tr>
        ${r.table.rows.map((t, i) => `<tr class="${t.opp ? 'opp' : t.us ? 'us' : ''}"><td>${i + 1}</td><td>${esc(t.team)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${signed(t.diff)}</td><td>${t.pts}</td></tr>`).join('')}
        </table></div>`;
    }

    h += `<div class="card"><div class="h">Coach notes <em>managers only</em></div>
        <textarea class="notes" id="notes" placeholder="Who to mark, kickouts, anything to tell the players…" oninput="notesDirty()">${esc(D.notes)}</textarea>
        <div class="hint" id="notesBy">${D.notes_by ? 'Last saved by ' + esc(D.notes_by) + (D.notes_at ? ', ' + esc(fmtWhen(D.notes_at)) : '') : 'Every manager on the team sees these notes.'}</div>
        <div class="btns">
          ${D.ai_enabled ? `<button class="btn" onclick="talkNotes()">${CSVoice.micSvg}Talk</button>` : ''}
          <button class="btn" id="saveNotesBtn" onclick="saveNotes()" disabled>Saved</button>
        </div></div>
      <div class="card"><div class="h">Share</div>
        <div class="btns" style="margin-top:0"><button class="btn g" id="pdfMobile" onclick="sharePdf('mobile')">PDF for phone</button><button class="btn" id="pdfA4" onclick="sharePdf('a4')">A4 to print</button></div>
        <div class="hint">The PDF includes the coach notes. ${r.last_result ? 'Results up to ' + esc(fmtDay(r.last_result)) + ', updated each night.' : 'Results update each night.'}</div></div>
      <button class="link" onclick="relink()">Wrong teams? Pick them again</button>`;

    showMain(h);
    if (D.ai_enabled && !D.summary && r.games.length) loadSummary();
  }

  const recLine = x => !x.p ? 'No games' : x.w === x.p ? `${x.w} from ${x.p} won` : !x.w ? `No win, ${x.d ? 'D' + x.d + ' ' : ''}L${x.l}` : `W${x.w} D${x.d} L${x.l}`;
  const summaryHtml = pts => `<ul class="ai">${pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;

  async function loadSummary() {
    try {
      const d = await callFn({ action: 'summary' });
      D.summary = d.summary;
      if ($('aiBox')) $('aiBox').innerHTML = summaryHtml(d.summary);
    } catch (e) {
      if ($('aiBox')) $('aiBox').innerHTML = `<div class="empty">The summary isn't available right now. <button class="link" style="padding:0" onclick="this.parentNode.innerHTML='<div class=&quot;ai-wait&quot;><div class=&quot;spinner sm&quot;></div>Writing a summary…</div>';loadSummary()">Try again</button></div>`;
    }
  }

  function marginChart(games) {
    const W = 330, H = 150, L = 28, T = 14, B = 22, n = games.length;
    const mx = Math.max(10, ...games.map(g => Math.abs(g.m)));
    const top = Math.ceil(mx / 10) * 10;
    const y = v => T + (top - v) / (2 * top) * (H - T - B);
    const bw = (W - L - 4) / n, w = Math.min(28, bw * .72);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Margin game by game">`;
    for (const v of [top, 0, -top]) {
      s += `<line x1="${L}" x2="${W - 2}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? '#2c313b' : '#4a505c'}" stroke-width="${v ? 1 : 1.5}"/>`;
      s += `<text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v ? signed(v) : 0}</text>`;
    }
    games.forEach((g, i) => {
      const x = L + 2 + i * bw + (bw - w) / 2, a = y(Math.max(g.m, 0)), b = y(Math.min(g.m, 0));
      const col = g.res === 'W' ? '#87c232' : g.res === 'L' ? '#ef5350' : '#a1a1a2';
      s += `<rect x="${x}" y="${Math.min(a, b) - (g.m ? 0 : 1.5)}" width="${w}" height="${Math.max(3, Math.abs(b - a))}" rx="${Math.min(4, w / 4)}" fill="${col}"><title>${esc(g.opp)} ${esc(g.us)} v ${esc(g.them)}</title></rect>`;
      if (n <= 14) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc((g.opp.match(/[A-Z0-9]/g) || []).join('').slice(0, 4))}</text>`;
    });
    return s + '</svg>';
  }

  // ── Notes ────────────────────────────────────────────────────────────────
  function notesDirty() { const b = $('saveNotesBtn'); b.disabled = false; b.textContent = 'Save notes'; b.classList.add('g'); }
  async function saveNotes() {
    const b = $('saveNotesBtn');
    b.disabled = true; b.textContent = 'Saving…';
    try {
      await callFn({ action: 'notes', notes: $('notes').value });
      D.notes = $('notes').value;
      b.textContent = 'Saved'; b.classList.remove('g');
      $('notesBy').textContent = 'Saved just now.';
    } catch (e) {
      b.disabled = false; b.textContent = 'Save notes';
      toast(e.message, 'error');
    }
  }
  function talkNotes() {
    CSVoice.open({
      fieldId: 'scouting_notes', title: 'Coach notes', subtitle: 'Say or type your notes. They are added to what is already there.',
      placeholder: 'Hold the mic and talk…', text: '', submitLabel: 'Add to notes', busyLabel: 'Saving…',
      onSubmit: async (text) => {
        if (!text || !text.trim()) return false;
        const ta = $('notes');
        ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + text.trim();
        notesDirty();
        await saveNotes();
        return true;
      },
    });
  }

  // ── PDF ──────────────────────────────────────────────────────────────────
  let _pdfBusy = false;
  async function sharePdf(format) {
    if (_pdfBusy) return;
    if ($('saveNotesBtn') && !$('saveNotesBtn').disabled) await saveNotes();
    _pdfBusy = true;
    const btn = $(format === 'mobile' ? 'pdfMobile' : 'pdfA4'), label = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Making PDF…'; }
    try {
      const { pdf, filename } = await callFn({ action: 'pdf', format });
      if (window.FlutterBridge) {
        window.FlutterBridge.postMessage('sharePdf:' + filename + ':' + pdf);
      } else {
        const bytes = Uint8Array.from(atob(pdf), c => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
    } catch (e) {
      toast('Could not make the PDF. Please try again.', 'error');
    } finally {
      _pdfBusy = false;
      if (btn) { btn.disabled = false; btn.textContent = label; }
    }
  }

  start();
</script>
</body>
</html>
