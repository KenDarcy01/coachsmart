<!DOCTYPE html>
<html lang="en" style="background:#111418">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Member Analytics</title>
<style>
/* ── Tokens — CoachSmart dark palette ───────────────────────────────────── */
:root {
  --accent:      #87C232;
  --accent-dim:  rgba(135,194,50,0.14);

  --yes:         #22C55E;
  --yes-dim:     rgba(34,197,94,0.14);
  --no:          #EF4444;
  --no-text:     #F87171;
  --no-dim:      rgba(239,68,68,0.14);
  --warn:        #F59E0B;
  --none:        #4B5563;
  --none-dim:    rgba(75,85,99,0.35);

  --bg:          #111418;
  --surface:     #1E222B;
  --surface-2:   #252A35;
  --border:      rgba(255,255,255,0.07);
  --text:        #F1F4F8;
  --text-2:      #B0B8C8;
  --muted:       #A1A1A2;
}

/* ── Reset + base ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  height: 100%;
  /* Prevent the html element growing beyond the webview container */
  overflow: hidden;
}

body {
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── Loading / Error screens ─────────────────────────────────────────────── */
#loadingScreen, #errorScreen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 50vh; padding: 40px 24px; text-align: center; gap: 12px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err-icon { font-size: 33px; }
.err-msg  { color: var(--muted); font-size: 15px; max-width: 260px; }

#mainScreen { display: none; padding: 12px 16px 32px; }

/* ── Top bar: period switch, filters, export ─────────────────────────────── */
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.seg {
  flex: 1; display: flex; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 3px;
}
.seg button {
  flex: 1; text-align: center; font-size: 13px; padding: 6px 0;
  border-radius: 8px; color: var(--text-2); white-space: nowrap;
}
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.icon-btn {
  width: 40px; height: 38px; flex: none; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border);
  display: grid; place-items: center; position: relative;
}
.icon-btn:disabled { opacity: 0.5; }
.icon-btn .dot {
  position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent); display: none;
}
.icon-btn.has-filters .dot { display: block; }

.chips { display: flex; gap: 6px; margin: -2px 0 12px; flex-wrap: wrap; }
.chips:empty { display: none; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 99px;
  border: 1px solid var(--accent); color: var(--accent);
}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.h {
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 18px 2px 8px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.h button { color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; }

.hero { display: flex; gap: 16px; align-items: center; }
.ring { width: 96px; height: 96px; flex: none; }
.big  { font-size: 16px; font-weight: 600; }
.sub  { font-size: 13px; color: var(--text-2); }
.trend { font-size: 13px; font-weight: 600; margin-top: 2px; }
.trend.up   { color: var(--yes); }
.trend.down { color: var(--no-text); }
.trend.flat { color: var(--muted); }
.dots-label { font-size: 12px; color: var(--text-2); margin-top: 12px; }
.dots { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
.dots b { width: 16px; height: 16px; border-radius: 50%; }
.d-yes { background: var(--yes); } .d-no { background: var(--no); } .d-none { background: var(--none); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.two .card { margin: 0; }
.two.single { grid-template-columns: 1fr; }
.codes:empty { display: none; }
.code-card { text-align: left; width: 100%; }
.code-name { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.code-card .k { margin-top: 6px; }
.code-sub { font-size: 12px; color: var(--text-2); margin-top: 8px; }
.code-sub + .code-sub { margin-top: 2px; }
.code-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 1px;
  color: var(--accent); background: var(--accent-dim);
}
.k { font-size: 26px; font-weight: 700; line-height: 1.1; }
.k small { font-size: 15px; color: var(--muted); font-weight: 500; }
.lbl { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.mini { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 10px; overflow: hidden; display: flex; }
.mini i { display: block; height: 100%; }

/* ── Rows ────────────────────────────────────────────────────────────────── */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child  { padding-bottom: 0; }
.date { width: 40px; text-align: center; flex: none; }
.date b { display: block; font-size: 17px; line-height: 1.1; }
.date span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.grow { flex: 1; min-width: 0; }
.t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; flex: none; }
.p-yes  { background: var(--yes-dim);  color: var(--yes); }
.p-no   { background: var(--no-dim);   color: var(--no-text); }
.p-none { background: var(--none-dim); color: var(--text-2); }
.p-acc  { background: var(--accent-dim); color: var(--accent); }
.needs { border-color: rgba(245,158,11,0.5); }
.empty { font-size: 13px; color: var(--muted); text-align: center; padding: 6px 0; }

.months { display: flex; align-items: flex-end; gap: 6px; height: 112px; }
.months div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.months em { font-style: normal; font-size: 11px; color: var(--text-2); }
.months i { display: block; width: 100%; border-radius: 5px 5px 2px 2px; background: var(--accent); min-height: 2px; }
.months i.low { opacity: 0.55; }
.months i.nil { background: var(--surface-2); }
.months span { font-size: 11px; color: var(--muted); }

.squads { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.hist-seg { margin-bottom: 10px; }

/* ── Filter sheet ────────────────────────────────────────────────────────── */
.sheet-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; align-items: flex-end; z-index: 10;
}
.sheet-bg.open { display: flex; }
.sheet {
  width: 100%; max-height: 80vh; overflow-y: auto;
  background: var(--surface); border-radius: 18px 18px 0 0;
  border-top: 1px solid var(--border); padding: 8px 16px 24px;
}
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--surface-2); margin: 0 auto 12px; }
.sheet-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.sheet-title b { font-size: 16px; }
.sheet-title button { color: var(--accent); font-size: 14px; }
.f-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
.f-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.f-pill {
  font-size: 13px; padding: 7px 12px; border-radius: 99px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid transparent;
}
.f-pill.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.done-btn {
  width: 100%; margin-top: 20px; padding: 12px; border-radius: 12px;
  background: var(--accent); color: #111418; font-weight: 700;
}

/* ── PDF header (only shown in the exported copy) ───────────────────────── */
.pdf-head { display: none; margin-bottom: 14px; padding-top: 8px; }
.pdf-head b { display: block; font-size: 20px; }
.pdf-head span { font-size: 13px; color: var(--text-2); }
.exporting .pdf-head { display: block; }
.exporting .no-pdf { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--surface-2); color: var(--text); font-size: 13px;
  padding: 10px 14px; border-radius: 10px; display: none; z-index: 20;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
</div>

<div id="errorScreen" style="display:none">
  <div class="err-icon">⚠️</div>
  <div id="errMsg" class="err-msg">Unable to load data</div>
</div>

<div id="mainScreen">

  <div class="bar no-pdf">
    <div class="seg" id="periodSeg">
      <button data-period="month">Month</button>
      <button data-period="3months">3 months</button>
      <button data-period="season" class="on">Season</button>
      <button data-period="all">All</button>
    </div>
    <button class="icon-btn" id="filterBtn" aria-label="Filters">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F4F8" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span class="dot"></span>
    </button>
    <button class="icon-btn" id="pdfBtn" aria-label="Export PDF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F4F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
  </div>
  <div class="chips no-pdf" id="activeChips"></div>

  <div id="report">
    <div class="pdf-head" id="pdfHead"></div>

    <div class="card" id="heroCard"></div>

    <div class="two">
      <div class="card" id="trainCard"></div>
      <div class="card" id="matchCard"></div>
    </div>

    <div class="two codes" id="codeCards"></div>

    <div id="upcomingSection">
      <div class="h">Coming up</div>
      <div class="card" id="upcomingList"></div>
    </div>

    <div id="monthSection">
      <div class="h">Attendance by month</div>
      <div class="card"><div class="months" id="monthChart"></div></div>
    </div>

    <div id="matchSection">
      <div class="h">Matches <button class="no-pdf" id="matchMore"></button></div>
      <div class="card">
        <div class="squads" id="squadCounts"></div>
        <div id="matchList"></div>
      </div>
    </div>

    <div id="historySection">
      <div class="h">History <button class="no-pdf" id="histMore"></button></div>
      <div class="seg hist-seg no-pdf" id="histSeg">
        <button data-hist="all" class="on">All</button>
        <button data-hist="yes">Went</button>
        <button data-hist="no">Missed</button>
        <button data-hist="none">No reply</button>
      </div>
      <div class="card" id="historyList"></div>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-title"><b>Filters</b><button id="clearFilters">Clear</button></div>
    <div id="codeGroup"><div class="f-label">Code</div><div class="f-pills" id="codePills"></div></div>
    <div id="typeGroup"><div class="f-label">Event type</div><div class="f-pills" id="typePills"></div></div>
    <div id="teamGroup"><div class="f-label">Team</div><div class="f-pills" id="teamPills"></div></div>
    <button class="done-btn" id="doneBtn">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script>
'use strict';

/* ── Config ──────────────────────────────────────────────────────────────── */
const SUPABASE_URL      = 'https://gyfporsbdftvtakdvukt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5ZnBvcnNiZGZ0dnRha2R2dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMzMjkxMjAsImV4cCI6MjA0ODkwNTEyMH0.tuWJT4RCp3b7JHi6cdDogqgInetBHdTjSxhJQMBy5n4';

const _p        = new URLSearchParams(window.location.search);
const WV_MEMBER = _p.get('member_id');
const WV_TOKEN  = _p.get('token') || _p.get('currentAuthToken') || _p.get('access_token');

const sb = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_ANON_KEY,
  WV_TOKEN
    ? { global: { headers: { Authorization: `Bearer ${WV_TOKEN}` } }, auth: { persistSession: false } }
    : {}
);

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const LIST_LIMIT = { matches: 3, history: 5 };

/* ── State ───────────────────────────────────────────────────────────────── */
let rawData  = null;
let isFemale = false;
let multiCode = false;   // player has events in more than one code: tag each row with its code
let fState   = { period: 'season', code: 'all', type: 'all', team: 'all' };
let histCat  = 'all';
let expanded = { matches: false, history: false };

/* ── Classifiers ─────────────────────────────────────────────────────────── */
// response_id 3 = attending, 4 = declined, anything else = pre-created "no response" placeholder
function catResponse(e) {
  if (e.response_id === 3) return 'yes';
  if (e.response_id === 4) return 'no';
  return 'none';
}
const isMatch    = e => /match|game|fixture|league|cup|championship|challenge/i.test(e.event_type || '');
const isTraining = e => /train|session|practi/i.test(e.event_type || '');

function codeLabel(code) {
  if (!code) return code;
  return (isFemale && code === 'Hurling') ? 'Camogie' : code;
}

/* ── Load ────────────────────────────────────────────────────────────────── */
async function init() {
  if (!WV_MEMBER) return showError('No member ID provided.');

  const { data, error } = await sb.rpc('get_member_analytics', { p_member_id: parseInt(WV_MEMBER) });
  if (error) return showError(`Failed to load data: ${error.message}`);
  if (!data)  return showError('No data returned.');

  rawData = data;

  // Deduplicate by event_id — defensive against any DB-level fan-out
  const dedupeByEventId = arr => {
    const seen = new Set();
    return (arr || []).filter(item => {
      if (!item.event_date_time || seen.has(item.event_id)) return false;
      seen.add(item.event_id);
      return true;
    });
  };
  rawData.events          = dedupeByEventId(rawData.events);
  rawData.matchSelections = dedupeByEventId(rawData.matchSelections);
  isFemale = (rawData.teams || []).some(t => t.team_female === true);
  multiCode = new Set(rawData.events.map(e => codeLabel(e.event_code)).filter(Boolean)).size > 1;

  buildFilters();
  wireControls();
  render();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display    = 'block';
}

/* ── Period ──────────────────────────────────────────────────────────────── */
// Returns { from, prevFrom, prevTo, prevLabel } for the selected period
function periodRange(period) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  if (period === 'month') {
    return { from: new Date(y, m, 1), prevFrom: new Date(y, m - 1, 1), prevTo: new Date(y, m, 1), prevLabel: 'last month', label: `${MON[m]} ${y}` };
  }
  if (period === '3months') {
    const from = new Date(y, m - 2, 1);
    return { from, prevFrom: new Date(y, m - 5, 1), prevTo: from, prevLabel: 'previous 3 months', label: `${MON[from.getMonth()]} – ${MON[m]} ${y}` };
  }
  if (period === 'season') {
    return { from: new Date(y, 0, 1), prevFrom: new Date(y - 1, 0, 1), prevTo: new Date(y - 1, m, now.getDate(), 23, 59), prevLabel: 'this time last year', label: `${y} season` };
  }
  return { from: null, prevFrom: null, prevTo: null, prevLabel: null, label: 'All time' };
}

function passesFilters(e) {
  if (fState.code !== 'all' && codeLabel(e.event_code) !== fState.code) return false;
  if (fState.type !== 'all' && e.event_type !== fState.type)            return false;
  if (fState.team !== 'all' && String(e.team_id) !== fState.team)       return false;
  return true;
}

function inRange(e, from, to) {
  const d = new Date(e.event_date_time);
  return (!from || d >= from) && (!to || d <= to);
}

/* ── Filters sheet ───────────────────────────────────────────────────────── */
function buildPills(containerId, groupId, key, options) {
  const group = document.getElementById(groupId);
  if (options.length < 2) { group.style.display = 'none'; return; }
  const el = document.getElementById(containerId);
  el.innerHTML = [['all', 'All'], ...options].map(([v, label]) =>
    `<button class="f-pill${fState[key] === v ? ' on' : ''}" data-v="${esc(v)}">${esc(label)}</button>`
  ).join('');
  el.querySelectorAll('.f-pill').forEach(btn => btn.addEventListener('click', () => {
    fState[key] = btn.dataset.v;
    el.querySelectorAll('.f-pill').forEach(b => b.classList.toggle('on', b === btn));
    render();
  }));
}

function buildFilters() {
  const evs   = rawData.events;
  const codes = [...new Set(evs.map(e => codeLabel(e.event_code)).filter(Boolean))].sort();
  const types = [...new Set(evs.map(e => e.event_type).filter(Boolean))].sort();
  // Teams from current links plus any team that appears in the player's history
  const teams = new Map();
  (rawData.teams || []).forEach(t => teams.set(String(t.team_id), t.team_name));
  evs.forEach(e => { if (e.team_id && !teams.has(String(e.team_id))) teams.set(String(e.team_id), e.team_name); });

  buildPills('codePills', 'codeGroup', 'code', codes.map(c => [c, c]));
  buildPills('typePills', 'typeGroup', 'type', types.map(t => [t, t]));
  buildPills('teamPills', 'teamGroup', 'team', [...teams.entries()].map(([id, n]) => [id, n || 'Team']));
  rawData._teamNames = teams;

  if (codes.length < 2 && types.length < 2 && teams.size < 2) {
    document.getElementById('filterBtn').style.display = 'none';
  }
}

function renderChips() {
  const chips = [];
  if (fState.code !== 'all') chips.push(['code', fState.code]);
  if (fState.type !== 'all') chips.push(['type', fState.type]);
  if (fState.team !== 'all') chips.push(['team', rawData._teamNames.get(fState.team) || 'Team']);
  const el = document.getElementById('activeChips');
  el.innerHTML = chips.map(([k, label]) => `<button class="chip" data-k="${k}">${esc(label)} ✕</button>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    fState[c.dataset.k] = 'all';
    resetPills(c.dataset.k);
    render();
  }));
  document.getElementById('filterBtn').classList.toggle('has-filters', chips.length > 0);
}

function resetPills(key) {
  const id = { code: 'codePills', type: 'typePills', team: 'teamPills' }[key];
  document.querySelectorAll(`#${id} .f-pill`).forEach(b => b.classList.toggle('on', b.dataset.v === 'all'));
}

function wireControls() {
  document.querySelectorAll('#periodSeg button').forEach(btn => btn.addEventListener('click', () => {
    fState.period = btn.dataset.period;
    document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('on', b === btn));
    render();
  }));
  document.querySelectorAll('#histSeg button').forEach(btn => btn.addEventListener('click', () => {
    histCat = btn.dataset.hist;
    document.querySelectorAll('#histSeg button').forEach(b => b.classList.toggle('on', b === btn));
    renderHistory();
  }));

  const sheet = document.getElementById('sheetBg');
  document.getElementById('filterBtn').addEventListener('click', () => sheet.classList.add('open'));
  document.getElementById('doneBtn').addEventListener('click', () => sheet.classList.remove('open'));
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.classList.remove('open'); });
  document.getElementById('clearFilters').addEventListener('click', () => {
    ['code', 'type', 'team'].forEach(k => { fState[k] = 'all'; resetPills(k); });
    render();
  });

  document.getElementById('matchMore').addEventListener('click', () => { expanded.matches = !expanded.matches; renderMatches(); });
  document.getElementById('histMore').addEventListener('click',  () => { expanded.history = !expanded.history; renderHistory(); });
  document.getElementById('pdfBtn').addEventListener('click', exportPdf);
}

/* ── Derived data ────────────────────────────────────────────────────────── */
let view = null;

function computeView() {
  const now = new Date();
  const r   = periodRange(fState.period);
  const evs = rawData.events.filter(passesFilters);
  const sel = rawData.matchSelections.filter(passesFilters);

  const past     = evs.filter(e => inRange(e, r.from, now)).sort(byDateDesc);
  const prevPast = r.prevFrom ? evs.filter(e => inRange(e, r.prevFrom, r.prevTo)) : [];
  const upcoming = evs.filter(e => new Date(e.event_date_time) > now).sort(byDateAsc).slice(0, 3);

  // Matches: every past match event in range, joined with the player's selection
  const selById = new Map(sel.filter(s => inRange(s, r.from, now)).map(s => [s.event_id, s]));
  const matchById = new Map();
  past.filter(isMatch).forEach(e => matchById.set(e.event_id, { ...e, selection: selById.get(e.event_id) || null }));
  selById.forEach((s, id) => { if (!matchById.has(id)) matchById.set(id, { ...s, selection: s }); });
  const matches = [...matchById.values()].sort(byDateDesc);

  return { r, past, prevPast, upcoming, matches, trainings: past.filter(isTraining) };
}

const byDateDesc = (a, b) => new Date(b.event_date_time) - new Date(a.event_date_time);
const byDateAsc  = (a, b) => new Date(a.event_date_time) - new Date(b.event_date_time);
const count = (arr, cat) => arr.filter(e => catResponse(e) === cat).length;
const pct   = (n, d) => d ? Math.round((n / d) * 100) : 0;

/* ── Render ──────────────────────────────────────────────────────────────── */
function render() {
  view = computeView();
  renderChips();
  renderHero();
  renderSplitCards();
  renderCodeCards();
  renderUpcoming();
  renderMonths();
  renderMatches();
  renderHistory();
}

function renderHero() {
  const { past, prevPast, r } = view;
  const el = document.getElementById('heroCard');
  if (!past.length) {
    el.innerHTML = `<div class="empty">No events in this period yet</div>`;
    return;
  }
  const went    = count(past, 'yes');
  const replied = past.length - count(past, 'none');
  const rate    = pct(went, past.length);

  let trend = '';
  if (prevPast.length >= 3) {
    const diff = rate - pct(count(prevPast, 'yes'), prevPast.length);
    const cls  = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '';
    trend = diff === 0
      ? `<div class="trend flat">Same as ${r.prevLabel}</div>`
      : `<div class="trend ${cls}">${arrow} ${Math.abs(diff)}% on ${r.prevLabel}</div>`;
  }

  const last10 = past.slice(0, 10).reverse();
  const dashes = rate === 0 ? '0 100' : `${rate} 100`;
  el.innerHTML = `
    <div class="hero">
      <svg class="ring" viewBox="0 0 36 36" role="img" aria-label="${rate}% attended">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#252A35" stroke-width="4"/>
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#87C232" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="${dashes}" pathLength="100" transform="rotate(-90 18 18)"/>
        <text x="18" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#F1F4F8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">${rate}%</text>
      </svg>
      <div>
        <div class="big">Attended ${went} of ${past.length}</div>
        <div class="sub">Replied to ${replied} of ${past.length}</div>
        ${trend}
      </div>
    </div>
    <div class="dots-label">Last ${last10.length} event${last10.length !== 1 ? 's' : ''}</div>
    <div class="dots">${last10.map(e => `<b class="d-${catResponse(e)}"></b>`).join('')}</div>`;
}

function renderSplitCards() {
  const { trainings, matches } = view;
  const tWent = count(trainings, 'yes'), tNo = count(trainings, 'no');
  document.getElementById('trainCard').innerHTML = trainings.length
    ? `<div class="k">${tWent}<small>/${trainings.length}</small></div>
       <div class="lbl">Trainings attended</div>
       <div class="mini"><i style="width:${pct(tWent, trainings.length)}%;background:var(--yes)"></i><i style="width:${pct(tNo, trainings.length)}%;background:var(--no)"></i></div>`
    : `<div class="k">–</div><div class="lbl">Trainings attended</div><div class="mini"></div>`;

  // Only one of the two has data (e.g. filtered to matches): let it fill the row
  document.getElementById('trainCard').style.display = trainings.length || !matches.length ? '' : 'none';
  document.getElementById('matchCard').style.display = matches.length || !trainings.length ? '' : 'none';
  document.querySelector('.two').classList.toggle('single', !trainings.length !== !matches.length);

  const picked = matches.filter(m => m.selection).length;
  document.getElementById('matchCard').innerHTML = matches.length
    ? `<div class="k">${picked}<small>/${matches.length}</small></div>
       <div class="lbl">Matches selected</div>
       <div class="mini"><i style="width:${pct(picked, matches.length)}%;background:var(--accent)"></i></div>`
    : `<div class="k">–</div><div class="lbl">Matches selected</div><div class="mini"></div>`;
}

// One card per code when the player's events span more than one code and no
// single code is picked. Tapping a card filters the page to that code.
function renderCodeCards() {
  const el = document.getElementById('codeCards');
  const { past, matches } = view;
  const codes = fState.code === 'all'
    ? [...new Set(past.concat(matches).map(e => codeLabel(e.event_code)).filter(Boolean))].sort()
    : [];
  if (codes.length < 2) { el.innerHTML = ''; return; }

  el.innerHTML = codes.map(code => {
    const evs  = past.filter(e => codeLabel(e.event_code) === code);
    const ms   = matches.filter(m => codeLabel(m.event_code) === code);
    const went = count(evs, 'yes'), no = count(evs, 'no');
    const picked = ms.filter(m => m.selection).length;
    return `
      <button class="card code-card" data-code="${esc(code)}">
        <div class="code-name">${esc(code)}</div>
        <div class="k">${evs.length ? pct(went, evs.length) + '%' : '–'}</div>
        <div class="lbl">Attended ${went} of ${evs.length}</div>
        <div class="mini"><i style="width:${pct(went, evs.length)}%;background:var(--yes)"></i><i style="width:${pct(no, evs.length)}%;background:var(--no)"></i></div>
        ${ms.length ? `<div class="code-sub">Selected ${picked}/${ms.length} match${ms.length !== 1 ? 'es' : ''}</div>` : ''}
      </button>`;
  }).join('');

  el.querySelectorAll('.code-card').forEach(card => card.addEventListener('click', () => {
    fState.code = card.dataset.code;
    document.querySelectorAll('#codePills .f-pill').forEach(b => b.classList.toggle('on', b.dataset.v === fState.code));
    render();
  }));
}

function renderUpcoming() {
  const { upcoming } = view;
  const sec = document.getElementById('upcomingSection');
  if (!upcoming.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  const list = document.getElementById('upcomingList');
  list.classList.toggle('needs', upcoming.some(e => catResponse(e) === 'none'));
  list.innerHTML = upcoming.map(e => {
    const cat  = catResponse(e);
    const pill = cat === 'yes' ? `<span class="pill p-yes">Going</span>`
               : cat === 'no'  ? `<span class="pill p-no">Can't go</span>`
               :                 `<span class="pill p-none">Reply needed</span>`;
    return eventRow(e, eventTitle(e), [typeLabel(e), dayTime(e.event_date_time), e.home_away], pill);
  }).join('');
}

function renderMonths() {
  const { past, r } = view;
  const sec = document.getElementById('monthSection');
  const now = new Date();
  // Months from the start of the period (or the first event) up to now, latest 12
  const first = r.from || (past.length ? new Date(past[past.length - 1].event_date_time) : now);
  const months = [];
  for (let d = new Date(first.getFullYear(), first.getMonth(), 1); d <= now; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    months.push(d);
  }
  const shown = months.slice(-12);
  if (shown.length < 2 || !past.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';

  const avg = pct(count(past, 'yes'), past.length);
  document.getElementById('monthChart').innerHTML = shown.map(m => {
    const inMonth = past.filter(e => {
      const d = new Date(e.event_date_time);
      return d.getFullYear() === m.getFullYear() && d.getMonth() === m.getMonth();
    });
    const label = shown.length > 6 ? MON[m.getMonth()].charAt(0) : MON[m.getMonth()];
    if (!inMonth.length) return `<div><em>–</em><i class="nil"></i><span>${label}</span></div>`;
    const p = pct(count(inMonth, 'yes'), inMonth.length);
    return `<div><em>${p}%</em><i class="${p < avg - 15 ? 'low' : ''}" style="height:${Math.max(p, 2) * 0.7}%"></i><span>${label}</span></div>`;
  }).join('');
}

function renderMatches() {
  const { matches } = view;
  const sec = document.getElementById('matchSection');
  if (!matches.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';

  // Squad counts, most frequent first
  const counts = {};
  matches.forEach(m => { if (m.selection) { const n = m.selection.squad_name || 'Selected'; counts[n] = (counts[n] || 0) + 1; } });
  const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const topSquad = ranked[0]?.[0];
  document.getElementById('squadCounts').innerHTML = ranked
    .map(([n, c], i) => `<span class="pill ${i === 0 ? 'p-acc' : 'p-none'}">${esc(n)} × ${c}</span>`).join('');
  document.getElementById('squadCounts').style.display = ranked.length ? '' : 'none';

  const all  = isExporting || expanded.matches;
  const list = all ? matches : matches.slice(0, LIST_LIMIT.matches);
  document.getElementById('matchList').innerHTML = list.map(m => {
    const s = m.selection;
    const squad = s ? (s.squad_name || 'Selected') : null;
    const pill = s ? `<span class="pill ${squad === topSquad ? 'p-acc' : 'p-none'}">${esc(squad)}</span>`
                   : `<span class="pill p-none">Not selected</span>`;
    const role = s && s.role_name && !/^player$/i.test(s.role_name) ? s.role_name : null;
    const sub  = m.opposition && m.event_title && m.event_title !== m.opposition ? m.event_title : m.event_type;
    return eventRow(m, m.opposition ? `vs ${m.opposition}` : (m.event_title || 'Match'), [sub, m.home_away, role], pill);
  }).join('');

  const more = document.getElementById('matchMore');
  more.style.display = matches.length > LIST_LIMIT.matches ? '' : 'none';
  more.textContent = expanded.matches ? 'Show less' : `See all ${matches.length}`;
}

function renderHistory() {
  const { past } = view;
  const sec = document.getElementById('historySection');
  if (!past.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';

  const rows = histCat === 'all' ? past : past.filter(e => catResponse(e) === histCat);
  const all  = isExporting || expanded.history;
  const list = all ? rows : rows.slice(0, LIST_LIMIT.history);
  const PILL = { yes: '<span class="pill p-yes">Went</span>', no: '<span class="pill p-no">Declined</span>', none: '<span class="pill p-none">No reply</span>' };
  document.getElementById('historyList').innerHTML = list.length
    ? list.map(e => eventRow(e, eventTitle(e), [typeLabel(e), dayTime(e.event_date_time), e.home_away], PILL[catResponse(e)])).join('')
    : `<div class="empty">Nothing here for this period</div>`;

  const more = document.getElementById('histMore');
  more.style.display = rows.length > LIST_LIMIT.history ? '' : 'none';
  more.textContent = expanded.history ? 'Show less' : `See all ${rows.length}`;
}

/* ── Row helpers ─────────────────────────────────────────────────────────── */
function eventTitle(e) {
  if (isMatch(e) && e.opposition) return `vs ${e.opposition}`;
  return e.event_title || e.event_type || 'Event';
}

// "vs Raheny" already says it's a match, so leave the type out to save room for the code tag
function typeLabel(e) {
  return isMatch(e) && e.opposition ? null : e.event_type;
}

function dayTime(iso) {
  const d = new Date(iso);
  return `${DOW[d.getDay()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function eventRow(e, title, metaParts, pill) {
  const d  = new Date(e.event_date_time);
  const yr = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : '';
  const meta = metaParts.filter(v => v && v !== title).map(esc).join(' · ');
  const code = multiCode && e.event_code ? `<span class="code-tag">${esc(codeLabel(e.event_code))}</span>` : '';
  return `
    <div class="row">
      <div class="date"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}${yr}</span></div>
      <div class="grow"><div class="t">${esc(title)}</div>${meta || code ? `<div class="m">${code}${meta}</div>` : ''}</div>
      ${pill}
    </div>`;
}

/* ── PDF export ──────────────────────────────────────────────────────────── */
let isExporting = false;

function playerName() {
  const m = rawData.member;
  return m ? [m.first_name, m.last_name].filter(Boolean).join(' ') : '';
}

async function exportPdf() {
  const btn = document.getElementById('pdfBtn');
  if (btn.disabled) return;
  if (!window.html2canvas || !window.jspdf) return toast('Still loading, try again in a moment');
  btn.disabled = true;
  toast('Preparing PDF…', 0);

  const main = document.getElementById('mainScreen');
  const name = playerName();
  const filters = [fState.code, fState.type, fState.team !== 'all' ? rawData._teamNames.get(fState.team) : 'all']
    .filter(v => v && v !== 'all');
  const teamLine = fState.team === 'all'
    ? [...new Set((rawData.teams || []).map(t => t.team_name))].join(', ')
    : '';
  document.getElementById('pdfHead').innerHTML = `
    <b>${esc(name || 'Player report')}</b>
    <span>${esc([view.r.label, ...filters, teamLine].filter(Boolean).join(' · '))}</span>`;

  const scroller = document.body, prevScroll = scroller.scrollTop;
  scroller.scrollTop = 0;
  isExporting = true;
  main.classList.add('exporting');
  renderMatches();
  renderHistory();

  try {
    const pdf  = await buildPdf(document.getElementById('report'));
    const file = `${(name || 'player').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '-')}-stats.pdf`;
    await sharePdf(pdf, file, name ? `${name} – stats` : 'Player stats');
    hideToast();
  } catch (e) {
    toast('Could not create the PDF');
  } finally {
    isExporting = false;
    main.classList.remove('exporting');
    renderMatches();
    renderHistory();
    scroller.scrollTop = prevScroll;
    btn.disabled = false;
  }
}

// Renders the report in page-height slices so long histories don't blow the canvas limit
async function buildPdf(el) {
  const { jsPDF } = window.jspdf;
  const pad = 16, pageH = 1100;
  const w = el.offsetWidth, h = el.scrollHeight;
  const top = el.getBoundingClientRect().top;
  let pdf = null;
  for (let y = 0; y < h; y += pageH) {
    const sliceH = Math.min(pageH, h - y);
    const canvas = await Promise.race([
      html2canvas(el, { backgroundColor: '#111418', scale: 2, y: top + y, x: 0, width: w, height: sliceH, windowWidth: document.body.clientWidth, logging: false, imageTimeout: 5000 }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000))
    ]);
    const img = canvas.toDataURL('image/jpeg', 0.9);
    const pw = w + pad * 2, ph = sliceH + pad * 2;
    if (!pdf) pdf = new jsPDF({ orientation: 'p', unit: 'px', format: [pw, ph] });
    else pdf.addPage([pw, ph]);
    pdf.setFillColor(17, 20, 24);
    pdf.rect(0, 0, pw, ph, 'F');
    pdf.addImage(img, 'JPEG', pad, pad, w, sliceH);
  }
  return pdf;
}

async function sharePdf(pdf, filename, title) {
  const blob = pdf.output('blob');
  const file = new File([blob], filename, { type: 'application/pdf' });
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (_) {}
  if (canShare) {
    try {
      // navigator.share can hang in some WKWebView configs, so cap it
      await Promise.race([
        navigator.share({ title, files: [file] }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('ShareTimeout')), 10000))
      ]);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastTimer = null;
function toast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(_toastTimer);
  if (ms) _toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { document.getElementById('toast').style.display = 'none'; }

function showError(msg) {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display  = 'flex';
  document.getElementById('errMsg').textContent         = msg;
}

/* ── Height reporting (for FlutterFlow dynamic WebView sizing) ───────────── */
// After every render, post the full scroll height so the parent Flutter widget
// can resize via an app state variable bound to a JavascriptChannel.
function reportHeight() {
  const h = document.documentElement.scrollHeight;
  try { window.flutter_inappwebview?.callHandler?.('onHeightChanged', h); } catch(_) {}
  try { window.parent?.postMessage?.({ type: 'webviewHeight', height: h }, '*'); } catch(_) {}
}

// Observe DOM changes so height reports fire after filter re-renders too
const _ro = new ResizeObserver(() => reportHeight());
_ro.observe(document.body);

/* ── Boot ────────────────────────────────────────────────────────────────── */
init();
</script>
