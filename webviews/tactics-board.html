<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CoachSmart Tactics Board</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: #0f1923;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Top toolbar ─────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: #1a2332;
  border-bottom: 1px solid #2a3a4a;
  flex-shrink: 0;
  gap: 8px;
  min-height: 52px;
}

#pitch-selector { display: flex; gap: 4px; }

.pitch-btn {
  padding: 7px 11px;
  border: 1px solid #3a5a7a;
  background: transparent;
  color: #8ab4d4;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.pitch-btn.active { background: #2a7a4a; border-color: #3aaa6a; color: #fff; }

#toolbar-actions { display: flex; gap: 6px; }

.action-btn {
  width: 36px;
  height: 36px;
  border: 1px solid #3a5a7a;
  background: transparent;
  color: #ccc;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
}
.action-btn:active { background: #2a3a4a; }
#export-btn { background: #1a5a2a; border-color: #2a8a4a; color: #6fda90; }
#delete-btn { color: #e05050; border-color: #6a2a2a; }
#delete-btn.has-selection { background: #3a1a1a; border-color: #e05050; }

/* ── Canvas area ─────────────────────────────────── */
#canvas-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}

#canvas-wrap canvas { display: block; touch-action: none; }

#mode-label {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 11px;
  color: #aac;
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

/* ── Drag ghost ──────────────────────────────────── */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  transform: translate(-50%, -50%);
  display: none;
}

/* ── Bottom palette ──────────────────────────────── */
#palette {
  background: #1a2332;
  border-top: 1px solid #2a3a4a;
  padding: 8px 10px 12px;
  flex-shrink: 0;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#palette::-webkit-scrollbar { display: none; }

#palette-inner {
  display: flex;
  gap: 6px;
  align-items: center;
  width: max-content;
  padding: 0 2px;
}

.pal-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 8px;
  border: 1.5px solid #2a3a4a;
  background: #111a27;
  color: #8ab4d4;
  border-radius: 10px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  min-width: 54px;
  height: 62px;
  letter-spacing: 0.2px;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.12s;
}
.pal-btn:active { transform: scale(0.93); }
.pal-btn.active { border-color: #3aaa6a; background: #0f2a1a; color: #6fda90; }
.pal-btn svg, .pal-btn canvas { display: block; }

.pal-divider {
  width: 1px;
  height: 44px;
  background: #2a3a4a;
  flex-shrink: 0;
  margin: 0 2px;
}
</style>
</head>
<body>

<!-- Top toolbar -->
<div id="toolbar">
  <div id="pitch-selector">
    <button class="pitch-btn active" data-pitch="full">Full</button>
    <button class="pitch-btn" data-pitch="half">Half</button>
    <button class="pitch-btn" data-pitch="blank">Blank</button>
  </div>
  <div id="toolbar-actions">
    <button class="action-btn" id="undo-btn" title="Undo">↩</button>
    <button class="action-btn" id="delete-btn" title="Delete selected">✕</button>
    <button class="action-btn" id="clear-btn" title="Clear all">🗑</button>
    <button class="action-btn" id="export-btn" title="Share PDF">📤</button>
  </div>
</div>

<!-- Canvas -->
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="mode-label">Select &amp; Move</div>
</div>

<!-- Drag ghost -->
<div id="drag-ghost"></div>

<!-- Bottom palette -->
<div id="palette">
  <div id="palette-inner">

    <button class="pal-btn active" data-action="tool" data-tool="select">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <path d="M4 2 L18 13 L11 14 L8 20 Z" fill="#8ab4d4"/>
      </svg>
      Select
    </button>

    <div class="pal-divider"></div>

    <button class="pal-btn" data-action="add" data-type="player-blue">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="13" fill="#1a6abf" stroke="#4a9aef" stroke-width="1.5"/>
        <text x="16" y="21" text-anchor="middle" fill="white" font-size="13" font-weight="700" font-family="sans-serif">B</text>
      </svg>
      Blue
    </button>

    <button class="pal-btn" data-action="add" data-type="player-red">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="13" fill="#bf1a1a" stroke="#ef4a4a" stroke-width="1.5"/>
        <text x="16" y="21" text-anchor="middle" fill="white" font-size="13" font-weight="700" font-family="sans-serif">R</text>
      </svg>
      Red
    </button>

    <button class="pal-btn" data-action="add" data-type="cone">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <polygon points="16,4 28,28 4,28" fill="#f07010" stroke="#ffaa50" stroke-width="1"/>
        <ellipse cx="16" cy="28" rx="6" ry="2" fill="#c05010" opacity="0.6"/>
      </svg>
      Cone
    </button>

    <button class="pal-btn" data-action="add" data-type="ball">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="12" fill="#f5f0e8" stroke="#bbb" stroke-width="1.5"/>
        <line x1="8" y1="16" x2="24" y2="16" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
        <line x1="16" y1="8" x2="16" y2="24" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
      </svg>
      Ball
    </button>

    <button class="pal-btn" data-action="add" data-type="posts">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <rect x="4"  y="14" width="24" height="3"  fill="#ffe55c" rx="1"/>
        <rect x="4"  y="4"  width="4"  height="10" fill="#ffe55c" rx="1"/>
        <rect x="24" y="4"  width="4"  height="10" fill="#ffe55c" rx="1"/>
        <rect x="12" y="17" width="3"  height="11" fill="#ffe55c" rx="1"/>
        <rect x="17" y="17" width="3"  height="11" fill="#ffe55c" rx="1"/>
      </svg>
      Posts
    </button>

    <div class="pal-divider"></div>

    <button class="pal-btn" data-action="tool" data-tool="draw">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <path d="M3 19 L7 10 L19 3 L20 5 L8 18 Z" fill="none" stroke="#8ab4d4" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="3" cy="19" r="2" fill="#8ab4d4"/>
      </svg>
      Draw
    </button>

    <button class="pal-btn" data-action="tool" data-tool="arrow">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <line x1="3" y1="19" x2="17" y2="5" stroke="#8ab4d4" stroke-width="2" stroke-linecap="round"/>
        <polygon points="17,5 11,6 16,11" fill="#8ab4d4"/>
      </svg>
      Arrow
    </button>

    <button class="pal-btn" data-action="tool" data-tool="text">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <text x="4" y="18" fill="#8ab4d4" font-size="18" font-weight="700" font-family="sans-serif">T</text>
      </svg>
      Text
    </button>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────
const GRASS_DARK   = '#1a4a25';
const GRASS        = '#2d7a3a';
const LINE_COLOR   = 'rgba(255,255,255,0.8)';
const LINE_W       = 1.5;

// ── State ─────────────────────────────────────────────────────
let currentTool     = 'select';
let currentPitch    = 'full';
let blueCount       = 0;
let redCount        = 0;
let history         = [];
let drawingArrow    = false;
let arrowOrigin     = null;
let tempArrowLine   = null;

// ── Canvas ────────────────────────────────────────────────────
const wrap   = document.getElementById('canvas-wrap');
const canvas = new fabric.Canvas('c', {
  isDrawingMode: false,
  selection: true,
  preserveObjectStacking: true,
});

canvas.freeDrawingBrush.color = '#fff';
canvas.freeDrawingBrush.width = 2.5;

// ── Helpers ───────────────────────────────────────────────────
function pitchObj(obj) {
  obj.set({ selectable: false, evented: false, _isPitch: true });
  return obj;
}

function pRect(x, y, w, h, fill, stroke, sw) {
  return pitchObj(new fabric.Rect({
    left: x, top: y, width: w, height: h,
    fill: fill ?? 'transparent',
    stroke: stroke ?? LINE_COLOR,
    strokeWidth: sw ?? LINE_W,
  }));
}

function pLine(x1, y1, x2, y2) {
  return pitchObj(new fabric.Line([x1, y1, x2, y2], {
    stroke: LINE_COLOR, strokeWidth: LINE_W,
  }));
}

function pCircle(cx, cy, r, fill, stroke, sw) {
  return pitchObj(new fabric.Circle({
    left: cx - r, top: cy - r, radius: r,
    fill: fill ?? 'transparent',
    stroke: stroke ?? LINE_COLOR,
    strokeWidth: sw ?? LINE_W,
  }));
}

function addBack(...objs) {
  objs.forEach(o => { canvas.add(o); canvas.sendToBack(o); });
}

// ── Pitch drawing ─────────────────────────────────────────────
function clearPitch() {
  canvas.getObjects().filter(o => o._isPitch).forEach(o => canvas.remove(o));
}

function pitchBounds() {
  const cw = canvas.getWidth();
  const ch = canvas.getHeight();
  const isHalf = currentPitch === 'half';
  // Full GAA: 130m × 90m → ratio h/w = 1.444
  // Half GAA: 65m × 90m  → ratio h/w = 0.722
  const ratio = isHalf ? 0.722 : 1.444;
  const pad   = 22;

  let pw, ph;
  if ((ch - pad * 2) / (cw - pad * 2) > ratio) {
    pw = cw - pad * 2;
    ph = pw * ratio;
  } else {
    ph = ch - pad * 2;
    pw = ph / ratio;
  }

  return {
    x: (cw - pw) / 2,
    y: (ch - ph) / 2,
    w: pw,
    h: ph,
  };
}

function drawFullPitch(b) {
  const { x, y, w, h } = b;
  const r = x + w, b2 = y + h;

  // Dark outer surround
  addBack(pRect(0, 0, canvas.getWidth(), canvas.getHeight(), GRASS_DARK, 'transparent', 0));
  // Pitch
  addBack(pRect(x, y, w, h, GRASS, LINE_COLOR, LINE_W));

  // ── Lines (portrait: long axis = vertical, goals top & bottom) ──
  const m20  = h * 0.154; // 20m line
  const m45  = h * 0.346; // 45m line
  const mid  = h * 0.5;   // midfield

  addBack(
    pLine(x, y + m20, r, y + m20),
    pLine(x, b2 - m20, r, b2 - m20),
    pLine(x, y + m45, r, y + m45),
    pLine(x, b2 - m45, r, b2 - m45),
    pLine(x, y + mid, r, y + mid),
  );

  // Center circle (radius ≈ 5m → 5/90 of width)
  const ccR = w * 0.056;
  addBack(pCircle(x + w/2, y + h/2, ccR));
  // Center dot
  addBack(pCircle(x + w/2, y + h/2, 2.5, LINE_COLOR, 'transparent', 0));

  // Small goal squares (14-yd box): ~15% wide × 3.5% tall
  const sqW = w * 0.153, sqH = h * 0.035;
  const sqX = x + (w - sqW) / 2;
  addBack(pRect(sqX, y, sqW, sqH));
  addBack(pRect(sqX, b2 - sqH, sqW, sqH));

  // Large rectangles: ~38% wide × 10% tall
  const lrW = w * 0.38, lrH = h * 0.10;
  const lrX = x + (w - lrW) / 2;
  addBack(pRect(lrX, y, lrW, lrH));
  addBack(pRect(lrX, b2 - lrH, lrW, lrH));

  // Penalty spots (~11m = 8.5% from end)
  const psY = h * 0.085;
  addBack(pCircle(x + w/2, y + psY, 2.5, LINE_COLOR, 'transparent', 0));
  addBack(pCircle(x + w/2, b2 - psY, 2.5, LINE_COLOR, 'transparent', 0));

  // Goals (H-posts, shown as small rectangles outside pitch)
  const gW = w * 0.072, gH = h * 0.022;
  const gX = x + (w - gW) / 2;
  addBack(pRect(gX, y - gH, gW, gH, '#777', LINE_COLOR, 1));
  addBack(pRect(gX, b2, gW, gH, '#777', LINE_COLOR, 1));
}

function drawHalfPitch(b) {
  const { x, y, w, h } = b;
  const r = x + w, b2 = y + h;

  addBack(pRect(0, 0, canvas.getWidth(), canvas.getHeight(), GRASS_DARK, 'transparent', 0));
  addBack(pRect(x, y, w, h, GRASS, LINE_COLOR, LINE_W));

  // Midfield line at top
  addBack(pLine(x, y, r, y)); // already drawn by rect outline but makes it clearer

  // 45m from goal (~54% up)
  addBack(pLine(x, y + h * 0.46, r, y + h * 0.46));

  // 20m from goal (~23% up)
  addBack(pLine(x, b2 - h * 0.23, r, b2 - h * 0.23));

  // Large rect
  const lrW = w * 0.38, lrH = h * 0.20;
  const lrX = x + (w - lrW) / 2;
  addBack(pRect(lrX, b2 - lrH, lrW, lrH));

  // Small square
  const sqW = w * 0.153, sqH = h * 0.065;
  const sqX = x + (w - sqW) / 2;
  addBack(pRect(sqX, b2 - sqH, sqW, sqH));

  // Penalty spot (~13% from goal end)
  addBack(pCircle(x + w/2, b2 - h * 0.13, 2.5, LINE_COLOR, 'transparent', 0));

  // Goal
  const gW = w * 0.072, gH = h * 0.04;
  const gX = x + (w - gW) / 2;
  addBack(pRect(gX, b2, gW, gH, '#777', LINE_COLOR, 1));
}

function drawBlankPitch() {
  addBack(pRect(0, 0, canvas.getWidth(), canvas.getHeight(), GRASS, 'transparent', 0));
}

function drawPitch() {
  clearPitch();
  if (currentPitch === 'blank') {
    drawBlankPitch();
  } else {
    const b = pitchBounds();
    if (currentPitch === 'full') drawFullPitch(b);
    else drawHalfPitch(b);
  }
  canvas.renderAll();
}

// ── Resize ────────────────────────────────────────────────────
function resize() {
  const w = wrap.offsetWidth;
  const h = wrap.offsetHeight;
  if (!w || !h) return;
  if (w === canvas.getWidth() && h === canvas.getHeight()) return;
  canvas.setDimensions({ width: w, height: h });
  drawPitch();
}
let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(resize, 120);
});
resize();

// ── Token factory ─────────────────────────────────────────────
function makePlayer(type) {
  const isBlue = type === 'player-blue';
  const num    = isBlue ? ++blueCount : ++redCount;
  const fill   = isBlue ? '#1a6abf' : '#bf1a1a';
  const stroke = isBlue ? '#4a9aef' : '#ef4a4a';

  const circle = new fabric.Circle({
    radius: 18, fill, stroke, strokeWidth: 2,
    originX: 'center', originY: 'center',
  });
  const label = new fabric.Text(String(num), {
    fontSize: 15, fontWeight: '700', fill: '#fff',
    fontFamily: 'sans-serif',
    originX: 'center', originY: 'center',
  });

  return new fabric.Group([circle, label], {
    left: canvas.getWidth() / 2,
    top:  canvas.getHeight() / 2,
    originX: 'center', originY: 'center',
    _tokenType: type,
  });
}

function makeCone() {
  const tri = new fabric.Triangle({
    width: 26, height: 26, fill: '#f07010',
    stroke: '#ffaa50', strokeWidth: 1.5,
    originX: 'center', originY: 'center',
  });
  return new fabric.Group([tri], {
    left: canvas.getWidth() / 2, top: canvas.getHeight() / 2,
    originX: 'center', originY: 'center', _tokenType: 'cone',
  });
}

function makeBall() {
  const circle = new fabric.Circle({
    radius: 14, fill: '#f5f0e8', stroke: '#bbb', strokeWidth: 1.5,
    originX: 'center', originY: 'center',
  });
  const seam1 = new fabric.Line([-10, 0, 10, 0], {
    stroke: 'rgba(0,0,0,0.18)', strokeWidth: 1.5,
    originX: 'center', originY: 'center',
  });
  const seam2 = new fabric.Line([0, -10, 0, 10], {
    stroke: 'rgba(0,0,0,0.18)', strokeWidth: 1.5,
    originX: 'center', originY: 'center',
  });
  return new fabric.Group([circle, seam1, seam2], {
    left: canvas.getWidth() / 2, top: canvas.getHeight() / 2,
    originX: 'center', originY: 'center', _tokenType: 'ball',
  });
}

function makePosts() {
  // GAA H-posts: crossbar at mid-height, two tall uprights above, short goal posts below
  const POST = '#ffe55c';
  const crossbar = new fabric.Rect({ left: -22, top: -2,  width: 44, height: 4,  fill: POST, rx: 1 });
  const lUp      = new fabric.Rect({ left: -22, top: -28, width: 4,  height: 26, fill: POST, rx: 1 });
  const rUp      = new fabric.Rect({ left:  18, top: -28, width: 4,  height: 26, fill: POST, rx: 1 });
  const lGoal    = new fabric.Rect({ left: -10, top:   2, width: 3,  height: 18, fill: POST, rx: 1 });
  const rGoal    = new fabric.Rect({ left:   7, top:   2, width: 3,  height: 18, fill: POST, rx: 1 });
  return new fabric.Group([crossbar, lUp, rUp, lGoal, rGoal], {
    left: canvas.getWidth() / 2, top: canvas.getHeight() / 2,
    originX: 'center', originY: 'center', _tokenType: 'posts',
  });
}

function addToken(type, cx, cy) {
  let obj;
  if (type === 'player-blue') obj = makePlayer('player-blue');
  else if (type === 'player-red') obj = makePlayer('player-red');
  else if (type === 'cone') obj = makeCone();
  else if (type === 'ball') obj = makeBall();
  else if (type === 'posts') obj = makePosts();
  if (!obj) return;
  if (cx !== undefined && cy !== undefined) {
    obj.set({ left: cx, top: cy });
  }
  canvas.add(obj);
  canvas.setActiveObject(obj);
  saveState();
  canvas.renderAll();
}

// ── Arrow drawing ─────────────────────────────────────────────
function makeArrowHead(x1, y1, x2, y2, color) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const s     = 13;
  return new fabric.Polygon([
    { x: x2, y: y2 },
    { x: x2 - s * Math.cos(angle - Math.PI / 6), y: y2 - s * Math.sin(angle - Math.PI / 6) },
    { x: x2 - s * Math.cos(angle + Math.PI / 6), y: y2 - s * Math.sin(angle + Math.PI / 6) },
  ], { fill: color, selectable: false, evented: false });
}

canvas.on('mouse:down', opt => {
  if (currentTool !== 'arrow') return;
  const p = canvas.getPointer(opt.e);
  arrowOrigin  = p;
  drawingArrow = true;
  tempArrowLine = new fabric.Line([p.x, p.y, p.x, p.y], {
    stroke: '#fff', strokeWidth: 2.5,
    selectable: false, evented: false,
  });
  canvas.add(tempArrowLine);
});

canvas.on('mouse:move', opt => {
  if (!drawingArrow || !tempArrowLine) return;
  const p = canvas.getPointer(opt.e);
  tempArrowLine.set({ x2: p.x, y2: p.y });
  canvas.renderAll();
});

canvas.on('mouse:up', opt => {
  // Text tool
  if (currentTool === 'text') {
    const p = canvas.getPointer(opt.e);
    const txt = new fabric.IText('Label', {
      left: p.x, top: p.y,
      fontSize: 14, fontWeight: '700', fill: '#fff',
      fontFamily: 'sans-serif',
      shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.6)', blur: 3 }),
    });
    canvas.add(txt);
    canvas.setActiveObject(txt);
    txt.enterEditing();
    txt.selectAll();
    saveState();
    return;
  }

  if (!drawingArrow || !tempArrowLine) return;
  drawingArrow = false;

  const p  = canvas.getPointer(opt.e);
  const dx = p.x - arrowOrigin.x;
  const dy = p.y - arrowOrigin.y;

  canvas.remove(tempArrowLine);
  tempArrowLine = null;

  if (Math.sqrt(dx * dx + dy * dy) < 8) return;

  const arrowColor = '#fff';
  const line = new fabric.Line(
    [arrowOrigin.x, arrowOrigin.y, p.x, p.y],
    { stroke: arrowColor, strokeWidth: 2.5 }
  );
  const head = makeArrowHead(arrowOrigin.x, arrowOrigin.y, p.x, p.y, arrowColor);
  const group = new fabric.Group([line, head], { _isArrow: true });
  canvas.add(group);
  saveState();
  canvas.renderAll();
});

canvas.on('path:created', () => saveState());
canvas.on('object:modified', () => saveState());

// ── Selection tracking ────────────────────────────────────────
canvas.on('selection:created', updateDeleteBtn);
canvas.on('selection:updated', updateDeleteBtn);
canvas.on('selection:cleared', updateDeleteBtn);

function updateDeleteBtn() {
  const has = canvas.getActiveObjects().filter(o => !o._isPitch).length > 0;
  document.getElementById('delete-btn').classList.toggle('has-selection', has);
}

// ── Tool switching ────────────────────────────────────────────
function setTool(tool) {
  currentTool = tool;
  canvas.isDrawingMode = tool === 'draw';
  canvas.selection     = tool === 'select';
  canvas.defaultCursor = tool === 'arrow' ? 'crosshair' : tool === 'text' ? 'text' : 'default';

  const labels = {
    select: 'Select & Move',
    draw:   'Freehand Draw — tap and drag',
    arrow:  'Arrow — drag to draw',
    text:   'Text — tap to place',
  };
  document.getElementById('mode-label').textContent = labels[tool] || '';

  document.querySelectorAll('[data-action="tool"]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === tool)
  );
}

// ── History ───────────────────────────────────────────────────
function saveState() {
  const json = canvas.toJSON(['_tokenType', '_isArrow', '_isPitch']);
  json.objects = (json.objects || []).filter(o => !o._isPitch);
  history.push(JSON.stringify(json));
  if (history.length > 40) history.shift();
}

function undo() {
  if (history.length <= 1) return;
  history.pop();
  const snap = history[history.length - 1];
  canvas.getObjects().filter(o => !o._isPitch).forEach(o => canvas.remove(o));
  canvas.loadFromJSON(snap, () => {
    drawPitch();
    canvas.renderAll();
  });
}

// ── Delete selected ───────────────────────────────────────────
function deleteSelected() {
  const active = canvas.getActiveObjects().filter(o => !o._isPitch);
  if (!active.length) return;
  active.forEach(o => canvas.remove(o));
  canvas.discardActiveObject();
  saveState();
  updateDeleteBtn();
}

document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && !canvas.isDrawingMode) {
    const target = document.activeElement;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) return;
    deleteSelected();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

// ── Export PDF ────────────────────────────────────────────────
async function exportPDF() {
  canvas.discardActiveObject();
  canvas.renderAll();

  const scale   = 2;
  const imgData = canvas.toDataURL({ format: 'png', multiplier: scale });
  const cw      = canvas.getWidth();
  const ch      = canvas.getHeight();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: cw > ch ? 'landscape' : 'portrait',
    unit: 'pt',
    format: [cw, ch],
  });

  pdf.addImage(imgData, 'PNG', 0, 0, cw, ch);

  const blob = pdf.output('blob');
  const file = new File([blob], 'CoachSmart_Tactics.pdf', { type: 'application/pdf' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ title: 'CoachSmart Tactics', files: [file] });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }

  // Fallback — direct download
  const url = URL.createObjectURL(blob);
  const a   = document.createElement('a');
  a.href     = url;
  a.download = 'CoachSmart_Tactics.pdf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── Event listeners ───────────────────────────────────────────
document.querySelectorAll('.pitch-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.pitch-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPitch = btn.dataset.pitch;
  blueCount    = 0;
  redCount     = 0;
  canvas.getObjects().filter(o => !o._isPitch).forEach(o => canvas.remove(o));
  drawPitch();
  history = [];
  saveState();
}));

document.querySelectorAll('[data-action="tool"]').forEach(btn =>
  btn.addEventListener('click', () => setTool(btn.dataset.tool))
);

// ── Drag-from-palette ─────────────────────────────────────────
const ghost = document.getElementById('drag-ghost');
let dragType = null;

function ghostMove(clientX, clientY) {
  ghost.style.left = clientX + 'px';
  ghost.style.top  = clientY + 'px';
}

function dropToken(clientX, clientY) {
  if (!dragType) return;
  ghost.style.display = 'none';
  const wrapRect = wrap.getBoundingClientRect();
  if (clientX >= wrapRect.left && clientX <= wrapRect.right &&
      clientY >= wrapRect.top  && clientY <= wrapRect.bottom) {
    const scale = canvas.getWidth() / wrapRect.width;
    const cx = (clientX - wrapRect.left) * scale;
    const cy = (clientY - wrapRect.top)  * scale;
    setTool('select');
    addToken(dragType, cx, cy);
  }
  dragType = null;
}

document.querySelectorAll('[data-action="add"]').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragType = btn.dataset.type;
    ghost.style.display = 'block';
    ghostMove(e.clientX, e.clientY);
    btn.setPointerCapture(e.pointerId);
  });
  btn.addEventListener('pointermove', e => {
    if (!dragType) return;
    ghostMove(e.clientX, e.clientY);
  });
  btn.addEventListener('pointerup', e => {
    dropToken(e.clientX, e.clientY);
  });
  btn.addEventListener('pointercancel', () => {
    ghost.style.display = 'none';
    dragType = null;
  });
});

document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('delete-btn').addEventListener('click', deleteSelected);
document.getElementById('export-btn').addEventListener('click', exportPDF);

document.getElementById('clear-btn').addEventListener('click', () => {
  if (!confirm('Clear the board?')) return;
  blueCount = 0; redCount = 0;
  canvas.getObjects().filter(o => !o._isPitch).forEach(o => canvas.remove(o));
  canvas.discardActiveObject();
  canvas.renderAll();
  history = [];
  saveState();
});

// ── Init ──────────────────────────────────────────────────────
saveState();
</script>
</body>
</html>
