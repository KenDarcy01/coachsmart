<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CoachSmart Tactics Board</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: #0f1923;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Toolbar ─────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: #1a2332;
  border-bottom: 1px solid #2a3a4a;
  flex-shrink: 0;
  min-height: 48px;
  gap: 8px;
}

#mode-label {
  font-size: 11px;
  color: #8ab4d4;
  font-weight: 600;
  letter-spacing: 0.3px;
  flex: 1;
}

#toolbar-actions { display: flex; gap: 6px; }

.action-btn {
  width: 36px; height: 36px;
  border: 1px solid #2a3a4a;
  background: transparent;
  color: #ccc;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
}
.action-btn:active { background: #2a3a4a; }
#export-btn { background: #1a5a2a; border-color: #2a8a4a; color: #6fda90; }
#delete-btn { color: #e05050; border-color: #6a2a2a; }
#delete-btn.has-selection { background: #3a1a1a; border-color: #e05050; }

/* ── Main area ───────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* ── Left sidebar ────────────────────────────────── */
#sidebar {
  width: 68px;
  flex-shrink: 0;
  background: rgba(10, 20, 35, 0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-right: 1px solid rgba(255,255,255,0.07);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 0 14px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  gap: 1px;
  z-index: 10;
}
#sidebar::-webkit-scrollbar { display: none; }

.side-btn {
  width: 58px;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 1.5px solid transparent;
  background: transparent;
  border-radius: 10px;
  cursor: pointer;
  font-size: 9px;
  font-weight: 600;
  color: #8ab4d4;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.12s;
  padding: 5px 2px;
  flex-shrink: 0;
  touch-action: none;
}
.side-btn:active { background: rgba(255,255,255,0.06); transform: scale(0.94); }
.side-btn.active  { border-color: #3aaa6a; background: rgba(58,170,106,0.12); color: #6fda90; }

.side-divider {
  width: 38px;
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 3px 0;
  flex-shrink: 0;
}

/* ── Canvas area ─────────────────────────────────── */
#canvas-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}
#canvas-wrap canvas { display: block; touch-action: none; }

/* ── Shape popup ─────────────────────────────────── */
#shape-popup {
  position: absolute;
  left: 72px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(10, 20, 35, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 8px 5px;
  flex-direction: column;
  gap: 2px;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,0.55);
  display: none;
}
#shape-popup.open { display: flex; }

/* ── Drag ghost ──────────────────────────────────── */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  transform: translate(-50%, -50%);
  display: none;
}
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <div id="mode-label">Select &amp; Move</div>
  <div id="toolbar-actions">
    <button class="action-btn" id="undo-btn"   title="Undo">↩</button>
    <button class="action-btn" id="delete-btn" title="Delete">✕</button>
    <button class="action-btn" id="clear-btn"  title="Clear">🗑</button>
    <button class="action-btn" id="export-btn" title="Share PDF">📤</button>
  </div>
</div>

<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">

    <!-- Players -->
    <button class="side-btn" data-action="add" data-type="player-blue">
      <svg width="30" height="30" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="12" fill="#1a6abf" stroke="#4a9aef" stroke-width="1.5"/>
        <text x="15" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="sans-serif">B</text>
      </svg>
      <span style="color:#4a9aef">Blue</span>
    </button>

    <button class="side-btn" data-action="add" data-type="player-red">
      <svg width="30" height="30" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="12" fill="#bf1a1a" stroke="#ef4a4a" stroke-width="1.5"/>
        <text x="15" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="sans-serif">R</text>
      </svg>
      <span style="color:#ef4a4a">Red</span>
    </button>

    <div class="side-divider"></div>

    <!-- Cones (4 colours) -->
    <button class="side-btn" data-action="add" data-type="cone-orange">
      <svg width="28" height="26" viewBox="0 0 28 26">
        <polygon points="14,2 26,24 2,24" fill="#f07010" stroke="#ffaa50" stroke-width="1"/>
      </svg>
      <span style="color:#f07010">Cone</span>
    </button>

    <button class="side-btn" data-action="add" data-type="cone-yellow">
      <svg width="28" height="26" viewBox="0 0 28 26">
        <polygon points="14,2 26,24 2,24" fill="#ffe020" stroke="#fff08a" stroke-width="1"/>
      </svg>
      <span style="color:#e8c800">Cone</span>
    </button>

    <button class="side-btn" data-action="add" data-type="cone-blue">
      <svg width="28" height="26" viewBox="0 0 28 26">
        <polygon points="14,2 26,24 2,24" fill="#2060e0" stroke="#6090ff" stroke-width="1"/>
      </svg>
      <span style="color:#6090ff">Cone</span>
    </button>

    <button class="side-btn" data-action="add" data-type="cone-white">
      <svg width="28" height="26" viewBox="0 0 28 26">
        <polygon points="14,2 26,24 2,24" fill="#ddd" stroke="#999" stroke-width="1"/>
      </svg>
      <span style="color:#ccc">Cone</span>
    </button>

    <div class="side-divider"></div>

    <!-- Ball -->
    <button class="side-btn" data-action="add" data-type="ball">
      <svg width="30" height="30" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="12" fill="#f5f0e8" stroke="#bbb" stroke-width="1.5"/>
        <path d="M7 11 Q15 8 23 11" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1.2"/>
        <path d="M6 18 Q15 15 24 18" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1.2"/>
      </svg>
      Ball
    </button>

    <!-- Posts -->
    <button class="side-btn" data-action="add" data-type="posts">
      <svg width="30" height="30" viewBox="0 0 30 30">
        <rect x="5"  y="3"  width="4" height="24" fill="#f0f0f0" rx="1"/>
        <rect x="21" y="3"  width="4" height="24" fill="#f0f0f0" rx="1"/>
        <rect x="5"  y="19" width="20" height="3"  fill="#f0f0f0" rx="1"/>
      </svg>
      Posts
    </button>

    <div class="side-divider"></div>

    <!-- Shapes -->
    <button class="side-btn" id="shape-toggle">
      <svg width="30" height="30" viewBox="0 0 30 30">
        <rect x="3" y="15" width="12" height="12" fill="none" stroke="#8ab4d4" stroke-width="1.5" rx="1"/>
        <circle cx="22" cy="9" r="7" fill="none" stroke="#8ab4d4" stroke-width="1.5"/>
        <polygon points="9,3 15,13 3,13" fill="none" stroke="#8ab4d4" stroke-width="1.5"/>
      </svg>
      Shape
    </button>

    <div class="side-divider"></div>

    <!-- Tools -->
    <button class="side-btn active" data-action="tool" data-tool="select">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <path d="M4 2 L18 13 L11 14 L8 20 Z" fill="#8ab4d4"/>
      </svg>
      Select
    </button>

    <button class="side-btn" data-action="tool" data-tool="draw">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <path d="M3 19 L7 10 L19 3 L20 5 L8 18 Z" fill="none" stroke="#8ab4d4" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="3" cy="19" r="2" fill="#8ab4d4"/>
      </svg>
      Draw
    </button>

    <button class="side-btn" data-action="tool" data-tool="arrow">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <line x1="3" y1="19" x2="17" y2="5" stroke="#8ab4d4" stroke-width="2" stroke-linecap="round"/>
        <polygon points="17,5 11,6 16,11" fill="#8ab4d4"/>
      </svg>
      Arrow
    </button>

    <button class="side-btn" data-action="tool" data-tool="text">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <text x="4" y="18" fill="#8ab4d4" font-size="18" font-weight="700" font-family="sans-serif">T</text>
      </svg>
      Text
    </button>

  </div><!-- /sidebar -->

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
  </div>

  <!-- Shape popup (appears to the right of sidebar) -->
  <div id="shape-popup">
    <button class="side-btn" data-action="add" data-type="shape-circle">
      <svg width="28" height="28" viewBox="0 0 28 28">
        <circle cx="14" cy="14" r="11" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="2"/>
      </svg>
      Circle
    </button>
    <button class="side-btn" data-action="add" data-type="shape-square">
      <svg width="28" height="28" viewBox="0 0 28 28">
        <rect x="3" y="3" width="22" height="22" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="2" rx="1"/>
      </svg>
      Square
    </button>
    <button class="side-btn" data-action="add" data-type="shape-triangle">
      <svg width="28" height="28" viewBox="0 0 28 28">
        <polygon points="14,2 26,26 2,26" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="2"/>
      </svg>
      Triangle
    </button>
    <button class="side-btn" data-action="add" data-type="shape-diamond">
      <svg width="28" height="28" viewBox="0 0 28 28">
        <polygon points="14,2 26,14 14,26 2,14" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="2"/>
      </svg>
      Diamond
    </button>
  </div>

</div><!-- /main -->

<!-- Drag ghost -->
<div id="drag-ghost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────
const GRASS = '#2d7a3a';

// ── State ─────────────────────────────────────────────────────
let currentTool   = 'select';
let blueCount     = 0;
let redCount      = 0;
let history       = [];
let drawingArrow  = false;
let arrowOrigin   = null;
let tempArrowLine = null;

// ── Canvas ────────────────────────────────────────────────────
const wrap   = document.getElementById('canvas-wrap');
const canvas = new fabric.Canvas('c', {
  isDrawingMode: false,
  selection: true,
  preserveObjectStacking: true,
});
canvas.freeDrawingBrush.color = '#fff';
canvas.freeDrawingBrush.width = 2.5;

// ── Pitch: blank green only ───────────────────────────────────
function drawPitch() {
  canvas.getObjects().filter(o => o._isPitch).forEach(o => canvas.remove(o));
  const bg = new fabric.Rect({
    left: 0, top: 0,
    width:  canvas.getWidth(),
    height: canvas.getHeight(),
    fill: GRASS,
    selectable: false, evented: false, _isPitch: true,
  });
  canvas.add(bg);
  canvas.sendToBack(bg);
  canvas.renderAll();
}

// ── Resize ────────────────────────────────────────────────────
function resize() {
  const w = wrap.offsetWidth;
  const h = wrap.offsetHeight;
  if (!w || !h) return;
  if (w === canvas.getWidth() && h === canvas.getHeight()) return;
  canvas.setDimensions({ width: w, height: h });
  drawPitch();
}
let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(resize, 120);
});
resize();

// ── Token factories ───────────────────────────────────────────
function cx() { return canvas.getWidth()  / 2; }
function cy() { return canvas.getHeight() / 2; }

function makePlayer(type) {
  const isBlue = type === 'player-blue';
  const num    = isBlue ? ++blueCount : ++redCount;
  const fill   = isBlue ? '#1a6abf' : '#bf1a1a';
  const stroke = isBlue ? '#4a9aef' : '#ef4a4a';
  const circle = new fabric.Circle({ radius: 18, fill, stroke, strokeWidth: 2, originX: 'center', originY: 'center' });
  const label  = new fabric.Text(String(num), { fontSize: 15, fontWeight: '700', fill: '#fff', fontFamily: 'sans-serif', originX: 'center', originY: 'center' });
  return new fabric.Group([circle, label], { left: cx(), top: cy(), originX: 'center', originY: 'center', _tokenType: type });
}

const CONE_COLORS = {
  'cone-orange': { fill: '#f07010', stroke: '#ffaa50' },
  'cone-yellow': { fill: '#ffe020', stroke: '#fff08a' },
  'cone-blue':   { fill: '#2060e0', stroke: '#6090ff' },
  'cone-white':  { fill: '#ddd',    stroke: '#aaa'    },
};

function makeCone(type) {
  const c = CONE_COLORS[type] || CONE_COLORS['cone-orange'];
  return new fabric.Triangle({
    width: 28, height: 28, fill: c.fill, stroke: c.stroke, strokeWidth: 1.5,
    left: cx(), top: cy(), originX: 'center', originY: 'center', _tokenType: type,
  });
}

function makeBall() {
  return new fabric.Circle({
    radius: 14, fill: '#f5f0e8', stroke: '#bbb', strokeWidth: 1.5,
    left: cx(), top: cy(), originX: 'center', originY: 'center', _tokenType: 'ball',
  });
}

function makePosts() {
  // GAA H-posts: two tall uprights with crossbar ~70% down, goal area below
  const c   = '#f0f0f0';
  const lUp = new fabric.Rect({ left: -20, top: -28, width: 4, height: 55, fill: c, rx: 2 });
  const rUp = new fabric.Rect({ left: 16,  top: -28, width: 4, height: 55, fill: c, rx: 2 });
  const bar = new fabric.Rect({ left: -22, top: 12,  width: 44, height: 4, fill: c, rx: 1 });
  return new fabric.Group([lUp, rUp, bar], {
    left: cx(), top: cy(), originX: 'center', originY: 'center', _tokenType: 'posts',
  });
}

function makeShape(type) {
  const base = {
    fill: 'rgba(255,255,255,0.15)', stroke: '#fff', strokeWidth: 2,
    left: cx(), top: cy(), originX: 'center', originY: 'center', _tokenType: type,
  };
  if (type === 'shape-circle')   return new fabric.Circle({ ...base, radius: 30 });
  if (type === 'shape-square')   return new fabric.Rect({ ...base, width: 60, height: 60, rx: 2 });
  if (type === 'shape-triangle') return new fabric.Triangle({ ...base, width: 60, height: 55 });
  if (type === 'shape-diamond')  return new fabric.Polygon(
    [{ x: 0, y: -34 }, { x: 34, y: 0 }, { x: 0, y: 34 }, { x: -34, y: 0 }], base
  );
  return null;
}

// ── Add token ─────────────────────────────────────────────────
function addToken(type, dropX, dropY) {
  let obj;
  if (type === 'player-blue' || type === 'player-red') obj = makePlayer(type);
  else if (type.startsWith('cone-'))   obj = makeCone(type);
  else if (type === 'ball')            obj = makeBall();
  else if (type === 'posts')           obj = makePosts();
  else if (type.startsWith('shape-')) obj = makeShape(type);
  if (!obj) return;
  if (dropX !== undefined && dropY !== undefined) obj.set({ left: dropX, top: dropY });
  canvas.add(obj);
  canvas.setActiveObject(obj);
  saveState();
  canvas.renderAll();
}

// ── Arrow drawing ─────────────────────────────────────────────
function makeArrowHead(x1, y1, x2, y2, color) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const s = 13;
  return new fabric.Polygon([
    { x: x2, y: y2 },
    { x: x2 - s * Math.cos(angle - Math.PI / 6), y: y2 - s * Math.sin(angle - Math.PI / 6) },
    { x: x2 - s * Math.cos(angle + Math.PI / 6), y: y2 - s * Math.sin(angle + Math.PI / 6) },
  ], { fill: color, selectable: false, evented: false });
}

canvas.on('mouse:down', opt => {
  if (currentTool !== 'arrow') return;
  const p = canvas.getPointer(opt.e);
  arrowOrigin = p; drawingArrow = true;
  tempArrowLine = new fabric.Line([p.x, p.y, p.x, p.y], { stroke: '#fff', strokeWidth: 2.5, selectable: false, evented: false });
  canvas.add(tempArrowLine);
});

canvas.on('mouse:move', opt => {
  if (!drawingArrow || !tempArrowLine) return;
  const p = canvas.getPointer(opt.e);
  tempArrowLine.set({ x2: p.x, y2: p.y });
  canvas.renderAll();
});

canvas.on('mouse:up', opt => {
  if (currentTool === 'text') {
    const p   = canvas.getPointer(opt.e);
    const txt = new fabric.IText('Label', {
      left: p.x, top: p.y, fontSize: 14, fontWeight: '700', fill: '#fff',
      fontFamily: 'sans-serif', shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.6)', blur: 3 }),
    });
    canvas.add(txt); canvas.setActiveObject(txt); txt.enterEditing(); txt.selectAll();
    saveState(); return;
  }
  if (!drawingArrow || !tempArrowLine) return;
  drawingArrow = false;
  const p  = canvas.getPointer(opt.e);
  const dx = p.x - arrowOrigin.x, dy = p.y - arrowOrigin.y;
  canvas.remove(tempArrowLine); tempArrowLine = null;
  if (Math.sqrt(dx * dx + dy * dy) < 8) return;
  const line = new fabric.Line([arrowOrigin.x, arrowOrigin.y, p.x, p.y], { stroke: '#fff', strokeWidth: 2.5 });
  const head = makeArrowHead(arrowOrigin.x, arrowOrigin.y, p.x, p.y, '#fff');
  canvas.add(new fabric.Group([line, head], { _isArrow: true }));
  saveState(); canvas.renderAll();
});

canvas.on('path:created',    () => saveState());
canvas.on('object:modified', () => saveState());

// ── Selection ─────────────────────────────────────────────────
canvas.on('selection:created', updateDeleteBtn);
canvas.on('selection:updated', updateDeleteBtn);
canvas.on('selection:cleared', updateDeleteBtn);

function updateDeleteBtn() {
  const has = canvas.getActiveObjects().filter(o => !o._isPitch).length > 0;
  document.getElementById('delete-btn').classList.toggle('has-selection', has);
}

// ── Tool switching ────────────────────────────────────────────
function setTool(tool) {
  currentTool = tool;
  canvas.isDrawingMode = tool === 'draw';
  canvas.selection     = tool === 'select';
  canvas.defaultCursor = tool === 'arrow' ? 'crosshair' : tool === 'text' ? 'text' : 'default';
  const labels = { select: 'Select & Move', draw: 'Freehand Draw — drag on canvas', arrow: 'Arrow — drag to draw', text: 'Text — tap canvas to place' };
  document.getElementById('mode-label').textContent = labels[tool] || '';
  document.querySelectorAll('[data-action="tool"]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
}

// ── History ───────────────────────────────────────────────────
function saveState() {
  const json = canvas.toJSON(['_tokenType', '_isArrow', '_isPitch']);
  json.objects = (json.objects || []).filter(o => !o._isPitch);
  history.push(JSON.stringify(json));
  if (history.length > 40) history.shift();
}

function undo() {
  if (history.length <= 1) return;
  history.pop();
  const snap = history[history.length - 1];
  canvas.getObjects().filter(o => !o._isPitch).forEach(o => canvas.remove(o));
  canvas.loadFromJSON(snap, () => { drawPitch(); canvas.renderAll(); });
}

// ── Delete ────────────────────────────────────────────────────
function deleteSelected() {
  const active = canvas.getActiveObjects().filter(o => !o._isPitch);
  if (!active.length) return;
  active.forEach(o => canvas.remove(o));
  canvas.discardActiveObject();
  saveState(); updateDeleteBtn(); canvas.renderAll();
}

document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && !canvas.isDrawingMode) {
    const t = document.activeElement;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    deleteSelected();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

// ── Export PDF ────────────────────────────────────────────────
async function exportPDF() {
  canvas.discardActiveObject(); canvas.renderAll();
  const imgData = canvas.toDataURL({ format: 'png', multiplier: 2 });
  const cw = canvas.getWidth(), ch = canvas.getHeight();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: cw > ch ? 'landscape' : 'portrait', unit: 'pt', format: [cw, ch] });
  pdf.addImage(imgData, 'PNG', 0, 0, cw, ch);
  const blob = pdf.output('blob');
  const file = new File([blob], 'CoachSmart_Tactics.pdf', { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ title: 'CoachSmart Tactics', files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'CoachSmart_Tactics.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── Event listeners ───────────────────────────────────────────
document.querySelectorAll('[data-action="tool"]').forEach(btn =>
  btn.addEventListener('click', () => setTool(btn.dataset.tool))
);

document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('delete-btn').addEventListener('click', deleteSelected);
document.getElementById('export-btn').addEventListener('click', exportPDF);
document.getElementById('clear-btn').addEventListener('click', () => {
  if (!confirm('Clear the board?')) return;
  blueCount = 0; redCount = 0;
  canvas.getObjects().filter(o => !o._isPitch).forEach(o => canvas.remove(o));
  canvas.discardActiveObject(); canvas.renderAll();
  history = []; saveState();
});

// Shape popup toggle
const shapePopup = document.getElementById('shape-popup');
document.getElementById('shape-toggle').addEventListener('click', e => {
  e.stopPropagation();
  shapePopup.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!e.target.closest('#shape-popup') && !e.target.closest('#shape-toggle')) {
    shapePopup.classList.remove('open');
  }
});

// ── Drag-from-sidebar ─────────────────────────────────────────
// Uses touch events (reliable on iOS WKWebView) with mouse fallback for desktop.
// Document-level move/end listeners let the finger roam freely off the button.
const ghost  = document.getElementById('drag-ghost');
let dragType = null;

function ghostMove(x, y) { ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; }

function startDrag(type, x, y) {
  dragType = type;
  ghost.style.display = 'block';
  ghostMove(x, y);
}

function dropToken(x, y) {
  if (!dragType) return;
  ghost.style.display = 'none';
  const r = wrap.getBoundingClientRect();
  if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
    const scale = canvas.getWidth() / r.width;
    addToken(dragType, (x - r.left) * scale, (y - r.top) * scale);
    shapePopup.classList.remove('open');
    setTool('select');
  }
  dragType = null;
}

function cancelDrag() { ghost.style.display = 'none'; dragType = null; }

document.querySelectorAll('[data-action="add"]').forEach(btn => {
  // Touch (iOS primary path)
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    startDrag(btn.dataset.type, t.clientX, t.clientY);
  }, { passive: false });

  // Mouse (desktop fallback)
  btn.addEventListener('mousedown', e => {
    e.preventDefault();
    startDrag(btn.dataset.type, e.clientX, e.clientY);
  });
});

// Document-level listeners so finger/cursor can move anywhere
document.addEventListener('touchmove', e => {
  if (!dragType) return;
  e.preventDefault();
  const t = e.touches[0];
  ghostMove(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchend', e => {
  if (!dragType) return;
  const t = e.changedTouches[0];
  dropToken(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchcancel', cancelDrag);

document.addEventListener('mousemove', e => { if (dragType) ghostMove(e.clientX, e.clientY); });
document.addEventListener('mouseup',   e => { if (dragType) dropToken(e.clientX, e.clientY); });

// ── Init ──────────────────────────────────────────────────────
saveState();
</script>
</body>
</html>
