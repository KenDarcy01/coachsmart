<body>
<header class="hero">
  <div class="hero-in">
    <img src="../images/clontarf-crest.png" alt="Clontarf GAA crest">
    <div class="ht">
      <div class="club">Clontarf GAA · Senior Football</div>
      <h1>Off-Season</h1>

</header>

<nav class="strip" aria-label="Choose a day">
  <div class="strip-in">
    <div class="sh">
      <button id="prev" aria-label="Previous week">‹</button>

<main class="wrap">
  <div id="day"></div>
  <section class="card">

  <section class="card key">
    <span class="k-snc">◆ Gym</span><span class="k-match">⚡ Speed</span><span class="k-run">➜ Run</span><span class="k-rest">☾ Off</span>

  <p class="foot">Plan by David Hare, Director of Sport. Ticks and numbers are saved to your CoachSmart account.<br>Injury or rehab: follow your agreed plan and contact David or the physio.</p>
