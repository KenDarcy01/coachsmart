# CoachSmart v3 store builds (the Flutter app in app/). Codemagic reads this
# file from the repository root. Builds run only when a v3 tag is pushed
# (v3.0.0-1, v3.0.0-2, ...), never on ordinary pushes, so the live app and
# the web preview are untouched. The Firebase config files are already in
# app/android/app/google-services.json and app/ios/Runner/GoogleService-Info.plist.
#
# Before the first build Ken adds in Codemagic (Teams > Integrations / the
# app's settings):
#   - App Store Connect integration named "coachsmart-asc" (an API key with
#     App Manager access) for iOS signing and the TestFlight upload.
#   - Android keystore uploaded under Code signing identities as
#     "coachsmart_upload" (the Play upload key from FlutterFlow, or a new
#     upload key registered in Play Console).
#   - Environment group "coachsmart_ios" holding CERTIFICATE_PRIVATE_KEY
#     (an RSA private key in PEM form, marked secret). The build uses it to
#     create, then reuse, an Apple Distribution certificate for v3. It adds
#     a certificate; it never revokes the one FlutterFlow uses.
#   - Environment group "coachsmart_play" holding
#     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (a Play Console service account
#     JSON with release access) for the Play upload.

definitions:
  flutter: &flutter
    flutter: 3.47.9
    xcode: latest
    cocoapods: default
  env: &env
    APP_DIR: app
    BUNDLE_ID: my.coachsmartV2
    BUILD_NAME: "3.0.0"
  triggers: &triggers
    events:
      - tag
    tag_patterns:
      - pattern: "v3.*"
        include: true
    cancel_previous_builds: true
  version: &version
    name: Work out the build number from the tag
    script: |
      # v3.0.0-7 -> build name 3.0.0, build number 1007. Tester builds start
      # at 1000 so they always sit above the FlutterFlow 1.0.x builds (235+).
      # Builds started through the Codemagic API have no tag, so they use
      # Codemagic's own per-workflow build counter instead (1000 + counter).
      if [ -n "$CM_TAG" ]; then
        TAG="$CM_TAG"
        SEQ="${TAG##*-}"; case "$SEQ" in ''|*[!0-9]*) SEQ=0;; esac
      else
        TAG="v3.0.0-api"
        SEQ="${BUILD_NUMBER:-0}"
      fi
      NAME="${TAG#v}"; NAME="${NAME%%-*}"
      echo "BUILD_NAME=$NAME" >> "$CM_ENV"
      echo "BUILD_NUMBER=$((1000 + SEQ))" >> "$CM_ENV"
      echo "Building $NAME ($((1000 + SEQ))) from $TAG"
  pub: &pub
    name: Flutter packages
    script: |
      # Keep every iOS plugin on CocoaPods. With Swift Package Manager on,
      # Flutter 3.47 adds Firebase through SPM as well as CocoaPods and the
      # archive fails with "Multiple commands produce ... Metadata.appintents".
      flutter config --no-enable-swift-package-manager
      cd "$APP_DIR" && flutter pub get

  shorebird_env: &shorebird_env
    APP_DIR: app
    BUNDLE_ID: my.coachsmartV2
    FLUTTER_VERSION: 3.47.9
  shorebird_install: &shorebird_install
    name: Install Shorebird
    script: |
      # Shorebird (code push) sends Dart-only fixes to installed v3 apps
      # without a store review. The CLI signs in with SHOREBIRD_TOKEN, a
      # service account key kept secret in the Codemagic group "shorebird".
      curl -fsSL https://shorebird.dev/install.sh | bash
      echo PATH="$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"

workflows:
  v3-ios-testflight:
    name: v3 iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: coachsmart-asc
    environment:
      <<: *flutter
      groups:
        - coachsmart_ios
      vars:
        <<: *env
    triggering: *triggers
    scripts:
      - *version
      - *pub
      - name: iOS signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$APP_DIR/ios/Runner.xcodeproj"
      - name: CocoaPods
        script: cd "$APP_DIR/ios" && pod install
      - name: Build the IPA
        script: |
          cd "$APP_DIR"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - CoachSmart v3 testers

  v3-android-closed-testing:
    name: v3 Android to Play closed testing
    max_build_duration: 60
    instance_type: mac_mini_m2  # the free plan only offers Mac machines
    environment:
      <<: *flutter
      android_signing:
        - coachsmart_upload
      groups:
        - coachsmart_play
      vars:
        <<: *env
    triggering: *triggers
    scripts:
      - *version
      - *pub
      - name: Point Gradle at the upload key
        script: |
          cat > "$APP_DIR/android/key.properties" <<EOT
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOT
      - name: Build the app bundle
        script: |
          cd "$APP_DIR"
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
      - app/build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: v3-testers
        in_app_update_priority: 0

  # --- Shorebird code push -------------------------------------------------
  # None of these run on tags or pushes; start them through the Codemagic API
  # or the Codemagic site.

  # One-off: creates the CoachSmart app in Shorebird and prints the
  # app/shorebird.yaml it made (the app_id), which is then committed.
  v3-shorebird-init:
    name: v3 Shorebird one-off setup
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.9
      groups:
        - shorebird
      vars:
        <<: *shorebird_env
    scripts:
      - *shorebird_install
      - name: Create the Shorebird app
        script: |
          cd "$APP_DIR"
          if [ -f shorebird.yaml ]; then
            echo "app/shorebird.yaml is already committed; nothing to do."
          else
            # shorebird init reads the Android flavors through gradlew, which
            # is not committed; --config-only writes it without a full build.
            flutter pub get
            flutter build apk --config-only
            shorebird init --display-name "CoachSmart" ${SHOREBIRD_ORG_ID:+--org-id=$SHOREBIRD_ORG_ID}
          fi
          echo "----- app/shorebird.yaml -----"
          cat shorebird.yaml || exit 1
          echo "----- changes -----"
          git status --short
          git diff
    artifacts:
      - app/shorebird.yaml

  # Patch: sends the Dart code on the branch to phones running the release
  # named in RELEASE_VERSION (e.g. 3.0.0+1007; "latest" = newest release).
  # Native code, plugins, images and the Flutter version can't change in a
  # patch; those need a normal store build.
  v3-ios-patch:
    name: v3 iOS patch (Shorebird)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: coachsmart-asc
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
      groups:
        - coachsmart_ios
        - shorebird
      vars:
        <<: *shorebird_env
        RELEASE_VERSION: latest
    scripts:
      - *shorebird_install
      - *pub
      - name: iOS signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$APP_DIR/ios/Runner.xcodeproj" \
            --custom-export-options='{"manageAppVersionAndBuildNumber": false}'
      - name: CocoaPods
        script: cd "$APP_DIR/ios" && pod install
      - name: Publish the patch
        script: |
          cd "$APP_DIR"
          shorebird patch ios --release-version="$RELEASE_VERSION" --track=stable \
            --export-options-plist=/Users/builder/export_options.plist

  v3-android-patch:
    name: v3 Android patch (Shorebird)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.9
      android_signing:
        - coachsmart_upload
      groups:
        - shorebird
      vars:
        <<: *shorebird_env
        RELEASE_VERSION: latest
    scripts:
      - *shorebird_install
      - *pub
      - name: Point Gradle at the upload key
        script: |
          cat > "$APP_DIR/android/key.properties" <<EOT
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOT
      - name: Publish the patch
        script: |
          cd "$APP_DIR"
          shorebird patch android --release-version="$RELEASE_VERSION" --track=stable
